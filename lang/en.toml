about = "List every registered DAG. A DAG is derived, not stored: tasks tagged with the same `metadata.dag` string form one explicit group, and the rest are grouped by weak connectivity (`depends_on` / `Fallback.task` / `Reduce.inputs` / `metadata.fallback_of`). Omit `--workspace-id` to scan every live workspace"

