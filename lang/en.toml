[cli.help._root.agent.task-await]
about = "Wait for a task to reach a terminal state (blocking). Omitted = wait up to 10 minutes (provisional default). `--timeout-ms 0` = wait indefinitely"

[cli.help._root.agent.task-await.arg.id]
help = "Task id to wait on"

[cli.help._root.agent.task-await.arg.timeout_ms]
help = "Give up waiting after this many milliseconds. `0` = wait indefinitely"

[cli.help._root.agent.task-await.arg.workspace_id]
help = "Workspace id (focus-independent — required)"

[cli.help._root.agent.task-cancel]
