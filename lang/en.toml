[cli.help._root.plugin.upgrade-builtins]
about = "Re-sync all built-in plugins from the bundle"
long = "Re-sync all built-in plugins from the bundle.\n\nThe manifest version picks the branch and content decides inside it: a higher bundle version rewrites the whole directory, the same version rewrites only what differs, and an installed version higher than the bundle is skipped without reading content — `--force` is for that last branch. Permissions newly declared by a built-in that changed are granted in the same call."

[cli.help._root.plugin.upgrade-builtins.arg.force]
help = "Overwrite even when installed version >= bundle version"

[cli.help._root.plugin.upgrade-builtins.arg.restart_running]
help = "Restart running builtin processes whose binary is replaced — graceful swap. Also unblocks Windows sharing violation on in-place overwrite. Default off (conservative — briefly closes affected plugin surfaces)"

[cli.help._root.plugin.upgrade-builtins.arg.restore_all]
help = "Restore ALL builtins from `removed_builtins`. Overrides `--restore-removed` when both are given"

[cli.help._root.plugin.upgrade-builtins.arg.restore_removed]
help = "Restore specific builtins from `removed_builtins` so they become eligible for auto-install in the same call. Repeat for multiple ids"

