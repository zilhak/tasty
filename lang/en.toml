[cli.help._root.agent.task-list.arg.workspace_id]
help = "Workspace id (focus-independent — required)"

[cli.help._root.agent.task-purge]
about = "Bulk-delete tasks matching state/age filters. At least one of `--states`/`--older-than-ms` is required. Only tasks that are safe to delete (not Running, not referenced from outside the matched set) are actually removed; the rest are reported as retained"

[cli.help._root.agent.task-purge.arg.dry_run]
help = "Compute and print the plan without deleting anything"

[cli.help._root.agent.task-purge.arg.older_than_ms]
help = "Only tasks whose age (created_at, or finished_at for terminal tasks) exceeds this many milliseconds are candidates"

[cli.help._root.agent.task-purge.arg.states]
help = "Comma-separated state names (waiting|ready|running|succeeded|failed|cancelled|skipped|unknown)"

[cli.help._root.agent.task-purge.arg.workspace_id]
help = "Workspace id (focus-independent — required)"

[cli.help._root.agent.task-reduce]
about = "Combine results from N tasks into one value (strategies: first_success | all | merge_json | concat_text | custom:<cmd>)"

[cli.help._root.agent.task-reduce.arg.extract_path]
help = "JSON Pointer (e.g. `/stdout/text`) extracted from each input's `output` before reducing — recommended when reducing `Run` task results, whose `output` is `{pid,stdout:{text,...},stderr:{...}}` rather than a plain value. Inputs missing the path are treated as `null` and reported in the response's `warnings` (the rest of the reduce still proceeds)"

[cli.help._root.agent.task-reduce.arg.inputs]
help = "Comma-separated input task IDs (in reduce order)"

[cli.help._root.agent.task-reduce.arg.strategy]
help = "Strategy: `first_success` | `all` | `merge_json` | `concat_text` | `custom:<command>`"

[cli.help._root.agent.task-reduce.arg.workspace_id]
help = "Workspace id (focus-independent — required)"

[cli.help._root.agent.task-retry]
