[cli.help._root.webhook.register]
about = "Register an inbound webhook and print its issued URL"
long = "Register an inbound webhook and print its issued URL.\n\nProvide exactly one of `--handler <id>` (bind a registered hook handler) or `--sequence <json>` (define an inline IpcSequence). The external HTTP payload only fills `${body.x}` / `${header.x}` / `${query.x}` value slots.\n\nThe listener binds every interface, not loopback. The printed URL reads `127.0.0.1` because that is the convenient way to curl it, but whoever can reach the port reaches this webhook. There is no signature verification of any kind: `--auth-token` is one fixed shared secret compared in constant time, and with no `--auth-*` the sequence fires for whoever asks. `--persistent` writes that token in plain text into `~/.tasty/webhooks.toml`.\n\nThe HTTP answer is a fixed acknowledgement chosen before the sequence runs, so `200` says the call matched and was handed off, never that it worked. A step that fails neither stops the steps after it nor changes the answer, which leaves a partly applied sequence as an ordinary outcome; the log is the only place that failure appears."

[cli.help._root.webhook.register.arg.methods]
help = "Allowed HTTP methods (repeatable). Defaults to POST"

[cli.help._root.webhook.register.arg.handler]
help = "Registered hook handler id to bind (source must accept webhook)"

[cli.help._root.webhook.register.arg.sequence]
help = "Inline IpcSequence as a JSON array of {\"method\",\"params\"} objects"

[cli.help._root.webhook.register.arg.persistent]
help = "Persist across restarts (default: temporary, dropped on restart)"

[cli.help._root.webhook.register.arg.ttl_secs]
help = "Time limit in seconds; the webhook auto-expires after this many seconds. Mutually exclusive with --count"

[cli.help._root.webhook.register.arg.count]
help = "Count limit; the webhook auto-destructs after this many accepted calls. Mutually exclusive with --ttl-secs"
long = "Count limit; the webhook auto-destructs after this many accepted calls. Mutually exclusive with --ttl-secs.\n\nAccepted means the request matched the path and one of `--method` and, where auth is set, carried the right token. A method mismatch (`405`) and a rejected token (`401`) leave the count where it was, so a sender who does not know the token cannot spend it. What the count does not measure is whether the sequence then worked: the answer is already sent by that point and nothing puts a call back."
[cli.help._root.webhook.register.arg.auth_location]
help = "Optional auth: where the token is presented. Unset = no auth"

[cli.help._root.webhook.register.arg.auth_key]
help = "Token location key: query param / body field path / header name. Required for query|body|header locations (ignored for bearer)"

[cli.help._root.webhook.register.arg.auth_token]
help = "Fixed shared token the sender must present to pass auth"

[cli.help._root.webhook.list]
about = "List all registered webhooks (URL, methods, handler, steps, lifetime)"

[cli.help._root.webhook.info]
about = "Show a single webhook's details by id (incl. remaining count / expiry)"

[cli.help._root.webhook.info.arg.id]
help = "Webhook opaque id (the `/{id}` path segment)"

[cli.help._root.webhook.unregister]
about = "Unregister a webhook by id; its path returns 404 afterwards"

[cli.help._root.webhook.unregister.arg.id]
help = "Webhook opaque id"

[cli.help._root.webhook.sweep]
about = "Sweep (bulk-remove) all expired webhooks (time-elapsed / count-exhausted)"
long = "Sweep (bulk-remove) all expired webhooks (time-elapsed / count-exhausted).\n\nNothing expires on a timer, so an expired webhook stays registered until something looks at it. A call to its path removes it right then and answers `410` that once — every later call gets `404` — a restart drops the expired persistent ones, and this command clears the whole set at once without waiting for either."

[cli.help._root.webhook.config]
about = "Get or set the listener bind port (persisted to ~/.tasty/webhooks.toml)"
long = "Get or set the listener bind port (persisted to ~/.tasty/webhooks.toml).\n\nWith no `--port`, prints the active port and bound status. With `--port`, persists the new port; the listener rebinds only on the next restart. The port is config-only — tasty never silently binds a fallback port. The bind address is not configurable and is not loopback: the listener takes every interface, so this port is the whole of the exposure."

[cli.help._root.webhook.config.arg.port]
help = "Set the listener port (1-65535). Requires restart to take effect"
