[cli.help._root.agent.task-retry.arg.id]
help = "Task id to retry"

[cli.help._root.agent.task-retry.arg.reset_downstream]
help = "Also reset downstream Skipped/Failed tasks back to Waiting"

[cli.help._root.agent.task-retry.arg.workspace_id]
help = "Workspace id (focus-independent — required)"

[cli.help._root.agent.task-run]
about = "Start/stop/inspect the agent task runner for a workspace. The runner is a host-side thread that dispatches Ready tasks and detects completion of Running tasks. Calling start twice on the same workspace is idempotent"
long = "Start/stop/inspect the agent task runner for a workspace. The runner is a host-side thread that dispatches Ready tasks and detects completion of Running tasks. Calling start twice on the same workspace is idempotent.\n\nIt is never started for you. Booting the host restores state for live workspaces but leaves every runner stopped, so a workspace whose runner was never started dispatches nothing at all.\n\n`stop` ends the detection, not the work: already-dispatched processes keep going and their tasks stay `Running` with nothing left to notice them finishing. Starting again picks those handles back up and settles each one — alive, dead, or with the exit code its watcher had persisted."

[cli.help._root.agent.task-run.arg.action]
help = "start | stop | status. Default: status"

[cli.help._root.agent.task-run.arg.workspace_id]
help = "Workspace id whose runner is being controlled (focus-independent — required)"

[cli.help._root.agent.task-set-result]
about = "Manually report a task's terminal result (succeeded | failed). For signalling completion of external/manual tasks that the runner thread did not dispatch"

[cli.help._root.agent.task-set-result.arg.error]
help = "Optional error message (recommended for state=failed)"

[cli.help._root.agent.task-set-result.arg.exit_code]
help = "Optional process exit code"

[cli.help._root.agent.task-set-result.arg.id]
help = "Task id whose result is being reported"

[cli.help._root.agent.task-set-result.arg.output]
help = "Optional output JSON. Accepts inline JSON or `@path/to/file.json`"

[cli.help._root.agent.task-set-result.arg.state]
help = "Terminal state: `succeeded` | `failed`"

[cli.help._root.agent.task-set-result.arg.workspace_id]
help = "Workspace id (focus-independent — required)"

