# Shown when a structural change forwarded to the remote instance fails there —
# most often because the requested surface kind isn't available on the remote.
mirror_structural_forward_failed = "The remote workspace couldn't apply that change."
# Shown when a close would destroy a surface a remote attach session hard-occupies.
# Occupancy means someone is working in that terminal right now, so closing would kill
# their session without warning. Reclaim it with the force-detach button, then close.
close_blocked_hard_occupied = "Not closed — a remote session is using one of these terminals. Force-detach it first, then try again."
# Shown after an interactive screenshot taken while focused on a mirror
# workspace was uploaded and set as the remote instance's clipboard content.
mirror_capture_saved = "Screenshot copied to the remote clipboard."
# Shown when that upload/remote clipboard write fails.
mirror_capture_failed = "Couldn't copy the screenshot to the remote clipboard."
# Shown when a mirror workspace is torn down because the remote connection was
# lost (EOF / force-detach / heartbeat timeout / an outbound frame write failed).
# Only applies to mirrors that were attached ad-hoc (no workspace mapping) —
# mapped mirrors instead go through the three keys below (they auto-reconnect).
mirror_disconnected = "The remote connection was lost. The mirror workspace has been closed."
# Shown when a mapped mirror workspace's connection is lost — the workspace and
# its terminals are kept (scrollback preserved) while a background backoff
# retry tries to reconnect automatically.
mirror_reconnecting = "The remote connection was lost. Trying to reconnect…"
# Shown when a backoff retry succeeds and the mirror is live again.
mirror_reconnected = "Reconnected to the remote workspace."
# Shown once automatic backoff retries give up after repeated failures.
# Switching away from and back to the workspace still retries manually.
