[settings.file_handler.handlers]
description = "A handler defines what to do with an identified format. Multiple handlers can attach to a single detector — automatic dispatch picks the first one by priority, then by owner."
bullet_what = "A handler's action is one of: open a surface, call an IPC method, or launch the OS default app."
bullet_priority = "Priority column: lower numbers win. Ties are broken by owner preference (user > plugin > host)."
bullet_owner = "Owner column: host = built-in / plugin:<id> = contributed by a plugin / user = user-added. Only user / plugin entries can be removed."
bullet_action_surface = "Action: surface:<kind> — adds a surface to the focused pane (e.g. markdown_view)."
bullet_action_ipc = "Action: ipc:<method> — invokes a registered IPC method. Plugin owners are restricted to their own <plugin_id>.* methods."
bullet_action_system = "Action: system — opens with the OS default app (Finder / Explorer / xdg-open). Not available to plugins."
