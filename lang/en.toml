[cli.help._root.agent.semaphore-set-permits]
about = "Change a semaphore's permit count in place. Growing takes effect at once; shrinking drains — current holders are never revoked, new acquires are refused until the holder count falls under the new limit"

[cli.help._root.agent.semaphore-set-permits.arg.name]
