[settings.file_handler.detectors]
description = "A detector is a bundle of rules that identifies what a file is. The result is a DetectorId (e.g. markdown, pdf). Rules from host / plugin / user origins can be merged under the same ID."
bullet_what = "Role: detectors identify the format, handlers (next tab) take action on the result — a two-stage routing pipeline."
bullet_rules = "Rule kinds column: ext (extension), glob (path pattern), mime (MIME guess), magic (magic bytes), dir (directory), lua (Lua script), structure (JSON Schema), etc."
bullet_origin = "Origin: host = built-in / plugin:<id> = contributed by a plugin / user = ~/.tasty/file-handlers.toml. The same DetectorId may combine rules from multiple origins."
bullet_status = "The Enabled toggle only records a user-origin disabled override. Host / plugin defaults are left untouched."
bullet_add = "+ Add user detector supports only ext / path_glob in the form. Advanced rules (magic / mime / lua / structure) require editing ~/.tasty/file-handlers.toml by hand."
