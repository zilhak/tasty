[cli.help._root.agent.semaphore-acquire]
about = "Acquire 1 permit. Idempotent for the same holder"
long = "Acquire 1 permit. Idempotent for the same holder.\n\nA full semaphore is not an error: the call succeeds and reports `acquired: false` along with the current holders, so read that field rather than the exit code. There is no waiting mode — retrying is the caller's job."

[cli.help._root.agent.semaphore-acquire.arg.holder]
help = "Holder id (must be non-empty)"

[cli.help._root.agent.semaphore-acquire.arg.name]
help = "Semaphore name to acquire a permit from"

[cli.help._root.agent.semaphore-acquire.arg.ttl_ms]
help = "Reclaim this permit automatically if the holder goes silent for this many ms. Re-acquiring with the same holder renews it. Omit for a permit that never expires (the default)"

[cli.help._root.agent.semaphore-acquire.arg.workspace_id]
help = "Workspace id (focus-independent — required)"

[cli.help._root.agent.semaphore-create]
about = "Create a semaphore with N permits"

[cli.help._root.agent.semaphore-create.arg.name]
help = "Semaphore name (unique within the workspace)"

[cli.help._root.agent.semaphore-create.arg.permits]
help = "Permit count (must be >= 1)"

[cli.help._root.agent.semaphore-create.arg.workspace_id]
help = "Workspace id (focus-independent — required)"

[cli.help._root.agent.semaphore-delete]
