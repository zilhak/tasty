[cli.help._root.agent.barrier-create]
about = "Create a barrier (waits until N signals have arrived)"
long = "Create a barrier (waits until N signals have arrived).\n\nNothing runs on a timer. `--timeout-ms` is stamped lazily: the barrier turns `TimedOut` inside the next `barrier-signal`, `barrier-state` or `barrier-list`, so a barrier nobody asks about sits in whatever state it was left in. Once stamped, `barrier-signal` fails, and the record stays until `barrier-delete` removes it."

[cli.help._root.agent.barrier-create.arg.count_required]
help = "Required signal count (must be >= 1)"

[cli.help._root.agent.barrier-create.arg.name]
