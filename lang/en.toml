[cli.help._root.approval]
long = "Human-handoff approval gates (request/respond/await/cancel/list/get)\n\nThe live gate does not outlive the host. `request`, `respond`, `await`, `cancel`, `list` and `get` all read one in-memory store that starts empty on every boot, so a request that was pending when the host stopped is not there afterwards — `list` will not show it and `await` on its id answers \"not found\". What survives is the written record, which `history` reads from the memory store. Treat `history` as the log and `list` as what is answerable right now."
about = "Human-handoff approval gates (request/respond/await/cancel/list/get)"

[cli.help._root.telemetry]
long = "Agent telemetry (record metrics, summary, timeseries, top-N)\n\nTwo sources feed it: what an agent reports with `telemetry record`, and one `ipc_calls` event the host writes per IPC call an agent makes, tagged with the method name (host calls, `telemetry.*` and throttled calls are not counted). Queries read the raw events and nothing else — there is no rollup — and the store is trimmed to the most recent 20,000, so `--since` cannot reliably reach past that. Anomaly records are trimmed separately: the most recent 5,000, and at most 50 hours."
about = "Agent telemetry (record metrics, summary, timeseries, top-N)"

