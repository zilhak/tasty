help = "Task id to cancel"

[cli.help._root.agent.task-cancel.arg.workspace_id]
help = "Workspace id (focus-independent — required)"

[cli.help._root.agent.task-create]
about = "Create a new task within a workspace"
long = "Create a new task within a workspace.\n\nCreating does not run it. Nothing dispatches until the workspace's runner is started with `task-run --action start`, and it is never started for you — not at boot either. Without it a task sits in `Ready` and `task-await` just burns its timeout."

[cli.help._root.agent.task-create.arg.command]
help = "TaskCommand as JSON (e.g. `{\"kind\":\"run\",\"command\":[\"cargo\",\"build\"]}`). `workspace_id` is auto-filled from `--workspace-id` if omitted; if present and different, `--workspace-id` wins and a warning is returned. Accepts inline JSON or `@path/to/file.json`"

[cli.help._root.agent.task-create.arg.concurrency_limit]
help = "Shorthand for `metadata.semaphore.name` — caps how many tasks tagged with the same semaphore name run concurrently (the rest wait as `ready` until a permit frees up). Merges into `--metadata` if both are given; conflicts if `--metadata` already sets `semaphore`"

[cli.help._root.agent.task-create.arg.depends_on]
help = "Comma-separated dependency task IDs"

[cli.help._root.agent.task-create.arg.metadata]
help = "Metadata JSON (free-form, attached to the task)"

[cli.help._root.agent.task-create.arg.name]
help = "Display name"

[cli.help._root.agent.task-create.arg.on_failure]
help = "On-failure policy: abort | continue_downstream | fallback:<task_id> (default: abort). Which task you set this on matters: abort/continue_downstream must be set on the dependent (downstream) task; fallback must be set on the task that may itself fail (upstream) — setting fallback on a downstream task has no effect on skip cascades from a failed dependency"

[cli.help._root.agent.task-create.arg.reserved_for_fallback]
help = "Reserve this task as a not-yet-referenced fallback candidate: it stays `waiting` (never `ready`, so the runner cannot dispatch it) until a later `task-create --on-failure fallback:<this-id>` call links a main task to it, however long that takes. Without this flag, a bare no-deps task becomes `ready` immediately, and if the runner ticks before the linking main is created, it can dispatch and run to completion regardless of that main's outcome — closes the creation-order race between the two `task-create` calls"

[cli.help._root.agent.task-create.arg.workspace_id]
help = "Workspace id (focus-independent — required)"

[cli.help._root.agent.task-delete]
about = "Delete a task. Rejected by default if other tasks still reference it (depends_on / on_failure.fallback.task / reduce.inputs) — the referencing task IDs are returned. `Running` tasks are always rejected regardless of `--cascade`/`--force` (cancel first)"

[cli.help._root.agent.task-delete.arg.cascade]
help = "Also delete every task that transitively references this one"

[cli.help._root.agent.task-delete.arg.force]
help = "Skip the reference check only — state constraints (Running) still apply"

[cli.help._root.agent.task-delete.arg.id]
help = "Task id to delete"

[cli.help._root.agent.task-delete.arg.workspace_id]
help = "Workspace id (focus-independent — required)"

[cli.help._root.agent.task-get]
about = "Fetch a single task"

[cli.help._root.agent.task-get.arg.id]
help = "Task id"

[cli.help._root.agent.task-get.arg.workspace_id]
