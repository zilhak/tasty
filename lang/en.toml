about = "Remove a rate limit bucket by id"

[cli.help._root.agent.rate-limit-remove.arg.id]
help = "Bucket id, as reported by `rate-limit-list`"

[cli.help._root.agent.rate-limit-set]
about = "Configure a rate limit bucket for (agent, metric) — `limit` tokens per `per_ms` ms"
long = "Configure a rate limit bucket for (agent, metric) — `limit` tokens per `per_ms` ms.\n\nOne metric is actually spent from: `ipc_calls`. A bucket stored under any other name is listed by `rate-limit-list` and charged by nothing, so it throttles nothing.\n\nThe `ipc_calls` bucket is charged one token per IPC call, and a call over budget comes back as `-32010 throttled` with a Deny in the audit log. Not every call is charged: a caller with no session token — the plain CLI — and the host's own calls are exempt, as are `telemetry.*`, `agent.rate_limit_*` and `system.info`. The last two are what let a throttled agent read and lift its own limit."

[cli.help._root.agent.rate-limit-set.arg.agent]
help = "Agent id"

[cli.help._root.agent.rate-limit-set.arg.burst]
help = "Bucket capacity (defaults to `limit`)"

[cli.help._root.agent.rate-limit-set.arg.limit]
help = "Token refill amount per window"

[cli.help._root.agent.rate-limit-set.arg.metric]
help = "Metric name. `ipc_calls` is the only one anything spends from"

[cli.help._root.agent.rate-limit-set.arg.per_ms]
help = "Window length in milliseconds (e.g. `60000` for per-minute)"

[cli.help._root.agent.rate-limit-status]
about = "Inspect rate limit state, optionally filtered by agent and/or metric"

