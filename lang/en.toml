[cli.help._root.plugin.disable]
about = "Disable a plugin (graceful shutdown if running)"
long = "Disable a plugin (graceful shutdown if running).\n\nThe mark is written to disk, so it survives a restart and a later `plugin install` of the same id will not turn it back on. This is not an uninstall: the directory stays and the plugin keeps its command namespace, so `tasty <namespace> ...` answers `plugin ... is not running` rather than reporting an unknown method. What does go away is everything the plugin contributed — file detectors and handlers, hook handlers, completion strategies, settings pages — so a file it used to open now takes another route."

[cli.help._root.plugin.disable.arg.id]
help = "Plugin id"

