[cli.help._root.memory.goal]
about = "Goal — a single goal sentence per surface (`tasty.goal`)"
long = "Goal — a single goal sentence per surface (`tasty.goal`).\n\nNothing inherits it: a surface spawned from this one starts with no goal. It carries no TTL because it needs none — the surface's whole memory scope is dropped when the surface closes, and again at startup for surfaces that were not restored, so a goal lives exactly as long as its surface."

[cli.help._root.memory.goal.clear]
about = "Remove the surface's goal (idempotent)"

[cli.help._root.memory.goal.clear.arg.surface]
