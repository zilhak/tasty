[cli.help._root.agent.lease-acquire]
about = "Acquire a lease on an arbitrary resource (advisory, cooperative)"
long = "Acquire a lease on an arbitrary resource (advisory, cooperative).\n\nWhether you got it is not the exit code. `--mode fail` turns a conflict into an error, but `--mode block` succeeds and reports `acquired: false` with the current holder — read that field. Nothing enforces the lease either: it is a marker the participants agree to read.\n\nWithout `--ttl-ms` the lease never expires and only `lease-release` with the same holder id frees it, so a holder that dies keeps the resource. The restart cleanup does not cover that case — it only releases leases a running task holds under its own task id."

[cli.help._root.agent.lease-acquire.arg.holder]
help = "Holder id (must be non-empty)"

[cli.help._root.agent.lease-acquire.arg.mode]
help = "Conflict mode: fail | block (default: fail). `block` does not wait — it returns at once with `acquired: false`, and retrying is the caller's job"

[cli.help._root.agent.lease-acquire.arg.resource]
help = "Resource identifier (e.g. `file:/path`, `workspace:foo`)"

[cli.help._root.agent.lease-acquire.arg.ttl_ms]
help = "Time-to-live in milliseconds. Omit for a lease that never expires. Expiry is lazy — an expired lease is evicted by the next `lease-acquire` or `lease-list`, not at the moment it lapses"

[cli.help._root.agent.lease-acquire.arg.workspace_id]
help = "Workspace id (focus-independent — required)"

[cli.help._root.agent.lease-list]
about = "List all leases in a workspace (expired leases auto-evicted)"

[cli.help._root.agent.lease-list.arg.workspace_id]
help = "Workspace id (focus-independent — required)"

[cli.help._root.agent.lease-release]
about = "Release a lease. Only the current holder can release"

[cli.help._root.agent.lease-release.arg.holder]
help = "Holder id that currently holds the lease"

[cli.help._root.agent.lease-release.arg.resource]
help = "Resource identifier the lease was acquired on"

[cli.help._root.agent.lease-release.arg.workspace_id]
help = "Workspace id (focus-independent — required)"

