[cli.help._root.plugin.remove]
about = "Remove an installed plugin by id"
long = "Remove an installed plugin by id.\n\nThe whole plugin directory is deleted, so anything the plugin kept inside it goes with it. For a built-in, removal is also recorded so the next boot does not put it back — bringing it back is `plugin upgrade-builtins --restore-removed <id>`, and it returns enabled."

