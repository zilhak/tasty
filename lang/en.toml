[cli.help._root.plugin.install]
about = "Install a plugin from a directory containing tasty-plugin.toml"
long = "Install a plugin from a directory containing tasty-plugin.toml.\n\nTwo more things happen, and neither is asked about: every permission the manifest declares is granted immediately, and the plugin is enabled and started unless a disabled mark for that id is already on file. Inspect `tasty-plugin.toml` first, or check afterwards with `plugin permissions <id>` and `plugin revoke <id> <permission>`."

[cli.help._root.plugin.install.arg.path]
