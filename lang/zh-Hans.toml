[cli.help._root.webhook]
about = "管理入站 Webhook（注册/列出/信息/注销）—— HTTP → IpcSequence"

[cli.help._root.webhook.register]
about = "注册入站 Webhook 并输出分配的 URL"
long = """
注册入站 Webhook 并输出分配的 URL。

必须且只能指定 `--handler <id>`（绑定已注册的钩子处理器）或 `--sequence <json>`（定义内联 IpcSequence）中的一个。外部 HTTP 载荷仅填充 `${body.x}` / `${header.x}` / `${query.x}` 值槽。

除非在本次启动前设置了 `tasty webhook allow-external on`，否则监听器仅监听 127.0.0.1；若已设置，则监听所有 IPv4 接口，输出的 `127.0.0.1` URL 只是便于用 curl 调用的地址，任何能访问该端口的人都能访问此 Webhook。不进行任何签名验证：`--auth-token` 是一个固定的共享机密，未指定 `--auth-*` 时，任何人的请求都会触发序列。`--persistent` 将该令牌以明文写入 `~/.tasty/webhooks.toml`。

HTTP 响应是在序列运行前选定的固定确认响应，因此 `200` 仅表示调用已匹配并已移交执行，绝不表示执行成功。某个步骤失败既不会阻止后续步骤，也不会改变响应，因此序列仅部分应用也是常见结果；失败仅出现在日志中。"""

[cli.help._root.webhook.register.arg.methods]
help = "允许的 HTTP 方法（可重复指定）。默认为 POST"

[cli.help._root.webhook.register.arg.handler]
help = "要绑定的已注册钩子处理器 ID（来源必须接受 Webhook）"

[cli.help._root.webhook.register.arg.sequence]
help = "内联 IpcSequence，格式为由 {\"method\",\"params\"} 对象组成的 JSON 数组"

[cli.help._root.webhook.register.arg.persistent]
help = "重启后保留（默认：临时，重启时丢弃）"

[cli.help._root.webhook.register.arg.ttl_secs]
help = "时间限制，单位为秒；Webhook 在指定秒数后自动过期。与 --count 互斥"

[cli.help._root.webhook.register.arg.count]
help = "次数限制；Webhook 在受理指定次数的调用后自动销毁。与 --ttl-secs 互斥"
long = """
次数限制；Webhook 在受理指定次数的调用后自动销毁。与 --ttl-secs 互斥。

受理是指请求匹配路径及 `--method` 中的一个方法，且在设置了认证时携带正确令牌。方法不匹配（`405`）和令牌被拒绝（`401`）均不改变计数，因此不知道令牌的发送方无法消耗次数。计数不衡量序列随后是否执行成功：此时响应已发送，调用次数不会返还。"""

[cli.help._root.webhook.register.arg.auth_location]
help = "可选认证：提供令牌的位置。未设置 = 不认证"

[cli.help._root.webhook.register.arg.auth_key]
help = "令牌位置键：查询参数 / 正文字段路径 / 请求头名称。位置为 query|body|header 时必填（bearer 忽略此项）"

[cli.help._root.webhook.register.arg.auth_token]
help = "发送方必须提供以通过认证的固定共享令牌"

[cli.help._root.webhook.list]
