[cli.help._root.remote.check]
about = "通过 SSH 检查远程 tasty 实例是否存活"
long = """
通过 SSH 检查远程 tasty 实例是否存活。

使用 `tasty port` 或端口文件查找远程端口，打开 `ssh -L` 隧道，然后发送 `system.info` 请求。成功响应表示实例可达。连接失败、超时、无效响应或错误响应表示检查失败；仅凭这些不能判断服务器已停止。参数名称与 `remote attach` 相同。"""

