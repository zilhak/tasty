long = """
通过 SSH 在远程 tasty 实例上创建新工作区。

与 `remote workspaces` 对应的写入命令。将输出的 ID 传给 `tasty remote attach --workspace <id>`，即可在远程创建工作区并附加。远程的活动工作区不变。若还需在本地 GUI 中镜像，使用 `tasty remote attach --into-gui --new-workspace`。"""

[cli.help._root.remote.new-workspace.arg.ssh]
help = "远程 SSH 目标，例如 --ssh user@host、--ssh gx10 或 --ssh 127.0.0.1:45123。与 `--profile` 互斥"

