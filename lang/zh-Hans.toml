help = "插件 ID"

[cli.help._root.plugin.install]
about = "从包含 tasty-plugin.toml 的目录安装插件"
long = """
从包含 tasty-plugin.toml 的目录安装插件。

还会执行两项操作，均不询问确认：立即授予清单声明的所有权限；启用并启动插件，除非已保存该 ID 的禁用标记。先检查 `tasty-plugin.toml`，或在安装后使用 `plugin permissions <id>` 检查权限并使用 `plugin revoke <id> <permission>` 撤销权限。

若 Tasty 无法通过受信任的密钥验证插件签名，则该插件未经验证。除非指定 `--allow-unverified`，否则不予安装，并说明拒绝原因。此选择会保留，直到清单更改或插件被移除。"""

[cli.help._root.plugin.install.arg.path]
help = "插件目录路径（必须包含 tasty-plugin.toml）"

[cli.help._root.plugin.install.arg.allow_unverified]
help = "即使插件未经验证也安装。插件以当前账户的访问权限运行；仅在信任其来源时使用"

[cli.help._root.plugin.remove]
about = "按 ID 移除已安装的插件"
long = """
按 ID 移除已安装的插件。

整个插件目录都会被删除，插件保存在其中的所有内容也会一并删除。对于内置插件，还会记录移除状态，以免下次启动时重新安装。使用 `plugin upgrade-builtins --restore-removed <id>` 恢复，恢复后处于启用状态。"""

[cli.help._root.plugin.remove.arg.id]
help = "插件 ID（例如 com.example.explorer）"

[cli.help._root.plugin.upgrade-builtins]
about = "从捆绑包重新同步所有内置插件"
long = """
从捆绑包重新同步所有内置插件。

清单版本决定处理分支，内容决定分支内的操作：捆绑包版本较高时重写整个目录；版本相同时仅重写存在差异的内容；已安装版本高于捆绑包版本时，不读取内容，直接跳过。`--force` 用于最后一种情况。发生变更的内置插件新声明的权限会在同一次调用中授予。"""

[cli.help._root.plugin.upgrade-builtins.arg.force]
help = "即使已安装版本 >= 捆绑包版本也覆盖"

[cli.help._root.plugin.upgrade-builtins.arg.restore_removed]
help = "从 `removed_builtins` 中恢复指定的内置插件，使其可在同一次调用中自动安装。多个 ID 可重复指定"

[cli.help._root.plugin.upgrade-builtins.arg.restore_all]
help = "从 `removed_builtins` 中恢复所有内置插件。同时指定时优先于 `--restore-removed`"

[cli.help._root.plugin.upgrade-builtins.arg.restart_running]
help = "重启二进制文件被替换的运行中内置插件进程，执行平滑切换。也可解除 Windows 就地覆盖时的共享冲突。默认关闭（保守策略，会短暂关闭受影响的插件 Surface）"

[cli.help._root.plugin.enable]
about = "启用已禁用的插件并启动"
long = """
启用已禁用的插件并启动。

等待插件连接、启动失败或被取消；若未连接，则以非零状态退出。响应包含启动代次及其最终状态。等待期间不接受 --response-timeout-ms；指定 --no-wait 时仅发送一次请求。"""

[cli.help._root.plugin.enable.arg.id]
help = "插件 ID"

[cli.help._root.plugin.enable.arg.no_wait]
help = "输出已接受的启动请求并返回，不等待结果"

[cli.help._root.plugin.disable]
about = "禁用插件（若正在运行则正常关闭）"
long = """
禁用插件（若正在运行则正常关闭）。

禁用标记会写入磁盘，重启后仍保留，之后对同一 ID 执行 `plugin install` 也不会重新启用。这不会卸载插件：目录和插件的命令命名空间均保留，因此 `tasty <namespace> ...` 会返回 `plugin ... is not running`，而非报告未知方法。插件提供的所有功能都会移除，包括文件检测器和处理器、钩子处理器、完成判定策略、设置页面，因此此前由该插件打开的文件将改用其他处理路径。"""

[cli.help._root.plugin.disable.arg.id]
help = "插件 ID"

