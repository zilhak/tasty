help = "远程端口发现模式：auto（默认）| subcommand | file-unix | file-windows"

[cli.help._root.remote.workspaces]
about = "通过 SSH 列出远程 tasty 实例的工作区"
long = """
通过 SSH 列出远程 tasty 实例的工作区。

连接到 SSH 目标或附加配置档，获取远程 `workspace.list` 和 `attach.list` 并合并：每个工作区均报告其 ID、名称、窗格数、忙碌标志，以及是否已被其他客户端附加。用于查找 `remote attach --workspace` 所需的工作区 ID。只读；不改变本地用户状态（焦点等）。`--ssh 127.0.0.1:<port>` 通过回环直接连接，无需隧道（本地端到端检查）。

本地 IPC 方法 `remote.workspaces` 提供相同功能。"""

[cli.help._root.remote.workspaces.arg.ssh]
