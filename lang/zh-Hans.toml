[cli.help._root.agent.task-await]
about = "等待任务进入终态（阻塞）。检查响应的 `outcome`：退出状态 0 不代表任务成功"
long = """
等待任务进入终态（阻塞）。检查响应的 `outcome`：退出状态 0 不代表任务成功。

未指定 `--timeout-ms` 时最多等待 10 分钟（暂定默认值）；`--timeout-ms 0` 表示无限等待。响应的 `outcome` 为 `terminal`（附带 `state`，例如 succeeded 或 failed）、`timed_out` 或 `not_found`。三者均以退出状态 0 退出，因此先读取 `outcome`，再读取 `state`。根级 `--response-timeout-ms` 仅限制 CLI 等待服务器响应的时长，并非任务的超时时间。"""

[cli.help._root.agent.task-await.arg.workspace_id]
