[cli.help._root.events]
about = "按位置读取宿主事件流（fetch, follow）"
long = """
按位置读取宿主事件流（fetch, follow）

事件流仅存于内存：重启会清空事件流并重置位置，因此每个响应都带有 `epoch`，用于标明位置所属的世代。已滚出环形缓冲区的位置不会被悄然替换为最早保留的位置——响应会说明跳过的事件数。"""

[cli.help._root.events.fetch]
about = "从指定位置读取事件。以单个 JSON 对象输出响应"
long = """
从指定位置读取事件。以单个 JSON 对象输出响应。

事件位于响应的 `events` 数组中，与 `next_offset`、`epoch` 及其他字段并列。要每行输出一个事件，使用 `follow`。

传入上次响应的 next_offset 以继续读取。读取不会推进宿主端游标，也不会为读取较慢的客户端将事件加入队列。随着保留的事件流变化，重复读取可能返回不同的数据。

事件仅存于内存。重启会清空事件并重置位置，因此每个响应都带有 `epoch` — 若它与偏移量来源的世代不同，则该偏移量属于先前的世代。"""

[cli.help._root.events.fetch.arg.offset]
help = "读取起始位置。默认为 0，即仍保留的最早位置"

[cli.help._root.events.fetch.arg.max]
help = "事件数量上限。由宿主限制"

[cli.help._root.events.fetch.arg.filter]
help = "键模式：精确键（`agent.task_finished`）或命名空间通配符（`agent.*`）。语法与订阅相同"

[cli.help._root.events.fetch.arg.wait_ms]
help = "响应前等待事件到达的最长时间。默认为 0，立即返回现有内容"

[cli.help._root.events.follow]
about = "跟随事件流：从指定位置持续长轮询，将每个事件输出为一行 JSON。运行至被中断"
long = """
持续跟踪事件流：从指定位置开始长轮询，将每个事件输出为一行 JSON，持续运行直至中断。

重新连接时使用最后的位置发起相同调用，已停止的消费端即可从上次停止处继续。如果停止时间过长，导致该位置已移出环形缓冲区，响应会明确说明，而不会静默地从最早的事件重新开始；此命令将该通知输出到 stderr，避免干扰 stdout 上的 `while read` 循环。

重启 tasty 会重置位置。重新附加时，传入偏移量所属的 `--epoch`：如果 tasty 在此期间重启，此命令会在 stderr 上说明，并从新一代的起点开始。未提供该参数时，如果位置超出新事件流的末尾，也会以相同方式报告并处理。如果连接断开，此命令会输出重新附加所需的 `--offset` 和 `--epoch`，然后退出；指定 `--reconnect` 时则会持续重试并继续跟踪。"""

[cli.help._root.events.follow.arg.offset]
help = "起始位置。默认为 0，即仍保留的最早位置"

[cli.help._root.events.follow.arg.filter]
help = "键模式，语法与 `fetch --filter` 相同"

[cli.help._root.events.follow.arg.batch]
help = "每次请求的事件数"

[cli.help._root.events.follow.arg.wait_ms]
help = "每次请求返回空结果前的等待时长"

[cli.help._root.events.follow.arg.epoch]
help = "偏移量所属的代，由连接断开时输出或由 `fetch` 返回。如果 tasty 在此期间重启，则从新一代的起点重新开始，避免读取不相关的位置"

[cli.help._root.events.follow.arg.reconnect]
help = "连接断开时每秒重试，不退出。保留原来的代信息，因此会报告重启并从新一代的起点继续跟踪"

[cli.help._root.telemetry]
about = "智能体遥测（记录指标、汇总、时间序列、前 N 项）"
long = """
智能体遥测（记录指标、汇总、时间序列、前 N 项）

数据来自两个来源：智能体通过 `telemetry record` 上报的内容，以及智能体每次发起 IPC 调用时宿主写入的一条带有方法名标签的 `ipc_calls` 事件（不统计宿主调用、`telemetry.*` 和受节流限制的调用）。查询仅读取原始事件，不读取其他数据，也不预先汇总；存储仅保留最近 20,000 条，因此 `--since` 无法可靠地查询更早的数据。异常记录单独裁剪：仅保留最近 5,000 条，且最多保留 50 小时。"""

