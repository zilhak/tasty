help = "远程 SSH 目标，例如 --ssh user@host 或 --ssh gx10。与 `--profile` 互斥"

[cli.help._root.remote.check.arg.profile]
help = "使用已保存的 tasty-attach 配置档名称检查。从 `~/.tasty/remote-profiles.toml` 解析配置档，提供用户、端口、身份密钥及额外选项。与 `--ssh` 互斥。配置档中的值替代 `--remote-tasty` 和 `--remote-port-mode`"

[cli.help._root.remote.check.arg.remote_tasty]
help = "远程主机上 tasty 二进制文件的路径，用于端口发现的子命令步骤（`ssh host <path> port`）。默认为 \"tasty\"（假定在远程 PATH 中）"

