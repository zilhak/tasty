[cli.help._root.list.pressure]
about = "显示此实例启动以来的 IPC 压力和诊断统计"
long = """
显示此实例启动以来的 IPC 压力和诊断统计。

各统计块测量的请求不同，不得相减：queue_before_gate 包含随后被权限检查拒绝的请求；handler_after_gate 涵盖已处理的请求；plugin_round_trip 涵盖已收到响应的插件调用；db 涵盖成功的数据库提交。请求可能在通过检查后、处理器计时前就收到响应。

connections 统计 TCP 连接数，包括附加和 mesh 流。live 为当前使用量，limit 为强制执行的上限，refused_saturated 统计发出请求前就被拒绝的连接数。累计计数不会减少；live 和派生平均值可以减少。accept_waits 等于 accepted + refused_saturated。accept_wait_bound_us_sum/max/mean 字段根据自上次观测到队列为空以来的经过时间，给出 OS accept 队列中等待时间的上界。这些值是上界，并非实测等待时间。队列为空时休眠 100 ms。

queue_before_gate、handler_after_gate 和 plugin_round_trip 还包含直方图。bounds_us 包含区间边界；counts 额外包含一个溢出桶，且不是累计值。计数之和等于观测次数。不计算分位数。db 和 connections 没有直方图。queue_before_gate.waits 是 wait_us_mean 的分母，也是 wait_us_hist.counts 的总和。commands 在一轮分派结束时更新，因此在当前轮次中可能滞后于 waits，包括本次查询所在的轮次。

db_pragmas 比较 memory_db 和 state_db 的请求设置与实际设置。degraded 表示设置不匹配，或 memory_db 在文件打开失败后回退到内存数据库。init_failure 记录该失败，或为 null。回退数据库仍可使用。state_db 在未打开时为 null，无界面实例也包括在内。

stream_push 统计附加/mesh 帧：frames_dropped 记录活动连接因队列已满而丢弃的帧数；clients_lagged_out 记录因过慢而断开的客户端数。backlog 为所有活动连接当前排队的帧数，sink_capacity 为单个连接的上限。

queue_admission 报告当前字节数、命令数、注入命令数、峰值字节数，以及 limit_bytes/limit_injected_depth 上限。refused_bytes 和 refused_depth 统计进入队列前被拒绝的请求；这些请求不计入其他任何统计块。没有 IPC 服务器时，此统计块为 null。queue_dispatch 记录轮次数、因命令/时间预算而停止的次数、expired_before_run、已启动的命令数，以及当前/峰值 in_flight 请求数。已启动的请求会保持 in_flight 状态，直到命令及其响应等待方都释放共享生命周期状态。

keyed_requests 对每个带键请求只计数一次：executed、replayed、conflicted（未执行任何操作）、discarded（未保留响应）或 in_flight（加入已有请求）。此处的 in_flight 是累计决策次数，与 queue_dispatch 中的当前计数不同。

slow_requests 保留队列等待时间 + 宿主处理时间 + 插件等待时间达到 threshold_us（100 ms）的请求，最早的排在前面，最多保留 capacity 条。每行包含 request_seq（既不是 JSON-RPC id，也不是 trace id）、method、caller、queue_wait_us、host_us 和 plugin_hops。每一跳包含其插件、host_request_id、等待时间和结果。admitted 统计所有曾保留的行；admitted 减去显示的行数即为淘汰数。查询排除自身。每行的宿主处理结果为 ok/error，error_code 为其 JSON-RPC 错误码，用于区分过期（-32067）、拒绝（-32001）和成功。在响应前，两者均为 null，例如等待插件期间。

gate_refusals.judged 统计进入权限检查的请求数，包括 Local 和插件调用方的请求。检查依次执行：permission_denied（-32001）、cap_blocked（-32007），然后是 throttled（-32010）。每个请求最多计入一个拒绝项。权限拒绝可能表示缺少权限、未知方法或该调用方被禁止使用的方法；授予权限只解决第一种情况。没有令牌的 Local 调用方通过此检查。无效、过期或已撤销的会话令牌在计入 judged 前被拒绝，而通过检查后发生的 -32001 错误计为通过。格式错误的幂等键不计入此处。这些总数在重启时重置；agent rate-limit-status 中各桶的 throttled_count 会持久保存，属于不同的计数。

没有观测数据时，平均值为 null，而非零。"""

