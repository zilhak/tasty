long = """
按 ID 关闭整个工作区及其中的所有窗格、标签页和 Surface。

此操作无法撤销：工作区内的所有终端均被终止，工作区不会进入用户的重新打开历史记录，回滚缓冲区也不会保留。只有用户手动关闭的项目才能重新打开。

目标始终通过 --workspace 显式指定（见 `tasty list workspaces`），绝不根据屏幕内容推断。关闭用户未在查看的工作区时，屏幕上仍显示当前工作区。拒绝关闭包含自身 Surface 的工作区、镜像远程附加会话的工作区以及最后一个工作区。关闭窗口是另一项决定，见 `tasty close window`。"""

