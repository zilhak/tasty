[cli.help._root.agent.task-graph-submit]
about = "一次调用提交带类型的任务图（contract_version 2）"
long = """
一次调用提交带类型的任务图（contract_version 2）。

首先验证整个图：ID、引用、输入绑定、类型、映射、回退和循环。验证失败的图不会存储任何内容；错误会指出任务以及提交图中的 JSON 指针。有效的图会整体存储并激活，确保所有任务都已存在后才开始运行其中的任务。未指定 `workspace_id` 的 run 和 agent 命令，包括内联回退命令，都会填入 `--workspace` 的值。其他种类的命令没有此字段，按原样发送。"""

