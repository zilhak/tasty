long = """
本次运行的 Webhook 监听端口，覆盖 `tasty webhook port`。若无法打开，Tasty 将在不启用监听器的情况下运行，并留下警告通知。

此时 Tasty 不会改用其他端口。若未指定此选项且未保存端口，Tasty 将尝试 28429 及其后的 63 个端口，使用第一个空闲端口。"""

[cli.help._root.arg.response_timeout_ms]
help = "单次请求的服务器响应等待时限，单位为毫秒。返回 -32061 时结果未知，请求可能仍在运行；设为 0 或不指定标志表示不限时"
long = """
单次请求的服务器响应等待时限，单位为毫秒。返回 -32061 时结果未知，请求可能仍在运行；设为 0 或不指定标志表示不限时。

若在处理开始后超时，服务器返回 -32061。若在排队期间超时，服务器返回 -32067，请求未执行。实例必须声明 ipc.response-timeout，否则不发送原始请求。检查支持情况所用的时间会从请求的剩余时间额度中扣除。若检查超时或耗尽该额度，则结果为 -32067，且不发送原始请求。检查还会为每次套接字读取设置超时。此选项并非涵盖建立连接、发送和重复读取的绝对截止时间。循环或流式命令拒绝此标志"""

[cli.help._root.arg.launch]
help = "即使在 tasty 终端内也强制启动 GUI"

[cli.help._root.arg.headless]
help = "以无界面模式运行（无 GUI）。仅 no-default-features 构建支持无界面模式；GUI 构建会发出警告并仍然打开窗口"
long = """
以无界面模式运行（无 GUI）。仅 no-default-features 构建支持无界面模式；GUI 构建会发出警告并仍然打开窗口。

无界面模式仅运行 IPC、PTY 和插件。default-features（GUI）构建不包含无界面模式：此标志会记录警告并照常启动 GUI，因此会在继承的 DISPLAY 上打开窗口。"""

[cli.help._root.arg.all]
