[cli.help._root.approval]
about = "移交人工处理的批准关卡（request/respond/await/cancel/list/get）"
long = """
移交人工处理的批准关卡（request/respond/await/cancel/list/get）

活动关卡的存续时间不会超过宿主。`request`、`respond`、`await`、`cancel`、`list` 和 `get` 均读取同一个内存存储，每次启动时该存储均为空，因此宿主停止时仍待处理的请求之后便不复存在 — `list` 不会显示该请求，对其 ID 调用 `await` 会返回“未找到”。保留下来的是已写入的记录，`history` 从记忆存储中读取这些记录。将 `history` 视为日志，将 `list` 视为当前可响应的请求。"""

