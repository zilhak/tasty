[cli.help._root.webhook.unregister.arg.id]
help = "Webhook 不透明 ID"

[cli.help._root.webhook.sweep]
about = "清理（批量移除）所有已过期的 Webhook（超时 / 次数耗尽）"
long = """
清理（批量移除）所有已过期的 Webhook（超时 / 次数耗尽）。

过期处理不由定时器触发，因此已过期的 Webhook 会保持注册状态，直到被检查。调用其路径会立即将其移除，并仅在该次返回 `410`，后续调用均返回 `404`；重启会丢弃已过期的持久化 Webhook，而此命令无需等待调用或重启，即可一次清除所有已过期的 Webhook。"""

[cli.help._root.webhook.port]
about = "显示运行中监听器的端口，或保存下次启动使用的端口"
long = """
显示运行中监听器的端口，或保存下次启动使用的端口。

不带参数时，向运行中的 Tasty 查询监听器实际打开的地址、端口的选择方式（`argument`、`config` 或 `probe`），以及为下次启动保存的端口。指定端口时，将其保存到数据文件夹的 webhooks.toml；指定 `--unset` 时，移除已保存的端口。若 Tasty 未运行，则直接编辑文件并在输出中说明。两种更改均从下次启动起生效。已保存的端口属于显式指定：若无法打开，Tasty 将不启动。未保存端口且未指定 `--webhook-port` 时，Tasty 依次尝试 28429 及其后的 63 个端口，使用第一个空闲端口。"""

[cli.help._root.webhook.port.arg.port]
help = "要保存的端口（1-65535）"

[cli.help._root.webhook.port.arg.unset]
help = "移除已保存的端口，使下次启动选择空闲端口"

[cli.help._root.webhook.allow-external]
about = "显示或更改是否允许其他计算机调用 Webhook"
long = """
显示或更改是否允许其他计算机调用 Webhook。

默认关闭：监听器仅监听 127.0.0.1，因此只有本机程序可以访问。`on` 使监听器从下次启动起监听所有 IPv4 接口（0.0.0.0）；届时任何能访问该端口的人都能访问已注册的 Webhook。不带参数时，显示已保存的值及运行中监听器实际打开的地址。"""

[cli.help._root.webhook.allow-external.arg.value]
help = "`on` 或 `off`"

[cli.help._root.webhook.config]
about = "已弃用：改用 `tasty webhook port`。此命令仍以相同方式工作"

[cli.help._root.webhook.config.arg.port]
help = "保存监听器端口（1-65535）。从下次启动起生效"

[cli.help._root.port]
about = "将此实例的 IPC 端口输出到 stdout（远程端口自动发现链的第一步，`ssh host tasty port`）。仅读取端口文件，不使用 IPC"

[cli.help._root.screenshot]
about = "将截图保存为 PNG 文件（不依赖焦点）"
long = """
将截图保存为 PNG 文件（不依赖焦点）。

指定 `--surface` 时，按该终端 Surface 自身的网格大小进行离屏渲染并截图，适用于后台标签页和工作区，且不会改变焦点或当前显示的画面。否则截取整个窗口：使用 `--window` 按 ID 选择窗口（参见 `list windows`）；若省略且仅打开了一个窗口，则使用该窗口。

显式指定 `--window` 时，可以指定 `list windows` 未显示的窗口，例如设置或插件模态框。只有自动选择（未指定 `--window`）才限于主窗口，且绝不会回退到碰巧获得焦点的窗口。"""

[cli.help._root.screenshot.arg.path]
help = "输出 PNG 路径"

[cli.help._root.screenshot.arg.surface]
help = "要截取的终端 Surface ID（离屏；不依赖焦点）"

[cli.help._root.screenshot.arg.window]
help = "要截取的窗口 ID（整个 Tasty 画面）。打开多个窗口时必填。可指定 `list windows` 未列出的模态窗口"

