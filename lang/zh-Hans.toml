[cli.help._root.agent.rate-limit-set]
about = "为 (agent, metric) 配置速率限制桶，每 `per_ms` 毫秒补充 `limit` 个令牌"
long = """
为 (agent, metric) 配置速率限制桶，每 `per_ms` 毫秒补充 `limit` 个令牌。

实际会消耗令牌的指标只有一个：`ipc_calls`。以其他名称存储的桶会由 `rate-limit-list` 列出，但没有任何调用会扣除其令牌，因此不会限制任何调用。

`ipc_calls` 桶在每次 IPC 调用时扣除一个令牌，超出额度的调用返回 `-32010 throttled`，并在审计日志中记录 Deny。并非所有调用都会扣除令牌：没有会话令牌的调用方（即普通 CLI）和宿主自身的调用不受限制，`telemetry.*`、`agent.rate_limit_*` 和 `system.info` 也不受限制。后两者使受限的智能体仍能读取并解除自身限制。"""

[cli.help._root.agent.rate-limit-set.arg.agent]
help = "智能体 ID"

[cli.help._root.agent.rate-limit-set.arg.metric]
help = "指标名称。只有 `ipc_calls` 会被实际消耗"

[cli.help._root.agent.rate-limit-set.arg.limit]
help = "每个时间段的令牌补充量"

[cli.help._root.agent.rate-limit-set.arg.per_ms]
help = "时间段长度，单位为毫秒（如按分钟计则为 `60000`）"

[cli.help._root.agent.rate-limit-set.arg.burst]
help = "桶容量（默认为 `limit`）"

