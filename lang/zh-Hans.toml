report_usage = """
任务报告：为正在执行的任务尝试写入记录。

  tasty agent report append --address '<address>' '<text>'

使用收到的地址（智能体指令中显示为 "Report address"）。任务运行器启动的进程（run 任务、其后处理命令、自定义 reduce Shell）在 TASTY_TASK_REPORT 中保存了该地址，可以省略 --address：

  tasty agent report append '<text>'

- 使用纯文本。每次调用添加一条记录，供人阅读，不作为后续任务的数据。
- 超过追加上限（除非在设置中更改，否则为 1 KiB）的记录会被截断，并标记为 omit_by_limit。尝试的记录块填满后，后续记录仅计入 omitted_appends。无论哪种情况，命令都会成功且不输出任何内容，因此不会干扰以标准输出作为任务结果的命令。
- 仅在尝试运行期间接受记录。尝试结束后，地址关闭，命令失败。
- run 任务也可以输出以 ::tasty-report:: 开头的标准错误行，代替调用此命令。
- 读取报告：tasty agent dag-report <dag id> [--task <task id> [--attempt <n>]]"""

