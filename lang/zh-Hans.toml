[cli.help._root.agent.task-run]
about = "启动、停止或检查工作区运行器。重复启动具有幂等性。宿主启动时恢复已保存的状态，但保持运行器停止"
long = """
启动、停止或检查工作区运行器。重复启动具有幂等性。宿主启动时恢复已保存的状态，但保持运行器停止。

停止运行器会停止完成检查，不会停止其已调度的进程。这些进程的任务保持 Running 状态。正在运行的后处理除外：它会被终止并记录为已取消，其任务在运行器再次启动时失败。再次启动会恢复句柄，并检查进程是否存活或是否已保存退出结果。"""

