[cli.help._root.agent.lease-acquire]
about = "获取任意资源的租约（建议性、协作式）"
long = """
获取任意资源的租约（建议性、协作式）。

退出码不表示是否获取成功。`--mode fail` 会将冲突视为错误，但 `--mode block` 会成功返回，并报告 `acquired: false` 和当前持有者，须读取该字段。租约也没有强制约束机制：它只是参与者约定读取的标记。

不指定 `--ttl-ms` 时，租约永不过期，只有使用相同持有者 ID 的 `lease-release` 才能释放，因此持有者终止后仍会占用资源。重启清理不涵盖这种情况，只释放运行中的任务以自身任务 ID 持有的租约。"""

