[cli.help._root.memory.secret]
about = "机密记忆存储。CLI 以 `_host` 所有者身份运行；不存在 --owner 标志。按设计，CLI 无法访问插件的机密区域"
long = """
机密记忆存储。CLI 以 `_host` 所有者身份运行；不存在 --owner 标志。按设计，CLI 无法访问插件的机密区域。

机密仅表示“其他所有者无法读取”，不提供其他保护。值以原始字节形式存放在同一个 `memory.db` 中，因此任何能打开该文件的人都能读取这些值——隔离在 IPC 路径上实施，不在磁盘上实施。若数据需要抵御此类访问，使用操作系统密钥环，或将数据存放在具有独立权限的单独文件中，此处仅存储路径。"""

