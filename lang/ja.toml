[cli.help._root.events]
about = "位置を指定してホストのイベントを読み取る (fetch, follow)"
long = "位置を指定してホストのイベントを読み取ります (fetch, follow)。\n\nイベントはメモリにのみ保存され、再起動で内容と位置が初期化されます。応答の `epoch` で位置が属する世代を区別します。要求した位置が保持範囲外なら、スキップしたイベント数を応答に含めます。"

[cli.help._root.events.fetch]
about = "ある位置からイベントを読む。応答を 1 つの JSON オブジェクトとして出力する"
long = "指定した位置からイベントを読み、1つのJSONオブジェクトで出力します。\n\nイベントはevents配列に、次の読み取り位置と世代はnext_offsetとepochに入ります。イベントを1行ずつ出力するにはfollowを使います。\n\n前の応答のnext_offsetを渡して読み進めます。読み取りによってホスト側の消費者別カーソルが動いたり、遅い消費者用のキューが作られたりはしません。フィードの更新や保持範囲の変更により、同じ要求の結果が変わることがあります。\n\nイベントはメモリにのみ保存されます。再起動で消去され、位置も最初から始まります。応答のepochが元の位置の世代と異なる場合、その位置を新しい世代にそのまま適用しないでください。"

[cli.help._root.events.fetch.arg.offset]
help = "読み始める位置。既定は 0、まだ残っているうち最も古い位置"

[cli.help._root.events.fetch.arg.max]
help = "最大で何件まで。ホストが上限を掛ける"

[cli.help._root.events.fetch.arg.filter]
help = "キーパターン: 完全一致のキー（`agent.task_finished`）または名前空間のワイルドカード（`agent.*`）。購読が使うのと同じ文法だ"

[cli.help._root.events.fetch.arg.wait_ms]
help = "答える前に何か届くのをこれだけ待つ。既定は 0、今あるもので即座に答える"

[cli.help._root.events.follow]
about = "フィードを追う: ある位置から long-poll し、イベントごとに JSON 1 行を出し続ける。中断するまで動く"
long = "指定した位置から long-poll でイベントを受け取り、1 行に JSON を一つずつ出力します。中断するまで実行します。\n\n最後の位置で呼び直すと続きから読めます。その位置が保持範囲外なら、欠落の通知を stderr に出力します。イベント JSON を受け取る stdout の `while read` 処理に通知は混ざりません。\n\ntasty の再起動で位置も初期化されます。再接続時には元の offset の `--epoch` も指定してください。世代が変わっていれば stderr に通知し、新しい世代の先頭から読みます。epoch がなくても位置が現在の末尾を超えていれば同様に処理します。切断時は再接続用の `--offset` と `--epoch` を表示して終了します。`--reconnect` を指定すると終了せず再接続を試みます。"

[cli.help._root.events.follow.arg.offset]
help = "開始する位置。既定は 0、まだ残っているうち最も古い位置"

[cli.help._root.events.follow.arg.filter]
help = "キーパターン。`fetch --filter` と同じ文法だ"

[cli.help._root.events.follow.arg.batch]
help = "1 リクエストあたり何件まで"

[cli.help._root.events.follow.arg.wait_ms]
help = "イベントがない場合に応答前に待つ時間"

[cli.help._root.events.follow.arg.epoch]
help = "offset が属する世代です。切断時の案内または `fetch` の応答の値を使ってください。その後 tasty が再起動していれば、新しい世代の先頭から読みます。"

[cli.help._root.events.follow.arg.reconnect]
help = "接続が切れたら終了せず 1 秒ごとに再接続する。世代を引き継ぐので、再起動は通知されその先頭から追う"

[cli.help._root.telemetry]
about = "エージェントテレメトリ（指標の記録、要約、時系列、上位 N）"
long = "エージェントの指標を記録し、集計、時系列、上位 N 件を照会します。\n\n記録元は 2 種類です。エージェントが `telemetry record` で記録するイベントと、ホストがエージェントの IPC 呼び出しごとに method タグを付けて 1 件記録する `ipc_calls` です。ホスト自身の呼び出し、`telemetry.*`、制限で拒否された throttled 呼び出しは数えません。\n\n照会時に元のイベントを集計し、集計結果は別に保存しません。直近 2 万件だけを保持するため、`--since` を過去に指定しても削除済みの記録は取得できません。anomaly は別途、直近 5 千件、最大 50 時間まで保持します。"

[cli.help._root.telemetry.record-batch]
about = "複数のイベントを一度に記録する — 同じタイムスタンプを共有するので順序が保たれる。イベント間の順序が重要なときは `record` を繰り返す代わりにこれを使う"

[cli.help._root.telemetry.record-batch.arg.events]
help = "イベントを並べた JSON 配列。各要素は `record` と同じフィールドを取る (`metric`, `value`, `op`, `tags`, …)"

[cli.help._root.telemetry.record]
about = "メトリクスイベントを 1 件記録する"

