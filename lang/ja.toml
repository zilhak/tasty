[cli.help._root.agent.task-create]
about = "ワークスペースの中に新しい task を作る"
long = "ワークスペースの中に新しい task を作る。\n\n作ることは走らせることではない。そのワークスペースの runner を `task-run --action start` で起こすまで何も dispatch されず、誰も代わりに起こしてくれない — 起動時にも起こさない。起こさなければ task は `Ready` に座ったままで、`task-await` は timeout をただ燃やす。"

[cli.help._root.agent.task-create.arg.command]
help = "TaskCommand を JSON で（例: `{\"kind\":\"run\",\"command\":[\"cargo\",\"build\"]}`）。`workspace_id` を省くと `--workspace-id` から埋められ、入れていて違う場合は `--workspace-id` が勝ち警告が一緒に返る。インライン JSON か `@path/to/file.json` を受ける"

[cli.help._root.agent.task-create.arg.concurrency_limit]
help = "`metadata.semaphore.name` の短縮形 — 同じ semaphore 名が付いた task が同時に何個まで走るかを制限する（残りは permit が空くまで `ready` で待つ）。`--metadata` と一緒に与えると統合され、`--metadata` が既に `semaphore` を決めていれば衝突だ"

