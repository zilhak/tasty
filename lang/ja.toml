[cli.help._root.approval]
about = "ユーザーへの承認要求と応答の管理 (request/respond/await/cancel/list/get)"
long = "ユーザーへの承認要求と応答を管理します (request/respond/await/cancel/list/get)。\n\n`request`、`respond`、`await`、`cancel`、`list`、`get` は実行中ホストのメモリストア 1 つを使います。再起動時に空になるため、待機中の要求は消えます。以前の要求は `list` に表示されず、その ID で `await` すると「not found」を返します。\n\n別途保存した記録は memory store の `history` から取得できます。`history` は過去の記録、`list` は現在応答できる要求の一覧です。"

[cli.help._root.approval.request]
about = "承認を要求し、作成されたIDを出力します"
long = "承認を要求し、作成されたIDを出力します。\n\nタイムアウトはapproval awaitで処理します。応答を待つ呼び出しがなければ、pendingの要求は自動では期限切れになりません。"

[cli.help._root.approval.request.arg.title]
help = "ポップアップや通知に出す題名"

[cli.help._root.approval.request.arg.body]
help = "任意の本文（複数行の説明）"

[cli.help._root.approval.request.arg.choices]
help = "`key:label[:destructive]` 形式の選択肢をカンマで区切ります (例: `approve:Approve,deny:Deny:1`)。省略すると `approve / deny` を使います。"

[cli.help._root.approval.request.arg.default_choice]
help = "タイムアウト時に記録する選択キーです。システムがこのキーを含む `timed_out` の結果を残します。`responded` の応答ではないため、`approval history --decision` の対象にはなりません。"

