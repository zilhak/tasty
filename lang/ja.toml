[cli.help._root.agent.lease-acquire]
about = "任意の resource に lease を取る（勧告的・協調的）"
long = "任意の resource に lease を取る（勧告的・協調的）。\n\n取れたかどうかは終了コードではない。`--mode fail` は衝突を エラーにするが、`--mode block` は成功で終わりながら `acquired: false` と現在の holder を出す — そのフィールドを読むこと。lease を強制するものも無い: 参加者どうしが読むと約束した印にすぎない。\n\n`--ttl-ms` が無ければ lease は決して期限切れにならず、同じ holder id での `lease-release` だけがそれを解く — holder が死ぬと resource を握ったまま残る。再起動時の掃除もその場合を覆わない — それは実行中の task が自分の task id で握った lease だけを解く。"

[cli.help._root.agent.lease-acquire.arg.holder]
help = "holder id（空であってはならない）"

[cli.help._root.agent.lease-acquire.arg.mode]
help = "衝突モード: fail | block（デフォルト: fail）。`block` は待たない — すぐに `acquired: false` で戻り、再試行は呼び出し側の仕事だ"

[cli.help._root.agent.lease-acquire.arg.resource]
help = "resource 識別子（例: `file:/path`, `workspace:foo`）"

[cli.help._root.agent.lease-acquire.arg.ttl_ms]
help = "有効期間（ミリ秒）。省略すると期限切れの無い lease になる。期限切れは遅延評価だ — 時刻を過ぎた瞬間ではなく、次の `lease-acquire` か `lease-list` が evict する"

[cli.help._root.agent.lease-acquire.arg.workspace_id]
help = "ワークスペース id（フォーカス非依存 — 必須）"

[cli.help._root.agent.lease-list]
about = "ワークスペースの lease を全て並べる（期限切れのものは自動 evict）"

[cli.help._root.agent.lease-list.arg.workspace_id]
help = "ワークスペース id（フォーカス非依存 — 必須）"

