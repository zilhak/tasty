[cli.help._root.plugin.disable]
about = "plugin を無効化する（動作中なら正常終了させる）"
long = "plugin を無効化する（動作中なら正常終了させる）。\n\n印はディスクに書かれるので再起動をまたぐ — その後で同じ id を `plugin install` しても再び有効にはならない。これはアンインストールではない: ディレクトリは残り、コマンド名前空間の所有もそのままなので、`tasty <名前空間> ...` は「そんなメソッドは無い」ではなく `plugin ... is not running` と答える。代わりにその plugin が提供していたもの — ファイルの detector と handler、hook handler、completion strategy、設定ページ — が全て外れるため、その plugin が開いていたファイルは別の経路で開くようになる。"

