[cli.help._root.plugin.install]
about = "tasty-plugin.toml のあるディレクトリから plugin をインストールする"
long = "tasty-plugin.toml のあるディレクトリから plugin をインストールする。\n\nもう 2 つ起きるが、どちらも尋ねられない: マニフェストが宣言した権限が即座に全て与えられ、その id の無効化の印が既に無い限りそのまま有効化されて起動する。先に `tasty-plugin.toml` を見るか、後から `plugin permissions <id>` と `plugin revoke <id> <permission>` で確認して戻すこと。"

