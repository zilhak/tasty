[cli.help._root.webhook.register]
about = "インバウンド Webhook を登録し、発行された URL を出力する"
long = "インバウンド Webhook を登録し、発行された URL を出力する。\n\n`--handler <id>`(登録済み hook handler を結ぶ)と `--sequence <json>`(インライン IpcSequence を定義する)のうち、ちょうど一つを指定する。外部 HTTP ペイロードが埋めるのは `${body.x}` / `${header.x}` / `${query.x}` の値スロットだけだ。\n\nリスナーは loopback ではなくすべてのインターフェースに bind する。出力される URL が `127.0.0.1` なのは curl しやすいからにすぎず、そのポートに届く者は誰でもこの Webhook に届く。署名検証はどんな形でも存在しない — `--auth-token` は定数時間で比較する固定の共有秘密ひとつであり、`--auth-*` を与えなければ尋ねた者全員に対してシーケンスが発火する。`--persistent` はそのトークンを平文で `~/.tasty/webhooks.toml` に書く。\n\nHTTP の応答はシーケンスが走る前に決まる固定の確認応答なので、`200` は呼び出しが一致して引き渡されたという意味であって、それが成功したという意味ではない。失敗したステップは後続のステップを止めず応答も変えないため、部分的にしか適用されていないシーケンスが通常の終わり方として残る。失敗が現れる場所はログだけだ。"

[cli.help._root.webhook.register.arg.methods]
help = "許可する HTTP メソッド(繰り返し可)。既定は POST"

[cli.help._root.webhook.register.arg.handler]
help = "結ぶ登録済み hook handler の id(その source が webhook を受け付ける必要がある)"

[cli.help._root.webhook.register.arg.sequence]
help = "{\"method\",\"params\"} オブジェクトの JSON 配列で与えるインライン IpcSequence"

[cli.help._root.webhook.register.arg.persistent]
help = "再起動をまたいで保持する(既定: 一時的 — 再起動で消える)"

[cli.help._root.webhook.register.arg.ttl_secs]
help = "秒単位の時間制限 — この秒数が過ぎると Webhook は自動的に失効する。`--count` とは併用できない"

[cli.help._root.webhook.register.arg.count]
help = "回数制限 — 受理された呼び出しがこの回数に達すると Webhook は自動的に消滅する。`--ttl-secs` とは併用できない"
long = "回数制限 — 受理された呼び出しがこの回数に達すると Webhook は自動的に消滅する。`--ttl-secs` とは併用できない。\n\n受理されたとは、リクエストが path と `--method` のいずれかに一致し、認証を設定しているなら正しいトークンを載せて来た、という意味だ。メソッド不一致(`405`)とトークン拒否(`401`)は回数をそのまま残すので、トークンを知らない送信者はそれを消費できない。この回数が測らないのはその後シーケンスが成功したかどうかだ — その時点で応答はすでに送られており、数えた呼び出しは戻らない。"
[cli.help._root.webhook.register.arg.auth_location]
help = "任意の認証 — トークンをどこに載せて来るか。未指定なら認証なし"

[cli.help._root.webhook.register.arg.auth_key]
help = "トークンの位置キー — クエリパラメータ / ボディのフィールドパス / ヘッダー名。query|body|header では必須で、bearer では無視される"

[cli.help._root.webhook.register.arg.auth_token]
help = "認証を通すために送信者が提示する固定の共有トークン"

[cli.help._root.webhook.list]
about = "登録されている Webhook をすべて列挙する(URL・メソッド・ハンドラ・ステップ・寿命)"

[cli.help._root.webhook.info]
about = "id で Webhook ひとつの詳細を表示する(残り回数・失効を含む)"

[cli.help._root.webhook.info.arg.id]
help = "Webhook の opaque id(URL の `/{id}` パスセグメント)"

[cli.help._root.webhook.unregister]
about = "id で Webhook を解除する — 以後そのパスは 404 を返す"

[cli.help._root.webhook.unregister.arg.id]
help = "Webhook の opaque id"

[cli.help._root.webhook.sweep]
about = "失効した Webhook をまとめて掃き出す(時間超過・回数消尽)"
long = "失効した Webhook をまとめて掃き出す(時間超過・回数消尽)。\n\nタイマーがないので失効はひとりでには執行されない — 失効した Webhook は誰かがそれを覗くまで登録されたまま残る。そのパスに呼び出しが来ればその場で削除され `410` を一度だけ返し、以後はすべて `404` になる。再起動は失効した永続 Webhook を捨て、このコマンドはそのどちらも待たずに全体を一度に片づける。"

[cli.help._root.webhook.config]
about = "リスナーの bind ポートを読み取る/設定する(`~/.tasty/webhooks.toml` に永続化)"
long = "リスナーの bind ポートを読み取る/設定する(`~/.tasty/webhooks.toml` に永続化)。\n\n`--port` なしで呼ぶと現在のポートと bind 状態を出力する。`--port` を与えると新しいポートを永続化し、リスナーが再び bind するのは次の再起動のときだけだ。ポートは設定値専用で、tasty が黙って代替ポートに bind することはない。bind アドレスは設定できず loopback でもない — リスナーがすべてのインターフェースを取るので、このポートが露出のすべてだ。"

[cli.help._root.webhook.config.arg.port]
help = "リスナーのポートを設定する(1-65535)。反映には再起動が必要"
