[cli.help._root.agent.dag-list]
about = "登録済みタスクから DAG 一覧を計算します。同じ `metadata.dag` 文字列を持つタスクを 1 つのグループにし、残りは `depends_on` / `Fallback.task` / `Reduce.inputs` / `metadata.fallback_of` の接続を方向に関係なくたどってまとめます。DAG を別に保存することはありません。`--workspace-id` を省略すると現在の全ワークスペースを調べます。"

