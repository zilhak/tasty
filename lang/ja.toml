[cli.help._root.plugin.install]
about = "tasty-plugin.toml のあるディレクトリから plugin をインストールする"
long = "tasty-plugin.toml のあるディレクトリからプラグインをインストールします。\n\n追加の確認なしで 2 つの処理を行います。マニフェストの全権限を付与し、その ID の無効化設定が残っていなければ有効化して起動します。インストール前に `tasty-plugin.toml` を確認してください。インストール後は `plugin permissions <id>` で権限を確認し、`plugin revoke <id> <permission>` で取り消せます。"

[cli.help._root.plugin.install.arg.path]
help = "plugin ディレクトリのパス（tasty-plugin.toml が必要）"

[cli.help._root.plugin.remove]
about = "インストール済みの plugin を id で削除する"
long = "ID でプラグインを削除します。\n\nプラグインのディレクトリ全体を削除するため、中に保存されたファイルも消えます。組み込みプラグインは削除した状態を記録し、次回起動時にも再インストールしません。`plugin upgrade-builtins --restore-removed <id>` で復元すると、有効な状態でインストールします。"

[cli.help._root.plugin.remove.arg.id]
help = "plugin id（例: com.example.explorer）"

[cli.help._root.plugin.upgrade-builtins]
about = "組み込み plugin を全てバンドルから同期し直す"
long = "バンドルの組み込みプラグインをインストール先へ反映します。\n\nバンドルのバージョンが高ければディレクトリを置き換えます。同じバージョンなら内容の異なるファイルだけを変更します。インストール済みのバージョンが高ければ内容を読まずにスキップします。この場合も上書きするには `--force` を指定してください。変更した組み込みプラグインが新たに要求する権限は、同じ呼び出しで付与します。"

[cli.help._root.plugin.upgrade-builtins.arg.force]
help = "インストール済みのバージョンがバンドル以上でも上書きする"

[cli.help._root.plugin.upgrade-builtins.arg.restore_removed]
help = "指定した組み込みプラグインを `removed_builtins` から除き、今回の呼び出しで自動インストールできるようにします。複数の ID は繰り返し指定してください。"

[cli.help._root.plugin.upgrade-builtins.arg.restore_all]
help = "`removed_builtins` の全組み込みプラグインを復元します。`--restore-removed` より優先します。"

[cli.help._root.plugin.upgrade-builtins.arg.restart_running]
help = "実行ファイルを置き換える組み込みプラグインを再起動します。Windows で実行中のファイルを上書きするときの共有違反を避けるためにも使います。対象のサーフェスを一時的に閉じるため、既定では無効です。"

