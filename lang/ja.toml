[cli.help._root.agent.rate-limit-set]
about = "(agent, metric) に rate limit バケットを設定する — `per_ms` ミリ秒ごとに `limit` トークン"
long = "(agent, metric) に rate limit バケットを設定する — `per_ms` ミリ秒ごとに `limit` トークン。\n\n実際にトークンが引かれる metric は 1 つだけだ: `ipc_calls`。別の名前で保存したバケットは `rate-limit-list` に出るが、何もそれを使わないので何も制限しない。\n\n`ipc_calls` バケットは IPC 呼び出し 1 件ごとにトークンが 1 つ引かれ、予算を超えた呼び出しは `-32010 throttled` で戻り audit に Deny が残る。全ての呼び出しを数えるわけではない: セッショントークンの無い呼び出し元 — 素の CLI — とホスト自身の呼び出しは免除で、`telemetry.*`・`agent.rate_limit_*`・`system.info` も免除だ。後ろの 2 つが、throttle されたエージェントが自分の上限を読んで解くための通路だ。"

[cli.help._root.agent.rate-limit-set.arg.agent]
help = "エージェント id"

[cli.help._root.agent.rate-limit-set.arg.burst]
help = "バケットの容量（デフォルトは `limit`）"

[cli.help._root.agent.rate-limit-set.arg.limit]
help = "1 周期ごとに補充されるトークン数"

[cli.help._root.agent.rate-limit-set.arg.metric]
help = "metric 名。何かが実際に引いて使うのは `ipc_calls` だけだ"

[cli.help._root.agent.rate-limit-set.arg.per_ms]
help = "1 周期の長さ（ミリ秒、例: 分単位なら `60000`）"

[cli.help._root.agent.rate-limit-status]
about = "rate limit の状態を見る。agent や metric で絞れる"

