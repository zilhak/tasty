about = "ID を指定してワークスペースをまるごと閉じる — 中のペイン・タブ・サーフェスもすべて"
long = "ID で指定したワークスペースと、その中のすべてのペイン、タブ、サーフェスを閉じます。\n\nこの操作は取り消せません。ワークスペース内のターミナルをすべて終了し、再オープン履歴やスクロールバックには残しません。再オープンできるのは、ユーザーが画面で直接閉じた項目だけです。\n\n対象の ID は `--id` で指定してください (`tasty list workspaces` を参照)。現在の画面から対象を選ぶことはありません。別のワークスペースを閉じても、現在表示中のワークスペースは変わりません。呼び出したサーフェスが属するワークスペース、リモート attach セッションをミラーリングするワークスペース、最後の 1 つのワークスペースは閉じられません。ウィンドウを閉じるには `tasty close window` を使ってください。"

[cli.help._root.close.workspace.arg.id]
