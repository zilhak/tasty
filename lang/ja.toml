[cli.help._root.list.pressure]
about = "インスタンス起動後のIPC負荷と診断統計を表示します"
long = "インスタンス起動後のIPC負荷と診断統計を表示します。\n\n各ブロックの測定対象は異なるため、互いに差し引いて比較しないでください。queue_before_gateは後で権限検査に拒否された要求も含み、handler_after_gateは処理された要求、plugin_round_tripは応答のあったプラグイン呼び出し、dbは成功したDBコミットを測定します。権限検査を通過しても、ハンドラの測定前に応答する要求があります。\n\nconnectionsはattach・meshストリームを含むTCP接続を数えます。liveは現在数、limitは上限、refused_saturatedは要求を送る前に接続上限で拒否された数です。累計は減りませんが、liveと派生平均は減ることがあります。accept_waitsはaccepted + refused_saturatedです。accept_wait_bound_us_sum/max/meanは、acceptキューが最後に空と観測されてからの経過時間を使った、OSキュー待ち時間の上限です。実測した待ち時間ではありません。キューが空のときは100 ms待機します。\n\nqueue_before_gate、handler_after_gate、plugin_round_tripにはヒストグラムもあります。bounds_usは区間境界で、countsは最上限を超えた区間を含むため1要素多くなります。countsは累積値ではなく、合計が観測数です。分位数は計算せず、dbとconnectionsにはヒストグラムがありません。queue_before_gate.waitsはwait_us_meanの分母であり、wait_us_hist.countsの合計です。commandsは処理ラウンドの最後に更新するため、この照会を含むラウンドの途中ではwaitsより小さくなることがあります。\n\ndb_pragmasはmemory_dbとstate_dbの要求設定と実際の設定を比較します。degradedは設定の不一致、またはmemory_dbを開けずメモリDBに切り替えた状態です。init_failureはその失敗理由で、なければnullです。代替DBは引き続き使用されます。state_dbが開かれていなければnullで、ヘッドレスも該当します。\n\nstream_pushはattach・meshフレームを数えます。frames_droppedは接続を維持したまま満杯のキューで捨てたフレーム数、clients_lagged_outは遅延により切断した接続数です。backlogは現在全接続のキューにあるフレーム数、sink_capacityは1接続のキュー上限です。\n\nqueue_admissionは現在のバイト数・コマンド数・注入コマンド数、最大バイト数、limit_bytesとlimit_injected_depthを示します。refused_bytesとrefused_depthはキューに入る前に拒否した要求数で、他のブロックには含まれません。IPCサーバーがなければこのブロックはnullです。queue_dispatchは処理ラウンド、コマンド数/時間予算による中断、expired_before_run、開始したコマンド数、現在/最大のin_flightを記録します。開始済みの要求は、コマンドと応答待機側の両方が共有状態を手放すまでin_flightに含まれます。\n\nkeyed_requestsは冪等キー付き要求を1回ずつ数えます。executedは実行、replayedは保存済み応答の再利用、conflictedは競合による未実行、discardedは応答を保持しなかった場合、in_flightは実行中の要求に合流した場合です。このin_flightは累積判定数で、queue_dispatchの現在数とは異なります。\n\nslow_requestsはキュー待ち + ホスト処理 + プラグイン待ちがthreshold_us（100 ms）以上の要求を、古い順にcapacity件まで保持します。request_seqはJSON-RPC IDやtrace IDではなく独自の要求番号です。行にはmethod、caller、queue_wait_us、host_us、plugin_hopsがあり、各hopにはプラグイン、host_request_id、待ち時間、結果が入ります。admittedはこれまで保持した行数で、現在の行数を引くと押し出された数になります。この照会自身は保持しません。hostのoutcomeはok/error、error_codeはJSON-RPCエラーコードで、期限切れ（-32067）、拒否（-32001）、成功を区別します。まだ応答していなければ両方nullです。\n\ngate_refusals.judgedはLocalとプラグイン呼び出しを含め、権限検査に達した要求数です。permission_denied（-32001）、cap_blocked（-32007）、throttled（-32010）の順で検査し、1要求を最大1つの拒否項目に数えます。権限不足、存在しないメソッド、呼び出し側に禁止されたメソッドはいずれも権限拒否になりえますが、権限追加で解決するのは最初の場合だけです。トークンなしのLocal呼び出しはこの検査を通過します。不正・期限切れ・失効済みトークンはjudgedより前に拒否され、検査通過後の-32001は通過側に数えます。不正な冪等キーは含みません。この累計は再起動で初期化され、バケット別に永続化されるagent rate-limit-statusのthrottled_countとは異なります。\n\n観測のない平均は0ではなくnullです。"

