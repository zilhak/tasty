long = "ワークスペースのrunnerを起動・停止し、状態を確認します。startを繰り返しても重複起動しません。ホスト起動時に保存済みの状態は復元されますが、runnerは停止したままです。\n\nrunnerを停止しても、開始済みのプロセスは実行を続け、タスクはRunningのまま残ります。再起動するとハンドルを復元し、プロセスが動いているか、終了結果が保存されているかを確認します。"

