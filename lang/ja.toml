[cli.help._root.agent.lease-acquire]
about = "任意の resource に lease を取る（勧告的・協調的）"
long = "リソースの使用権を示す lease を取得します。参加者がこの表示を確認して従う方式であり、リソースへのアクセス自体を強制的に防ぐものではありません。\n\n競合時に `--mode fail` はエラーを返します。`--mode block` は待たずに成功応答へ `acquired: false` と現在の holder を含めます。取得できたかどうかは終了コードではなく acquired で確認してください。\n\n`--ttl-ms` を省略すると自動で期限切れになりません。同じ holder ID での `lease-release` が必要なため、holder が終了しても lease は残ります。再起動で整理するのは、実行中だったタスクが自身のタスク ID で保持した lease だけです。"

[cli.help._root.agent.lease-acquire.arg.workspace_id]
help = "ワークスペース id（フォーカス非依存 — 必須）"

[cli.help._root.agent.lease-acquire.arg.resource]
help = "resource 識別子（例: `file:/path`, `workspace:foo`）"

[cli.help._root.agent.lease-acquire.arg.holder]
help = "holder id（空であってはならない）"

[cli.help._root.agent.lease-acquire.arg.ttl_ms]
help = "有効期間 (ミリ秒)。省略すると期限はありません。期限切れの lease は次の `lease-acquire` または `lease-list` 呼び出し時に削除します。"

[cli.help._root.agent.lease-acquire.arg.mode]
help = "衝突モード: fail | block（デフォルト: fail）。`block` は待たない — すぐに `acquired: false` で戻り、再試行は呼び出し側の仕事だ"

[cli.help._root.agent.lease-release]
about = "lease を解く。現在の holder だけが解ける"

[cli.help._root.agent.lease-release.arg.workspace_id]
help = "ワークスペース id（フォーカス非依存 — 必須）"

[cli.help._root.agent.lease-release.arg.resource]
help = "lease を取った resource 識別子"

[cli.help._root.agent.lease-release.arg.holder]
help = "今その lease を握っている holder id"

