[cli.help._root.agent.task-list.arg.workspace_id]
help = "ワークスペース id（フォーカス非依存 — 必須）"

[cli.help._root.agent.task-list.arg.state]
help = "状態で絞り込む（カンマ区切り: waiting,ready,running,succeeded,failed,cancelled,skipped,unknown）。複数の状態を与えると、そのいずれかに合う task を全て出す（`--state waiting,ready,running` = まだ終わっていない task）"

[cli.help._root.agent.task-get]
about = "task を 1 つ取得する"

