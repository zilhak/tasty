[cli.help._root.approval]
long = "人間への引き継ぎ承認ゲート（request/respond/await/cancel/list/get）\n\n生きているゲートはホストより長くは残らない。`request`・`respond`・`await`・`cancel`・`list`・`get` は全てメモリ上のストア 1 つを読み、そのストアは起動のたびに空から始まる。だからホストが止まったとき `pending` だった要求はその後には無い — `list` に出ず、その id で `await` すると「not found」が返る。残るのは書かれた記録で、それを memory store から読むのが `history` だ。`history` はログ、`list` は今答えられるものとして読むこと。"
