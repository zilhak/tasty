[cli.help._root.agent]
about = "エージェントのタスク、barrier、semaphore、lease、reducer、呼び出しレート制限を管理します"

[cli.help._root.agent.task-create]
about = "ワークスペースにタスクを作成します。まだ実行はしません"
long = "ワークスペースにタスクを作成します。まだ実行はしません。\n\n`task-run --action start`でワークスペースのrunnerを明示的に起動してください。ホストの起動だけではrunnerは開始されません。runnerがないとReadyのタスクは待機したままとなり、task-awaitがタイムアウトすることがあります。"

[cli.help._root.agent.task-create.arg.workspace_id]
help = "ワークスペース id（フォーカス非依存 — 必須）"

[cli.help._root.agent.task-create.arg.name]
help = "表示名"

[cli.help._root.agent.task-create.arg.command]
help = "タスクのコマンドを JSON で指定します (例: `{\"kind\":\"run\",\"command\":[\"cargo\",\"build\"]}`)。`workspace_id` を省略すると `--workspace-id` から補います。両者が異なる場合は `--workspace-id` を使い、警告を出します。JSON を直接指定するか `@path/to/file.json` から読み取れます。"

[cli.help._root.agent.task-create.arg.depends_on]
help = "カンマ区切りの依存 task id 一覧"

[cli.help._root.agent.task-create.arg.on_failure]
help = "失敗時の処理: abort | continue_downstream | fallback:<task_id> (既定値: abort)。abort と continue_downstream は先行タスクに依存する後続タスクに設定します。fallback は失敗する可能性のあるタスク自身に設定します。後続タスクに fallback を設定しても、先行タスクの失敗によるスキップには適用されません。"

[cli.help._root.agent.task-create.arg.metadata]
help = "メタデータ JSON（自由形式、task に付く）"

[cli.help._root.agent.task-create.arg.concurrency_limit]
help = "`metadata.semaphore.name` を簡単に指定するオプションです。同じセマフォのタスクの同時実行数を制限し、残りは許可が空くまで `ready` で待ちます。`--metadata` と併用するとマージしますが、既に `semaphore` があれば競合します。"

[cli.help._root.agent.task-create.arg.reserved_for_fallback]
help = "後のtask-create --on-failure fallback:<this-id>で主タスクに関連付けるまで、fallback候補をwaitingに保ちます。2つの呼び出しの間にrunnerが候補を実行するのを防ぎます。主タスクが関連付けられなければ待機し続けます"

