[cli.help._root.agent.task-create.arg.on_failure]
help = "失敗時の方針: abort | continue_downstream | fallback:<task_id>（デフォルト: abort）。どの task に付けるかが重要だ: abort・continue_downstream は依存する側（下流）の task に付け、fallback は自分が失敗しうる側（上流）の task に付ける — 下流の task に fallback を付けても、失敗した依存から来る skip の連鎖には何の効果も無い"

[cli.help._root.agent.task-create.arg.reserved_for_fallback]
help = "この task をまだ参照されていない fallback 候補として予約する: 後から `task-create --on-failure fallback:<この id>` が本体の task を結び付けるまで、どれだけ時間がかかっても `waiting` に留まる（`ready` にならないので runner は dispatch できない）。このフラグが無ければ依存の無い task はすぐ `ready` になり、結び付ける本体が作られる前に runner が一度回れば、その本体の結果と無関係に dispatch されて最後まで走りうる — 2 つの `task-create` 呼び出しのあいだの生成順序の競合を閉じる"

