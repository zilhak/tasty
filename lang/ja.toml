[cli.help._root.telemetry]
long = "エージェントのテレメトリ (メトリクス記録・集計・時系列・上位 N)\n\n入り口は 2 つある: エージェントが `telemetry record` で自分から報告するものと、エージェントの IPC 呼び出しごとにホストが method タグを付けて 1 件ずつ残す `ipc_calls` イベント (ホスト自身の呼び出し・`telemetry.*`・throttled の呼び出しは数えない)。問い合わせは raw イベントだけを読む — 永続的な rollup は無い — そして保存は直近 2 万件で 切られるので、`--since` をそれより過去にしても届かない。anomaly の記録は別に切られる: 直近 5 千件、最大 50 時間。"
about = "エージェントテレメトリ（指標の記録、要約、時系列、上位 N）"

