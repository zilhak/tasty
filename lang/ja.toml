[attach.toast]
# ミラーワークスペース内で構造変更(分割 / 新規タブ / 閉じる / 並べ替え)を試みた時に
# 表示。ミラーワークスペースはリモートワークスペースのビューなので、変更はリモート
# インスタンスで実行される必要がある(リモート転送は後続ステップで対応)。
mirror_structural_blocked = "ミラーされたリモートワークスペースではまだ構造を変更できません。"
mirror_structural_forward_failed = "リモートワークスペースがその変更を適用できませんでした。"
# リモート attach がハード占有中の surface を閉じようとしたときに表示。占有は「今
# リモートユーザーがこの端末を使っている」という宣言であり、閉じるとそのセッション
# が予告なく終了する。強制切断ボタンで回収してから閉じる。
close_blocked_hard_occupied = "リモートセッションが使用中の端末があるため閉じませんでした。強制切断で回収してから再試行してください。"
# ミラーワークスペースにフォーカスした状態で撮ったインタラクティブスクリーンショットが
# アップロードされ、リモートインスタンスのクリップボードに反映された時に表示。
mirror_capture_saved = "スクリーンショットをリモートのクリップボードにコピーしました。"
# 上記のアップロード/リモートクリップボード反映が失敗した時に表示。
mirror_capture_failed = "スクリーンショットをリモートのクリップボードにコピーできませんでした。"
# リモート接続が切断され(EOF / force-detach / heartbeat タイムアウト / 送信フレームの
# write 失敗)、ミラーワークスペースが片付けられた時に表示。マッピングなしで一時的に
# attach したミラー限定 — マッピング済みミラーは下の3キー(自動再接続対象)で表示。
mirror_disconnected = "リモート接続が切断されました。ミラーワークスペースを閉じました。"
# マッピング済みミラーワークスペースの接続が切れた時に表示 — ワークスペースとターミナル
# (scrollback 含む)はそのまま維持し、バックグラウンドの backoff 再試行が自動的に
# 再接続を試みる。
mirror_reconnecting = "リモート接続が切断されました。再接続を試みています…"
# backoff 再試行が成功し、ミラーが復帰した時に表示。
mirror_reconnected = "リモートワークスペースに再接続しました。"
# 繰り返し失敗して自動 backoff 再試行を諦めた時に1回表示。ワークスペースを離れて
# 戻れば手動での再試行は引き続き有効。
mirror_reconnect_giveup = "何度か試しましたが再接続できませんでした。このワークスペースを離れてから戻ると再試行します。"

# (09) リモートファイル転送のフィードバックポップアップ — 進捗(determinate)+ 失敗。
[transfer.progress]
# 転送進捗ポップアップのヘッダー(download グリフ)。受信側(リモートがファイルを受け取る)視点。
title = "ファイルを受信中"
# ghost ボタン — 進捗の監視のみ中断(バックグラウンド転送は完了まで継続)。
cancel = "キャンセル"

[transfer.error]
# 転送失敗ポップアップのヘッダー(danger グリフ)。
