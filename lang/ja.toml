about = "ワークスペースの agent task runner を起動・停止・確認する。runner は Ready の task を dispatch し、Running の task の完了を検知するホスト側のスレッドだ。同じワークスペースに start を 2 回しても idempotent だ"
long = "ワークスペースの agent task runner を起動・停止・確認する。runner は Ready の task を dispatch し、Running の task の完了を検知するホスト側のスレッドだ。同じワークスペースに start を 2 回しても idempotent だ。\n\n誰も代わりに起こしてくれない。ホストを起動すると生きているワークスペースの状態は復元するが runner は全て止まったままにする — だから一度も起こしたことの無いワークスペースは何も dispatch しない。\n\n`stop` が止めるのは仕事ではなく検知だ: 既に dispatch されたプロセスは走り続け、その task は終わったことに気付く主体が無いまま `Running` で残る。もう一度 start すればその handle を拾い直して 1 つずつ決着させる — 生きているか、死んでいるか、あるいはその watcher が残しておいた終了コードで。"

