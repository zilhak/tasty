[cli.help._root.plugin.disable]
about = "plugin を無効化する（動作中なら正常終了させる）"
long = "プラグインを無効化し、実行中なら正常終了を要求します。\n\n無効化設定はディスクに保存されます。再起動や同じ ID の `plugin install` でも自動的には有効になりません。インストール先とコマンド名前空間は残るため、`tasty <名前空間> ...` は不明なメソッドではなく `plugin ... is not running` を返します。\n\nプラグインが提供したファイルディテクターとハンドラー、フックハンドラー、完了判定方法、設定ページは登録から外れます。そのプラグインで開いていたファイルは別の処理方法を使います。"

