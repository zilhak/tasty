[cli.help._root.plugin.upgrade-builtins]
about = "組み込み plugin を全てバンドルから同期し直す"
long = "組み込み plugin を全てバンドルから同期し直す。\n\nマニフェストのバージョンが分岐を決め、その中では内容が決める: バンドルのバージョンが高ければディレクトリを丸ごと書き直し、同じバージョンなら違うものだけ書き直し、インストール済みの方が高ければ内容を見ずに飛ばす — `--force` はその最後の分岐のためのものだ。変わった組み込み plugin が新しく宣言した権限は、同じ呼び出しの中で与えられる。"

