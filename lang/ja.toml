[cli.help._root.webhook.register]
about = "インバウンド Webhook を登録し、発行された URL を出力する"
long = "インバウンド Webhook を登録し、発行された URL を出力します。\n\n`--handler <id>` (登録済み hook handler を使用) と `--sequence <json>` (インライン IpcSequence を定義) のどちらか一つを指定します。外部 HTTP リクエストは `${body.x}` / `${header.x}` / `${query.x}` に入る値だけを渡します。\n\nリスナーは loopback に限らず、すべてのインターフェースで接続を受け付けます。表示 URL の `127.0.0.1` は curl の例に便利なアドレスにすぎず、ポートにアクセスできる人は誰でもリクエストできます。署名検証はありません。`--auth-token` は固定の共有トークンで、`--auth-*` を省略すると認証なしでシーケンスを実行します。`--persistent` はトークンを `~/.tasty/webhooks.toml` に平文で保存します。\n\nHTTP 応答はシーケンスを実行する前に決まります。`200` はリクエストが一致して実行を引き渡したという意味で、実行成功を保証しません。ステップが失敗しても残りを実行し、応答も変わらないため、一部だけ適用されることがあります。実行失敗はログにのみ残ります。"

[cli.help._root.webhook.register.arg.methods]
help = "許可する HTTP メソッド(繰り返し可)。既定は POST"

[cli.help._root.webhook.register.arg.handler]
help = "結ぶ登録済み hook handler の id(その source が webhook を受け付ける必要がある)"

[cli.help._root.webhook.register.arg.sequence]
help = "{\"method\",\"params\"} オブジェクトの JSON 配列で与えるインライン IpcSequence"

[cli.help._root.webhook.register.arg.persistent]
help = "再起動をまたいで保持する(既定: 一時的 — 再起動で消える)"

[cli.help._root.webhook.register.arg.ttl_secs]
help = "秒単位の時間制限 — この秒数が過ぎると Webhook は自動的に失効する。`--count` とは併用できない"

[cli.help._root.webhook.register.arg.count]
help = "受理したリクエストが指定回数に達すると Webhook が期限切れになります。`--ttl-secs` とは併用できません"
long = "受理したリクエストが指定回数に達すると Webhook が期限切れになります。`--ttl-secs` とは併用できません。\n\nリクエストのパスと `--method` が一致し、認証を設定していればトークンも正しい場合に数えます。メソッド不一致 (`405`) やトークンの拒否 (`401`) では回数を減らさないため、トークンを知らない送信者は回数を消費できません。シーケンスの実行成功は数えません。応答を送った後なので、実行に失敗しても減らした回数は戻しません。"

[cli.help._root.webhook.register.arg.auth_location]
help = "任意の認証 — トークンをどこに載せて来るか。未指定なら認証なし"

[cli.help._root.webhook.register.arg.auth_key]
help = "トークンの位置キー — クエリパラメータ / ボディのフィールドパス / ヘッダー名。query|body|header では必須で、bearer では無視される"

[cli.help._root.webhook.register.arg.auth_token]
help = "認証を通すために送信者が提示する固定の共有トークン"

[cli.help._root.webhook.list]
about = "登録されている Webhook をすべて列挙する(URL・メソッド・ハンドラ・ステップ・寿命)"

[cli.help._root.webhook.info]
about = "id で Webhook ひとつの詳細を表示する(残り回数・失効を含む)"

[cli.help._root.webhook.info.arg.id]
help = "Webhook の opaque id(URL の `/{id}` パスセグメント)"

[cli.help._root.webhook.unregister]
about = "id で Webhook を解除する — 以後そのパスは 404 を返す"

[cli.help._root.webhook.unregister.arg.id]
help = "Webhook の opaque id"

[cli.help._root.webhook.sweep]
about = "失効した Webhook をまとめて掃き出す(時間超過・回数消尽)"
long = "期限切れの Webhook を一括削除します (時間超過または回数の消尽)。\n\nタイマーで削除しないため、期限切れでも登録は残ります。そのパスへのリクエストで削除し、`410` を一度返した後は `404` を返します。再起動時には期限切れの永続 Webhook を破棄します。このコマンドはリクエストや再起動を待たずに期限切れの項目をすべて削除します。"

[cli.help._root.webhook.config]
about = "リスナーの bind ポートを読み取る/設定する(`~/.tasty/webhooks.toml` に永続化)"
long = "リスナーのポートを取得または設定します (`~/.tasty/webhooks.toml` に保存)。\n\n`--port` を省略すると現在のポートと bind 状態を表示します。指定すると新しいポートを保存し、次の再起動時に適用します。設定したポートだけを使い、失敗しても別のポートには変更しません。待ち受けアドレスは設定できず、loopback に限定されません。すべてのインターフェースでこのポートへの接続を受け付けます。"

[cli.help._root.webhook.config.arg.port]
help = "リスナーのポートを設定する(1-65535)。反映には再起動が必要"

[cli.help._root.port]
about = "このインスタンスの IPC ポートを stdout に出力する（リモートポート自動発見チェーンの最初の一歩、`ssh host tasty port`）。ポートファイルのみを読み、IPC は使わない"

[cli.help._root.screenshot]
about = "スクリーンショットを PNG ファイルに取得する（フォーカスに依存しない）"
long = "スクリーンショットをPNGファイルに保存します（フォーカス非依存）。`--surface` は対象ターミナルサーフェスを自身のグリッドサイズでオフスクリーン描画して撮影します。バックグラウンドのタブ/ワークスペースでも動作し、フォーカスや表示中のフレームは変更しません。それ以外はウィンドウ全体を撮影します。`--window` でIDを指定（`list windows` 参照）し、省略時に開いているウィンドウが一つならそれを使用します。明示的な `--window` は設定・pluginモーダルなど `list windows` にないウィンドウも指定できます。自動選択（--windowなし）だけがメインウィンドウに制限され、フォーカス中のウィンドウへはフォールバックしません。"

[cli.help._root.screenshot.arg.path]
help = "出力先PNGパス"

[cli.help._root.screenshot.arg.surface]
help = "撮影するターミナルサーフェスID（オフスクリーン、フォーカス非依存）"

[cli.help._root.screenshot.arg.window]
help = "撮影するウィンドウID（tasty全フレーム）。複数のウィンドウが開いている場合は必須。`list windows` にないモーダルウィンドウも指定可能"

