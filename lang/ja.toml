[cli.help._root.hook-handler.upsert]
about = "ユーザーハンドラを TOML を直接開かずにその場で作成・編集する"
long = "TOML を直接編集せずにユーザーハンドラーを作成または変更します。\n\n指定したフィールドだけを変えるため、ID とその ID を参照する関連付けは保持します。フィールドを一つ以上指定する必要があり、変更は `~/.tasty/hook-handlers.toml` にすぐ保存します。\n\n登録済み webhook の IpcSequence は登録時の呼び出しを保持します。変更を反映するには webhook を再登録してください。"

