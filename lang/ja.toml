# 전체 디스크 접근은 Automation·화면 기록·손쉬운 사용 권한과 별개다.
[macos_permissions.notice]
title = "許可されていない権限があります"
body = """Tasty で実行したコマンドがユーザーに代わってファイルを読み書きし、macOS はそのアクセスを Tasty のものとして扱います。権限がないと作業の途中でダイアログが出て進行が止まったり、機能が何も起きないまま終わったりします。

現在、許可されていないと見られる権限があります。どの権限がどの状態かは、設定 > 一般 > 権限 で確認できます。

フルディスクアクセス — macOS はアプリがこの権限を要求する手段を用意していません。システム設定 > プライバシーとセキュリティ > フルディスクアクセスで Tasty を自分で追加してください。この権限を与えるとファイルアクセスのダイアログ(他アプリのデータ、ダウンロード、書類、デスクトップ、マウント済みボリューム)が出なくなります。ただし他アプリの制御(Automation / Apple Events、例: osascript)・画面収録・アクセシビリティは別の権限なので引き続きダイアログが出ます。

画面収録 — スクリーンショット機能が使います。システム設定 > プライバシーとセキュリティ > 画面とシステムオーディオの収録で有効にしてください。一度拒否するとアプリからは再度尋ねられず、システム設定からのみ有効にできます。

Tasty を自分でビルドして使う場合は、先に "Tasty Dev" 証明書で署名してください(./scripts/macos-codesign-identity.sh --create)。ad-hoc 署名のビルドは再ビルドのたびに macOS から別のアプリに見えるため、権限が毎回リセットされます。

権限を与えればこの案内は表示されなくなります。案内をオフにする設定はありません — オフにした記録を残すと、後で権限がリセットされたときに知らせる手段がなくなるためです。"""
open_settings = "設定を開く"

# CLI 도움말. 영어 값은 소스에서 생성되는 clap 도움말과 정확히 같아야 한다.
[cli.help._root]
about = "AI コーディングエージェントのための GPU アクセラレーテッドターミナルエミュレータ"

[cli.help._root.arg.port_file]
help = "ポートファイルのパスを指定（テスト分離用）"

[cli.help._root.arg.response_timeout_ms]
help = "単一リクエストに対するサーバーの応答待機制限をミリ秒で指定します。処理開始後に制限に達するとサーバーは -32061 を返します。結果は不明で、リクエストの実行が続く場合があります。キューで待機中に制限に達すると -32067 を返し、リクエストは実行されません。0 またはオプションの省略で応答待機の制限をなくします。インスタンスが ipc.response-timeout の対応を通知しない場合、元のリクエストは送信しません。対応確認にかかった時間はリクエストの残り時間から差し引きます。確認がタイムアウトするか残り時間を使い切ると -32067 を返し、元のリクエストは送信しません。確認中は個々のソケット読み取りにもタイムアウトを設定します。このオプションは接続、送信、繰り返しの読み取りを含む処理全体の絶対期限ではありません。ループやストリームを行うコマンドでは使えません"

[cli.help._root.arg.launch]
help = "tasty ターミナル内でも GUI を強制的に起動する"

[cli.help._root.arg.headless]
help = "ヘッドレスターミナルエミュレータとして実行（GUI なしで IPC + PTY + plugin のみ）。ヘッドレスになるのは no-default-features ビルドだけで、GUI ビルドは警告を出したうえで GUI を起動し、継承した DISPLAY にウィンドウが開く"

[cli.help._root.arg.all]
help = "すべてのコマンドをツリー表示する（-h と併用）"

[cli.help._root.arg.enable_input_simulation]
