[cli.help._root.agent.dag-get]
about = "`dag-list` 가 낸 DAG 하나를 JSON 또는 Graphviz dot 으로 낸다 — 노드·간선 모양은 `task-graph` 와 같고 그 DAG 로만 좁힌 것이다"

[cli.help._root.agent.dag-get.arg.format]
help = "형식: json | dot. 기본값: json"

[cli.help._root.agent.dag-get.arg.id]
help = "`dag-list` 가 준 DAG id (`d:<metadata.dag>` 또는 `c:<루트 task id>`)"

[cli.help._root.agent.dag-get.arg.workspace_id]
help = "찾는 범위를 한 워크스페이스로 좁힌다. 명시 id 는 사용자가 짓는 것이라 두 워크스페이스가 같은 것을 가질 수 있다 — 그때 이것으로 가른다"

[cli.help._root.agent.dag-list]
about = "등록된 DAG 를 전부 나열한다. DAG 는 저장된 것이 아니라 유도된 것이다: 같은 `metadata.dag` 문자열이 붙은 task 가 하나의 명시 그룹을 이루고, 나머지는 약연결(`depends_on` / `Fallback.task` / `Reduce.inputs` / `metadata.fallback_of`)로 묶인다. `--workspace-id` 를 생략하면 살아 있는 워크스페이스를 전부 훑는다"

[cli.help._root.agent.dag-list.arg.include_tasks]
help = "각 DAG 의 task id 목록(`task_ids`)도 함께 낸다"

[cli.help._root.agent.dag-list.arg.workspace_id]
help = "한 워크스페이스로 좁힌다. 생략하면 살아 있는 워크스페이스 전부"

[cli.help._root.agent.lease-acquire]
about = "임의 resource 에 lease 를 잡는다 (권고적·협조적)"
long = "임의 resource 에 lease 를 잡는다 (권고적·협조적).\n\n잡았는지 여부는 종료 코드가 아니다. `--mode fail` 은 충돌을 오류로 만들지만, `--mode block` 은 성공으로 끝나면서 `acquired: false` 와 현재 holder 를 낸다 — 그 필드를 읽어라. lease 를 강제하는 것도 없다: 참여자들이 서로 읽기로 약속한 표시일 뿐이다.\n\n`--ttl-ms` 가 없으면 lease 는 영영 만료되지 않고, 같은 holder id 로 `lease-release` 하는 것만이 그것을 푼다 — holder 가 죽으면 resource 를 쥔 채로 남는다. 재시작 정화도 그 경우를 덮지 않는다 — 그것은 실행 중인 task 가 자기 task id 로 쥔 lease 만 푼다."

[cli.help._root.agent.lease-acquire.arg.holder]
help = "holder id (비어 있으면 안 된다)"

[cli.help._root.agent.lease-acquire.arg.mode]
help = "충돌 모드: fail | block (기본값: fail). `block` 은 기다리지 않는다 — 곧바로 `acquired: false` 로 돌아오고, 재시도는 호출자 몫이다"

[cli.help._root.agent.lease-acquire.arg.resource]
help = "resource 식별자 (예: `file:/path`, `workspace:foo`)"

[cli.help._root.agent.lease-acquire.arg.ttl_ms]
help = "수명 (밀리초). 생략하면 만료가 없는 lease 가 된다. 만료는 게으르다 — 시각이 지나는 순간이 아니라 다음 `lease-acquire` 나 `lease-list` 가 evict 한다"

[cli.help._root.agent.lease-acquire.arg.workspace_id]
help = "워크스페이스 id (포커스 무관 — 필수)"

[cli.help._root.agent.lease-list]
about = "워크스페이스의 lease 를 전부 나열한다 (만료된 것은 자동 evict)"

[cli.help._root.agent.lease-list.arg.workspace_id]
help = "워크스페이스 id (포커스 무관 — 필수)"

[cli.help._root.agent.lease-release]
about = "lease 를 푼다. 현재 holder 만 풀 수 있다"

[cli.help._root.agent.lease-release.arg.holder]
help = "지금 그 lease 를 쥐고 있는 holder id"

[cli.help._root.agent.lease-release.arg.resource]
help = "lease 를 잡았던 resource 식별자"

[cli.help._root.agent.lease-release.arg.workspace_id]
help = "워크스페이스 id (포커스 무관 — 필수)"

[cli.help._root.agent.rate-limit-list]
about = "설정된 rate limit 버킷을 전부 나열한다 (현재 토큰 상태와 함께)"

[cli.help._root.agent.rate-limit-remove]
about = "rate limit 버킷을 id 로 지운다"

[cli.help._root.agent.rate-limit-remove.arg.id]
help = "`rate-limit-list` 가 낸 버킷 id"

[cli.help._root.agent.rate-limit-set]
about = "(agent, metric) 에 rate limit 버킷을 설정한다 — `per_ms` 밀리초마다 `limit` 토큰"
long = "(agent, metric) 에 rate limit 버킷을 설정한다 — `per_ms` 밀리초마다 `limit` 토큰.\n\n실제로 토큰이 빠져나가는 metric 은 하나다: `ipc_calls`. 다른 이름으로 저장한 버킷은 `rate-limit-list` 에 나오지만 아무것도 그것을 쓰지 않으므로 아무것도 제한하지 않는다.\n\n`ipc_calls` 버킷은 IPC 호출 하나마다 토큰 하나가 빠지고, 예산을 넘긴 호출은 `-32010 throttled` 로 돌아오며 audit 에 Deny 가 남는다. 모든 호출을 세는 것은 아니다: 세션 토큰이 없는 호출자 — 맨 CLI — 와 호스트 자신의 호출은 면제이고, `telemetry.*`·`agent.rate_limit_*`·`system.info` 도 면제다. 뒤의 둘이 throttle 된 에이전트가 자기 한도를 읽고 푸는 통로다."

[cli.help._root.agent.rate-limit-set.arg.agent]
help = "에이전트 id"

[cli.help._root.agent.rate-limit-set.arg.burst]
help = "버킷 용량 (기본값은 `limit`)"

[cli.help._root.agent.rate-limit-set.arg.limit]
help = "한 주기마다 채워지는 토큰 수"

[cli.help._root.agent.rate-limit-set.arg.metric]
help = "metric 이름. 무언가가 실제로 빼 쓰는 것은 `ipc_calls` 하나뿐이다"

[cli.help._root.agent.rate-limit-set.arg.per_ms]
help = "한 주기의 길이 (밀리초, 예: 분 단위면 `60000`)"

[cli.help._root.agent.rate-limit-status]
about = "rate limit 상태를 본다. agent 나 metric 으로 좁힐 수 있다"

[cli.help._root.agent.rate-limit-status.arg.agent]
help = "이 에이전트 id 의 버킷만 보고한다"

[cli.help._root.agent.rate-limit-status.arg.metric]
help = "이 metric 이름의 버킷만 보고한다"

[cli.help._root.agent.semaphore-acquire]
about = "permit 하나를 잡는다. 같은 holder 면 idempotent 하다"
long = "permit 하나를 잡는다. 같은 holder 면 idempotent 하다.\n\n자리가 꽉 찬 것은 오류가 아니다: 호출은 성공하고 `acquired: false` 와 현재 holder 들을 함께 낸다 — 종료 코드가 아니라 그 필드를 읽어라. 대기 모드는 없다 — 재시도는 호출자 몫이다."

[cli.help._root.agent.semaphore-acquire.arg.holder]
help = "holder id (비어 있으면 안 된다)"

[cli.help._root.agent.semaphore-acquire.arg.name]
help = "permit 을 가져올 세마포어 이름"

[cli.help._root.agent.semaphore-acquire.arg.ttl_ms]
help = "holder 가 이 밀리초 동안 조용하면 permit 을 자동으로 회수한다. 같은 holder 로 다시 잡으면 갱신된다. 생략하면 만료가 없다 (기본값)"

[cli.help._root.agent.semaphore-acquire.arg.workspace_id]
help = "워크스페이스 id (포커스 무관 — 필수)"

[cli.help._root.agent.semaphore-create]
about = "permit N 개짜리 세마포어를 만든다"

[cli.help._root.agent.semaphore-create.arg.name]
help = "세마포어 이름 (워크스페이스 안에서 유일)"

[cli.help._root.agent.semaphore-create.arg.permits]
help = "permit 수 (1 이상)"

[cli.help._root.agent.semaphore-create.arg.workspace_id]
help = "워크스페이스 id (포커스 무관 — 필수)"

[cli.help._root.agent.semaphore-delete]
about = "세마포어를 지운다 (없으면 no-op)"

[cli.help._root.agent.semaphore-delete.arg.name]
help = "지울 세마포어 이름"

[cli.help._root.agent.semaphore-delete.arg.workspace_id]
help = "워크스페이스 id (포커스 무관 — 필수)"

[cli.help._root.agent.semaphore-list]
about = "워크스페이스의 세마포어를 전부 나열한다"

[cli.help._root.agent.semaphore-list.arg.workspace_id]
help = "워크스페이스 id (포커스 무관 — 필수)"

[cli.help._root.agent.semaphore-release]
about = "permit 을 반납한다. 그 holder 가 쥐고 있지 않으면 no-op"

[cli.help._root.agent.semaphore-release.arg.holder]
help = "지금 그 permit 을 쥐고 있는 holder id"

[cli.help._root.agent.semaphore-release.arg.name]
help = "그 permit 이 속한 세마포어 이름"

[cli.help._root.agent.semaphore-release.arg.workspace_id]
help = "워크스페이스 id (포커스 무관 — 필수)"

[cli.help._root.agent.semaphore-set-permits]
about = "세마포어의 permit 수를 제자리에서 바꾼다. 늘리는 것은 즉시 반영되고, 줄이는 것은 drain 이다 — 이미 쥔 holder 를 강제로 뺏지 않고, holder 수가 새 한도 아래로 내려갈 때까지 새 acquire 만 거절한다"

[cli.help._root.agent.semaphore-set-permits.arg.name]
help = "크기를 바꿀 세마포어 이름"

[cli.help._root.agent.semaphore-set-permits.arg.permits]
help = "새 permit 수 (1 이상)"

[cli.help._root.agent.semaphore-set-permits.arg.workspace_id]
help = "워크스페이스 id (포커스 무관 — 필수)"

[cli.help._root.agent.task-await]
about = "task 가 종료 상태에 이를 때까지 기다린다 (블로킹). 생략하면 최대 10 분 기다린다 (잠정 기본값). `--timeout-ms 0` = 무기한 대기"

[cli.help._root.agent.task-await.arg.id]
help = "기다릴 task id"

[cli.help._root.agent.task-await.arg.timeout_ms]
help = "이 밀리초가 지나면 기다리기를 포기한다. `0` = 무기한 대기"

[cli.help._root.agent.task-await.arg.workspace_id]
help = "워크스페이스 id (포커스 무관 — 필수)"

[cli.help._root.agent.task-cancel]
about = "task 를 취소한다. 하류는 on_failure 에 따라 연쇄된다"

[cli.help._root.agent.task-cancel.arg.id]
help = "취소할 task id"

[cli.help._root.agent.task-cancel.arg.workspace_id]
help = "워크스페이스 id (포커스 무관 — 필수)"

[cli.help._root.agent.task-create]
about = "워크스페이스 안에 새 task 를 만든다"
long = "워크스페이스 안에 새 task 를 만든다.\n\n만드는 것이 돌리는 것은 아니다. 그 워크스페이스의 러너를 `task-run --action start` 로 켜기 전에는 아무것도 dispatch 되지 않고, 아무도 대신 켜 주지 않는다 — 부팅도 켜지 않는다. 켜지 않으면 task 는 `Ready` 에 앉아 있고 `task-await` 는 timeout 을 그냥 태운다."

[cli.help._root.agent.task-create.arg.command]
help = "TaskCommand 를 JSON 으로 (예: `{\"kind\":\"run\",\"command\":[\"cargo\",\"build\"]}`). `workspace_id` 를 빼면 `--workspace-id` 에서 채워지고, 넣었는데 다르면 `--workspace-id` 가 이기고 경고가 함께 온다. 인라인 JSON 이나 `@path/to/file.json` 을 받는다"

[cli.help._root.agent.task-create.arg.concurrency_limit]
help = "`metadata.semaphore.name` 의 축약형 — 같은 세마포어 이름이 붙은 task 가 동시에 몇 개까지 도는지 제한한다 (나머지는 permit 이 날 때까지 `ready` 로 기다린다). `--metadata` 와 함께 주면 병합되고, `--metadata` 가 이미 `semaphore` 를 정했으면 충돌이다"

[cli.help._root.agent.task-create.arg.depends_on]
help = "쉼표로 구분한 선행 task id 목록"

[cli.help._root.agent.task-create.arg.metadata]
help = "메타데이터 JSON (자유 형식, task 에 붙는다)"

[cli.help._root.agent.task-create.arg.name]
help = "표시 이름"

[cli.help._root.agent.task-create.arg.on_failure]
help = "실패 시 정책: abort | continue_downstream | fallback:<task_id> (기본값: abort). 어느 task 에 거는지가 중요하다: abort·continue_downstream 은 의존하는 쪽(하류) task 에 걸어야 하고, fallback 은 스스로 실패할 수 있는 쪽(상류) task 에 걸어야 한다 — 하류 task 에 fallback 을 걸면 실패한 선행에서 오는 skip 연쇄에는 아무 효과가 없다"

[cli.help._root.agent.task-create.arg.reserved_for_fallback]
help = "이 task 를 아직 참조되지 않은 fallback 후보로 예약한다: 나중에 `task-create --on-failure fallback:<이 id>` 가 본 task 를 연결해 줄 때까지, 얼마가 걸리든 `waiting` 에 머문다 (`ready` 가 되지 않으므로 러너가 dispatch 할 수 없다). 이 플래그가 없으면 의존 없는 task 는 곧바로 `ready` 가 되고, 연결할 본 task 가 만들어지기 전에 러너가 한 번 돌면 그 본 task 의 결과와 무관하게 dispatch 되어 끝까지 돌 수 있다 — 두 `task-create` 호출 사이의 생성 순서 경쟁을 닫는다"

[cli.help._root.agent.task-create.arg.workspace_id]
help = "워크스페이스 id (포커스 무관 — 필수)"

[cli.help._root.agent.task-delete]
about = "task 를 지운다. 다른 task 가 아직 참조하고 있으면 기본적으로 거절하고 (depends_on / on_failure.fallback.task / reduce.inputs) 참조하는 task id 들을 돌려준다. `Running` task 는 `--cascade`·`--force` 와 무관하게 언제나 거절이다 (먼저 취소해라)"

[cli.help._root.agent.task-delete.arg.cascade]
help = "이 task 를 간접적으로라도 참조하는 task 를 전부 함께 지운다"

[cli.help._root.agent.task-delete.arg.force]
help = "참조 검사만 건너뛴다 — 상태 제약(Running)은 그대로 적용된다"

[cli.help._root.agent.task-delete.arg.id]
help = "지울 task id"

[cli.help._root.agent.task-delete.arg.workspace_id]
help = "워크스페이스 id (포커스 무관 — 필수)"

[cli.help._root.agent.task-get]
about = "task 하나를 가져온다"

[cli.help._root.agent.task-get.arg.id]
help = "task id"

[cli.help._root.agent.task-get.arg.workspace_id]
help = "워크스페이스 id (포커스 무관 — 필수)"

[cli.help._root.agent.task-graph]
about = "task DAG 를 JSON 또는 Graphviz dot 으로 낸다"

[cli.help._root.agent.task-graph.arg.format]
help = "형식: json | dot. 기본값: json"

[cli.help._root.agent.task-graph.arg.workspace_id]
help = "워크스페이스 id (포커스 무관 — 필수)"

[cli.help._root.agent.task-list]
about = "워크스페이스의 task 를 나열한다"

[cli.help._root.agent.task-list.arg.state]
help = "상태로 거른다 (쉼표로 구분: waiting,ready,running,succeeded,failed,cancelled,skipped,unknown). 여러 상태를 주면 그중 아무거나 맞는 task 를 전부 낸다 (`--state waiting,ready,running` = 아직 안 끝난 task)"

[cli.help._root.agent.task-list.arg.workspace_id]
help = "워크스페이스 id (포커스 무관 — 필수)"

[cli.help._root.agent.task-purge]
about = "상태·나이 필터에 맞는 task 를 한꺼번에 지운다. `--states` 나 `--older-than-ms` 중 최소 하나가 필요하다. 실제로 지워지는 것은 지워도 안전한 것 (Running 이 아니고, 걸린 집합 바깥에서 참조되지 않는 것) 뿐이고 나머지는 남긴 것으로 보고한다"

[cli.help._root.agent.task-purge.arg.dry_run]
help = "아무것도 지우지 않고 계획만 계산해서 찍는다"

[cli.help._root.agent.task-purge.arg.older_than_ms]
