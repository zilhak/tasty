long = "ID 로 워크스페이스를 통째로 닫는다 — 그 안의 모든 페인·탭·서피스까지.\n\n되돌릴 수 없다: 워크스페이스 안의 터미널이 전부 죽고, 그 워크스페이스는 사용자의 다시 열기 기록에 들어가지 않으며, 스크롤백도 남지 않는다. 다시 열 수 있는 것은 사용자가 손으로 닫은 것뿐이다.\n\n대상은 언제나 `--id` 로 명시한다 (`tasty list workspaces` 참고) — 화면에 무엇이 보이는지로 추론하지 않는다. 사용자가 보고 있지 않은 워크스페이스를 닫아도 지금 화면의 워크스페이스는 그대로 남는다. 자기 서피스를 담고 있는 워크스페이스는 거절하고, 원격 attach 세션을 mirror 하는 워크스페이스와 마지막으로 남은 워크스페이스도 거절한다 — 윈도우를 닫는 것은 별개의 결정이다, `tasty close window` 참고."

