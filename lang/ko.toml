[cli.help._root.webhook]
about = "인바운드 웹훅 관리 (등록/목록/정보/해제) — HTTP → IpcSequence"

[cli.help._root.webhook.register]
about = "인바운드 웹훅을 등록하고 발급된 URL 을 출력한다"
long = "인바운드 웹훅을 등록하고 발급된 URL을 출력합니다.\n\n`--handler <id>`(등록된 hook handler 사용)와 `--sequence <json>`(인라인 IpcSequence 정의) 중 하나만 지정합니다. 외부 HTTP 요청은 `${body.x}` / `${header.x}` / `${query.x}`에 들어갈 값만 전달합니다.\n\n리스너는 loopback에 한정하지 않고 모든 인터페이스에서 연결을 받습니다. 출력 URL의 `127.0.0.1`은 curl 예시에 편리한 주소일 뿐이며, 포트에 접근할 수 있는 누구나 웹훅에 요청할 수 있습니다. 서명 검증은 없습니다. `--auth-token`은 고정 공유 토큰이며, `--auth-*`를 생략하면 인증 없이 시퀀스를 실행합니다. `--persistent`는 토큰을 `~/.tasty/webhooks.toml`에 평문으로 저장합니다.\n\nHTTP 응답은 시퀀스를 실행하기 전에 정해집니다. `200`은 요청이 일치해 실행을 넘겼다는 뜻이며 실행 성공을 보장하지 않습니다. 단계가 실패해도 나머지 단계는 계속 실행하고 응답도 바뀌지 않으므로 일부만 적용될 수 있습니다. 실행 실패는 로그에만 남습니다."

[cli.help._root.webhook.register.arg.methods]
help = "허용할 HTTP 메서드(반복 가능). 기본값은 POST"

[cli.help._root.webhook.register.arg.handler]
help = "묶을 등록된 hook handler id(그 source 가 webhook 을 받아야 한다)"

[cli.help._root.webhook.register.arg.sequence]
help = "{\"method\",\"params\"} 객체의 JSON 배열로 주는 인라인 IpcSequence"

[cli.help._root.webhook.register.arg.persistent]
help = "재시작을 넘겨 유지한다(기본: 임시 — 재시작 시 사라진다)"

[cli.help._root.webhook.register.arg.ttl_secs]
help = "초 단위 시간 제한 — 이만큼 지나면 웹훅이 자동 만료된다. `--count` 와 함께 쓸 수 없다"

[cli.help._root.webhook.register.arg.count]
help = "접수한 요청이 지정한 횟수에 도달하면 웹훅이 만료됩니다. `--ttl-secs`와 함께 쓸 수 없습니다"
long = "접수한 요청이 지정한 횟수에 도달하면 웹훅이 만료됩니다. `--ttl-secs`와 함께 쓸 수 없습니다.\n\n요청 경로와 `--method`가 일치하고, 인증을 설정했다면 토큰도 맞아야 횟수를 셉니다. 메서드 불일치(`405`)나 토큰 거절(`401`)은 횟수를 차감하지 않으므로 토큰을 모르는 발신자는 횟수를 소진할 수 없습니다. 시퀀스 실행 성공 여부는 세지 않습니다. 이미 응답을 보낸 뒤이므로 실행에 실패해도 차감한 횟수를 되돌리지 않습니다."

[cli.help._root.webhook.register.arg.auth_location]
help = "선택적 인증 — 토큰을 어디에 실어 오는지. 지정하지 않으면 인증 없음"

[cli.help._root.webhook.register.arg.auth_key]
help = "토큰 위치 키 — 쿼리 파라미터 / 바디 필드 경로 / 헤더 이름. query|body|header 위치에는 필수이고 bearer 에서는 무시된다"

[cli.help._root.webhook.register.arg.auth_token]
help = "인증을 통과하려면 발신자가 제시해야 하는 고정 공유 토큰"

[cli.help._root.webhook.list]
about = "등록된 웹훅을 전부 나열한다(URL · 메서드 · 핸들러 · 스텝 · 수명)"

[cli.help._root.webhook.info]
about = "id 로 웹훅 하나의 상세를 보여준다(남은 횟수 · 만료 포함)"

[cli.help._root.webhook.info.arg.id]
help = "웹훅 opaque id(URL 의 `/{id}` 경로 조각)"

[cli.help._root.webhook.unregister]
about = "id 로 웹훅을 해제한다 — 그 뒤로 그 경로는 404 를 낸다"

[cli.help._root.webhook.unregister.arg.id]
help = "웹훅 opaque id"

[cli.help._root.webhook.sweep]
about = "만료된 웹훅을 한꺼번에 쓸어 제거한다(시간 초과 · 횟수 소진)"
long = "만료된 웹훅을 한꺼번에 제거합니다(시간 초과 또는 횟수 소진).\n\n타이머로 제거하지 않으므로 만료된 웹훅도 등록 상태로 남아 있습니다. 해당 경로에 요청하면 웹훅을 제거하고 `410`을 한 번 반환하며, 이후 요청에는 `404`를 반환합니다. 재시작할 때는 만료된 영속 웹훅을 버립니다. 이 명령은 요청이나 재시작을 기다리지 않고 만료된 항목을 모두 제거합니다."

[cli.help._root.webhook.config]
about = "리스너 bind 포트를 읽거나 설정한다(`~/.tasty/webhooks.toml` 에 영속화)"
long = "리스너의 포트를 조회하거나 설정합니다(`~/.tasty/webhooks.toml`에 저장).\n\n`--port`를 생략하면 현재 포트와 bind 상태를 출력합니다. 지정하면 새 포트를 저장하고 다음 재시작 때 적용합니다. 설정한 포트만 사용하며 실패해도 다른 포트로 바꾸지 않습니다. 수신 주소는 설정할 수 없고 loopback에 한정되지 않습니다. 모든 인터페이스에서 이 포트로 연결을 받습니다."

[cli.help._root.webhook.config.arg.port]
help = "리스너 포트를 설정한다(1-65535). 적용되려면 재시작이 필요하다"

[cli.help._root.port]
about = "이 인스턴스의 IPC 포트를 stdout 에 출력 (원격 포트 자동 발견 사슬의 첫 걸음, `ssh host tasty port`). 포트 파일만 읽으며 IPC 는 쓰지 않는다"

[cli.help._root.screenshot]
about = "스크린샷을 PNG 파일로 캡처 (포커스와 무관)"
long = "스크린샷을 PNG 파일로 저장합니다(포커스 독립). `--surface`는 해당 터미널 서피스를 자체 그리드 크기로 오프스크린 렌더링하여 캡처합니다. 백그라운드 탭/워크스페이스에서도 동작하며 포커스나 보이는 프레임은 바뀌지 않습니다. 그 외에는 전체 윈도우를 캡처합니다. `--window`로 ID를 지정(`list windows` 참조)하며 생략 시 열린 윈도우가 하나이면 그것을 사용합니다. 명시적 `--window`는 설정·plugin 모달처럼 `list windows`에 없는 윈도우도 지정할 수 있습니다. 자동 선택(--window 없음)만 메인 윈도우로 제한되며 포커스된 윈도우로 폴백하지 않습니다."

[cli.help._root.screenshot.arg.path]
help = "출력 PNG 경로"

[cli.help._root.screenshot.arg.surface]
help = "캡처할 터미널 서피스 ID(오프스크린, 포커스 독립)"

[cli.help._root.screenshot.arg.window]
help = "캡처할 윈도우 ID(tasty 전체 프레임). 여러 윈도우가 열려 있으면 필수. `list windows`에 없는 모달 윈도우도 지정 가능"

