help = "resource 식별자 (예: `file:/path`, `workspace:foo`)"

[cli.help._root.agent.lease-acquire.arg.holder]
help = "holder id (비어 있으면 안 된다)"

[cli.help._root.agent.lease-acquire.arg.ttl_ms]
help = "유효 기간(밀리초). 생략하면 만료되지 않습니다. 만료된 lease는 다음 `lease-acquire`나 `lease-list` 호출 때 제거합니다."

[cli.help._root.agent.lease-acquire.arg.mode]
help = "충돌 모드: fail | block (기본값: fail). `block` 은 기다리지 않는다 — 곧바로 `acquired: false` 로 돌아오고, 재시도는 호출자 몫이다"

[cli.help._root.agent.lease-release]
