[cli.help._root.plugin.upgrade-builtins]
about = "기본 제공 plugin 전부를 번들에서 다시 맞춘다"
long = "기본 제공 plugin 전부를 번들에서 다시 맞춘다.\n\n매니페스트 버전이 갈래를 고르고 그 안에서는 내용이 정한다: 번들 버전이 더 높으면 디렉토리를 통째로 다시 쓰고, 같은 버전이면 다른 것만 다시 쓰고, 설치본이 번들보다 높으면 내용을 보지 않고 건너뛴다 — `--force` 는 그 마지막 갈래를 위한 것이다. 바뀐 기본 제공 plugin 이 새로 선언한 권한은 같은 호출에서 부여된다."

