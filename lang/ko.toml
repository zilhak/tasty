[cli.help._root.agent.task-run]
about = "워크스페이스의 agent task 러너를 켜거나 끄거나 들여다본다. 러너는 Ready task 를 dispatch 하고 Running task 의 완료를 감지하는 호스트 쪽 스레드다. 같은 워크스페이스에 start 를 두 번 해도 idempotent 하다"
long = "워크스페이스의 agent task 러너를 켜거나 끄거나 들여다본다. 러너는 Ready task 를 dispatch 하고 Running task 의 완료를 감지하는 호스트 쪽 스레드다. 같은 워크스페이스에 start 를 두 번 해도 idempotent 하다.\n\n아무도 대신 켜 주지 않는다. 호스트를 켜면 살아 있는 워크스페이스의 상태는 복구하지만 러너는 전부 꺼진 채로 둔다 — 그래서 한 번도 켠 적 없는 워크스페이스는 아무것도 dispatch 하지 않는다.\n\n`stop` 이 멈추는 것은 일이 아니라 감지다: 이미 dispatch 된 프로세스는 계속 돌고, 그 task 는 끝난 것을 알아챌 주체가 없는 채 `Running` 으로 남는다. 다시 start 하면 그 handle 들을 되집어 하나씩 마감한다 — 살아 있는지, 죽었는지, 아니면 그 watcher 가 남겨 둔 종료 코드로."

[cli.help._root.agent.task-run.arg.action]
help = "start | stop | status. 기본값: status"

[cli.help._root.agent.task-run.arg.workspace_id]
help = "러너를 조작할 워크스페이스 id (포커스 무관 — 필수)"

