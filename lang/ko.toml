[cli.help._root.plugin.install]
about = "tasty-plugin.toml 이 있는 디렉토리에서 plugin 을 설치한다"
long = "tasty-plugin.toml이 있는 디렉터리에서 플러그인을 설치합니다.\n\n추가 확인 없이 매니페스트의 모든 권한을 부여합니다. 해당 ID의 비활성화 설정이 남아 있지 않으면 바로 활성화하고 실행합니다. 설치 전에 `tasty-plugin.toml`을 확인하세요. 설치 후에는 `plugin permissions <id>`로 권한을 확인하고 `plugin revoke <id> <permission>`으로 회수할 수 있습니다."

[cli.help._root.plugin.install.arg.path]
help = "plugin 디렉토리 경로 (tasty-plugin.toml 이 있어야 한다)"

[cli.help._root.plugin.remove]
about = "설치된 plugin 을 id 로 제거한다"
long = "ID로 플러그인을 제거합니다.\n\n플러그인 디렉터리를 통째로 삭제하므로 그 안에 저장된 파일도 함께 사라집니다. 기본 제공 플러그인은 제거한 상태를 기록하여 다음 시작 때 다시 설치하지 않습니다. `plugin upgrade-builtins --restore-removed <id>`로 복원하면 활성 상태로 설치합니다."

[cli.help._root.plugin.remove.arg.id]
help = "plugin id (예: com.example.explorer)"

[cli.help._root.plugin.upgrade-builtins]
about = "기본 제공 plugin 전부를 번들에서 다시 맞춘다"
long = "번들의 기본 제공 플러그인을 설치본에 반영합니다.\n\n번들 버전이 높으면 플러그인 디렉터리를 교체합니다. 버전이 같으면 내용이 다른 파일만 바꿉니다. 설치본 버전이 더 높으면 내용을 읽지 않고 건너뛰며, 이 경우에도 덮어쓰려면 `--force`를 지정하세요. 변경한 기본 제공 플러그인이 새로 요청하는 권한은 같은 호출에서 부여합니다."

[cli.help._root.plugin.upgrade-builtins.arg.force]
help = "설치본 버전이 번들 버전 이상이어도 덮어쓴다"

[cli.help._root.plugin.upgrade-builtins.arg.restore_removed]
help = "지정한 기본 제공 플러그인을 `removed_builtins`에서 제외하여 이번 호출에서 자동 설치할 수 있게 합니다. 여러 ID는 반복 지정하세요."

[cli.help._root.plugin.upgrade-builtins.arg.restore_all]
help = "`removed_builtins`의 모든 기본 제공 플러그인을 복원합니다. `--restore-removed`보다 우선합니다."

[cli.help._root.plugin.upgrade-builtins.arg.restart_running]
help = "실행 파일이 바뀌는 기본 제공 플러그인을 재시작합니다. Windows에서 실행 중인 파일을 덮어쓸 때의 공유 위반을 피하는 데도 사용합니다. 해당 플러그인 서피스를 잠시 닫으므로 기본값은 꺼짐입니다."

[cli.help._root.plugin.enable]
about = "비활성화된 plugin 을 활성화하고 기동한다"

[cli.help._root.plugin.enable.arg.id]
help = "플러그인 ID"

[cli.help._root.plugin.disable]
about = "plugin 을 비활성화한다 (돌고 있으면 정상 종료)"
long = "플러그인을 비활성화하고 실행 중이면 정상 종료를 요청합니다.\n\n비활성화 설정은 디스크에 저장됩니다. 재시작하거나 같은 ID를 `plugin install`로 다시 설치해도 자동으로 켜지지 않습니다. 설치 디렉터리와 명령 네임스페이스는 남으므로 `tasty <네임스페이스> ...`는 없는 메서드 오류 대신 `plugin ... is not running`을 반환합니다.\n\n플러그인이 제공한 파일 디텍터·핸들러, 훅 핸들러, 완료 판정 전략, 설정 페이지는 등록에서 제외됩니다. 해당 플러그인으로 열던 파일은 다른 처리 경로를 사용합니다."

[cli.help._root.plugin.disable.arg.id]
help = "플러그인 ID"

