[cli.help._root.approval]
about = "사용자 승인 요청과 응답 관리(request/respond/await/cancel/list/get)"
long = "사용자 승인 요청과 응답을 관리합니다(request/respond/await/cancel/list/get).\n\n`request`, `respond`, `await`, `cancel`, `list`, `get`은 실행 중인 호스트의 메모리 저장소를 사용합니다. 이 저장소는 재시작 때 비워지므로 대기 중이던 요청은 사라집니다. 이전 요청은 `list`에 나오지 않으며 해당 ID로 `await`하면 \"not found\"를 반환합니다.\n\n별도로 저장한 기록은 memory store의 `history`로 조회합니다. `history`는 과거 기록이며 `list`는 현재 응답할 수 있는 요청 목록입니다."

[cli.help._root.approval.request]
about = "승인을 요청하고 생성된 ID를 출력합니다"
long = "승인을 요청하고 생성된 ID를 출력합니다.\n\n시간 초과는 approval await에서 처리합니다. 응답을 기다리는 호출이 없으면 pending 요청이 저절로 만료되지는 않습니다."

[cli.help._root.approval.request.arg.title]
help = "팝업·알림에 보일 제목"

[cli.help._root.approval.request.arg.body]
help = "선택적 본문 (여러 줄 설명)"

[cli.help._root.approval.request.arg.choices]
help = "`key:label[:destructive]` 형식의 선택지를 쉼표로 구분합니다(예: `approve:Approve,deny:Deny:1`). 생략하면 `approve / deny`를 사용합니다."

[cli.help._root.approval.request.arg.default_choice]
help = "시간 초과 때 기록할 선택 키입니다. 시스템이 이 키를 포함한 `timed_out` 결과를 남깁니다. `responded` 응답이 아니므로 `approval history --decision`으로는 조회되지 않습니다."

