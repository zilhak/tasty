[cli.help._root.events]
about = "위치에 따라 호스트 이벤트 읽기(fetch, follow)"
long = "위치에 따라 호스트 이벤트를 읽습니다(fetch, follow).\n\n이벤트는 메모리에만 저장되며 재시작하면 내용과 위치가 초기화됩니다. 응답의 `epoch`로 해당 위치가 속한 세대를 구분합니다. 요청한 위치가 보존 범위를 벗어나면 응답에 건너뛴 이벤트 수를 포함합니다."

[cli.help._root.events.fetch]
about = "어떤 위치부터 사건을 읽는다. 답을 JSON 객체 하나로 찍는다"
long = "지정한 위치부터 이벤트를 읽고 JSON 객체 하나로 출력합니다.\n\n이벤트는 events 배열에, 다음 읽기 위치와 세대는 next_offset·epoch에 담깁니다. 이벤트를 한 줄씩 출력하려면 follow를 사용합니다.\n\n이전 응답의 next_offset을 넘겨 이어 읽습니다. 조회가 호스트의 소비자별 커서를 옮기거나 느린 소비자용 큐를 만들지는 않습니다. 피드가 갱신되거나 보존 범위가 바뀌면 같은 요청의 결과도 달라질 수 있습니다.\n\n이벤트는 메모리에만 저장됩니다. 재시작하면 비워지고 위치도 처음부터 시작합니다. 응답의 epoch가 기존 위치의 세대와 다르면 그 위치를 새 세대에 그대로 적용하지 않습니다."

[cli.help._root.events.fetch.arg.offset]
help = "읽기 시작할 위치. 기본 0, 아직 남아 있는 것 중 가장 오래된 자리"

[cli.help._root.events.fetch.arg.max]
help = "최대 몇 개까지. 호스트가 상한을 건다"

[cli.help._root.events.fetch.arg.filter]
help = "키 패턴: 정확한 키(`agent.task_finished`) 또는 네임스페이스 와일드카드(`agent.*`). 구독이 쓰는 것과 같은 문법이다"

[cli.help._root.events.fetch.arg.wait_ms]
help = "답하기 전에 뭔가 올 때까지 이만큼 기다린다. 기본 0, 지금 있는 것으로 곧바로 답한다"

[cli.help._root.events.follow]
about = "피드를 따라간다: 어떤 위치부터 long-poll 하며 사건마다 JSON 한 줄을 계속 찍는다. 끊을 때까지 돈다"
long = "지정한 위치부터 long-poll로 이벤트를 받아 한 줄에 JSON 하나씩 출력합니다. 중단할 때까지 실행합니다.\n\n마지막 위치로 다시 호출하면 이어 읽을 수 있습니다. 해당 위치가 보존 범위를 벗어난 경우에는 누락 안내를 stderr로 출력합니다. 이벤트 JSON을 받는 stdout의 `while read` 처리에는 안내가 섞이지 않습니다.\n\ntasty가 재시작하면 위치도 초기화됩니다. 다시 연결할 때 기존 offset의 `--epoch`를 함께 지정하세요. 세대가 바뀌었으면 stderr로 알리고 새 세대의 처음부터 읽습니다. epoch가 없어도 위치가 현재 목록의 끝보다 크면 같은 방식으로 처리합니다. 연결이 끊기면 다시 연결할 때 쓸 `--offset`과 `--epoch`를 출력하고 종료합니다. `--reconnect`를 지정하면 종료하지 않고 재연결을 시도합니다."

[cli.help._root.events.follow.arg.offset]
help = "시작할 위치. 기본 0, 아직 남아 있는 것 중 가장 오래된 자리"

[cli.help._root.events.follow.arg.filter]
help = "키 패턴. `fetch --filter` 와 같은 문법이다"

[cli.help._root.events.follow.arg.batch]
help = "요청 하나에 사건 몇 개까지"

[cli.help._root.events.follow.arg.wait_ms]
help = "이벤트가 없을 때 응답 전에 기다릴 시간"

[cli.help._root.events.follow.arg.epoch]
help = "offset이 속한 세대입니다. 연결 종료 안내나 `fetch` 응답의 값을 사용하세요. 그 뒤 tasty가 재시작했다면 새 세대의 처음부터 읽습니다."

[cli.help._root.events.follow.arg.reconnect]
help = "연결이 끊기면 끝내지 않고 1 초마다 다시 붙는다. 세대를 들고 가므로 재시작은 알리고 그 처음부터 따라간다"

[cli.help._root.telemetry]
about = "에이전트 텔레메트리 (지표 기록, 요약, 시계열, 상위 N)"
long = "에이전트의 지표를 기록하고 요약, 시계열, 상위 N 항목을 조회합니다.\n\n에이전트가 `telemetry record`로 직접 남긴 이벤트와 호스트가 에이전트 IPC 호출마다 method 태그를 붙여 남긴 `ipc_calls`를 사용합니다. 호스트 자체 호출, `telemetry.*`, 제한으로 거절된 throttled 호출은 세지 않습니다.\n\n조회할 때 원본 이벤트를 집계하며 집계 결과를 따로 저장하지 않습니다. 최근 2만 건만 보관하므로 `--since`를 더 과거로 지정해도 삭제된 기록은 조회할 수 없습니다. anomaly 기록은 별도로 최근 5천 건, 최대 50시간까지 보관합니다."

[cli.help._root.telemetry.record-batch]
about = "여러 이벤트를 한 번에 기록한다 — 같은 타임스탬프를 공유하므로 순서가 보존된다. 이벤트 사이의 순서가 중요하면 `record` 를 반복하는 대신 이것을 쓴다"

