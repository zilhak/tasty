[cli.help._root.list.pressure]
about = "인스턴스 시작 이후의 IPC 부하와 진단 통계를 보여 줍니다"
long = "인스턴스 시작 이후의 IPC 부하와 진단 통계를 보여 줍니다.\n\n각 블록은 다른 요청을 측정하므로 서로 빼서 비교하지 않습니다. queue_before_gate는 권한 검사에서 나중에 거절된 요청도 포함하고, handler_after_gate는 처리된 요청을, plugin_round_trip은 응답이 온 플러그인 호출을, db는 성공한 DB 커밋을 측정합니다. 권한 검사를 통과했지만 핸들러 측정 전에 응답하는 요청도 있습니다.\n\nconnections는 attach·mesh 스트림을 포함한 TCP 연결을 셉니다. live는 현재 사용량, limit는 한도, refused_saturated는 요청을 보내기 전에 한도에서 거절된 연결 수입니다. 누계는 감소하지 않지만 live와 파생 평균은 줄 수 있습니다. accept_waits는 accepted + refused_saturated입니다. accept_wait_bound_us_sum/max/mean은 accept 큐가 마지막으로 비었다고 관측한 뒤의 경과 시간으로 OS 큐 대기 시간의 상한을 나타냅니다. 실제 대기 시간을 측정한 값은 아닙니다. 큐가 비면 100 ms 쉽니다.\n\nqueue_before_gate·handler_after_gate·plugin_round_trip에는 히스토그램도 있습니다. bounds_us는 구간 경계이며 counts는 경계를 넘는 마지막 구간을 포함해 한 칸 더 깁니다. counts는 누적값이 아니며 합은 관측 수입니다. 분위수는 계산하지 않고 db와 connections에는 히스토그램이 없습니다. queue_before_gate.waits는 wait_us_mean의 분모이자 wait_us_hist.counts의 합입니다. commands는 처리 회차 끝에 갱신되므로 현재 조회가 포함된 회차 중에는 waits보다 작을 수 있습니다.\n\ndb_pragmas는 memory_db와 state_db의 요청한 설정과 실제 설정을 비교합니다. degraded는 설정 불일치 또는 memory_db 파일 열기 실패 뒤 메모리 DB 대체를 뜻합니다. init_failure는 해당 실패 사유이며 없으면 null입니다. 대체 DB도 계속 사용합니다. state_db가 열리지 않았다면 null이며 헤드리스도 이에 해당합니다.\n\nstream_push는 attach·mesh 프레임을 셉니다. frames_dropped는 유지 중인 연결의 큐가 가득 차 버린 프레임 수, clients_lagged_out는 지연으로 끊은 연결 수입니다. backlog는 현재 모든 연결에 쌓인 프레임 수이며 sink_capacity는 연결 하나의 큐 한도입니다.\n\nqueue_admission은 현재 바이트·명령·주입 명령 수, 최대 바이트 수, limit_bytes·limit_injected_depth를 보여 줍니다. refused_bytes와 refused_depth는 큐에 들어오기 전에 거절된 요청이며 다른 블록에는 포함되지 않습니다. IPC 서버가 없으면 이 블록은 null입니다. queue_dispatch는 처리 회차, 명령/시간 예산으로 중단한 회차, expired_before_run, 시작한 명령 수, 현재/최대 in_flight를 기록합니다. 시작한 요청은 명령과 응답 대기자 모두 공유 상태를 놓을 때까지 in_flight에 포함됩니다.\n\nkeyed_requests는 멱등 키가 있는 요청을 한 번씩 셉니다. executed는 실행, replayed는 저장된 응답 재사용, conflicted는 충돌로 미실행, discarded는 응답 미보존, in_flight는 실행 중 요청에 합류한 경우입니다. 이 in_flight는 누적 판정 수로, queue_dispatch의 현재 실행 수와 다릅니다.\n\nslow_requests는 큐 대기 + 호스트 처리 + 플러그인 대기가 threshold_us(100 ms) 이상인 요청을 오래된 순서로 capacity개까지 보관합니다. request_seq는 JSON-RPC ID나 trace ID가 아닌 자체 요청 번호입니다. 행에는 method·caller·queue_wait_us·host_us와 plugin_hops가 있으며 각 hop에는 플러그인·host_request_id·대기·결과가 담깁니다. admitted는 지금까지 보관한 행 수이고, 현재 행 수를 빼면 밀려난 수입니다. 이 조회 자신은 보관하지 않습니다. host의 outcome은 ok/error, error_code는 JSON-RPC 오류 코드로 만료(-32067)·거절(-32001)·성공을 구분합니다. 아직 응답하지 않았으면 둘 다 null입니다.\n\ngate_refusals.judged는 Local과 플러그인 호출을 포함해 권한 검사에 도달한 요청 수입니다. permission_denied(-32001), cap_blocked(-32007), throttled(-32010) 순서로 검사하며 요청 하나를 최대 한 거절 항목에 셉니다. 권한 부족, 없는 메서드, 호출자에게 금지된 메서드는 모두 권한 거절이 될 수 있으며 권한 추가는 첫 경우만 해결합니다. 토큰 없는 Local 호출자는 이 검사를 통과합니다. 잘못됐거나 만료·폐기된 토큰은 judged 이전에 거절하고, 검사 통과 뒤의 -32001은 통과 쪽에 셉니다. 잘못된 멱등 키는 여기에 포함하지 않습니다. 이 누계는 재시작 때 초기화되며, 버킷별로 영속되는 agent rate-limit-status의 throttled_count와 다릅니다.\n\n관측이 없는 평균은 0이 아니라 null입니다."

