open_full_disk_access = "전체 디스크 접근 권한 설정 열기"

# 전체 디스크 접근은 Automation·화면 기록·손쉬운 사용 권한과 별개다.
[macos_permissions.fda]
title = "Tasty 에 전체 디스크 접근 권한 주기"
body = """Tasty 안에서 실행한 명령이 사용자를 대신해 파일을 읽고 쓰며, macOS 는 그 접근을 Tasty 의 것으로 봅니다. 전체 디스크 접근 권한이 없으면 작업 도중에 "Tasty이(가) 다른 앱의 데이터에 접근하려고 합니다" 가 앱 폴더마다 새로 뜹니다.

이 권한을 주면 파일 접근 프롬프트가 사라집니다 — 다른 앱의 데이터, 다운로드, 문서, 데스크탑, 마운트된 볼륨까지 포함합니다. 다만 다른 앱 제어(Automation / Apple Events, 예: osascript)·화면 기록·손쉬운 사용은 포함되지 않습니다. 이들은 별개 권한이라 계속 프롬프트가 뜹니다.

macOS 는 앱이 이 권한을 요청할 방법을 제공하지 않습니다. 시스템 설정 > 개인정보 보호 및 보안 > 전체 디스크 접근 권한에서 Tasty 를 직접 추가해 주세요.

Tasty 를 직접 빌드해 쓴다면 먼저 "Tasty Dev" 인증서로 서명하세요(./scripts/macos-codesign-identity.sh --create). ad-hoc 서명 빌드는 재빌드할 때마다 macOS 에 다른 앱으로 보여서 권한이 매번 초기화됩니다.

권한을 주면 이 안내는 더 이상 뜨지 않습니다."""
open_settings = "설정 열기"

# CLI 도움말. 영어 값은 소스에서 생성되는 clap 도움말과 정확히 같아야 한다.
[cli.help._root]
about = "AI 코딩 에이전트를 위한 GPU 가속 터미널 에뮬레이터"

[cli.help._root.arg.port_file]
help = "포트 파일 경로 지정 (테스트 격리용)"

[cli.help._root.arg.response_timeout_ms]
help = "단일 요청에 대한 서버의 응답 대기 제한을 밀리초로 지정합니다. 처리 시작 후 제한에 도달하면 서버가 -32061을 반환합니다. 결과는 알 수 없으며 요청은 계속 실행될 수 있습니다. 큐에서 기다리던 요청은 -32067을 반환하며 실행되지 않습니다. 0이거나 옵션을 지정하지 않으면 응답 대기 제한이 없습니다. 인스턴스가 ipc.response-timeout 지원을 알리지 않으면 원래 요청은 보내지 않습니다. 지원 여부를 확인한 시간은 요청에 남은 시간에서 차감합니다. 확인 중 timeout이 나거나 남은 시간을 다 쓰면 -32067을 반환하고 원래 요청은 보내지 않습니다. 확인 과정에서는 개별 소켓 읽기에도 timeout을 설정합니다. 이 옵션은 연결, 송신, 반복 읽기를 포함한 전체 호출의 절대 기한이 아닙니다. 반복하거나 스트리밍하는 명령은 이 옵션을 사용할 수 없습니다"

