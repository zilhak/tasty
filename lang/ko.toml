[cli.help._root.agent.task-purge.arg.workspace_id]
help = "워크스페이스 id (포커스 무관 — 필수)"

[cli.help._root.agent.task-reduce]
about = "task N 개의 결과를 하나의 값으로 합친다 (전략: first_success | all | merge_json | concat_text | custom:<cmd>)"

[cli.help._root.agent.task-reduce.arg.extract_path]
