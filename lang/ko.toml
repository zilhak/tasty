long = "ID로 지정한 워크스페이스와 그 안의 모든 페인, 탭, 서피스를 닫습니다.\n\n이 작업은 되돌릴 수 없습니다. 워크스페이스의 터미널을 모두 종료하며 다시 열기 기록과 스크롤백을 남기지 않습니다. 다시 열기는 사용자가 화면에서 직접 닫은 항목에만 적용됩니다.\n\n대상 ID는 `--id`로 지정하세요(`tasty list workspaces` 참고). 현재 화면을 기준으로 대상을 선택하지 않습니다. 다른 워크스페이스를 닫아도 현재 보고 있는 워크스페이스는 바뀌지 않습니다. 호출한 서피스가 속한 워크스페이스, 원격 attach 세션을 미러링하는 워크스페이스, 마지막으로 남은 워크스페이스는 닫을 수 없습니다. 윈도우를 닫으려면 `tasty close window`를 사용하세요."

