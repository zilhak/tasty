about = "핸들러 하나를 id 로 보여준다 — action 본문 전체를 포함해서"
long = "ID로 핸들러의 action 전체를 조회합니다.\n\n`list`는 IpcSequence의 단계 수만 보여 주지만 `get`은 실제 호출 배열을 출력합니다. 출력된 `action`은 `upsert --action`과 같은 형식이므로 편집한 뒤 다시 적용할 수 있습니다."

