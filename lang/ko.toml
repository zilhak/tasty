[cli.help._root.approval.summary.set.arg.content]
help = "인라인 내용, 또는 파일에서 읽을 `@path`"

[cli.help._root.approval.summary.set.arg.workspace_id]
help = "요약을 덮어쓸 워크스페이스 (포커스 무관 — 필수)"

[cli.help._root.webhook.register]
about = "인바운드 웹훅을 등록하고 발급된 URL 을 출력한다"
long = "인바운드 웹훅을 등록하고 발급된 URL 을 출력한다.\n\n`--handler <id>`(등록된 hook handler 를 묶는다)와 `--sequence <json>`(인라인 IpcSequence 를 정의한다) 중 정확히 하나를 준다. 외부 HTTP 페이로드가 채우는 것은 `${body.x}` / `${header.x}` / `${query.x}` 값 자리뿐이다.\n\n리스너는 loopback 이 아니라 모든 인터페이스에 bind 한다. 출력되는 URL 이 `127.0.0.1` 인 것은 그대로 curl 하기 편해서일 뿐이고, 그 포트에 닿는 누구든 이 웹훅에 닿는다. 서명 검증은 어떤 형태로도 없다 — `--auth-token` 은 상수시간으로 비교하는 고정 공유 비밀 하나이고, `--auth-*` 를 주지 않으면 묻는 사람 누구에게나 시퀀스가 발화한다. `--persistent` 는 그 토큰을 평문으로 `~/.tasty/webhooks.toml` 에 쓴다.\n\nHTTP 응답은 시퀀스가 돌기 전에 정해지는 고정 확인응답이라, `200` 은 호출이 매칭돼 넘겨졌다는 뜻이지 그것이 됐다는 뜻이 아니다. 실패한 스텝은 뒤 스텝을 멈추지도 응답을 바꾸지도 않으므로 부분적으로만 적용된 시퀀스가 평범한 결말로 남는다. 실패가 드러나는 자리는 로그뿐이다."

[cli.help._root.webhook.register.arg.methods]
help = "허용할 HTTP 메서드(반복 가능). 기본값은 POST"

[cli.help._root.webhook.register.arg.handler]
help = "묶을 등록된 hook handler id(그 source 가 webhook 을 받아야 한다)"

[cli.help._root.webhook.register.arg.sequence]
help = "{\"method\",\"params\"} 객체의 JSON 배열로 주는 인라인 IpcSequence"

[cli.help._root.webhook.register.arg.persistent]
help = "재시작을 넘겨 유지한다(기본: 임시 — 재시작 시 사라진다)"

[cli.help._root.webhook.register.arg.ttl_secs]
help = "초 단위 시간 제한 — 이만큼 지나면 웹훅이 자동 만료된다. `--count` 와 함께 쓸 수 없다"

[cli.help._root.webhook.register.arg.count]
help = "횟수 제한 — 접수된 호출이 이만큼 쌓이면 웹훅이 자동 소멸한다. `--ttl-secs` 와 함께 쓸 수 없다"
long = "횟수 제한 — 접수된 호출이 이만큼 쌓이면 웹훅이 자동 소멸한다. `--ttl-secs` 와 함께 쓸 수 없다.\n\n접수됐다는 것은 요청이 path 와 `--method` 중 하나에 맞았고, 인증을 걸었다면 맞는 토큰을 실어 왔다는 뜻이다. 메서드 불일치(`405`)와 토큰 거절(`401`)은 횟수를 그대로 두므로, 토큰을 모르는 발신자는 그것을 태울 수 없다. 이 횟수가 재지 않는 것은 그 뒤 시퀀스가 됐는지다 — 그 시점에는 응답이 이미 나갔고 한 번 센 호출은 되돌아오지 않는다."
[cli.help._root.webhook.register.arg.auth_location]
help = "선택적 인증 — 토큰을 어디에 실어 오는지. 지정하지 않으면 인증 없음"

[cli.help._root.webhook.register.arg.auth_key]
help = "토큰 위치 키 — 쿼리 파라미터 / 바디 필드 경로 / 헤더 이름. query|body|header 위치에는 필수이고 bearer 에서는 무시된다"

[cli.help._root.webhook.register.arg.auth_token]
help = "인증을 통과하려면 발신자가 제시해야 하는 고정 공유 토큰"

[cli.help._root.webhook.list]
about = "등록된 웹훅을 전부 나열한다(URL · 메서드 · 핸들러 · 스텝 · 수명)"

[cli.help._root.webhook.info]
about = "id 로 웹훅 하나의 상세를 보여준다(남은 횟수 · 만료 포함)"

[cli.help._root.webhook.info.arg.id]
help = "웹훅 opaque id(URL 의 `/{id}` 경로 조각)"

[cli.help._root.webhook.unregister]
about = "id 로 웹훅을 해제한다 — 그 뒤로 그 경로는 404 를 낸다"

[cli.help._root.webhook.unregister.arg.id]
help = "웹훅 opaque id"

[cli.help._root.webhook.sweep]
about = "만료된 웹훅을 한꺼번에 쓸어 제거한다(시간 초과 · 횟수 소진)"
long = "만료된 웹훅을 한꺼번에 쓸어 제거한다(시간 초과 · 횟수 소진).\n\n타이머가 없어서 만료가 저절로 집행되지 않는다 — 만료된 웹훅은 누군가 그것을 들여다볼 때까지 등록된 채로 남는다. 그 경로로 호출이 오면 그 자리에서 제거되면서 `410` 을 한 번 내고 그 뒤로는 전부 `404` 이며, 재시작은 만료된 영속 웹훅을 버리고, 이 명령은 둘 중 어느 것도 기다리지 않고 전체를 한 번에 치운다."

[cli.help._root.webhook.config]
about = "리스너 bind 포트를 읽거나 설정한다(`~/.tasty/webhooks.toml` 에 영속화)"
long = "리스너 bind 포트를 읽거나 설정한다(`~/.tasty/webhooks.toml` 에 영속화).\n\n`--port` 없이 부르면 지금 포트와 bind 상태를 출력한다. `--port` 를 주면 새 포트를 영속화하고, 리스너는 다음 재시작에만 다시 bind 한다. 포트는 설정값 전용이라 tasty 가 조용히 대체 포트에 bind 하는 일은 없다. bind 주소는 설정할 수 없고 loopback 도 아니다 — 리스너가 모든 인터페이스를 가져가므로 이 포트가 노출의 전부다."

[cli.help._root.webhook.config.arg.port]
help = "리스너 포트를 설정한다(1-65535). 적용되려면 재시작이 필요하다"
