long = "소유자별로 접근을 제한하는 secret 저장소입니다. CLI는 `_host` 소유자로 동작하며 --owner 옵션이 없으므로 플러그인의 secret 영역에는 접근할 수 없습니다.\n\n접근 제한은 IPC에만 적용됩니다. 값은 같은 `memory.db`에 암호화 없이 저장되므로 DB 파일을 열 수 있는 사람은 값을 읽을 수 있습니다. 디스크에서도 보호해야 하는 비밀은 OS 키체인을 쓰거나 별도 권한을 설정한 파일에 저장하고, 여기에는 그 경로만 남기세요."

