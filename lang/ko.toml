[cli.help._root.agent.rate-limit-set]
about = "(agent, metric) 에 rate limit 버킷을 설정한다 — `per_ms` 밀리초마다 `limit` 토큰"
long = "(agent, metric)의 호출 비율을 제한합니다. `per_ms` 밀리초마다 `limit` 토큰을 보충합니다.\n\n실제 호출에서 토큰을 사용하는 metric은 `ipc_calls`뿐입니다. 다른 이름의 버킷은 `rate-limit-list`에 표시되지만 호출을 제한하지 않습니다.\n\n대상 IPC 호출마다 토큰 하나를 사용합니다. 토큰이 부족하면 `-32010 throttled`를 반환하고 감사 로그에 Deny를 기록합니다. 세션 토큰 없는 일반 CLI 호출, 호스트 자체 호출, `telemetry.*`, `agent.rate_limit_*`, `system.info`는 제외합니다. 따라서 제한된 에이전트도 마지막 두 메서드 종류로 자신의 한도를 확인하고 해제할 수 있습니다."

[cli.help._root.agent.rate-limit-set.arg.agent]
help = "에이전트 id"

[cli.help._root.agent.rate-limit-set.arg.metric]
help = "metric 이름. 무언가가 실제로 빼 쓰는 것은 `ipc_calls` 하나뿐이다"

[cli.help._root.agent.rate-limit-set.arg.limit]
help = "한 주기마다 채워지는 토큰 수"

[cli.help._root.agent.rate-limit-set.arg.per_ms]
help = "한 주기의 길이 (밀리초, 예: 분 단위면 `60000`)"

