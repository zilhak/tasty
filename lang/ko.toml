[cli.help._root.plugin.disable]
about = "plugin 을 비활성화한다 (돌고 있으면 정상 종료)"
long = "plugin 을 비활성화한다 (돌고 있으면 정상 종료).\n\n자국이 디스크에 남아 재시작을 넘긴다 — 그 뒤에 같은 id 를 `plugin install` 해도 다시 켜지지 않는다. 이것은 제거가 아니다: 디렉토리는 남고 명령 네임스페이스의 소유도 그대로라, `tasty <네임스페이스> ...` 는 없는 메서드라고 답하지 않고 `plugin ... is not running` 으로 답한다. 대신 그 plugin 이 기여하던 것 — 파일 detector 와 handler, hook handler, completion strategy, 설정 페이지 — 이 전부 빠지므로, 그 plugin 이 열던 파일은 이제 다른 경로로 열린다."

[cli.help._root.plugin.disable.arg.id]
