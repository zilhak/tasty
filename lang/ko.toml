long = "등록된 훅 핸들러를 ID로 수동 실행합니다(테스트·자동화 진입점). IpcSequence 핸들러에서는 `--body`/`--header`/`--query`로 `${body.x}`/`${header.x}`/`${query.x}` 값을 채웁니다. 응답은 접수 확인뿐이며 핸들러 완료를 기다리지 않습니다."

