[cli.help._root.hook-handler.upsert]
about = "사용자 핸들러를 TOML 을 직접 열지 않고 그 자리에서 만들거나 고친다"
long = "TOML을 직접 편집하지 않고 사용자 핸들러를 만들거나 수정합니다.\n\n지정한 필드만 바꾸므로 ID와 그 ID를 참조하는 연결은 유지됩니다. 필드를 하나 이상 지정해야 하며 변경은 `~/.tasty/hook-handlers.toml`에 바로 저장합니다.\n\n이미 등록한 webhook의 IpcSequence는 등록 당시의 호출을 유지합니다. 수정한 내용을 적용하려면 webhook을 다시 등록하세요."

