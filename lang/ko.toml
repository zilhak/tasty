# 매핑된 mirror 워크스페이스의 연결이 끊겼을 때 표시 — 워크스페이스와 터미널(scrollback
# 포함)은 그대로 유지한 채 백그라운드 backoff 재시도가 자동으로 재연결을 시도한다.
