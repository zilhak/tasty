# 원격 연결이 끊겨(EOF / force-detach / heartbeat 타임아웃 / 송신 프레임 write 실패)
# mirror 워크스페이스가 정리될 때 표시. anchor 매핑 없이 임시로 attach 한 mirror 에만
# 해당 — 매핑된 mirror 는 아래 세 키(자동 재연결 대상)로 대신 표시된다.
