long = "Goal — surface 하나당 목표 문장 하나 (`tasty.goal`).\n\n아무것도 이것을 물려받지 않는다: 이 surface 에서 spawn 된 surface 는 goal 이 없는 채로 시작한다. TTL 도 없는데, 필요가 없어서다 — surface 가 닫힐 때, 그리고 복원되지 않은 surface 는 시작할 때, 그 surface 의 메모리 스코프가 통째로 지워진다. 그래서 goal 의 수명은 정확히 그 surface 의 수명이다."

