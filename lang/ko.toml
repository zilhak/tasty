long = "secret 메모리 저장소. CLI 는 `_host` 소유자로 동작하며 --owner 플래그는 없다. plugin 의 secret 영역은 설계상 CLI 에서 접근할 수 없다.\n\nsecret 이 뜻하는 것은 \"다른 소유자가 읽지 못한다\" 이고 그 이상은 아니다. 값은 같은 `memory.db` 안에 평문 바이트로 앉아 있으므로, 그 파일을 열 수 있는 사람은 그대로 읽는다 — 분리는 디스크가 아니라 IPC 경로에서 걸린다. 그것까지 견뎌야 하는 값이라면 OS 키체인을 쓰거나, 권한을 따로 건 파일에 데이터를 두고 여기에는 경로만 저장해라."

