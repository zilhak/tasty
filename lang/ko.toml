[cli.help._root.agent.task-create]
about = "워크스페이스에 작업을 만들되 바로 실행하지는 않습니다"
long = "워크스페이스에 작업을 만들되 바로 실행하지는 않습니다.\n\n`task-run --action start`로 워크스페이스의 러너를 직접 시작해야 합니다. 호스트 부팅만으로 러너가 시작되지는 않습니다. 러너가 없으면 Ready 작업이 대기 상태에 남고 task-await는 시간 초과될 수 있습니다."

