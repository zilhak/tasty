# mirror 워크스페이스에 포커스된 상태에서 찍은 인터랙티브 스크린샷이 업로드되어
# 원격 인스턴스의 클립보드로 반영됐을 때 표시.
mirror_capture_saved = "스크린샷을 원격 클립보드로 복사했습니다."
# 위 업로드/원격 클립보드 반영이 실패했을 때 표시.
