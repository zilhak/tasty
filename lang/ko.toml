long = "사람 인계 승인 게이트 (request/respond/await/cancel/list/get)\n\n살아 있는 게이트는 호스트를 넘기지 못한다. `request`·`respond`·`await`·`cancel`·`list`·`get` 은 전부 메모리 안의 저장소 하나를 읽고, 그 저장소는 부팅마다 비어서 시작한다. 그래서 호스트가 멈출 때 `pending` 이던 요청은 그 뒤에 없다 — `list` 에 안 나오고 그 id 로 `await` 하면 \"not found\" 가 온다. 남는 것은 적힌 기록이고, 그것을 memory store 에서 읽는 것이 `history` 다. `history` 는 로그, `list` 는 지금 답할 수 있는 것으로 읽어라."
