long = "설치된 plugin 을 id 로 제거한다.\n\nplugin 디렉토리가 통째로 지워지므로, 그 plugin 이 그 안에 두었던 것도 함께 없어진다. 기본 제공 plugin 이면 제거된 사실까지 기록되어 다음 실행에 다시 놓이지 않는다 — 되돌리는 것은 `plugin upgrade-builtins --restore-removed <id>` 이고, 돌아올 때는 활성 상태다."

