long = "워크스페이스 러너를 시작·중지하거나 상태를 조회합니다. start를 반복해도 중복 실행하지 않습니다. 호스트는 부팅 시 저장 상태를 복구하지만 러너는 중지 상태로 둡니다.\n\nrunner를 멈춰도 이미 시작한 프로세스는 계속 실행되며 작업은 Running으로 남습니다. 다시 시작하면 핸들을 복원하고 프로세스 생존 여부와 저장된 종료 결과를 확인합니다."

