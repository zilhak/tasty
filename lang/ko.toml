[cli.help._root.remote.check]
about = "SSH로 원격 tasty 인스턴스의 생존 여부 확인"
long = "SSH로 원격 tasty 인스턴스에 연결할 수 있는지 확인합니다.\n\n`tasty port` 또는 포트 파일로 원격 포트를 찾고 `ssh -L` 터널을 연 뒤 `system.info` 요청을 보냅니다. 성공 응답을 받아야 연결 가능하다고 판단합니다. 연결 실패, 시간 초과, 잘못된 응답, 오류 응답은 검사가 실패했다는 뜻이며 서버가 종료됐다는 증거는 아닙니다. 인자 이름은 `remote attach`와 같습니다."

[cli.help._root.remote.check.arg.ssh]
help = "원격 SSH 대상(예: --ssh user@host, --ssh gx10). `--profile`과 함께 사용 불가"

[cli.help._root.remote.check.arg.profile]
help = "저장된 tasty-attach 프로필로 확인합니다. `~/.tasty/remote-profiles.toml`에서 사용자, 포트, 인증 키, 추가 옵션을 읽습니다. `--ssh`와 함께 사용할 수 없습니다. `--remote-tasty`와 `--remote-port-mode` 대신 프로필의 값을 사용합니다."

[cli.help._root.remote.check.arg.remote_tasty]
help = "원격 호스트의 tasty 실행 파일 경로입니다. 포트 조회 명령(`ssh host <path> port`)에 사용합니다. 기본값은 \"tasty\"이며 원격 PATH에 있어야 합니다."

[cli.help._root.remote.check.arg.remote_port_mode]
help = "원격 포트 발견 방식: auto (기본값) | subcommand | file-unix | file-windows"

[cli.help._root.remote.workspaces]
about = "SSH로 원격 tasty 인스턴스의 워크스페이스 나열"
long = "SSH로 원격 tasty 인스턴스의 워크스페이스를 나열합니다. SSH 대상이나 attach 프로필로 연결하여 원격 `workspace.list`와 `attach.list`를 합칩니다. 워크스페이스별 ID, 이름, 페인 수, 실행 중 여부, 다른 클라이언트의 attach 여부를 표시합니다. `remote attach --workspace`에 필요한 ID를 찾을 때 사용합니다. 읽기 전용이며 로컬 사용자 상태(포커스 등)를 바꾸지 않습니다. `--ssh 127.0.0.1:<port>`는 터널 없이 루프백으로 직접 연결합니다(로컬 종단 간 검증). 로컬 IPC `remote.workspaces`도 같은 기능을 제공합니다."

[cli.help._root.remote.workspaces.arg.ssh]
help = "원격 SSH 대상(예: --ssh user@host, --ssh gx10, --ssh 127.0.0.1:45123). `--profile`과 함께 사용 불가"

[cli.help._root.remote.workspaces.arg.profile]
help = "저장된 tasty-attach 프로필 이름으로 나열. `--ssh`와 함께 사용 불가. 프로필 값이 `--remote-tasty`와 `--remote-port-mode`를 대체"

[cli.help._root.remote.workspaces.arg.remote_tasty]
help = "원격 host의 tasty 바이너리 경로(포트 탐색 하위 명령에 사용). 기본값 \"tasty\""

[cli.help._root.remote.workspaces.arg.remote_port_mode]
help = "원격 포트 발견 방식: auto (기본값) | subcommand | file-unix | file-windows"

[cli.help._root.remote.workspaces.arg.json]
help = "텍스트 대신 JSON 배열로 출력(스크립트나 UI에서 사용)"

[cli.help._root.remote.new-workspace]
about = "SSH로 원격 tasty 인스턴스에 새 워크스페이스 생성"
long = "SSH로 원격 tasty 인스턴스에 새 워크스페이스를 만듭니다. `remote workspaces`로 목록을 조회하는 대신 새 항목을 생성하는 명령입니다. 출력된 ID를 `tasty remote attach --workspace <id>`에 지정하면 생성한 워크스페이스에 연결할 수 있습니다. 원격의 활성 워크스페이스는 바뀌지 않습니다. 로컬 IPC `remote.attach`의 `new_workspace` 옵션도 같은 기능을 제공합니다."

[cli.help._root.remote.new-workspace.arg.ssh]
help = "원격 SSH 대상(예: --ssh user@host, --ssh gx10, --ssh 127.0.0.1:45123). `--profile`과 함께 사용 불가"

[cli.help._root.remote.new-workspace.arg.profile]
help = "저장된 tasty-attach 프로필 이름으로 생성. `--ssh`와 함께 사용 불가. 프로필 값이 `--remote-tasty`와 `--remote-port-mode`를 대체"

[cli.help._root.remote.new-workspace.arg.remote_tasty]
help = "원격 host의 tasty 바이너리 경로(포트 탐색 하위 명령에 사용). 기본값 \"tasty\""

[cli.help._root.remote.new-workspace.arg.remote_port_mode]
help = "원격 포트 발견 방식: auto (기본값) | subcommand | file-unix | file-windows"

[cli.help._root.remote.new-workspace.arg.name]
help = "새 워크스페이스 이름(생략하면 원격 기본값)"

[cli.help._root.remote.new-workspace.arg.cwd]
help = "원격 파일시스템상의 새 워크스페이스 작업 디렉터리. 원격에서 존재 여부를 확인하고 없으면 `cwd does not exist`로 거부"

