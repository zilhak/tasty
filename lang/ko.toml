[cli.help._root.plugin.install]
about = "tasty-plugin.toml 이 있는 디렉토리에서 plugin 을 설치한다"
long = "tasty-plugin.toml 이 있는 디렉토리에서 plugin 을 설치한다.\n\n둘이 더 일어나고, 둘 다 묻지 않는다: 매니페스트가 선언한 권한이 즉시 전부 부여되고, 그 id 의 비활성 자국이 이미 남아 있지 않으면 곧바로 활성화·기동된다. `tasty-plugin.toml` 을 먼저 들여다보거나, 설치 뒤에 `plugin permissions <id>` 와 `plugin revoke <id> <permission>` 으로 확인하고 되돌려라."

