[cli.help._root.agent.lease-acquire]
about = "임의 resource 에 lease 를 잡는다 (권고적·협조적)"
long = "리소스의 사용권을 표시하는 lease를 획득합니다. 참여자가 이 표시를 확인하고 따르는 방식이며 리소스 접근 자체를 강제로 막지는 않습니다.\n\n충돌 시 `--mode fail`은 오류를 반환합니다. `--mode block`은 기다리지 않고 성공 응답에 `acquired: false`와 현재 holder를 담습니다. 획득 여부는 종료 코드가 아니라 acquired로 확인하세요.\n\n`--ttl-ms`를 생략하면 자동 만료되지 않습니다. 같은 holder ID로 `lease-release`해야 해제되므로 holder가 종료되어도 lease는 남습니다. 재시작 때 정리하는 대상은 실행 중이던 작업이 자신의 작업 ID로 보유한 lease뿐입니다."

[cli.help._root.agent.lease-acquire.arg.workspace_id]
help = "워크스페이스 id (포커스 무관 — 필수)"

