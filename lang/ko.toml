[cli.help._root.approval.request]
about = "새 승인을 요청한다. 성공하면 새 id 를 찍는다"
long = "새 승인을 요청한다. 성공하면 새 id 를 찍는다.\n\n저절로 만료되는 것은 없다. `--timeout-ms` 를 재는 자리는 `approval await` 안이고, 요청을 제시간에 `pending` 밖으로 옮기는 것은 그 호출뿐이다 — 기다리는 쪽이 없으면 요청은 timeout 값이 얼마였든 `pending` 으로 남고 `approval list --state pending` 에 계속 나온다."

[cli.help._root.approval.request.arg.body]
help = "선택적 본문 (여러 줄 설명)"

[cli.help._root.approval.request.arg.choices]
help = "쉼표로 구분한 `key:label[:destructive]` 세 쌍 (예: `approve:Approve,deny:Deny:1`). 생략하면 `approve / deny` 가 기본이다"

[cli.help._root.approval.request.arg.default_choice]
help = "요청이 timeout 될 때 기록되는 선택 키. 결과는 이 키를 실은 `timed_out` 이고 시스템이 한 것으로 남는다 — `responded` 가 아니라서 `approval history --decision` 은 그것을 잡지 않는다"

[cli.help._root.approval.request.arg.metadata]
help = "자유 형식 JSON 메타데이터 (문자열을 그대로 넘긴다. 파싱은 돼야 한다)"

[cli.help._root.approval.request.arg.severity]
help = "심각도: info | warn | danger. 기본값: info"

[cli.help._root.approval.request.arg.surface_id]
help = "묶을 surface id (선택)"

[cli.help._root.approval.request.arg.timeout_ms]
help = "timeout (밀리초). 호출자가 `await` 때 덮어쓸 수 있다"

[cli.help._root.approval.request.arg.title]
help = "팝업·알림에 보일 제목"

[cli.help._root.approval.request.arg.workspace_id]
help = "묶을 워크스페이스 id (기본값: 활성 워크스페이스)"

