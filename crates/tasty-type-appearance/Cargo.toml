[package]
name = "tasty-type-appearance"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Appearance schema/primitives for Tasty — HexColor/GpuRgba/GpuRgb color primitives, ThemeColors/PartialColors/SurfaceColors/ThemeSizing/Theme schema. Type-layer crate — may depend only on other `tasty-type-*` crates; must not depend on any tasty-* crate outside the type-* group; must not introduce cycles among type-* crates."

[features]
# Default: include thin egui Color32 conversion helpers on HexColor.
# Disable in plugin/headless processes that don't link egui:
#   tasty-type-appearance = { path = "...", default-features = false }
default = ["egui-compat"]
egui-compat = ["dep:egui"]

[dependencies]
# Type-layer crate. type-* 그룹 내부 의존은 허용 (순환 금지).
tasty-type-geometry = { path = "../tasty-type-geometry" }

bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }

# Optional egui Color32 conversion shim. Gated behind `egui-compat`.
egui = { version = "0.31", optional = true }

[lints]
workspace = true
