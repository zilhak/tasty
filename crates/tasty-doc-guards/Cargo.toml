[package]
name = "tasty-doc-guards"
version = "0.1.0"
edition = "2024"
license = "MIT"

# 의존 0 이 이 크레이트의 존재 이유다 — ADR-0138. 여기에 의존을 하나라도 더하면
# 그 결정의 전제가 사라진다.
[dependencies]

# 워크스페이스 공통 lint 를 상속한다. 이 크레이트만 이 절이 없어서 `dead_code = "deny"`
# 를 비롯한 11 개를 하나도 안 받고 있었다 — **가드를 담은 크레이트가 그 규율 밖에 있었다.**
#
# 켜는 비용은 0 으로 측정됐다(2026-09-07): 켜기 전후로 `cargo check -p tasty-doc-guards
# --all-targets` 와 `cargo clippy` 의 진단 줄을 정렬해 diff 했더니 check 0 · clippy 0 —
# 새 진단이 한 줄도 안 늘었다(rc 0/0, warning 6/26 이 동일). 상속이 실제로 먹는지는
# 따로 확인했다: 죽은 private fn 을 심으면 `[lints]` 가 있을 때 error(rc=101),
# 없을 때 warning(rc=0) 이고, clippy 쪽도 `let_underscore_must_use` 로 같은 두 상태를 봤다.
#
# 진단이 0 인 이유는 잡음이 없어서가 아니라 **이미 파일마다 꺼 놨기** 때문이다 —
# `#![allow(clippy::let_underscore_must_use)]` 가 `tests/` 에 15 개 있다. 그 15 는 루트
# `tests/` 에서 이 크레이트로 이사 오면서 억제를 달고 온 **재고**이고, 신규 유입은 그
# 자리를 거의 안 만든다. 파일이 이 경로에 들어온 날짜별로 코드에 `let _ =` 를 쓰는 비율:
#   2026-09-05  9/22 = 41%   ·   09-06  4/11 = 36%   ·   09-07  2/33 = 6%
# 파일 수가 22 -> 66 으로 3 배가 되는 동안 비율은 41% -> 6% 로 떨어졌다. 그래서 이
# 상속은 파일이 늘수록 무거워지지 않는다.
[lints]
workspace = true
