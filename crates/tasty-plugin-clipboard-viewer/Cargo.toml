[package]
name = "tasty-plugin-clipboard-viewer"
version = "0.1.26"
edition = "2024"
license = "MIT"
description = "External Tasty plugin: read-only viewer of the current system clipboard"
repository = "https://github.com/zilhak/tasty"

[[bin]]
name = "tasty-plugin-clipboard-viewer"
path = "src/main.rs"

[dependencies]
# egui-mesh popup: plugin 이 자기 프로세스에서 popup 콘텐츠를 egui 로 tessellate 해
# host 가 합성한다 (ADR-0028 / B4). EguiMeshPopup 헬퍼가 필요하므로 egui-mesh feature.
tasty-plugin-sdk = { path = "../tasty-plugin-sdk", features = ["egui-mesh"] }
# host 가 set_context 로 보낸 ThemeWire 를 `Theme::with_colors_and_zoom` 으로 재구성.
tasty-plugin-protocol = { path = "../tasty-plugin-protocol" }
# Theme 토큰 / egui-compat(to_egui). 이 프로세스는 egui 를 링크한다.
tasty-type-appearance = { path = "../tasty-type-appearance" }
# 디자인 토큰 정합 Button 위젯(primary/secondary) 재사용 — host UiNode::Button 과 동형.
tasty-ui-widgets = { path = "../tasty-ui-widgets" }
# 클립보드를 plugin process 내에서 직접 read (호스트 IPC 미경유).
# 본체와 동일 버전(3.x)으로 맞춰 Cargo.lock 비대 방지.
arboard = "3"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

# host·SDK·protocol 와 동일 egui 인스턴스로 unify (epaint serde OFF + bytemuck ON).
# plugin 이 closure 에서 위젯을 그리려면 SDK 와 같은 egui 타입이 필요하다 —
# Cargo 가 workspace 전역 0.31 로 통일하므로 mesh 와이어(POD Vertex)가 정합한다.
egui = { version = "0.31", default-features = false, features = [
    "bytemuck",
    "default_fonts",
] }

[dev-dependencies]
tasty-plugin-manifest = { path = "../tasty-plugin-manifest" }

# 빌드타임 SVG → 벡터 베이크(build.rs). usvg 는 host egui_extras svg feature 가 이미
# Cargo.lock 에 vendored 한 0.37 을 그대로 쓴다 — build-dep 라 런타임 바이너리 크기 영향 0.
# tasty-icons 는 canonical SVG 소스 — `default-features=false` 로 egui 를 끈다(build.rs
# 는 egui 를 링크하지 않는다). host/gallery 런타임 렌더와 바이트 동일한 소스를 베이크
# (`tasty-plugin-image/build.rs` 정본 패턴 이식).
[build-dependencies]
usvg = "0.37"
tasty-icons = { path = "../tasty-icons", default-features = false }

# "기타" 버킷의 raw 포맷 열거 — arboard 는 열거 자체를 노출하지 않아
# 플랫폼 raw API 를 직접 호출한다. 세 크레이트 다 arboard 가 이미 transitive
# dependency 로 끌어온 것과 semver 호환 버전을 선언해 동일 인스턴스로 재사용한다
# (버전이 어긋나면 중복 컴파일 + Cargo.lock 비대화, `cargo tree -d` 로 검증).
[target.'cfg(windows)'.dependencies]
clipboard-win = "5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSPasteboard",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSData",
    "NSString",
] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = "0.13"

[lints]
workspace = true
