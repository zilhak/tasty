[package]
name = "tasty-lua"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Host-only Lua scripting layer for Tasty (~/.tasty/init.lua user hooks)"

[dependencies]
mlua = { version = "0.10", features = ["lua54", "vendored", "send", "serialize"] }
notify-rust = "4"
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[lints]
workspace = true
