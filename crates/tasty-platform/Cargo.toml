[package]
name = "tasty-platform"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "OS-native surface of tasty — crash/hang reports, native context menu, tray, jump list, window chrome, screen capture, macOS permissions"
repository = "https://github.com/zilhak/tasty"

[dependencies]
# App/View에는 의존하지 않는다. OS 신호의 앱 동작은 호출자가 정한다.
tasty-i18n = { path = "../tasty-i18n" }
tasty-settings = { path = "../tasty-settings" }
tasty-utils = { path = "../tasty-utils" }

anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 윈도잉 의존성은 gui feature에서만 사용한다.
winit = { version = "0.30", optional = true }
png = { version = "0.18", optional = true }
tray-icon = { version = "0.22", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# macOS 권한 조회도 본체와 같은 홈 디렉터리 해석을 사용한다.
directories = { version = "6", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSURLRequest", "NSObject", "NSArray"], optional = true }
objc2-app-kit = { version = "0.3", features = ["NSView", "NSWindow", "NSResponder", "NSMenu", "NSMenuItem", "NSEvent", "NSGraphics", "NSPasteboard", "NSPasteboardItem", "NSApplication", "NSRunningApplication", "NSImage", "libc"], optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }
gdkx11 = { version = "0.18", optional = true }
# 에이전트 창의 X11 포커스·쌓임 요청(`window_stacking`). 본체가 이미 같은 버전을 쓴다.
x11-dl = { version = "2.21", optional = true }

[dev-dependencies]
# 시험에서 환경변수와 격리 홈을 원상 복구한다.
tasty-test-support = { path = "../tasty-test-support" }
tempfile = "3"

[features]
default = []
gui = [
    "dep:winit",
    "dep:directories",
    "dep:png",
    "dep:tray-icon",
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-app-kit",
    "dep:gtk",
    "dep:gdkx11",
    "dep:x11-dl",
]

[lints]
workspace = true
