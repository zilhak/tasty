[package]
name = "tasty-ssh-profiles"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "SSH connection profiles for Tasty (~/.tasty/ssh-profiles.toml) — workspace↔computer attach mapping"

[dependencies]
# Workspace crates
tasty-utils = { path = "../tasty-utils" }

# Serialization
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Logging
tracing = "0.1"

# Error handling
anyhow = "1"

[lints]
workspace = true
