# 호스트 기본 detector. $directory는 호스트 예약 ID다.
# 매칭 실패는 None으로 반환하며 별도 $unknown detector는 없다.

[[detector]]
id = "html"
display_name_i18n_key = "file_handler.format.html"

[[detector.rule]]
kind = "extension"
values = ["html", "htm"]

[[detector]]
id = "$directory"
display_name_i18n_key = "file_handler.format.directory"

[[detector.rule]]
kind = "is-directory"
