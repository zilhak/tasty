manifest_version = 1
id = "com.tasty.html"
name = "HTML Viewer"
version = "0.1.10"
description = "HTML viewer surface. Uses tasty's native WebView overlay toolkit."
api_version = "1"
permissions = [
    "surface.read",
    "surface.write",
    "file_handler.define",
    "file_handler.handle:html",
    "ui.settings_page",
]
lang_dir = "lang"

[entry]
type = "process"
command = "tasty-plugin-html"

[[surface_kinds]]
kind = "html"
display_name_i18n_key = "surface.kind.html"
icon = "html"
rendering = "webview"

# 프리셋 편집기 필드 — URL 입력. url 은 파일 경로 파생 대상이 아니다(derive_cwd 없음).
[[surface_kinds.preset_fields]]
id = "url"
label_key = "preset.field.url"
param_key = "url"
input_type = "url"
required = true
placeholder_key = "preset.field.url_hint"

[[contributes.ipc_namespace]]
prefix = "html"
description_i18n_key = "html.namespace.desc"

# detector 는 호스트가 유지 (default-file-format.toml). plugin disabled 시에도
# .html 확장자가 식별되어 host html-system handler 가 fallback 으로 동작.
# 본 plugin 은 handler 만 contribute — owner tiebreak (user > plugin > host)
# 에 의해 priority 동순위면 plugin handler 가 우선.
[[contributes.handler]]
id = "viewer"
detector = "html"
priority = 50
display_name_i18n_key = "file_handler.host.html-viewer"
[contributes.handler.action]
kind = "open_surface"
surface_kind = "html"
param_key = "url"

[[contributes.cli]]
name = "html"
description = "HTML viewer commands"
description_i18n_key = "html.cli.desc"
subcommands = [
    { name = "open", ipc_method = "html.open", args = "open_args", description = "Open a URL as HTML surface in the focused tab" },
]

[contributes.cli.arg_groups.open_args]
positional = [
    { name = "url", type = "string", required = true, help = "URL (http://, https://, file://) or local path" },
]
flags = [
    { name = "surface", type = "u32", flag = "--surface", required = false, help = "Target surface ID (default: convert focused)" },
]

# Appearance › HTML settings page. Host renders the controls (Phase 2-host) and
# persists values under `plugin_settings.com.tasty.html.<storage_key>`.
[[contributes.settings_pages]]
id = "html"
title_key = "settings.subtab.html"
category = "appearance"

[[contributes.settings_pages.items]]
kind = "number"
id = "zoom"
label_key = "html.settings.zoom"
storage_key = "zoom"
default = 100.0
min = 25.0
max = 500.0
suffix_key = "html.settings.zoom_suffix"

[[contributes.settings_pages.items]]
kind = "select"
id = "color_scheme"
label_key = "html.settings.color_scheme"
storage_key = "color_scheme"
default = "follow"
options = [
    { value = "follow", label_key = "html.settings.scheme.follow" },
    { value = "light", label_key = "html.settings.scheme.light" },
    { value = "dark", label_key = "html.settings.scheme.dark" },
]

[[contributes.settings_pages.items]]
kind = "toggle"
id = "allow_remote"
label_key = "html.settings.allow_remote"
storage_key = "allow_remote_content"
default = false

[[contributes.settings_pages.items]]
kind = "toggle"
id = "sandbox"
label_key = "html.settings.sandbox"
storage_key = "sandbox_scripts"
default = true
