[preset.field]
url = "URL"
url_hint = "https://…"

[html.cli]
desc = "HTML viewer commands"

[html.cli.sub.open]
description = "Set the URL of an existing HTML surface"

[html.cli.arg.open_args.url]
help = "URL (http://, https:// or file://). Use a file:// URL for a local file."

[html.cli.arg.open_args.surface]
