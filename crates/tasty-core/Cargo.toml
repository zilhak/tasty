[package]
name = "tasty-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Shared data types, theme, i18n and path helpers for Tasty"

[features]
# Default: include thin egui Color32 conversion helpers on `HexColor` (used by the host bin).
# Disable in plugin/headless processes that don't link egui:
#   tasty-core = { path = "...", default-features = false }
default = ["egui-compat"]
egui-compat = ["dep:egui"]

[dependencies]
# Workspace crates
tasty-terminal = { path = "../tasty-terminal" }
tasty-type-color = { path = "../tasty-type-color" }

# Optional egui Color32 conversion shim (color.rs only). Gated behind `egui-compat`.
egui = { version = "0.31", optional = true }

# Cell attributes for closed-item history
termwiz = "0.22"

# Serialization (model::length, settings 등 외부에서 사용)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Path helpers (~/.tasty)
directories = "6"

# Logging
tracing = "0.1"

# Error handling (model::workspace, model::pane)
anyhow = "1"

[lints]
workspace = true
