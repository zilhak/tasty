[package]
name = "tasty-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "GUI-free shared domain data types (model/i18n/paths/agent_id/waker) for Tasty"

[dependencies]
# Workspace crates — type-* layer 만 의존. 시각/색은 의존하지 않는다 (GUI-free).
tasty-terminal = { path = "../tasty-terminal" }
tasty-type-geometry = { path = "../tasty-type-geometry" }
tasty-utils = { path = "../tasty-utils" }

# Cell attributes for closed-item history
termwiz = "0.22"

# Serialization (model::length, settings 등 외부에서 사용)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Logging
tracing = "0.1"

# Error handling (model::workspace, model::pane)
anyhow = "1"

[lints]
workspace = true
