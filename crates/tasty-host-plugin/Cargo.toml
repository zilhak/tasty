[package]
name = "tasty-host-plugin"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Tasty plugin manager — host-side process lifecycle, IPC routing, manifest registry"
repository = "https://github.com/zilhak/tasty"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "io-util"] }
tasty-ipc = { path = "../tasty-ipc" }
tasty-plugin-manifest = { path = "../tasty-plugin-manifest" }
tasty-plugin-protocol = { path = "../tasty-plugin-protocol" }
tasty-shm = { path = "../tasty-shm" }
tasty-utils = { path = "../tasty-utils" }
tasty-terminal = { path = "../tasty-terminal" }
tasty-memory = { path = "../tasty-memory" }
tasty-telemetry = { path = "../tasty-telemetry" }
tasty-themes = { path = "../tasty-themes" }
tasty-settings = { path = "../tasty-settings" }
tasty-type-appearance = { path = "../tasty-type-appearance" }
semver = "1"
rand = "0.9"
hex = "0.4"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[lints]
workspace = true
