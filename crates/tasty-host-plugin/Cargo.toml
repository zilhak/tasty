[package]
name = "tasty-host-plugin"
version = "0.1.4"
edition = "2024"
license = "MIT"
description = "Tasty plugin manager — host-side process lifecycle, IPC routing, manifest registry"
repository = "https://github.com/zilhak/tasty"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "io-util"] }
tasty-ipc = { path = "../tasty-ipc" }
tasty-plugin-manifest = { path = "../tasty-plugin-manifest" }
tasty-plugin-protocol = { path = "../tasty-plugin-protocol" }
tasty-shm = { path = "../tasty-shm" }
tasty-utils = { path = "../tasty-utils" }
tasty-terminal = { path = "../tasty-terminal" }
tasty-memory = { path = "../tasty-memory" }
tasty-telemetry = { path = "../tasty-telemetry" }
tasty-themes = { path = "../tasty-themes" }
tasty-settings = { path = "../tasty-settings" }
tasty-type-appearance = { path = "../tasty-type-appearance" }
# 중앙 타이머 허브 — plugin 주기 작업(ping/RSS/auto-reload)의 스케줄 소유
# (docs/dev-guide/timer-hub.md "계층을 넘는 허브 합성").
tasty-timer = { path = "../tasty-timer" }
semver = "1"
rand = "0.9"
hex = "0.4"
toml = "0.8"
ed25519-dalek = "2"
sha2 = "0.10"
base64 = "0.22"
# 텔레메트리 RssSurge 이상탐지(docs/features/telemetry/index.md) — PluginProcess.child 의 PID로
# 실제 RSS 를 host 가 직접 sampling(manager/pump.rs). Plugin 은 자기 자신의
# 메모리를 정확히 보고할 유인이 없어(self-report 불신) 여기서만 PID 기반을
# 쓴다 — Agent 타입은 telemetry.record 자가 보고로 별도 처리.
sysinfo = "0.35"

[features]
# Phase J.C WASM POC stub gate. 본 feature 활성 시 src/wasm_poc.rs 컴파일.
# 기본 비활성. 정식 채택 시점에 sdk-wasm path-dep 을 본 feature 의 deps 에 추가.
wasm-poc = []

[dev-dependencies]
tempfile = "3"
# 로그 **레벨**을 시험이 관측하려고 쓴다 — "설치본이 번들보다 앞섰다" 는 경고가 실제로 warn
# 으로 나가는지, 같은 버전일 때는 안 나가는지를 문자열이 아니라 이벤트로 확인한다
# (`log_builtin_skip`). 정규 의존이 아니라 산출물에는 안 들어간다.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# 테스트에서만 tasty_home() 스레드 로컬 override 훅(push/pop_home_override)을 켠다.
# resolver v3(edition 2024) 가 이 dev-dep feature 를 정규(lib/release) 빌드로 통일하지
# 않으므로 release 산출물에는 훅이 남지 않는다 — 그 비누출은 cargo tree 로 관측
# 확인한다(docs/adr/0155). 정규 의존 선언은 위 [dependencies] 에 그대로 있다.
tasty-utils = { path = "../tasty-utils", features = ["test-support"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_IO"] }
tasty-reaper = { path = "../tasty-reaper" }

[lints]
workspace = true
