[package]
name = "tasty-terminal"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "PTY + VTE terminal emulator library"

[dependencies]
termwiz = "0.22"
portable-pty = "0.8"
regex = "1"
anyhow = "1"
tracing = "0.1"
unicode-width = "0.2"
finl_unicode = "1.4"
tasty-ansi = { path = "../tasty-ansi" }
tasty-reaper = { path = "../tasty-reaper" }
tasty-utils = { path = "../tasty-utils" }

# unix 공통 — Drop 의 zombie reap(waitpid/kill escalation)이 cfg(unix) 라
# macOS 만이 아니라 Linux 빌드에도 필요하다.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
] }

[dev-dependencies]
# 의존 크레이트에는 호출자의 cfg(test)가 적용되지 않아 test-support를 명시한다.
# 상속 환경변수 제거 시험이 tasty-utils의 공용 키 목록을 읽기 위한 설정이다.
tasty-utils = { path = "../tasty-utils", features = ["test-support"] }

[lints]
workspace = true
