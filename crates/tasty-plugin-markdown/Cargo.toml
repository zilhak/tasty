[package]
name = "tasty-plugin-markdown"
version = "0.1.70"
edition = "2024"
license = "MIT"
description = "Markdown viewer surface plugin (webview)"
repository = "https://github.com/zilhak/tasty"

[[bin]]
name = "tasty-plugin-markdown"
path = "src/main.rs"

[dependencies]
# 본문 렌더는 host WebView overlay 에 위임한다 — plugin 은 egui 를 그리지 않는다
# (large-file/file-open 확인 팝업만 egui-mesh 로 남는다).
tasty-plugin-sdk = { path = "../tasty-plugin-sdk", features = ["egui-mesh"] }
tasty-plugin-protocol = { path = "../tasty-plugin-protocol" }
# Theme parity — host `theme.query` IPC 로 받은 ThemeWire(색 집합+is_light+zoom)를
# `Theme::with_colors_and_zoom` 으로 재구성해 CSS 커스텀 프로퍼티로 주입한다. egui-compat
# (to_egui) 를 켠다 — 확인 팝업들이 여전히 egui 로 그려지므로.
tasty-type-appearance = { path = "../tasty-type-appearance" }
# typed 간격 헬퍼(vspace/margin_all) + 확인 팝업의 Button — egui-mesh 팝업 전용.
tasty-ui-widgets = { path = "../tasty-ui-widgets" }
# Markdown → HTML 변환 본체. push_html 로 문서를 만들고, 링크 destination 은 이벤트
# 스트림을 map 해 내부 nav 스킴(`#tasty-nav:link:<enc>`)으로 재작성한다(host WebView
# 의 실제 navigation 을 절대 일으키지 않기 위함 — docs/dev-guide 참조).
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
# 생성한 HTML 을 렌더 전에 sanitize — GFM 산출물에 필요한 최소 태그/속성만 허용하는
# 화이트리스트를 이 crate 가 직접 구성한다(render.rs). `<script>`/`on*` 핸들러/
# `javascript:` scheme 은 전부 제거된다.
ammonia = "4"
webbrowser = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
# KaTeX 웹폰트(woff2)를 render.rs 가 CSS `@font-face src` data URI 로 굽는 데만 쓴다 —
# 워크스페이스 다른 곳(tasty-host-plugin)도 이미 같은 버전을 쓴다.
base64 = "0.22"

# 확인 팝업(large-file/file-open) 전용 — 본문은 더 이상 egui 로 그리지 않지만, 이
# 두 팝업은 host·SDK·protocol 과 동일 egui 인스턴스로 unify 해야 한다(epaint serde
# OFF + bytemuck ON). Cargo 가 workspace 전역 0.31 로 통일하므로 mesh 와이어(POD
# Vertex)가 정합한다.
egui = { version = "0.31", default-features = false, features = [
    "bytemuck",
    "default_fonts",
] }

# GFM alert blockquote(`> [!NOTE]` 등) 5종의 아이콘 — canonical SVG 소스(`Icon::body`,
# egui 의존 없는 plain &str/bool 필드)를 render.rs 가 theme 색으로 직접 구운 뒤 CSS
# `background-image` data URI 로 굽는다. build-dependencies 의 tasty-icons(런타임과
# 별개 그래프, FOLDER 아이콘 usvg 베이크용)와는 소비 경로가 다르다.
tasty-icons = { path = "../tasty-icons", default-features = false }

# 빌드타임 SVG → 벡터 베이크(build.rs, 확인 팝업의 FILE/FOLDER 아이콘). usvg 는 host
# egui_extras svg feature 가 이미 Cargo.lock 에 vendored 한 0.37 을 그대로 쓴다 —
# build-dep 라 런타임 바이너리 크기 영향 0. tasty-icons 는 canonical SVG 소스 —
# `default-features=false` 로 egui 를 끈다(build.rs 는 egui 를 링크하지 않는다).
[build-dependencies]
usvg = "0.37"
tasty-icons = { path = "../tasty-icons", default-features = false }

[dev-dependencies]
tasty-plugin-manifest = { path = "../tasty-plugin-manifest" }
# render_document() 회귀 테스트 전용 — 완전한 `ThemeColors` 가 필요한데, 그 타입은
# Default 가 없다(98개 필드). `mocha_fallback_colors()` 는 host 가 부팅 시 최후
# fallback 으로 이미 쓰는 완성된 빌더라 재사용한다(런타임 바이너리엔 안 들어감).
tasty-themes = { path = "../tasty-themes" }
tempfile = "3"

[lints]
workspace = true
