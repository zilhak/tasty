[package]
name = "tasty-plugin-markdown"
version = "0.1.21"
edition = "2024"
license = "MIT"
description = "Markdown viewer surface plugin (egui-mesh)"
repository = "https://github.com/zilhak/tasty"

[[bin]]
name = "tasty-plugin-markdown"
path = "src/main.rs"

[dependencies]
tasty-plugin-sdk = { path = "../tasty-plugin-sdk", features = ["egui-mesh"] }
tasty-plugin-protocol = { path = "../tasty-plugin-protocol" }
# Theme parity — host 가 set_context 로 보낸 ThemeWire(색 집합+is_light+zoom)를
# `Theme::with_colors_and_zoom` 으로 재구성해 디자인 토큰대로 그린다. egui-compat
# (to_egui) 를 켠다 — 이 프로세스는 egui 를 링크하므로.
tasty-type-appearance = { path = "../tasty-type-appearance" }
# typed 간격 헬퍼 (vspace/margin_all) — git-viewer 선례와 동일하게 공용 위젯 crate 직접 의존.
tasty-ui-widgets = { path = "../tasty-ui-widgets" }
# egui_commonmark 는 egui 와 **lockstep** (0.20 ↔ egui 0.31). egui(및 egui-wgpu/
# egui-winit/egui_extras) 를 bump 하기 전에 egui_commonmark 가 그 egui 버전을 지원하는
# 릴리스를 냈는지 crates.io 에서 먼저 확인할 것 — 없으면 egui 업글 보류. 상세:
# docs/dev-guide/dep-issues.md. syntect(better_syntax_highlighting)·이미지(load-images)
# 는 끈다 — 코드 하이라이팅은 egui_extras 내장 경로로 충분하고, 이미지는 후속(TODO 08 bonus).
egui_commonmark = { version = "0.20.0", default-features = false, features = [
    "pulldown_cmark",
] }
# 링크 destination pre-scan 전용 (egui_commonmark 도 내부적으로 같은 0.12 를 쓴다).
pulldown-cmark = { version = "0.12", default-features = false }
webbrowser = "1"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

# host·SDK·protocol 와 동일 egui 인스턴스로 unify (epaint serde OFF + bytemuck ON).
# plugin 이 closure 에서 markdown 위젯을 그리려면 SDK 와 같은 egui 타입이 필요하다 —
# Cargo 가 workspace 전역 0.31 로 통일하므로 mesh 와이어(POD Vertex)가 정합한다.
egui = { version = "0.31", default-features = false, features = [
    "bytemuck",
    "default_fonts",
] }

# 빌드타임 SVG → 벡터 베이크(build.rs). usvg 는 host egui_extras svg feature 가 이미
# Cargo.lock 에 vendored 한 0.37 을 그대로 쓴다 — build-dep 라 런타임 바이너리 크기 영향 0.
# tasty-icons 는 canonical SVG 소스 — `default-features=false` 로 egui 를 끈다(build.rs
# 는 egui 를 링크하지 않는다). host/gallery 런타임 렌더와 바이트 동일한 소스를 베이크.
[build-dependencies]
usvg = "0.37"
tasty-icons = { path = "../tasty-icons", default-features = false }

[dev-dependencies]
tasty-plugin-manifest = { path = "../tasty-plugin-manifest" }

[lints]
workspace = true
