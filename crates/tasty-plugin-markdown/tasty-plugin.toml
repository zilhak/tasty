manifest_version = 1
id = "com.tasty.markdown"
name = "Markdown Viewer"
version = "0.1.0"
description = "Template: markdown viewer surface (host-rendered)"
api_version = "1"
permissions = [
    "surface.read",
    "surface.write",
    "fs.read",
    "file_handler.define",
    "file_handler.handle:markdown",
]
lang_dir = "lang"

[entry]
type = "process"
command = "tasty-plugin-markdown"

# host 가 SurfaceKindDef 를 제공한다 (image plugin 과 동일 패턴).
# 본 plugin 이 활성화되면 host 의 register_markdown 매칭이 plugin 화이트리스트
# 분기로 옮겨가야 한다 — 본 데모에서는 BUILTINS 미등록이라 실행되지 않음.
[[surface_kinds]]
kind = "markdown"
display_name_i18n_key = "surface.kind.markdown"
icon = "📝"
rendering = "host"

# 기존 docs/examples/markdown-plugin/tasty-plugin.toml 의 default_colors 흡수.
# F.H schema 데모 가치 보존.
[surface_kinds.default_colors]
focused_bg = "#1e1e2e"
focused_fg = "#cdd6f4"
unfocused_bg = "#181825"
unfocused_fg = "#a6adc8"

[[contributes.ipc_namespace]]
prefix = "markdown"
description_i18n_key = "markdown.namespace.desc"

# 향후 host 의 default-file-format.toml 에서 markdown detector 를 떼어내고
# 본 plugin 으로 옮길 때 활성화. demo 차원에서는 install 안 됨.
[[contributes.detector]]
id = "markdown"
display_name_i18n_key = "file_handler.format.markdown"
[[contributes.detector.rule]]
kind = "extension"
values = ["md", "markdown"]

[[contributes.handler]]
id = "viewer"
detector = "markdown"
priority = 50
display_name_i18n_key = "file_handler.host.markdown-viewer"
[contributes.handler.action]
kind = "open_surface"
surface_kind = "markdown"
param_key = "file"

[[contributes.cli]]
name = "markdown"
description = "Markdown viewer commands (template)"
description_i18n_key = "markdown.cli.desc"
subcommands = [
    { name = "reload", ipc_method = "markdown.reload", args = "reload_args", description = "Force reload the markdown surface from disk" },
]

[contributes.cli.arg_groups.reload_args]
flags = [
    { name = "surface", type = "u32", flag = "--surface", required = true, help = "Target surface ID" },
]
