manifest_version = 1
id = "com.tasty.markdown"
name = "Markdown Viewer"
version = "0.1.77"
description = "Markdown viewer surface (webview)"
api_version = "1"
permissions = [
    "surface.read",
    "surface.write",
    "fs.read",
    "file_handler.define",
    "file_handler.handle:markdown",
    "ui.settings_page",
    # 대용량 파일 확인 팝업(egui-mesh)을 자가 렌더한다.
    "ui.popup",
]
# 대용량 파일 감지 시 plugin 이 발행하는 이벤트(→ host fire_popup_triggers → 확인 팝업).
# 크기 감지는 plugin in-process — host 는 파일 크기를 stat 하지 않는다(크기게이트 plugin 소유).
event_publish = ["com.tasty.markdown.large_file_confirm"]
# webview-kind surface 는 `surface.set_context` 를 받지 않아 Theme 변경이 자동으로
# 밀리지 않는다(host_api/webview.rs::handle_theme_query 문서 참조) — 이 구독으로 색이
# 바뀔 때마다 문서를 재생성한다.
event_subscribe = ["theme.changed"]
lang_dir = "lang"

[entry]
type = "process"
command = "tasty-plugin-markdown"

# webview: host 가 native OS WebView overlay 를 생성해 이 kind 의 surface 를 덮는다
# (Stage B, ADR-0028 B1 을 대체). plugin 은 markdown → sanitize 된 HTML 문서를 만들어
# `webview.set_url` 로 전달할 뿐, 실제 픽셀은 host WebView 가 그린다. 대용량 파일/파일열기
# 확인 팝업만 여전히 egui-mesh 로 자가 렌더(아래 `[[contributes.popup]]`).
[[surface_kinds]]
kind = "markdown"
display_name_i18n_key = "surface.kind.markdown"
icon = "markdown"
rendering = "webview"
# capability: 줌 단축키가 host WebView 의 `HtmlWebViewSettings.zoom_percent` 를 조절한다
# (src/adapters/ui/input/shortcuts/zoom.rs). `egui_copy` 는 없다 — 선택 텍스트 복사는
# native WebView 가 Ctrl+C 를 자체 처리한다(egui `Event::Copy` 주입 대상 mesh 가 없다).
zoomable = true
# 옛 caller 가 `file_path` 로 넘겨도 host 가 canonical `file` 키로 정규화한다.
# 본체의 `kind == "markdown"` 정규화 하드코딩을 대체(generic-kind 마이그레이션).
param_aliases = { file_path = "file" }
# 자동 탭 명명: `file` 값의 basename 을 표시명으로(예: README.md). 본체의
# `kind == "markdown"` basename 명명 하드코딩을 대체(generic-kind 마이그레이션).
name_from_param = "file"
# 대용량 파일(>1MB) 확인은 **plugin 이 소유**한다: plugin 이 in-process 로 크기를 감지해
# read 를 보류하고 large-file 이벤트를 발행 → 아래 `[[contributes.popup]]` 확인 팝업을
# 연다. host 는 파일 크기를 stat 하지 않는다(옛 `size_confirm_limit` 게이트 제거).
# 파일로 열 때 host 의 "최근 연 파일" 목록에 기록. 본체의 `kind == "markdown"` recent
# 기록 하드코딩을 대체(generic per-kind). 주소창 드롭다운이 `recent.query` 로 조회.
records_recent = true
# convert 시 host 가 어느 파일을 열지 물어야 한다 → 즉시 빈 params 변환 대신 아래
# `file-open` 팝업을 연다. host 는 markdown 을 모르고 이 두 필드(capability + popup 참조)
# 로만 convert 라우팅을 판정한다(본체 `kind == "markdown"` convert 분기 제거).
convert_requires_input = true
convert_input_popup = "file-open"

# 프리셋 편집기가 이 kind 를 편집할 때 노출할 필드. 작업 디렉토리 대신 파일 경로를
# 입력받고, 적용 시 그 파일의 폴더를 cwd 로 파생한다(derive_cwd).
[[surface_kinds.preset_fields]]
id = "file"
label_key = "preset.field.file"
param_key = "file"
input_type = "file_path"
required = true
placeholder_key = "preset.field.file_hint"
derive_cwd = true

# default_colors: F.H schema 데모.
[surface_kinds.default_colors]
focused_bg = "#11111b"   # = crust, mocha.toml [surfaces.markdown].focused_bg 와 lockstep
focused_fg = "#cdd6f4"
unfocused_bg = "#181825"
unfocused_fg = "#a6adc8"

[[contributes.ipc_namespace]]
prefix = "markdown"
description_i18n_key = "markdown.namespace.desc"

# 대용량 파일 확인 팝업. plugin 이 크기 초과를 in-process 로 감지해 발행한
# `com.tasty.markdown.large_file_confirm` 이벤트로 열린다(event trigger). 콘텐츠
# (파일명·크기 태그·[취소]/[열기])는 plugin 이 egui-mesh 로 자가 렌더하고, 셸(scrim/
# border/outside-click/Esc)은 host 소유(ADR-0028). [열기] 시 plugin 이 read 를 재개한다.
[[contributes.popup]]
id = "large-file-confirm"
trigger = { kind = "event", event_key = "com.tasty.markdown.large_file_confirm" }
rendering = "egui-mesh"
size_hint = { width = 360, height = 150 }
anchor = "screen-center"
dismiss_on_outside_click = true

# 파일열기 폼(경로 입력 + browse + 열기/취소). host 는 `[[surface_kinds]]
# convert_input_popup = "file-open"` 을 보고 convert/open 진입점에서 이 팝업을
# `open_popup_instance` 로 직접 연다(context 에 convert 대상 surface_id 를 실으면 제자리
# 변환, 없으면 새 탭). event_key trigger 도 남겨 두어 host 이벤트 발행 경로도 지원한다.
# browse 는 host 소유 file_picker popup(`file_picker.trigger`)으로 위임, 열기는 surface_id
# 유무로 분기한다:
# 있으면 `markdown.navigate`(제자리), 없으면 `file_handler.dispatch`(새 탭).
[[contributes.popup]]
id = "file-open"
trigger = { kind = "event", event_key = "com.tasty.markdown.file_open" }
rendering = "egui-mesh"
size_hint = { width = 420, height = 170 }
anchor = "screen-center"
dismiss_on_outside_click = true

[[contributes.detector]]
id = "markdown"
display_name_i18n_key = "file_handler.format.markdown"
[[contributes.detector.rule]]
kind = "extension"
values = ["md", "markdown"]

[[contributes.handler]]
id = "viewer"
detector = "markdown"
priority = 50
display_name_i18n_key = "file_handler.host.markdown-viewer"
[contributes.handler.action]
kind = "open_surface"
surface_kind = "markdown"
param_key = "file"

[[contributes.cli]]
name = "markdown"
description = "Markdown viewer commands"
description_i18n_key = "markdown.cli.desc"
subcommands = [
    { name = "reload", ipc_method = "markdown.reload", args = "reload_args", description = "Force reload the markdown surface from disk" },
    { name = "recent", ipc_method = "markdown.recent", args = "recent_args", description = "List recently opened markdown files (newest first, up to 10)" },
]

[contributes.cli.arg_groups.reload_args]
flags = [
    { name = "surface", type = "u32", flag = "--surface", required = true, help = "Target surface ID" },
]

# recent 조회는 인자 없음 — 빈 그룹이라도 명시적으로 가리켜야 한다(validator). plugin
# 트램폴린이 host 의 generic `recent.query` 를 kind="markdown" 으로 채운다(host 무지).
[contributes.cli.arg_groups.recent_args]
flags = []

[[contributes.settings_pages]]
id = "markdown"
title_key = "settings.subtab.markdown"
category = "appearance"

[[contributes.settings_pages.items]]
kind = "font_override"
id = "font"
label_key = "settings.appearance.font_override"
storage_key = "markdown"
