[package]
name = "tasty-agent"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Agent collaboration primitives: tasks (DAG), barrier, semaphore, lease, reducer, rate-limit (Phase 5)"

[dependencies]
tasty-memory = { path = "../tasty-memory" }
tasty-utils = { path = "../tasty-utils" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
