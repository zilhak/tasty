[package]
name = "tasty-event-store"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "SQLite event journal: stream revisions, atomic batches, durable command identity, effect records, snapshots"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
