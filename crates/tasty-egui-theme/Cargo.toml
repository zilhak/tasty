[package]
name = "tasty-egui-theme"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "Theme ↔ egui adapter helpers (Visuals/Style apply, hint_text wrapper)"

[dependencies]
egui = "0.31"
# Font validation: the same parser epaint uses, so a file egui would panic on is
# rejected before insertion. Already in the tree transitively via egui/epaint.
ab_glyph = "0.2"
tasty-type-appearance = { path = "../tasty-type-appearance" }
tasty-type-geometry = { path = "../tasty-type-geometry" }
tracing = "0.1"

[lints]
workspace = true
