[package]
name = "tasty-ssh"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "System-ssh delegation for Tasty — ssh process spawn, tunnel lifecycle, remote port discovery, backoff and cancellation"
repository = "https://github.com/zilhak/tasty"

[dependencies]
# Workspace crates
tasty-remote-profiles = { path = "../tasty-remote-profiles" }
tasty-utils = { path = "../tasty-utils" }
tasty-i18n = { path = "../tasty-i18n" }

# Logging
tracing = "0.1"

# Error handling
anyhow = "1"

[dev-dependencies]
# 지연 단정의 대조군(ADR-0181). 이 크레이트의 지연 단정은 자식 프로세스 뒤에 줄 서므로
# spawn 계열 대조군을 쓴다 — 스케줄러 계열은 fork/exec 포화를 못 본다.
tasty-latency-control = { path = "../tasty-latency-control" }

[lints]
workspace = true
