[package]
name = "tasty-ssh"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "System-ssh delegation for Tasty — ssh process spawn, tunnel lifecycle, remote port discovery, backoff and cancellation"
repository = "https://github.com/zilhak/tasty"

[dependencies]
# Workspace crates
tasty-remote-profiles = { path = "../tasty-remote-profiles" }
tasty-utils = { path = "../tasty-utils" }
tasty-i18n = { path = "../tasty-i18n" }
tasty-reaper = { path = "../tasty-reaper" }

# Logging
tracing = "0.1"

# Error handling
anyhow = "1"

[dev-dependencies]
# Windows 상속 시험이 터널 준비 자리의 이음새(socket_inherit::seam)를 켠다.
tasty-utils = { path = "../tasty-utils", features = ["test-support"] }

[lints]
workspace = true
