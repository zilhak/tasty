[package]
name = "tasty-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Tasty CLI — commands/request/run wiring for the `tasty` binary"
repository = "https://github.com/zilhak/zilhak/tasty"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
clap = { version = "4", features = ["derive"] }
toml = "0.8"
tasty-ipc = { path = "../tasty-ipc" }
tasty-terminal = { path = "../tasty-terminal" }
tasty-plugin-manifest = { path = "../tasty-plugin-manifest" }
tasty-plugin-protocol = { path = "../tasty-plugin-protocol" }
tasty-host-plugin = { path = "../tasty-host-plugin" }
tasty-approval = { path = "../tasty-approval" }
tasty-utils = { path = "../tasty-utils" }
tasty-i18n = { path = "../tasty-i18n" }
tasty-remote = { path = "../tasty-remote" }
tasty-remote-profiles = { path = "../tasty-remote-profiles" }
tasty-ssh = { path = "../tasty-ssh" }
# debug-only `tasty debug sim` shares the simulator lib; release dead-code-elims it.
tasty-tui-simulator = { path = "../tasty-tui-simulator" }
tempfile = "3"

[dev-dependencies]
tempfile = "3"
# 소스를 텍스트로 훑는 가드가 "코드에 X 가 있나" 를 물을 때 쓰는 마스킹 판정기.
# dev 전용이라 산출물·의존 폐포에 안 들어간다(plugin version gate 와 층 가드는
# 둘 다 `[dev-dependencies]` 를 보지 않는다). 그 크레이트 자신은 의존 0 이다.
tasty-doc-guards = { path = "../tasty-doc-guards" }

[lints]
workspace = true
