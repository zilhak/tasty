manifest_version = 1
id = "com.tasty.codex"
name = "Codex"
version = "0.1.39"
description = "Codex CLI integration for Tasty"
api_version = "1"
permissions = [
    "surface.read",
    "surface.write",
    "terminal.spawn",
    "terminal.write",
    "terminal.read",
    "fs.write",
    "notification",
    "ui.settings_page",
    # `codex.spawn`/`codex.tell` 기본 완료 전략 선언에 필요.
    "completion_strategy.define",
]
lang_dir = "lang"

[entry]
type = "process"
command = "tasty-plugin-codex"

[[contributes.ipc_namespace]]
prefix = "codex"

# 이 plugin 이 `surface.fire_hook` 로 발사하는 surface hook 이벤트 카탈로그.
# host 가 `hook.set` / `surface.fire_hook` 등록을 (내장 ∪ 활성 plugin 선언) 으로
# 검증하므로, 여기 선언되지 않은 키는 plugin 활성 상태여도 거부된다.
# `process-exit` 은 host 내장 이벤트라 선언 불필요. `needs-input` 에 대응하는
# codex hook 이벤트가 없어(Notification 이벤트 부재) 선언하지 않는다 — 거짓
# 계약을 만들지 않기 위함.
[[contributes.hook_events]]
key = "codex-idle"
description = "Codex instance became idle (Stop hook)"

[[contributes.cli]]
name = "codex"
description = "Codex CLI integration (launch, spawn, kill, tell, etc.)"
description_i18n_key = "codex.cli.desc"
subcommands = [
    { name = "launch",        ipc_method = "codex.launch",        args = "launch_args",        description = "Launch a new workspace and start Codex in its terminal" },
    { name = "spawn",         ipc_method = "codex.spawn",         args = "spawn_args",         description = "Spawn a child Codex instance in a split surface. Returns immediately; a notification is sent to the parent surface every time the child becomes idle, and once more when it exits — not just the first transition." },
    { name = "children",      ipc_method = "codex.children",      args = "children_args",      description = "List children of the specified Codex parent" },
    { name = "parent",        ipc_method = "codex.parent",        args = "parent_args",        description = "Return the parent Codex surface id for a given child surface" },
    { name = "state",         ipc_method = "codex.state",         args = "state_args",         description = "Query a single child's status: idle, needs_input, active, or exited (live-surface cross-checked)" },
    { name = "tell",          ipc_method = "codex.tell",          args = "tell_args",          description = "Send a message to a Codex instance (preserves line breaks, submits at end). Returns immediately; a notification is sent to the caller surface every time the target becomes idle, and once more when it exits — not just the first transition." },
    { name = "notify-caller", ipc_method = "codex.notify_caller", args = "notify_caller_args", description = "Internal: notify caller surface that a spawned/told child changed state, clean up the sibling once-hook, and — if the target surface still exists (i.e. this fire wasn't process-exit) — re-arm the sibling hooks so future transitions keep notifying until the child actually exits. Invoked by hooks registered from spawn/tell — not meant for direct use." },
    { name = "broadcast",     ipc_method = "codex.broadcast",     args = "broadcast_args",     description = "Broadcast text to all children of a parent Codex instance" },
    { name = "kill",          ipc_method = "codex.kill",          args = "kill_args",          description = "Kill a child Codex instance by child index" },
    { name = "respawn",       ipc_method = "codex.respawn",       args = "respawn_args",       description = "Respawn a child Codex instance" },
    { name = "reboot",        ipc_method = "codex.reboot",        args = "reboot_args",        description = "Restart the Codex instance in a surface and resume the same session (delayed kill + codex resume). Call this as the LAST action of a turn — anything after the delay is cut off." },
    { name = "install",       ipc_method = "codex.install",       args = "no_args",            description = "Install Tasty hook into Codex CLI configuration" },
    { name = "uninstall",     ipc_method = "codex.uninstall",     args = "no_args",            description = "Uninstall Tasty hook from Codex CLI configuration" },
    { name = "hook",          ipc_method = "codex.hook",          args = "hook_args",          stdin_json = true, description = "Codex hook integration (called by Codex CLI's hook system). Reads JSON payload from stdin (session_id) when invoked by Codex's hook system." },
]

[contributes.cli.arg_groups.launch_args]
flags = [
    { name = "workspace", type = "string", flag = "--workspace", required = false, help = "Workspace name to create (defaults to \"codex\")" },
    { name = "directory", type = "string", flag = "--directory", required = false, path_kind = "directory", help = "Working directory to cd into before launching codex" },
    { name = "task",      type = "string", flag = "--task",      required = false, help = "Initial task passed to codex as --task <text>" },
    { name = "approval",  type = "string", flag = "--approval",  required = false, help = "Approval policy (untrusted|on-request|never). Overrides the default_approval_policy setting for this call only. Already defaults to 'never' when unset — pass this only to choose a different (interactive) policy" },
    { name = "sandbox",   type = "string", flag = "--sandbox",   required = false, help = "Sandbox mode (read-only|workspace-write|danger-full-access). Overrides the default_sandbox_mode setting for this call only" },
    { name = "full_auto", type = "bool",   flag = "--full-auto", required = false, help = "Bypass approvals and sandbox entirely (--dangerously-bypass-approvals-and-sandbox). Cannot be combined with --approval/--sandbox" },
]

[contributes.cli.arg_groups.parent_args]
flags = [
    { name = "surface", type = "u32", flag = "--surface", required = false, help = "Child Codex surface ID to look up the parent of (defaults to caller's TASTY_SURFACE_ID)" },
]

[contributes.cli.arg_groups.state_args]
flags = [
    { name = "surface", type = "u32", flag = "--surface", required = false, help = "Child Codex surface ID to query (defaults to caller's TASTY_SURFACE_ID)" },
]

[contributes.cli.arg_groups.tell_args]
positional = [
    { name = "message", type = "string", required = true, help = "Message text to send. Newlines are preserved; the message is submitted automatically." },
]
flags = [
    { name = "surface",        type = "u32", flag = "--surface",        required = false, help = "Target Codex surface ID to send the message to (defaults to caller's TASTY_SURFACE_ID)" },
    { name = "caller_surface", type = "u32", flag = "--caller-surface", required = false, help = "Surface ID to notify when the target reaches a terminal state (defaults to caller's TASTY_SURFACE_ID)" },
]

[contributes.cli.arg_groups.spawn_args]
flags = [
    { name = "surface",   type = "u32",    flag = "--surface",   required = false, help = "Parent surface ID (defaults to the focused Codex surface)" },
    { name = "workspace", type = "string", flag = "--workspace", required = true,  help = "Target workspace (ID or name)" },
    { name = "pane",      type = "u32",    flag = "--pane",      required = false, help = "Target pane ID (defaults to the first pane in the workspace)" },
    { name = "cwd",       type = "string", flag = "--cwd",       required = false, path_kind = "directory", help = "Working directory for the child Codex process" },
    { name = "prompt",    type = "string", flag = "--prompt",    required = false, help = "Initial prompt sent to the child after spawn" },
    { name = "role",      type = "string", flag = "--role",      required = false, help = "Role label attached to the child (used by broadcast --role)" },
    { name = "nickname",  type = "string", flag = "--nickname",  required = false, help = "Display nickname shown on the tab" },
    { name = "approval",  type = "string", flag = "--approval",  required = false, help = "Approval policy (untrusted|on-request|never). Overrides the default_approval_policy setting for this call only. Already defaults to 'never' when unset, so unattended automation is never stalled by an approval prompt — pass this only to opt into an interactive policy" },
    { name = "sandbox",   type = "string", flag = "--sandbox",   required = false, help = "Sandbox mode (read-only|workspace-write|danger-full-access). Overrides the default_sandbox_mode setting for this call only — use \"read-only\" for review/crosscheck children that must not write files" },
    { name = "full_auto", type = "bool",   flag = "--full-auto", required = false, help = "Bypass approvals and sandbox entirely (--dangerously-bypass-approvals-and-sandbox). Cannot be combined with --approval/--sandbox" },
]

[contributes.cli.arg_groups.children_args]
flags = [
    { name = "surface", type = "u32", flag = "--surface", required = false, help = "Parent surface ID (defaults to the focused Codex surface)" },
]

[contributes.cli.arg_groups.notify_caller_args]
flags = [
    { name = "caller", type = "u32",    flag = "--caller", required = true, help = "Surface ID to notify" },
    { name = "target",  type = "u32",   flag = "--target", required = true, help = "Surface ID that completed" },
    { name = "kind",    type = "string", flag = "--kind",  required = true, help = "spawn | tell" },
]

[contributes.cli.arg_groups.broadcast_args]
positional = [
    { name = "text", type = "string", required = true, help = "Text to broadcast. Use \\r to submit (e.g. \"hello\\r\")" },
]
flags = [
    { name = "surface", type = "u32",    flag = "--surface", required = false, help = "Parent surface ID (defaults to the focused Codex surface)" },
    { name = "role",    type = "string", flag = "--role",    required = false, help = "Only send to children with this role label" },
]

[contributes.cli.arg_groups.kill_args]
flags = [
    { name = "surface", type = "u32", flag = "--surface", required = false, help = "Parent surface ID (defaults to the focused Codex surface)" },
    { name = "child",   type = "u32", flag = "--child",   required = true,  help = "Child index to kill" },
]

[contributes.cli.arg_groups.respawn_args]
flags = [
    { name = "surface",   type = "u32",    flag = "--surface",   required = false, help = "Parent surface ID (defaults to the focused Codex surface)" },
    { name = "child",     type = "u32",    flag = "--child",     required = true,  help = "Child index to respawn" },
    { name = "cwd",       type = "string", flag = "--cwd",       required = false, path_kind = "directory", help = "Override working directory for the respawned process" },
    { name = "prompt",    type = "string", flag = "--prompt",    required = false, help = "Initial prompt sent to the respawned child" },
    { name = "role",      type = "string", flag = "--role",      required = false, help = "Replace the role label of the child" },
    { name = "nickname",  type = "string", flag = "--nickname",  required = false, help = "Replace the display nickname of the child" },
    { name = "approval",  type = "string", flag = "--approval",  required = false, help = "Approval policy (untrusted|on-request|never). Overrides the default_approval_policy setting for this call only. Already defaults to 'never' when unset — pass this only to choose a different (interactive) policy" },
    { name = "sandbox",   type = "string", flag = "--sandbox",   required = false, help = "Sandbox mode (read-only|workspace-write|danger-full-access). Overrides the default_sandbox_mode setting for this call only" },
    { name = "full_auto", type = "bool",   flag = "--full-auto", required = false, help = "Bypass approvals and sandbox entirely (--dangerously-bypass-approvals-and-sandbox). Cannot be combined with --approval/--sandbox" },
]

[contributes.cli.arg_groups.reboot_args]
flags = [
    { name = "surface",   type = "u32",    flag = "--surface",   required = false, help = "Target Codex surface ID (defaults to caller's TASTY_SURFACE_ID)" },
    { name = "delay",     type = "u32",    flag = "--delay",     required = false, help = "Seconds to wait before killing Codex (default: 5)" },
    { name = "prompt",    type = "string", flag = "--prompt",    required = false, help = "Extra text appended to the reboot notice prompt sent to the restarted Codex" },
    { name = "approval",  type = "string", flag = "--approval",  required = false, help = "Approval policy for the resumed session (untrusted|on-request|never). Overrides the default_approval_policy setting for this call only. Already defaults to 'never' when unset — pass this only to choose a different (interactive) policy" },
    { name = "sandbox",   type = "string", flag = "--sandbox",   required = false, help = "Sandbox mode for the resumed session (read-only|workspace-write|danger-full-access). Overrides the default_sandbox_mode setting for this call only" },
    { name = "full_auto", type = "bool",   flag = "--full-auto", required = false, help = "Bypass approvals and sandbox entirely (--dangerously-bypass-approvals-and-sandbox). Cannot be combined with --approval/--sandbox" },
]

[contributes.cli.arg_groups.hook_args]
positional = [
    { name = "event", type = "string", required = true, help = "Hook event name (e.g. stop, notification, prompt-submit, session-start)" },
]
flags = [
    { name = "surface", type = "u32",    flag = "--surface", required = false, help = "Surface ID the hook is firing for" },
    { name = "session", type = "string", flag = "--session", required = false, stdin_field = "session_id", help = "Codex session ID. Auto-populated from stdin JSON 'session_id' when Codex invokes the hook." },
]

[contributes.cli.arg_groups.no_args]

# 완료 판정 전략 — `codex.spawn` 의 기본 완료 판정(결정 6).
# poll_method 는 owner 자기 namespace 로만 제한되므로(결정 2) 호스트
# `terminal.state`(결정 3, terminal namespace 소유)를 직접 참조할 수 없다 —
# 그래서 이 plugin 자신의 `codex.state`(그 위에 얇게 위임하는 wrapper,
# handlers.rs 참고)를 poll_method 로 둔다. `needs_input` 을 terminal 목록에
# 넣지 않는 이유는 codex 에 대응하는 hook 이벤트가 없어(위 hook_events 주석
# 참고) registry 에 그 상태가 실제로 설정될 일이 없기 때문이다 — 거짓 계약을
# 만들지 않는다.
[[contributes.completion_strategy]]
id = "spawn-wait"
priority = 100
default_for_methods = ["codex.spawn"]

[contributes.completion_strategy.spec]
kind = "poll"
poll_method = "codex.state"
# `codex.spawn` 응답의 `child_surface_id` 를 poll 호출(`codex.state`) 의
# 필수 파라미터 `surface` 로 옮긴다 — claude 와 키 이름이 다르다
# (`handlers.rs` 의 `require_u32(&params, "surface")`). 매핑이 없으면
# poll params 가 비어 매 tick 실패한다.
map_from_response = { child_surface_id = "surface" }
state_field = "state"
terminal_states = ["idle"]
# `exited` 는 성공이 아니다 — 자식 프로세스가 죽었거나 surface 가 사라진 것이라,
# 그 산출물을 전제로 downstream 이 진행하면 틀린다. 실패로 종결시켜야 그 노드의
# `on_failure`(abort / continue_downstream / fallback)가 비로소 동작한다.
failure_states = ["exited"]

# 완료 판정 전략 — `codex.tell` 의 기본 완료 판정(결정 6).
# 이게 없으면 `tell` 노드는 dispatch 응답만 보고 즉시 성공한다 — 자식이 메시지를
# 받기만 하면 끝난 것으로 처리돼, 일을 시작하기도 전에 downstream 이 출발한다.
# spawn-wait 와 같은 이유로 poll_method 는 자기 namespace 의 `codex.state` 이고,
# 같은 이유로 `needs_input` 은 terminal 목록에 넣지 않는다(대응 hook 이벤트가
# 없어 registry 에 설정될 일이 없다 — 거짓 계약을 만들지 않는다).
#
# spawn 과 달리 tell 은 **이미 존재하는** 자식을 대상으로 하므로 시작 시점의
# registry 상태가 직전 턴의 `idle` 로 오염돼 있을 수 있다. 호스트 `terminal.tell`
# 이 본문 주입 성공 직후 그 플래그를 내리므로(`clear_idle_for_new_prompt`,
# `src/adapters/ipc/handler/terminal.rs`) 첫 tick 이 stale idle 을 읽지 않는다 —
# 그 호스트 동작이 이 전략의 전제다.
[[contributes.completion_strategy]]
id = "tell-wait"
priority = 100
default_for_methods = ["codex.tell"]

[contributes.completion_strategy.spec]
kind = "poll"
poll_method = "codex.state"
# `codex.tell` 은 호스트 `terminal.tell` 의 응답을 그대로 돌려주고, 그 응답은
# `{"sent": true, "surface_id": <n>}` 이다 — spawn 과 달리 소스 키가
# `child_surface_id` 가 아니라 `surface_id` 다. 대상 키는 claude 와 달리
# `surface` 다(`handlers.rs` 의 `require_u32(&params, "surface")`).
map_from_response = { surface_id = "surface" }
state_field = "state"
terminal_states = ["idle"]
# `exited` 는 성공이 아니다 — 자식 프로세스가 죽었거나 surface 가 사라진 것이라,
# 그 산출물을 전제로 downstream 이 진행하면 틀린다. 실패로 종결시켜야 그 노드의
# `on_failure`(abort / continue_downstream / fallback)가 비로소 동작한다.
failure_states = ["exited"]

[[contributes.settings_pages]]
id = "codex"
title_key = "settings.subtab.codex"
category = "plugin"

[[contributes.settings_pages.items]]
kind = "number"
id = "spawn_child_warn_threshold"
label_key = "codex.settings.spawn_child_warn_threshold"
storage_key = "spawn_child_warn_threshold"
default = 6.0
min = 1.0

[[contributes.settings_pages.items]]
kind = "select"
id = "default_approval_policy"
label_key = "codex.settings.default_approval_policy"
storage_key = "default_approval_policy"
# "inherit"(또는 미설정)을 골라도 런타임은 무조건 "never"로 해석한다(핸들러의
# resolve_policy_args 하드코드 기본값 — 승인 프롬프트가 무인 spawn 자식을 영구 정지시키는
# 문제 재발 방지). 이 select 의 기본 선택도 실제 동작과 일치하도록 "never"로 둔다.
default = "never"
options = [
    { value = "inherit",    label_key = "codex.settings.approval.inherit" },
    { value = "untrusted",  label_key = "codex.settings.approval.untrusted" },
    { value = "on-request", label_key = "codex.settings.approval.on_request" },
    { value = "never",      label_key = "codex.settings.approval.never" },
]

[[contributes.settings_pages.items]]
kind = "select"
id = "default_sandbox_mode"
label_key = "codex.settings.default_sandbox_mode"
storage_key = "default_sandbox_mode"
default = "inherit"
options = [
    { value = "inherit",             label_key = "codex.settings.sandbox.inherit" },
    { value = "read-only",           label_key = "codex.settings.sandbox.read_only" },
    { value = "workspace-write",     label_key = "codex.settings.sandbox.workspace_write" },
    { value = "danger-full-access",  label_key = "codex.settings.sandbox.danger_full_access" },
]
