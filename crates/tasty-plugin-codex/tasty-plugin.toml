manifest_version = 1
id = "com.tasty.codex"
name = "Codex"
version = "0.1.10"
description = "Codex CLI integration for Tasty"
api_version = "1"
permissions = [
    "surface.read",
    "surface.write",
    "terminal.spawn",
    "terminal.write",
    "terminal.read",
    "fs.write",
    "notification",
]
lang_dir = "lang"

[entry]
type = "process"
command = "tasty-plugin-codex"

[[contributes.ipc_namespace]]
prefix = "codex"

[[contributes.cli]]
name = "codex"
description = "Codex CLI integration (launch, spawn, kill, wait, etc.)"
description_i18n_key = "codex.cli.desc"
subcommands = [
    { name = "launch",    ipc_method = "codex.launch",    args = "launch_args",    description = "Launch a new workspace and start Codex in its terminal" },
    { name = "spawn",     ipc_method = "codex.spawn",     args = "spawn_args",     auto_wait = { method = "codex.wait", map_from_response = { child_index = "child" }, map_from_request = { surface = "surface" }, polling = { state_field = "state", terminal_states = ["idle", "needs_input", "exited", "untrusted"], interval_ms = 500, timeout_field = "timeout" } }, description = "Spawn a child Codex instance in a split surface. Auto-waits until the child becomes idle / needs_input / exited; pass --no-wait for legacy fire-and-forget." },
    { name = "children",  ipc_method = "codex.children",  args = "children_args",  description = "List children of the specified Codex parent" },
    { name = "parent",    ipc_method = "codex.parent",    args = "parent_args",    description = "Return the parent Codex surface id for a given child surface" },
    { name = "tell",      ipc_method = "codex.tell",      args = "tell_args",      auto_wait = { method = "codex.wait_by_surface", map_from_request = { surface = "surface" }, polling = { state_field = "state", terminal_states = ["idle", "needs_input", "exited", "untrusted"], interval_ms = 500, timeout_field = "timeout" } }, description = "Send a message to a Codex instance (preserves line breaks, submits at end). Auto-waits until the target becomes idle / needs_input / exited; pass --no-wait for legacy fire-and-forget." },
    { name = "wait",      ipc_method = "codex.wait",      args = "wait_args",      polling = { state_field = "state", terminal_states = ["idle", "needs_input", "exited", "untrusted"], interval_ms = 500, timeout_field = "timeout" }, description = "Wait for a child Codex instance to become idle / needs_input / exited (returns untrusted with instructions if codex hooks haven't been approved yet)" },
    { name = "broadcast", ipc_method = "codex.broadcast", args = "broadcast_args", description = "Broadcast text to all children of a parent Codex instance" },
    { name = "kill",      ipc_method = "codex.kill",      args = "kill_args",      description = "Kill a child Codex instance by child index" },
    { name = "respawn",   ipc_method = "codex.respawn",   args = "respawn_args",   description = "Respawn a child Codex instance" },
    { name = "install",   ipc_method = "codex.install",   args = "no_args",        description = "Install Tasty hook into Codex CLI configuration" },
    { name = "uninstall", ipc_method = "codex.uninstall", args = "no_args",        description = "Uninstall Tasty hook from Codex CLI configuration" },
    { name = "hook",      ipc_method = "codex.hook",      args = "hook_args",      stdin_json = true, description = "Codex hook integration (called by Codex CLI's hook system). Reads JSON payload from stdin (session_id) when invoked by Codex's hook system." },
]

[contributes.cli.arg_groups.launch_args]
flags = [
    { name = "workspace", type = "string", flag = "--workspace", required = false, help = "Workspace name to create (defaults to \"codex\")" },
    { name = "directory", type = "string", flag = "--directory", required = false, path_kind = "directory", help = "Working directory to cd into before launching codex" },
    { name = "task",      type = "string", flag = "--task",      required = false, help = "Initial task passed to codex as --task <text>" },
]

[contributes.cli.arg_groups.parent_args]
flags = [
    { name = "surface", type = "u32", flag = "--surface", required = false, help = "Child Codex surface ID to look up the parent of (defaults to caller's TASTY_SURFACE_ID)" },
]

[contributes.cli.arg_groups.tell_args]
positional = [
    { name = "message", type = "string", required = true, help = "Message text to send. Newlines are preserved; the message is submitted automatically." },
]
flags = [
    { name = "surface", type = "u32",  flag = "--surface", required = false, help = "Target Codex surface ID to send the message to (defaults to caller's TASTY_SURFACE_ID)" },
    { name = "no_wait", type = "bool", flag = "--no-wait", required = false, help = "Skip the automatic wait — return immediately after tell (legacy fire-and-forget)" },
    { name = "timeout", type = "u32",  flag = "--timeout", required = false, help = "Auto-wait timeout in seconds (omit means wait forever)" },
]

[contributes.cli.arg_groups.spawn_args]
flags = [
    { name = "surface",   type = "u32",    flag = "--surface",   required = false, help = "Parent surface ID (defaults to the focused Codex surface)" },
    { name = "workspace", type = "string", flag = "--workspace", required = true,  help = "Target workspace (ID or name)" },
    { name = "pane",      type = "u32",    flag = "--pane",      required = false, help = "Target pane ID (defaults to the first pane in the workspace)" },
    { name = "cwd",       type = "string", flag = "--cwd",       required = false, path_kind = "directory", help = "Working directory for the child Codex process" },
    { name = "prompt",    type = "string", flag = "--prompt",    required = false, help = "Initial prompt sent to the child after spawn" },
    { name = "role",      type = "string", flag = "--role",      required = false, help = "Role label attached to the child (used by broadcast --role)" },
    { name = "nickname",  type = "string", flag = "--nickname",  required = false, help = "Display nickname shown on the tab" },
    { name = "no_wait",   type = "bool",   flag = "--no-wait",   required = false, help = "Skip the automatic wait — return immediately after spawn (legacy fire-and-forget)" },
    { name = "timeout",   type = "u32",    flag = "--timeout",   required = false, help = "Auto-wait timeout in seconds (omit means wait forever)" },
]

[contributes.cli.arg_groups.children_args]
flags = [
    { name = "surface", type = "u32", flag = "--surface", required = false, help = "Parent surface ID (defaults to the focused Codex surface)" },
]

[contributes.cli.arg_groups.wait_args]
flags = [
    { name = "surface", type = "u32", flag = "--surface", required = false, help = "Parent surface ID (defaults to the focused Codex surface)" },
    { name = "child",   type = "u32", flag = "--child",   required = true,  help = "Child index returned by `codex children` / `codex spawn`" },
    { name = "timeout", type = "u32", flag = "--timeout", required = false, help = "Timeout in seconds (no default — omit means wait forever)" },
]

[contributes.cli.arg_groups.broadcast_args]
positional = [
    { name = "text", type = "string", required = true, help = "Text to broadcast. Use \\r to submit (e.g. \"hello\\r\")" },
]
flags = [
    { name = "surface", type = "u32",    flag = "--surface", required = false, help = "Parent surface ID (defaults to the focused Codex surface)" },
    { name = "role",    type = "string", flag = "--role",    required = false, help = "Only send to children with this role label" },
]

[contributes.cli.arg_groups.kill_args]
flags = [
    { name = "surface", type = "u32", flag = "--surface", required = false, help = "Parent surface ID (defaults to the focused Codex surface)" },
    { name = "child",   type = "u32", flag = "--child",   required = true,  help = "Child index to kill" },
]

[contributes.cli.arg_groups.respawn_args]
flags = [
    { name = "surface",  type = "u32",    flag = "--surface",  required = false, help = "Parent surface ID (defaults to the focused Codex surface)" },
    { name = "child",    type = "u32",    flag = "--child",    required = true,  help = "Child index to respawn" },
    { name = "cwd",      type = "string", flag = "--cwd",      required = false, path_kind = "directory", help = "Override working directory for the respawned process" },
    { name = "prompt",   type = "string", flag = "--prompt",   required = false, help = "Initial prompt sent to the respawned child" },
    { name = "role",     type = "string", flag = "--role",     required = false, help = "Replace the role label of the child" },
    { name = "nickname", type = "string", flag = "--nickname", required = false, help = "Replace the display nickname of the child" },
]

[contributes.cli.arg_groups.hook_args]
positional = [
    { name = "event", type = "string", required = true, help = "Hook event name (e.g. stop, notification, prompt-submit, session-start)" },
]
flags = [
    { name = "surface", type = "u32",    flag = "--surface", required = false, help = "Surface ID the hook is firing for" },
    { name = "session", type = "string", flag = "--session", required = false, stdin_field = "session_id", help = "Codex session ID. Auto-populated from stdin JSON 'session_id' when Codex invokes the hook." },
]

[contributes.cli.arg_groups.no_args]
