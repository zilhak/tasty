manifest_version = 1
id = "com.tasty.codex"
name = "Codex"
version = "0.1.92"
description = "Codex CLI integration for Tasty"
api_version = "1"
permissions = [
    "surface.read",
    "surface.write",
    "terminal.spawn",
    "terminal.write",
    "terminal.read",
    "fs.write",
    "notification",
    "ui.settings_page",
    # `codex.spawn`/`codex.tell` 기본 완료 전략 선언에 필요.
    "completion_strategy.define",
]
lang_dir = "lang"

[entry]
type = "process"
command = "tasty-plugin-codex"

[[contributes.ipc_namespace]]
prefix = "codex"

# 호스트가 등록·발생 요청을 검증할 이벤트 목록. 내장 process-exit은 선언하지 않는다.
[[contributes.hook_events]]
key = "codex-idle"
description = "Codex instance became idle (Stop / Interrupt hook)"

[[contributes.hook_events]]
key = "needs-input"
description = "Codex instance is waiting for a user approval (PermissionRequest hook)"

[[contributes.cli]]
name = "codex"
description = "Codex CLI integration (launch, spawn, kill, tell, etc.)"
description_i18n_key = "codex.cli.desc"
subcommands = [
    { name = "launch",        ipc_method = "codex.launch",        args = "launch_args",        description = "Launch a new workspace and start Codex in its terminal", description_i18n_key = "codex.cli.sub.launch.description" },
    { name = "spawn",         ipc_method = "codex.spawn",         args = "spawn_args",         description = "Create a child Codex instance in a split surface. Waits for host responses, then returns without waiting for the child task to finish. Registers hooks for idle, input-wait and exit notifications to the parent.", description_i18n_key = "codex.cli.sub.spawn.description" },
    { name = "children",      ipc_method = "codex.children",      args = "children_args",      description = "List children of the specified Codex parent", description_i18n_key = "codex.cli.sub.children.description" },
    { name = "parent",        ipc_method = "codex.parent",        args = "parent_args",        description = "Return the parent Codex surface id for a given child surface", description_i18n_key = "codex.cli.sub.parent.description" },
    { name = "state",         ipc_method = "codex.state",         args = "state_args",         description = "Query a single child's status: idle, needs_input, active, or exited (live-surface cross-checked)", description_i18n_key = "codex.cli.sub.state.description" },
    { name = "tell",          ipc_method = "codex.tell",          args = "tell_args",          description = "Send a message with line breaks preserved and submit it. Waits for host responses, then returns without waiting for the task to finish. When a caller surface is provided, registers hooks for idle, input-wait and exit notifications.", description_i18n_key = "codex.cli.sub.tell.description" },
    { name = "notify-caller", ipc_method = "codex.notify_caller", args = "notify_caller_args", description = "Internal: report a child state change and remove matching once-hooks. If the target surface can still be found, register the completion hooks again. Called by spawn/tell hooks; not intended for direct use.", description_i18n_key = "codex.cli.sub.notify-caller.description" },
    { name = "broadcast",     ipc_method = "codex.broadcast",     args = "broadcast_args",     description = "Broadcast text to all children of a parent Codex instance", description_i18n_key = "codex.cli.sub.broadcast.description" },
    { name = "kill",          ipc_method = "codex.kill",          args = "kill_args",          description = "Kill a child Codex instance by child index", description_i18n_key = "codex.cli.sub.kill.description" },
    { name = "respawn",       ipc_method = "codex.respawn",       args = "respawn_args",       description = "Respawn a child Codex instance", description_i18n_key = "codex.cli.sub.respawn.description" },
    { name = "reboot",        ipc_method = "codex.reboot",        args = "reboot_args",        description = "Restart the Codex instance in a surface and resume the same session (delayed kill + codex resume). Call this as the LAST action of a turn — anything after the delay is cut off.", description_i18n_key = "codex.cli.sub.reboot.description" },
    { name = "install",       ipc_method = "codex.install",       args = "install_args",            description = "Install Tasty hook into Codex CLI configuration", description_i18n_key = "codex.cli.sub.install.description" },
    { name = "uninstall",     ipc_method = "codex.uninstall",     args = "install_args",            description = "Uninstall Tasty hook from Codex CLI configuration", description_i18n_key = "codex.cli.sub.uninstall.description" },
    { name = "hook",          ipc_method = "codex.hook",          args = "hook_args",          stdin_json = true, description = "Codex hook integration (called by Codex CLI's hook system). Reads JSON payload from stdin (session_id) when invoked by Codex's hook system.", description_i18n_key = "codex.cli.sub.hook.description" },
]

[contributes.cli.arg_groups.launch_args]
flags = [
    { name = "workspace", type = "string", flag = "--workspace", required = false, help = "Workspace name to create (defaults to \"codex\")", help_i18n_key = "codex.cli.arg.launch_args.workspace.help" },
    { name = "directory", type = "string", flag = "--directory", required = false, path_kind = "directory", help = "Working directory to cd into before launching codex", help_i18n_key = "codex.cli.arg.launch_args.directory.help" },
    { name = "task",      type = "string", flag = "--task",      required = false, help = "Initial task passed as the Codex prompt argument", help_i18n_key = "codex.cli.arg.launch_args.task.help" },
    { name = "approval",  type = "string", flag = "--approval",  required = false, help = "Approval policy: untrusted|on-request|never. Overrides default_approval_policy for this call. If omitted, uses that setting; inherit or no setting resolves to never.", help_i18n_key = "codex.cli.arg.launch_args.approval.help" },
    { name = "sandbox",   type = "string", flag = "--sandbox",   required = false, help = "Sandbox mode (read-only|workspace-write|danger-full-access). Overrides the default_sandbox_mode setting for this call only", help_i18n_key = "codex.cli.arg.launch_args.sandbox.help" },
    { name = "full_auto", type = "bool",   flag = "--full-auto", required = false, help = "Bypass approvals and sandbox entirely (--dangerously-bypass-approvals-and-sandbox). Cannot be combined with --approval/--sandbox", help_i18n_key = "codex.cli.arg.launch_args.full_auto.help" },
]

[contributes.cli.arg_groups.parent_args]
flags = [
    { name = "surface", type = "u32", flag = "--surface", required = false, help = "Child Codex surface ID to look up the parent of (defaults to caller's TASTY_SURFACE_ID)", help_i18n_key = "codex.cli.arg.parent_args.surface.help" },
]

[contributes.cli.arg_groups.state_args]
flags = [
    { name = "surface", type = "u32", flag = "--surface", required = false, help = "Child Codex surface ID to query (defaults to caller's TASTY_SURFACE_ID)", help_i18n_key = "codex.cli.arg.state_args.surface.help" },
]

[contributes.cli.arg_groups.tell_args]
positional = [
    { name = "message", type = "string", required = true, help = "Message text to send. Newlines are preserved; the message is submitted automatically.", help_i18n_key = "codex.cli.arg.tell_args.message.help" },
]
flags = [
    { name = "surface",        type = "u32", flag = "--surface",        required = false, help = "Target Codex surface ID to send the message to (defaults to caller's TASTY_SURFACE_ID)", help_i18n_key = "codex.cli.arg.tell_args.surface.help" },
    { name = "caller_surface", type = "u32", flag = "--caller-surface", required = false, help = "Surface ID to notify when the target reaches a terminal state (defaults to caller's TASTY_SURFACE_ID)", help_i18n_key = "codex.cli.arg.tell_args.caller_surface.help" },
]

[contributes.cli.arg_groups.spawn_args]
flags = [
    { name = "surface",   type = "u32",    flag = "--surface",   required = false, help = "Parent surface ID (defaults to the focused Codex surface)", help_i18n_key = "codex.cli.arg.spawn_args.surface.help" },
    { name = "workspace", type = "string", flag = "--workspace", required = true,  help = "Target workspace (ID or name)", help_i18n_key = "codex.cli.arg.spawn_args.workspace.help" },
    { name = "pane",      type = "u32",    flag = "--pane",      required = false, help = "Target pane ID (defaults to the first pane in the workspace)", help_i18n_key = "codex.cli.arg.spawn_args.pane.help" },
    { name = "cwd",       type = "string", flag = "--cwd",       required = false, path_kind = "directory", help = "Working directory for the child Codex process", help_i18n_key = "codex.cli.arg.spawn_args.cwd.help" },
    { name = "prompt",    type = "string", flag = "--prompt",    required = false, help = "Initial prompt sent to the child after spawn", help_i18n_key = "codex.cli.arg.spawn_args.prompt.help" },
    { name = "role",      type = "string", flag = "--role",      required = false, help = "Role label attached to the child (used by broadcast --role)", help_i18n_key = "codex.cli.arg.spawn_args.role.help" },
    { name = "nickname",  type = "string", flag = "--nickname",  required = false, help = "Display nickname shown on the tab", help_i18n_key = "codex.cli.arg.spawn_args.nickname.help" },
    { name = "approval",  type = "string", flag = "--approval",  required = false, help = "Approval policy: untrusted|on-request|never. Overrides default_approval_policy for this call. If omitted, uses that setting; inherit or no setting resolves to never.", help_i18n_key = "codex.cli.arg.spawn_args.approval.help" },
    { name = "sandbox",   type = "string", flag = "--sandbox",   required = false, help = "Sandbox mode (read-only|workspace-write|danger-full-access). Overrides the default_sandbox_mode setting for this call only — use \"read-only\" for review/crosscheck children that must not write files", help_i18n_key = "codex.cli.arg.spawn_args.sandbox.help" },
    { name = "full_auto", type = "bool",   flag = "--full-auto", required = false, help = "Bypass approvals and sandbox entirely (--dangerously-bypass-approvals-and-sandbox). Cannot be combined with --approval/--sandbox", help_i18n_key = "codex.cli.arg.spawn_args.full_auto.help" },
]

[contributes.cli.arg_groups.children_args]
flags = [
    { name = "surface", type = "u32", flag = "--surface", required = false, help = "Parent surface ID (defaults to the focused Codex surface)", help_i18n_key = "codex.cli.arg.children_args.surface.help" },
]

[contributes.cli.arg_groups.notify_caller_args]
flags = [
    { name = "caller", type = "u32",    flag = "--caller", required = true, help = "Surface ID to notify", help_i18n_key = "codex.cli.arg.notify_caller_args.caller.help" },
    { name = "target",  type = "u32",   flag = "--target", required = true, help = "Surface ID that completed", help_i18n_key = "codex.cli.arg.notify_caller_args.target.help" },
    { name = "kind",    type = "string", flag = "--kind",  required = true, help = "spawn | tell", help_i18n_key = "codex.cli.arg.notify_caller_args.kind.help" },
]

[contributes.cli.arg_groups.broadcast_args]
positional = [
    { name = "text", type = "string", required = true, help = "Text to broadcast. Use \\r to submit (e.g. \"hello\\r\")", help_i18n_key = "codex.cli.arg.broadcast_args.text.help" },
]
flags = [
    { name = "surface", type = "u32",    flag = "--surface", required = false, help = "Parent surface ID (defaults to the focused Codex surface)", help_i18n_key = "codex.cli.arg.broadcast_args.surface.help" },
    { name = "role",    type = "string", flag = "--role",    required = false, help = "Only send to children with this role label", help_i18n_key = "codex.cli.arg.broadcast_args.role.help" },
]

[contributes.cli.arg_groups.kill_args]
flags = [
    { name = "surface", type = "u32", flag = "--surface", required = false, help = "Parent surface ID (defaults to the focused Codex surface)", help_i18n_key = "codex.cli.arg.kill_args.surface.help" },
    { name = "child",   type = "u32", flag = "--child",   required = true,  help = "Child index to kill", help_i18n_key = "codex.cli.arg.kill_args.child.help" },
]

[contributes.cli.arg_groups.respawn_args]
flags = [
    { name = "surface",   type = "u32",    flag = "--surface",   required = false, help = "Parent surface ID (defaults to the focused Codex surface)", help_i18n_key = "codex.cli.arg.respawn_args.surface.help" },
    { name = "child",     type = "u32",    flag = "--child",     required = true,  help = "Child index to respawn", help_i18n_key = "codex.cli.arg.respawn_args.child.help" },
    { name = "cwd",       type = "string", flag = "--cwd",       required = false, path_kind = "directory", help = "Override working directory for the respawned process", help_i18n_key = "codex.cli.arg.respawn_args.cwd.help" },
    { name = "prompt",    type = "string", flag = "--prompt",    required = false, help = "Initial prompt sent to the respawned child", help_i18n_key = "codex.cli.arg.respawn_args.prompt.help" },
    { name = "role",      type = "string", flag = "--role",      required = false, help = "Replace the role label of the child", help_i18n_key = "codex.cli.arg.respawn_args.role.help" },
    { name = "nickname",  type = "string", flag = "--nickname",  required = false, help = "Replace the display nickname of the child", help_i18n_key = "codex.cli.arg.respawn_args.nickname.help" },
    { name = "approval",  type = "string", flag = "--approval",  required = false, help = "Approval policy: untrusted|on-request|never. Overrides default_approval_policy for this call. If omitted, uses that setting; inherit or no setting resolves to never.", help_i18n_key = "codex.cli.arg.respawn_args.approval.help" },
    { name = "sandbox",   type = "string", flag = "--sandbox",   required = false, help = "Sandbox mode (read-only|workspace-write|danger-full-access). Overrides the default_sandbox_mode setting for this call only", help_i18n_key = "codex.cli.arg.respawn_args.sandbox.help" },
    { name = "full_auto", type = "bool",   flag = "--full-auto", required = false, help = "Bypass approvals and sandbox entirely (--dangerously-bypass-approvals-and-sandbox). Cannot be combined with --approval/--sandbox", help_i18n_key = "codex.cli.arg.respawn_args.full_auto.help" },
]

[contributes.cli.arg_groups.reboot_args]
flags = [
    { name = "surface",   type = "u32",    flag = "--surface",   required = false, help = "Target Codex surface ID (defaults to caller's TASTY_SURFACE_ID)", help_i18n_key = "codex.cli.arg.reboot_args.surface.help" },
    { name = "delay",     type = "u32",    flag = "--delay",     required = false, help = "Seconds to wait before killing Codex (default: 5)", help_i18n_key = "codex.cli.arg.reboot_args.delay.help" },
    { name = "prompt",    type = "string", flag = "--prompt",    required = false, help = "Extra text appended to the reboot notice prompt sent to the restarted Codex", help_i18n_key = "codex.cli.arg.reboot_args.prompt.help" },
    { name = "approval",  type = "string", flag = "--approval",  required = false, help = "Approval policy: untrusted|on-request|never. Overrides default_approval_policy for this call. If omitted, uses that setting; inherit or no setting resolves to never.", help_i18n_key = "codex.cli.arg.reboot_args.approval.help" },
    { name = "sandbox",   type = "string", flag = "--sandbox",   required = false, help = "Sandbox mode for the resumed session (read-only|workspace-write|danger-full-access). Overrides the default_sandbox_mode setting for this call only", help_i18n_key = "codex.cli.arg.reboot_args.sandbox.help" },
    { name = "full_auto", type = "bool",   flag = "--full-auto", required = false, help = "Bypass approvals and sandbox entirely (--dangerously-bypass-approvals-and-sandbox). Cannot be combined with --approval/--sandbox", help_i18n_key = "codex.cli.arg.reboot_args.full_auto.help" },
]

[contributes.cli.arg_groups.hook_args]
positional = [
    { name = "event", type = "string", required = true, help = "Hook event name: stop, prompt-submit, session-start, permission-request, post-tool-use, interrupt, session-end", help_i18n_key = "codex.cli.arg.hook_args.event.help" },
]
flags = [
    { name = "surface", type = "u32",    flag = "--surface", required = false, help = "Surface ID the hook is firing for", help_i18n_key = "codex.cli.arg.hook_args.surface.help" },
    { name = "session", type = "string", flag = "--session", required = false, stdin_field = "session_id", help = "Codex session ID. Auto-populated from stdin JSON 'session_id' when Codex invokes the hook.", help_i18n_key = "codex.cli.arg.hook_args.session.help" },
]

[contributes.cli.arg_groups.no_args]

# 완료 전략은 같은 namespace의 codex.state를 조회한다.
# needs_input은 사용자 응답 대기이므로 작업 완료로 처리하지 않는다.
[[contributes.completion_strategy]]
id = "spawn-wait"
priority = 100
default_for_methods = ["codex.spawn"]

[contributes.completion_strategy.spec]
kind = "poll"
poll_method = "codex.state"
# spawn 응답의 자식 ID를 상태 조회의 surface 인자로 전달한다.
map_from_response = { child_surface_id = "surface" }
state_field = "state"
terminal_states = ["idle"]
# exited는 실패로 종료해 작업의 on_failure 정책을 적용한다.
failure_states = ["exited"]

# tell도 전달 접수 뒤 idle까지 기다린다.
# 이전 턴의 idle을 읽지 않도록 호스트가 새 프롬프트 전달 때 상태를 초기화해야 한다.
[[contributes.completion_strategy]]
id = "tell-wait"
priority = 100
default_for_methods = ["codex.tell"]

[contributes.completion_strategy.spec]
kind = "poll"
poll_method = "codex.state"
# tell 응답의 surface_id를 상태 조회의 surface 인자로 전달한다.
map_from_response = { surface_id = "surface" }
state_field = "state"
terminal_states = ["idle"]
# exited는 실패로 종료해 작업의 on_failure 정책을 적용한다.
failure_states = ["exited"]

[[contributes.settings_pages]]
id = "codex"
title_key = "settings.subtab.codex"
category = "plugin"

[[contributes.settings_pages.items]]
kind = "number"
id = "spawn_child_warn_threshold"
label_key = "codex.settings.spawn_child_warn_threshold"
storage_key = "spawn_child_warn_threshold"
default = 6.0
min = 1.0

[[contributes.settings_pages.items]]
kind = "select"
id = "default_approval_policy"
label_key = "codex.settings.default_approval_policy"
storage_key = "default_approval_policy"
# 승인 설정이 inherit이거나 없을 때도 핸들러의 최종 기본값은 never다.
default = "never"
options = [
    { value = "inherit",    label_key = "codex.settings.approval.inherit" },
    { value = "untrusted",  label_key = "codex.settings.approval.untrusted" },
    { value = "on-request", label_key = "codex.settings.approval.on_request" },
    { value = "never",      label_key = "codex.settings.approval.never" },
]

[[contributes.settings_pages.items]]
kind = "select"
id = "default_sandbox_mode"
label_key = "codex.settings.default_sandbox_mode"
storage_key = "default_sandbox_mode"
default = "inherit"
options = [
    { value = "inherit",             label_key = "codex.settings.sandbox.inherit" },
    { value = "read-only",           label_key = "codex.settings.sandbox.read_only" },
    { value = "workspace-write",     label_key = "codex.settings.sandbox.workspace_write" },
    { value = "danger-full-access",  label_key = "codex.settings.sandbox.danger_full_access" },
]

[contributes.cli.arg_groups.install_args]
flags = [{ name = "config_file", type = "string", flag = "--config-file", required = false, path_kind = "file", help = "Exact profile/config file to update; mutually exclusive with --codex-home", help_i18n_key = "codex.cli.arg.install_args.config_file.help" }, { name = "codex_home", type = "string", flag = "--codex-home", required = false, path_kind = "directory", help = "Codex home whose hooks to install/remove; must match the intended daemon", help_i18n_key = "codex.cli.arg.install_args.codex_home.help" }]
