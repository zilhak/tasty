manifest_version = 1
id = "com.tasty.codex"
name = "Codex"
version = "0.1.0"
description = "Codex CLI integration for Tasty"
api_version = "1"
permissions = [
    "surface.read",
    "surface.write",
    "terminal.spawn",
    "terminal.write",
    "terminal.read",
    "fs.write",
    "notification",
]
lang_dir = "lang"

[entry]
type = "process"
command = "tasty-plugin-codex"

[[surface_kinds]]
kind = "codex_session"
display_name_i18n_key = "surface.kind.codex_session"
icon = "🤖"

[[contributes.ipc_namespace]]
prefix = "codex"

[[contributes.cli]]
name = "codex"
description_i18n_key = "codex.cli.desc"
subcommands = [
    { name = "spawn",     ipc_method = "codex.spawn",     args = "spawn_args" },
    { name = "children",  ipc_method = "codex.children",  args = "children_args" },
    { name = "wait",      ipc_method = "codex.wait",      args = "wait_args" },
    { name = "broadcast", ipc_method = "codex.broadcast", args = "broadcast_args" },
    { name = "kill",      ipc_method = "codex.kill",      args = "kill_args" },
    { name = "respawn",   ipc_method = "codex.respawn",   args = "respawn_args" },
    { name = "install",   ipc_method = "codex.install",   args = "no_args" },
    { name = "uninstall", ipc_method = "codex.uninstall", args = "no_args" },
    { name = "hook",      ipc_method = "codex.hook",      args = "hook_args" },
]

[contributes.cli.arg_groups.spawn_args]
flags = [
    { name = "surface",  type = "u32",    flag = "--surface",  required = false },
    { name = "cwd",      type = "string", flag = "--cwd",      required = false },
    { name = "prompt",   type = "string", flag = "--prompt",   required = false },
    { name = "role",     type = "string", flag = "--role",     required = false },
    { name = "nickname", type = "string", flag = "--nickname", required = false },
]

[contributes.cli.arg_groups.children_args]
flags = [
    { name = "surface", type = "u32", flag = "--surface", required = false },
]

[contributes.cli.arg_groups.wait_args]
flags = [
    { name = "surface", type = "u32", flag = "--surface", required = false },
    { name = "child",   type = "u32", flag = "--child",   required = true },
]

[contributes.cli.arg_groups.broadcast_args]
positional = [
    { name = "text", type = "string", required = true },
]
flags = [
    { name = "surface", type = "u32",    flag = "--surface", required = false },
    { name = "role",    type = "string", flag = "--role",    required = false },
]

[contributes.cli.arg_groups.kill_args]
flags = [
    { name = "surface", type = "u32", flag = "--surface", required = false },
    { name = "child",   type = "u32", flag = "--child",   required = true },
]

[contributes.cli.arg_groups.respawn_args]
flags = [
    { name = "surface",  type = "u32",    flag = "--surface",  required = false },
    { name = "child",    type = "u32",    flag = "--child",    required = true },
    { name = "cwd",      type = "string", flag = "--cwd",      required = false },
    { name = "prompt",   type = "string", flag = "--prompt",   required = false },
    { name = "role",     type = "string", flag = "--role",     required = false },
    { name = "nickname", type = "string", flag = "--nickname", required = false },
]

[contributes.cli.arg_groups.hook_args]
positional = [
    { name = "event", type = "string", required = true },
]
flags = [
    { name = "surface", type = "u32", flag = "--surface", required = false },
]

[contributes.cli.arg_groups.no_args]
