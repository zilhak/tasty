[package]
name = "tasty-plugin-codex"
version = "0.2.48"
edition = "2024"
license = "MIT"
description = "External Tasty plugin: codex CLI integration"
repository = "https://github.com/zilhak/tasty"

[[bin]]
name = "tasty-plugin-codex"
path = "src/main.rs"

[dependencies]
tasty-plugin-sdk = { path = "../tasty-plugin-sdk" }
tasty-plugin-agent-common = { path = "../tasty-plugin-agent-common" }
tasty-utils = { path = "../tasty-utils" }
# 세션 helper가 띄운 서버를 하위 프로세스까지 정리한다.
tasty-reaper = { path = "../tasty-reaper" }
serde_json = { version = "1", features = ["raw_value"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
# 수신자·이벤트 ID와 WebSocket 마스크에 쓰는 OS 난수.
getrandom = "0.3"
# 완료 키의 claim 파일 이름과 수신자 색인 이름.
sha2 = "0.10"

[dev-dependencies]
tasty-test-support = { path = "../tasty-test-support" }
tempfile = "3"

[lints]
workspace = true
