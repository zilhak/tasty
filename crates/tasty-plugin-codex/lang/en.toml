[codex.cli.arg.kill_args.workspace]
help = "Workspace (ID or name) of the children. Used only when called from a Codex conversation whose children are in more than one workspace"

[codex.cli.arg.kill_args.child]
help = "Child index to kill"

[codex.cli.arg.respawn_args.surface]
help = "Parent surface ID (defaults to caller's TASTY_SURFACE_ID; without it, the only parent when exactly one exists)"

[codex.cli.arg.respawn_args.workspace]
help = "Workspace (ID or name) of the children. Used only when called from a Codex conversation whose children are in more than one workspace"

[codex.cli.arg.respawn_args.child]
