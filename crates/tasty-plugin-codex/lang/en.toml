help = "The assistant's final message of the turn. Auto-populated from stdin JSON 'last_assistant_message' on the Stop hook. When the surface runs a Tasty agent task, it is reported as that turn's final answer."

[codex.cli.sub.result]
description = "Read a child result that was returned to this Codex conversation. Run it from the Codex session that received the reference; reading does not delete the result."

[codex.cli.sub.session-open]
