[codex.cli.arg.respawn_args.approval]
help = "Approval policy: untrusted|on-request|never. Overrides default_approval_policy for this call. If omitted, uses that setting; inherit or no setting resolves to never."

[codex.cli.arg.respawn_args.sandbox]
