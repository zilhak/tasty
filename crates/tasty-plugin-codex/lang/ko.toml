write_failed = "Codex 설정 파일을 쓰지 못했습니다: {detail}"

[codex.cli.sub.launch]
description = "새 워크스페이스를 만들고 터미널에서 Codex 시작"

[codex.cli.sub.spawn]
description = "분할 surface에 자식 Codex를 만듭니다. 호스트 응답을 받은 뒤 반환하며 자식 작업의 완료까지 기다리지는 않습니다. idle·입력 대기·종료를 부모에게 알릴 훅을 등록합니다."

[codex.cli.sub.children]
description = "지정한 Codex 부모의 자식 나열"

[codex.cli.sub.parent]
description = "지정한 자식 서피스의 부모 Codex 서피스 ID 반환"

[codex.cli.sub.state]
description = "자식 하나의 상태 조회: idle, needs_input, active, exited(실제 서피스와 대조)"

[codex.cli.sub.tell]
description = "줄바꿈을 유지해 메시지를 보내고 제출합니다. 호스트 응답을 받은 뒤 반환하며 작업 완료까지 기다리지는 않습니다. 호출자 surface가 있으면 idle·입력 대기·종료 알림 훅을 등록합니다."

[codex.cli.sub.notify-caller]
description = "내부용: 자식의 상태 변화를 알리고 같은 대상·명령의 일회성 훅을 제거합니다. 대상 surface가 여전히 조회되면 완료 훅을 다시 등록합니다. spawn/tell 훅에서 호출하며 직접 사용하지 않습니다."

[codex.cli.sub.broadcast]
description = "부모 Codex 인스턴스의 모든 자식에게 텍스트 일괄 전송"

[codex.cli.sub.kill]
