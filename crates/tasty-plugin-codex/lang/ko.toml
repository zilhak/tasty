surface_conflict = "'surface'와 'surface_id'가 서로 다른 대상을 가리킵니다(surface={surface}, surface_id={surface_id}). 하나만 지정하거나 두 값이 같도록 입력하세요."
invalid_choice = "'{flag}' 값 '{value}'은 유효하지 않습니다(가능한 값: {valid})"
full_auto_conflict = "'full_auto'는 승인과 샌드박스를 모두 우회하므로 'approval'/'sandbox'와 함께 쓸 수 없습니다"
missing_message = "필수 파라미터 'message'가 없습니다"
missing_text = "필수 파라미터 'text'가 없습니다"
missing_event = "필수 파라미터 'event'가 없습니다"

[codex.hook]
requires_surface = "훅 대상 자식을 지정할 --surface가 필요합니다"
unknown_event = "알 수 없는 hook 이벤트 '{event}'입니다(지원: stop, prompt-submit, session-start, permission-request, post-tool-use, interrupt, session-end)."

[codex.launch]
workspace_create_missing_id = "호스트 workspace.create 응답에 'id'가 없습니다: {resp}"

[codex.spawn]
missing_child_surface_id = "호스트 terminal.spawn 응답에 'child_surface_id'가 없습니다: {resp}"

[codex.respawn]
missing_child_surface_id = "호스트 terminal.respawn 응답에 'child_surface_id'가 없습니다: {resp}"

[codex.install]
read_failed = "Codex 설정을 읽을 수 없습니다: {detail}"
path_conflict = "Codex home과 설정 파일 중 하나만 지정하세요"
