[codex.reboot]
notice = "tasty codex reboot : 이 세션은 tasty 의 reboot 기능으로 재시작되었습니다 (codex resume 으로 동일 세션 resume). 직전 턴이 잘렸을 수 있으니 마지막 작업 상태를 확인하고 이어서 진행하세요."
malformed_session_id = "surface {surface}의 codex-session-id 메타데이터 형식이 잘못됐습니다: {value}"
screen_unreadable = "surface {surface}의 화면을 읽을 수 없습니다"
lock_poisoned = "재시작 진행 상태를 보호하는 잠금에서 이전 패닉이 감지됐습니다: {detail}"
already_in_progress = "surface {surface}의 재시작이 이미 진행 중입니다"
spawn_thread_failed = "재시작 스레드를 만들지 못했습니다: {detail}"
