[codex.cli]
desc = "Codex CLI 자식 세션 관리"

[codex]
"settings.spawn_child_warn_threshold" = "Spawn child 경고 임계치"
"settings.default_approval_policy" = "기본 승인 정책"
"settings.default_sandbox_mode" = "기본 샌드박스 모드"
"settings.approval.inherit" = "상속 (codex 기본값)"
"settings.approval.untrusted" = "Untrusted (신뢰되지 않은 명령만 승인 요청)"
"settings.approval.on_request" = "On request (모델이 판단)"
"settings.approval.never" = "Never (승인 프롬프트 없음)"
"settings.sandbox.inherit" = "상속 (codex 기본값)"
"settings.sandbox.read_only" = "읽기 전용"
"settings.sandbox.workspace_write" = "워크스페이스 쓰기 허용"
"settings.sandbox.danger_full_access" = "위험: 전체 접근"

[codex.spawn_warning]
total = "이 부모 아래에 현재 자식 인스턴스가 {total}개 있다(경고 임계치: {threshold}). 누수된 자식이 없는지 확인하라."
idle = " 인덱스 [{indices}]의 idle 자식은 이미 맡은 작업을 끝냈다 — 새로 spawn 하는 대신 `respawn` 을 고려하라."
stale = " 인덱스 [{indices}]의 자식은 에이전트 프로세스가 더 이상 살아 있지 않은데 완료 보고를 한 적이 없다(hook 유실) — 이들도 respawn 후보다."

[settings.subtab]
codex = "Codex"

[codex.notify]
done_message = "surface {target} 작업 완료 (호출 방식: {kind})"
sandbox_hint = "⚠ sandbox 초기화 실패로 보임(RTM_NEWADDR 감지) — 이 실행 환경은 nested sandbox(bwrap)를 지원하지 않을 수 있습니다. --full-auto 로 재시도해보세요."

[codex.reboot]
notice = "tasty codex reboot : 이 세션은 tasty 의 reboot 기능으로 재시작되었습니다 (codex resume 으로 동일 세션 resume). 직전 턴이 잘렸을 수 있으니 마지막 작업 상태를 확인하고 이어서 진행하세요."
malformed_session_id = "surface {surface} 의 codex-session-id meta 형식이 잘못됐다: {value}"
screen_unreadable = "surface {surface} 의 화면을 읽을 수 없다"
lock_poisoned = "reboot in-flight 락이 poison 됐다: {detail}"
already_in_progress = "surface {surface} 의 reboot 이 이미 진행 중이다"
spawn_thread_failed = "reboot 스레드를 띄우지 못했다: {detail}"
no_active_session = "surface {surface} 에 활성 codex 세션이 없다 (codex-session-id meta 미설정 — tasty hook 이 설치·신뢰됐는지 확인해라. `tasty codex install` 후 codex 의 /hooks 에서 승인)"

[codex.params]
missing = "필수 파라미터 '{key}' 가 없다"
not_a_number = "'{key}' 에 {raw} 이(가) 왔다 — 32비트에 들어가는 정수여야 한다. 자르지 않고 거부한다: 잘린 id 는 실재할 수 있는 다른 대상을 가리킨다"
surface_conflict = "'surface' 와 'surface_id' 가 서로 다른 대상을 가리킨다 (surface={surface}, surface_id={surface_id}) — 하나만 보내거나 같은 값을 보내라"
invalid_choice = "'{flag}' 값 '{value}' 은(는) 유효하지 않다 (가능한 값: {valid})"
full_auto_conflict = "'full_auto' 는 'approval'/'sandbox' 와 함께 쓸 수 없다 — 이미 둘 다 우회한다"
missing_message = "필수 파라미터 'message' 가 없다"
missing_text = "필수 파라미터 'text' 가 없다"
missing_event = "필수 파라미터 'event' 가 없다"

[codex.hook]
requires_surface = "hook 은 어느 자식인지 지목할 --surface 가 필요하다"
unknown_event = "알 수 없는 hook 이벤트 '{event}' (지원: stop, prompt-submit, session-start)"

[codex.launch]
workspace_create_missing_id = "호스트 workspace.create 응답에 'id' 가 없다: {resp}"

[codex.spawn]
missing_child_surface_id = "호스트 terminal.spawn 응답에 'child_surface_id' 가 없다: {resp}"

[codex.respawn]
missing_child_surface_id = "호스트 terminal.respawn 응답에 'child_surface_id' 가 없다: {resp}"

[codex.install]
mkdir_failed = "codex 설정 디렉터리를 만들지 못했다: {detail}"
no_home = "HOME 이 설정돼 있지 않다 — ~/.codex/config.toml 위치를 찾을 수 없다"
encode_failed = "codex 설정을 TOML 로 직렬화하지 못했다: {detail}"
write_failed = "codex 설정 파일을 쓰지 못했다: {detail}"
