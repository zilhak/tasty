lock_poisoned = "reboot in-flight 락이 poison 됐다: {detail}"
already_in_progress = "surface {surface} 의 reboot 이 이미 진행 중이다"
spawn_thread_failed = "reboot 스레드를 띄우지 못했다: {detail}"
no_active_session = "surface {surface} 에 활성 codex 세션이 없다 (codex-session-id meta 미설정 — tasty hook 이 설치·신뢰됐는지 확인해라. `tasty codex install` 후 codex 의 /hooks 에서 승인)"

[codex.params]
missing = "필수 파라미터 '{key}' 가 없다"
missing_target_surface = "필수 파라미터 'surface'(또는 'surface_id') 누락"
