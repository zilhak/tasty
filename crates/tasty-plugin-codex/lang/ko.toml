[codex.cli]
desc = "Codex CLI 자식 세션 관리"

[codex]
"settings.spawn_child_warn_threshold" = "Spawn child 경고 임계치"
"settings.default_approval_policy" = "기본 승인 정책"
"settings.default_sandbox_mode" = "기본 샌드박스 모드"
"settings.approval.inherit" = "상속 (codex 기본값)"
"settings.approval.untrusted" = "Untrusted (신뢰되지 않은 명령만 승인 요청)"
"settings.approval.on_request" = "On request (모델이 판단)"
"settings.approval.never" = "Never (승인 프롬프트 없음)"
"settings.sandbox.inherit" = "상속 (codex 기본값)"
"settings.sandbox.read_only" = "읽기 전용"
"settings.sandbox.workspace_write" = "워크스페이스 쓰기 허용"
"settings.sandbox.danger_full_access" = "위험: 전체 접근"

[codex.spawn_warning]
total = "이 부모 아래에 현재 자식 인스턴스가 {total}개 있다(경고 임계치: {threshold}). 누수된 자식이 없는지 확인하라."
idle = " 인덱스 [{indices}]의 idle 자식은 이미 맡은 작업을 끝냈다 — 새로 spawn 하는 대신 `respawn` 을 고려하라."
stale = " 인덱스 [{indices}]의 자식은 에이전트 프로세스가 더 이상 살아 있지 않은데 완료 보고를 한 적이 없다(hook 유실) — 이들도 respawn 후보다."

[settings.subtab]
codex = "Codex"

[codex.notify]
done_message = "surface {target} 작업 완료 (호출 방식: {kind})"
sandbox_hint = "⚠ sandbox 초기화 실패로 보임(RTM_NEWADDR 감지) — 이 실행 환경은 nested sandbox(bwrap)를 지원하지 않을 수 있습니다. --full-auto 로 재시도해보세요."

[codex.reboot]
notice = "tasty codex reboot : 이 세션은 tasty 의 reboot 기능으로 재시작되었습니다 (codex resume 으로 동일 세션 resume). 직전 턴이 잘렸을 수 있으니 마지막 작업 상태를 확인하고 이어서 진행하세요."
