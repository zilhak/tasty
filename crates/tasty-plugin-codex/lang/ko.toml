"settings.sandbox.danger_full_access" = "위험: 전체 접근"

[codex.spawn_warning]
total = "이 부모 아래에 자식 인스턴스가 {total}개 있습니다(경고 기준: {threshold}). 쓰지 않는 자식이 남아 있는지 확인하세요."
idle = " 인덱스 [{indices}]의 idle 자식은 새로 만들지 않고 respawn으로 다시 사용할 수 있습니다."
