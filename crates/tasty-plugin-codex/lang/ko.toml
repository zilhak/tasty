[codex.cli.sub.launch]
description = "새 워크스페이스를 만들고 터미널에서 Codex 시작"

[codex.cli.sub.spawn]
description = "분할 서피스에 자식 Codex 생성. 즉시 반환하며 자식이 idle이 될 때마다, 그리고 종료할 때 부모 서피스에 알립니다. 첫 전환에만 한정되지 않습니다."

[codex.cli.sub.children]
description = "지정한 Codex 부모의 자식 나열"

[codex.cli.sub.parent]
description = "지정한 자식 서피스의 부모 Codex 서피스 ID 반환"

[codex.cli.sub.state]
description = "자식 하나의 상태 조회: idle, needs_input, active, exited(실제 서피스와 대조)"

[codex.cli.sub.tell]
description = "Codex 인스턴스에 메시지 전송(줄바꿈 유지, 끝에서 제출). 즉시 반환하며 대상이 idle이 될 때마다, 그리고 종료할 때 호출자 서피스에 알립니다. 첫 전환에만 한정되지 않습니다."

[codex.cli.sub.notify-caller]
description = "내부용: spawn/tell 자식의 상태 전환을 호출자에게 알리고 형제 일회성 훅을 정리합니다. 대상이 남아 있으면(process-exit이 아니면) 형제 훅을 재등록하여 실제 종료까지 계속 알립니다. spawn/tell이 등록한 훅에서 호출하며 직접 사용하지 않습니다."

[codex.cli.sub.broadcast]
description = "부모 Codex 인스턴스의 모든 자식에게 텍스트 일괄 전송"

[codex.cli.sub.kill]
description = "자식 인덱스로 Codex 인스턴스 종료"

[codex.cli.sub.respawn]
description = "자식 Codex 인스턴스 재생성"

[codex.cli.sub.reboot]
description = "서피스의 Codex를 재시작하고 같은 세션 재개(지연 종료 + codex resume). 턴의 마지막 동작으로 호출하세요. 지연 이후 작업은 중단됩니다."

[codex.cli.sub.install]
description = "Codex CLI 설정에 Tasty 훅 설치"

[codex.cli.sub.uninstall]
description = "Codex CLI 설정에서 Tasty 훅 제거"

