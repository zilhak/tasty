surface_conflict = "'surface' 와 'surface_id' 가 서로 다른 대상을 가리킨다 (surface={surface}, surface_id={surface_id}) — 하나만 보내거나 같은 값을 보내라"
invalid_choice = "'{flag}' 값 '{value}' 은(는) 유효하지 않다 (가능한 값: {valid})"
