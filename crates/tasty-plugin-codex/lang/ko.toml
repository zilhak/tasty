[codex.cli.sub.respawn]
description = "자식 Codex 인스턴스 재생성"

[codex.cli.sub.reboot]
description = "서피스의 Codex를 재시작하고 같은 세션 재개(지연 종료 + codex resume). 턴의 마지막 동작으로 호출하세요. 지연 이후 작업은 중단됩니다."

