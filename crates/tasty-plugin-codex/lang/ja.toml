[codex.cli]
desc = "Codex CLI連携（launch、spawn、kill、tellなど）"

[codex]
"settings.spawn_child_warn_threshold" = "Spawn child 警告しきい値"
"settings.default_approval_policy" = "デフォルト承認ポリシー"
"settings.default_sandbox_mode" = "デフォルトサンドボックスモード"
"settings.approval.inherit" = "継承（codex のデフォルト）"
"settings.approval.untrusted" = "Untrusted（信頼されないコマンドのみ承認を要求）"
"settings.approval.on_request" = "On request（モデルが判断）"
"settings.approval.never" = "Never（承認プロンプトなし）"
"settings.sandbox.inherit" = "継承（codex のデフォルト）"
"settings.sandbox.read_only" = "読み取り専用"
"settings.sandbox.workspace_write" = "ワークスペース書き込み許可"
"settings.sandbox.danger_full_access" = "危険：フルアクセス"

[codex.spawn_warning]
total = "この親の下に現在 {total} 個の子インスタンスが起動している（警告しきい値: {threshold}）。リークした子がないか確認すること。"
idle = " インデックス [{indices}] の idle な子はすでに担当した作業を終えている — 新しく spawn せず `respawn` を検討すること。"
stale = " インデックス [{indices}] の子はエージェントプロセスがもう動いていないのに完了報告をしていない（hook の消失） — これらも respawn の候補である。"

[settings.subtab]
codex = "Codex"

[codex.notify]
done_message = "surface {target} 作業完了 (呼び出し方式: {kind})"
sandbox_hint = "⚠ sandbox の初期化に失敗した可能性があります(RTM_NEWADDR を検出)— この実行環境は入れ子の sandbox(bwrap)に対応していない可能性があります。--full-auto で再試行してください。"

[codex.reboot]
notice = "tasty codex reboot : このセッションは tasty の reboot 機能で再起動されました(codex resume で同一セッションを再開)。直前のターンが途中で切れている可能性があるため、最後の作業状態を確認してから続行してください。"
malformed_session_id = "surface {surface} の codex-session-id meta の形式が不正です: {value}"
screen_unreadable = "surface {surface} の画面を読み取れません"
lock_poisoned = "reboot in-flight ロックが poison しました: {detail}"
already_in_progress = "surface {surface} の reboot はすでに進行中です"
spawn_thread_failed = "reboot スレッドを起動できませんでした: {detail}"
no_active_session = "surface {surface} にアクティブな codex セッションがありません (codex-session-id meta 未設定 — tasty hook が導入・信頼されているか確認してください。`tasty codex install` の後 codex の /hooks で承認)"

[codex.params]
missing = "必須パラメータ '{key}' がありません"
missing_target_surface = "必須パラメータ 'surface'(または 'surface_id')がありません"
not_a_number = "'{key}' に {raw} が渡されました — 32ビットに収まる整数である必要があります。切り捨てず拒否します: 切り捨てられた id は実在しうる別の対象を指します"
surface_conflict = "'surface' と 'surface_id' が異なる対象を指している (surface={surface}, surface_id={surface_id}) — どちらか一方、または同じ値を送ること"
invalid_choice = "'{flag}' の値 '{value}' は不正です (指定可能: {valid})"
full_auto_conflict = "'full_auto' は 'approval'/'sandbox' と併用できません — すでに両方を迂回します"
missing_message = "必須パラメータ 'message' がありません"
missing_text = "必須パラメータ 'text' がありません"
missing_event = "必須パラメータ 'event' がありません"

[codex.hook]
requires_surface = "hook には対象の子を特定する --surface が必要です"
unknown_event = "不明な hook イベント '{event}' (対応: stop, prompt-submit, session-start)"

[codex.launch]
workspace_create_missing_id = "ホストの workspace.create 応答に 'id' がありません: {resp}"

[codex.spawn]
missing_child_surface_id = "ホストの terminal.spawn 応答に 'child_surface_id' がありません: {resp}"

[codex.respawn]
missing_child_surface_id = "ホストの terminal.respawn 応答に 'child_surface_id' がありません: {resp}"

[codex.install]
read_failed = "Codex設定を読み取れません: {detail}"
path_conflict = "Codex homeまたは設定ファイルの一方を指定してください"
home_absolute = "Codex homeには絶対ディレクトリパスを指定してください"
mkdir_failed = "codex 設定ディレクトリを作成できませんでした: {detail}"
no_home = "HOME が設定されていません — ~/.codex/config.toml の場所を特定できません"
encode_failed = "codex 設定を TOML に変換できませんでした: {detail}"
write_failed = "codex 設定ファイルを書き込めませんでした: {detail}"

[codex.cli.sub.launch]
description = "新しいワークスペースを作成しターミナルでCodexを起動"

[codex.cli.sub.spawn]
description = "分割サーフェスに子Codexを作成。即時に戻り、子がidleになるたび、および終了時に親サーフェスへ通知します。最初の移行だけではありません。"

[codex.cli.sub.children]
description = "指定したCodex親の子を一覧表示"

[codex.cli.sub.parent]
description = "指定した子サーフェスの親CodexサーフェスIDを返す"

[codex.cli.sub.state]
description = "子一つの状態を照会：idle、needs_input、active、exited（実際のサーフェスと照合）"

[codex.cli.sub.tell]
description = "Codexインスタンスにメッセージを送信（改行を維持し末尾で確定）。即時に戻り、対象がidleになるたび、および終了時に呼び出し元へ通知します。最初の移行だけではありません。"

[codex.cli.sub.notify-caller]
description = "内部用：spawn/tellの子の状態移行を呼び出し元へ通知し、兄弟の一度限りフックを削除。対象が残る場合（process-exitでない場合）は再登録して実際の終了まで通知します。spawn/tellが登録したフックから呼び出し、直接は使用しません。"

[codex.cli.sub.broadcast]
description = "親Codexインスタンスの全ての子へテキストを一斉送信"

[codex.cli.sub.kill]
description = "子インデックスでCodexインスタンスを終了"

[codex.cli.sub.respawn]
description = "子Codexインスタンスを再生成"

[codex.cli.sub.reboot]
description = "サーフェスのCodexを再起動し同じセッションを再開（遅延終了 + codex resume）。ターンの最後の操作として呼び出してください。遅延後の処理は中断されます。"

[codex.cli.sub.install]
description = "Codex CLI設定にTastyフックをインストール"

[codex.cli.sub.uninstall]
description = "Codex CLI設定からTastyフックを削除"

[codex.cli.sub.hook]
description = "Codexフック連携（Codex CLIのフックシステムから呼び出し）。呼び出し時にstdinからJSONペイロード（session_id）を読み取ります。"

[codex.cli.arg.launch_args.workspace]
help = "作成するワークスペース名（既定値：\"codex\"）"

[codex.cli.arg.launch_args.directory]
help = "codex起動前に移動する作業ディレクトリ"

[codex.cli.arg.launch_args.task]
help = "codexに --task <text> で渡す初期タスク"

[codex.cli.arg.launch_args.approval]
help = "承認ポリシー（untrusted|on-request|never）。今回だけdefault_approval_policyを上書きします。未指定時は 'never' のため、別の対話型ポリシーを選ぶ場合のみ指定"

[codex.cli.arg.launch_args.sandbox]
help = "サンドボックスモード（read-only|workspace-write|danger-full-access）。今回だけdefault_sandbox_modeを上書き"

[codex.cli.arg.launch_args.full_auto]
help = "承認とサンドボックスを両方省略（--dangerously-bypass-approvals-and-sandbox）。--approval/--sandboxと併用不可"

[codex.cli.arg.parent_args.surface]
help = "親を照会する子CodexサーフェスID（既定値：呼び出し元のTASTY_SURFACE_ID）"

[codex.cli.arg.state_args.surface]
help = "照会する子CodexサーフェスID（既定値：呼び出し元のTASTY_SURFACE_ID）"

[codex.cli.arg.tell_args.message]
help = "送信するメッセージ。改行を維持して自動確定"

[codex.cli.arg.tell_args.surface]
help = "メッセージを受け取るCodexサーフェスID（既定値：呼び出し元のTASTY_SURFACE_ID）"

[codex.cli.arg.tell_args.caller_surface]
help = "対象が終了状態に達したとき通知するサーフェスID（既定値：呼び出し元のTASTY_SURFACE_ID）"

[codex.cli.arg.spawn_args.surface]
help = "親サーフェスID（既定値：フォーカス中のCodexサーフェス）"

[codex.cli.arg.spawn_args.workspace]
help = "対象ワークスペース（IDまたは名前）"

[codex.cli.arg.spawn_args.pane]
help = "対象ペインID（既定値：ワークスペースの最初のペイン）"

[codex.cli.arg.spawn_args.cwd]
help = "子Codexプロセスの作業ディレクトリ"

[codex.cli.arg.spawn_args.prompt]
help = "作成後に子へ送る初期プロンプト"

[codex.cli.arg.spawn_args.role]
help = "子の役割ラベル（broadcast --roleで使用）"

[codex.cli.arg.spawn_args.nickname]
help = "タブに表示するニックネーム"

[codex.cli.arg.spawn_args.approval]
help = "承認ポリシー（untrusted|on-request|never）。今回だけdefault_approval_policyを上書きします。未指定時は 'never' なので無人自動化が承認待ちで止まりません。対話型ポリシーを希望する場合のみ指定"

[codex.cli.arg.spawn_args.sandbox]
help = "サンドボックスモード（read-only|workspace-write|danger-full-access）。今回だけdefault_sandbox_modeを上書きします。ファイルを書いてはいけないレビュー・照合用の子には \"read-only\" を使用"

[codex.cli.arg.spawn_args.full_auto]
help = "承認とサンドボックスを両方省略（--dangerously-bypass-approvals-and-sandbox）。--approval/--sandboxと併用不可"

[codex.cli.arg.children_args.surface]
help = "親サーフェスID（既定値：フォーカス中のCodexサーフェス）"

[codex.cli.arg.notify_caller_args.caller]
help = "通知を受け取るサーフェスID"

[codex.cli.arg.notify_caller_args.target]
help = "完了したサーフェスID"

[codex.cli.arg.notify_caller_args.kind]
help = "コマンド: spawn | tell"

[codex.cli.arg.broadcast_args.text]
help = "一斉送信するテキスト。確定には \\r を使用（例：\"hello\\r\"）"

[codex.cli.arg.broadcast_args.surface]
help = "親サーフェスID（既定値：フォーカス中のCodexサーフェス）"

[codex.cli.arg.broadcast_args.role]
help = "この役割ラベルの子だけに送信"

[codex.cli.arg.kill_args.surface]
help = "親サーフェスID（既定値：フォーカス中のCodexサーフェス）"

[codex.cli.arg.kill_args.child]
help = "終了する子インデックス"

[codex.cli.arg.respawn_args.surface]
help = "親サーフェスID（既定値：フォーカス中のCodexサーフェス）"

[codex.cli.arg.respawn_args.child]
help = "再生成する子インデックス"

[codex.cli.arg.respawn_args.cwd]
help = "再生成するプロセスの作業ディレクトリを上書き"

[codex.cli.arg.respawn_args.prompt]
help = "再生成した子へ送る初期プロンプト"

[codex.cli.arg.respawn_args.role]
help = "子の役割ラベルを置換"

[codex.cli.arg.respawn_args.nickname]
help = "子の表示ニックネームを置換"

[codex.cli.arg.respawn_args.approval]
help = "承認ポリシー（untrusted|on-request|never）。今回だけdefault_approval_policyを上書きします。未指定時は 'never' のため、別の対話型ポリシーを選ぶ場合のみ指定"

[codex.cli.arg.respawn_args.sandbox]
help = "サンドボックスモード（read-only|workspace-write|danger-full-access）。今回だけdefault_sandbox_modeを上書き"

[codex.cli.arg.respawn_args.full_auto]
help = "承認とサンドボックスを両方省略（--dangerously-bypass-approvals-and-sandbox）。--approval/--sandboxと併用不可"

[codex.cli.arg.reboot_args.surface]
