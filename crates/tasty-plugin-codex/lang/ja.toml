[codex.cli]
desc = "Codex CLI 子セッションの管理"

[codex]
"settings.spawn_child_warn_threshold" = "Spawn child 警告しきい値"
"settings.default_approval_policy" = "デフォルト承認ポリシー"
"settings.default_sandbox_mode" = "デフォルトサンドボックスモード"
"settings.approval.inherit" = "継承（codex のデフォルト）"
"settings.approval.untrusted" = "Untrusted（信頼されないコマンドのみ承認を要求）"
"settings.approval.on_request" = "On request（モデルが判断）"
"settings.approval.never" = "Never（承認プロンプトなし）"
"settings.sandbox.inherit" = "継承（codex のデフォルト）"
"settings.sandbox.read_only" = "読み取り専用"
"settings.sandbox.workspace_write" = "ワークスペース書き込み許可"
"settings.sandbox.danger_full_access" = "危険：フルアクセス"

[codex.spawn_warning]
total = "この親の下に現在 {total} 個の子インスタンスが起動している（警告しきい値: {threshold}）。リークした子がないか確認すること。"
idle = " インデックス [{indices}] の idle な子はすでに担当した作業を終えている — 新しく spawn せず `respawn` を検討すること。"
stale = " インデックス [{indices}] の子はエージェントプロセスがもう動いていないのに完了報告をしていない（hook の消失） — これらも respawn の候補である。"

[settings.subtab]
codex = "Codex"

[codex.notify]
done_message = "surface {target} 作業完了 (呼び出し方式: {kind})"
sandbox_hint = "⚠ sandbox の初期化に失敗した可能性があります(RTM_NEWADDR を検出)— この実行環境は入れ子の sandbox(bwrap)に対応していない可能性があります。--full-auto で再試行してください。"

[codex.reboot]
notice = "tasty codex reboot : このセッションは tasty の reboot 機能で再起動されました(codex resume で同一セッションを再開)。直前のターンが途中で切れている可能性があるため、最後の作業状態を確認してから続行してください。"
