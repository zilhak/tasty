write_failed = "codex 設定ファイルを書き込めませんでした: {detail}"

[codex.cli.sub.launch]
description = "新しいワークスペースを作成しターミナルでCodexを起動"

[codex.cli.sub.spawn]
description = "子 Codex インスタンスを分割 surface に作成します。ホストの応答を待って返り、子の作業完了は待ちません。Codex の会話から呼び出すと、子のターンが終わるたびに結果をその会話へ返します。それ以外では親 surface に idle・入力待ち・終了の通知フックを登録します。"

[codex.cli.sub.children]
description = "指定したCodex親の子を一覧表示"

[codex.cli.sub.parent]
description = "指定した子サーフェスの親CodexサーフェスIDを返す"

[codex.cli.sub.state]
description = "子一つの状態を照会：idle、needs_input、active、exited（実際のサーフェスと照合）"

[codex.cli.sub.tell]
description = "改行を維持してメッセージを送り、確定します。ホストの応答を待って返り、作業完了は待ちません。Codex の会話から呼び出すと、対象のターン結果をその会話へ返します。それ以外では呼び出し元 surface が指定されていれば idle・入力待ち・終了の通知フックを登録します。"

[codex.cli.sub.notify-caller]
description = "内部用：子の状態変化を通知し、同じ対象・コマンドの一度限りフックを削除します。対象 surface を引き続き確認できれば完了フックを再登録します。spawn/tell のフックから呼び出し、直接は使用しません。"

[codex.cli.sub.broadcast]
description = "親Codexインスタンスの全ての子へテキストを一斉送信"

[codex.cli.sub.kill]
description = "子インデックスでCodexインスタンスを終了"

[codex.cli.sub.respawn]
description = "子Codexインスタンスを再生成"

[codex.cli.sub.reboot]
description = "サーフェスのCodexを再起動し同じセッションを再開（遅延終了 + codex resume）。ターンの最後の操作として呼び出してください。遅延後の処理は中断されます。"

[codex.cli.sub.install]
description = "Codex CLI設定にTastyフックをインストール"

[codex.cli.sub.uninstall]
description = "Codex CLI設定からTastyフックを削除"

[codex.cli.sub.hook]
description = "Codexフック連携（Codex CLIのフックシステムから呼び出し）。呼び出し時にstdinからJSONペイロード（session_id、prompt、last_assistant_message、model、turn_id）を読み取ります。"

