missing_text = "必須パラメータ 'text' がありません"
missing_event = "必須パラメータ 'event' がありません"

[codex.hook]
requires_surface = "hook には対象の子を特定する --surface が必要です"
unknown_event = "不明な hook イベント '{event}'（対応: stop, prompt-submit, session-start, permission-request, post-tool-use, interrupt, session-end）"

