[codex.cli.arg.reboot_args.approval]
help = "再開セッションの承認ポリシー（untrusted|on-request|never）。今回だけdefault_approval_policyを上書きします。未指定時は 'never' のため、別の対話型ポリシーを選ぶ場合のみ指定"

[codex.cli.arg.reboot_args.sandbox]
help = "再開セッションのサンドボックスモード（read-only|workspace-write|danger-full-access）。今回だけdefault_sandbox_modeを上書き"

[codex.cli.arg.reboot_args.full_auto]
help = "承認とサンドボックスを両方省略（--dangerously-bypass-approvals-and-sandbox）。--approval/--sandboxと併用不可"

[codex.cli.arg.hook_args.event]
