# 본 crate 가 다른 워크스페이스에 흡수되지 않도록 빈 [workspace] 명시.
# (worktree 부모 디렉터리에 별 cargo workspace 가 있을 때 발생하는 충돌 회피.)
[workspace]

[package]
name = "tasty-plugin-sdk-wasm"
version = "0.1.2-poc"
edition = "2024"
license = "MIT"
description = "POC: Host-side WASM (wasi-preview2 component) runtime for Tasty plugins. Excluded from main workspace."
repository = "https://github.com/zilhak/tasty"
publish = false

# 메인 workspace에서 제외한 WASM 실행 실험. 자체 Cargo.lock을 사용한다.
# cargo build --release --manifest-path crates/tasty-plugin-sdk-wasm/Cargo.toml

[dependencies]
# 실험에 사용한 wasmtime 버전을 고정한다. 정식 지원은 보류 상태다.
# 현재 정책: docs/dev-guide/plugin-packaging.md#정책-현행.
wasmtime = { version = "35", default-features = false, features = [
    "runtime",
    "cranelift",
    "component-model",
    "cache",
] }
wasmtime-wasi = "35"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[features]
default = []
# 메인 바이너리에 연결하지 않으며 poc-host에서 별도로 실행한다.
