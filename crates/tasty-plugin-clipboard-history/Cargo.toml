[package]
name = "tasty-plugin-clipboard-history"
version = "0.1.2"
edition = "2024"
license = "MIT"
description = "External Tasty plugin: clipboard history viewer popup"
repository = "https://github.com/zilhak/tasty"

# Phase J.C — WASM POC dual-mode 빌드.
# default = ["process"]  → 기존 process plugin 형태. main workspace 빌드 변화 0.
# wasm 빌드:
#   cargo build -p tasty-plugin-clipboard-history \
#       --no-default-features --features wasm \
#       --target wasm32-wasip2 --release
# component 변환: scripts/build-wasm-plugin.sh

[[bin]]
name = "tasty-plugin-clipboard-history"
path = "src/main.rs"
required-features = ["process"]

[lib]
name = "tasty_plugin_clipboard_history"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]
required-features = ["wasm"]

[features]
default = ["process"]
process = ["dep:tasty-plugin-sdk", "dep:tracing", "dep:tracing-subscriber", "dep:anyhow"]
wasm = ["dep:wit-bindgen", "dep:serde"]

[dependencies]
tasty-plugin-sdk = { path = "../tasty-plugin-sdk", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = "1"
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
anyhow = { version = "1", optional = true }
# Phase J.C POC. wasm32-wasip2 + component model 호환.
# "macros" = wit_bindgen::generate! / export! 매크로 활성.
# "realloc" = guest allocator (wasi-preview2 ABI 표준).
wit-bindgen = { version = "0.49", default-features = false, features = ["macros", "realloc"], optional = true }

[lints]
workspace = true
