[package]
name = "tasty-plugin-sdk"
version = "0.1.13"
edition = "2024"
license = "MIT"
description = "SDK for writing external Tasty plugins (handshake, runtime, UI builder helpers)"
repository = "https://github.com/zilhak/tasty"

[dependencies]
tasty-plugin-protocol = { path = "../tasty-plugin-protocol" }
tasty-shm = { path = "../tasty-shm" }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
anyhow = "1"
thiserror = "1"

# egui-mesh plugin SDK 헬퍼 (A1-S4, 옵셔널). 기본 빌드는 egui 의존 없이 유지한다 —
# plugin 은 무거운 host 의존 없이 컴파일 가능해야 한다 (lib.rs 불변식). egui-mesh
# surface 를 그리는 plugin 만 이 feature 를 켠다. protocol 의 egui-mesh 코덱과 동일
# egui 인스턴스로 unify 되도록 epaint serde OFF + bytemuck ON 을 맞추고, plugin 이
# 자기 폰트 atlas 를 소유하도록 default_fonts 를 켠다.
egui = { version = "0.31", default-features = false, features = [
    "bytemuck",
    "default_fonts",
], optional = true }

[features]
# egui-mesh: tessellate→POD 인코드→shared buffer 송신 헬퍼([`egui_surface`]) 활성화.
egui-mesh = ["dep:egui", "tasty-plugin-protocol/egui-mesh"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
