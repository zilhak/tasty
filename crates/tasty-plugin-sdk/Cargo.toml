[package]
name = "tasty-plugin-sdk"
version = "0.1.22"
edition = "2024"
license = "MIT"
description = "SDK for writing external Tasty plugins (handshake, runtime, UI builder helpers)"
repository = "https://github.com/zilhak/tasty"

[dependencies]
tasty-plugin-protocol = { path = "../tasty-plugin-protocol" }
tasty-shm = { path = "../tasty-shm" }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tasty-utils = { path = "../tasty-utils" }
# Host and SDK share installed/user plugin catalog loading (src/i18n.rs).
tasty-i18n = { path = "../tasty-i18n" }
anyhow = "1"
thiserror = "1"

# egui-mesh 기능을 켜는 플러그인만 egui와 기본 폰트를 사용한다.
# 프로토콜 코덱과 같은 egui 타입을 사용하도록 bytemuck을 함께 켠다.
egui = { version = "0.31", default-features = false, features = [
    "bytemuck",
    "default_fonts",
], optional = true }

[features]
# egui-mesh: tessellate→POD 인코드→shared buffer 송신 헬퍼([`egui_surface`]) 활성화.
egui-mesh = ["dep:egui", "tasty-plugin-protocol/egui-mesh"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_IO"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
