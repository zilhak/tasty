[package]
name = "tasty-plugin-manifest"
version = "0.1.7"
edition = "2024"
license = "MIT"
description = "Tasty plugin manifest schema, parse and schema-agnostic validation"
repository = "https://github.com/zilhak/tasty"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
semver = "1"
tasty-plugin-protocol = { path = "../tasty-plugin-protocol" }
tasty-type-appearance = { path = "../tasty-type-appearance" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
