[package]
name = "tasty-i18n"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Shared i18n store for Tasty — translation loading + t()/t_fmt() lookup. Depended on by both the main binary and tasty-cli so CLI output can use the same translation table."

[dependencies]
toml = "0.8"
tracing = "0.1"
tasty-utils = { path = "../tasty-utils" }

[lints]
workspace = true
