[package]
name = "tasty-terminal-link"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Link detection in terminal text for Tasty — URL and path scanning, wrap-aware segments, and the highlight range the renderer overrides. Domain-only: no host, GUI, or IPC coupling."

[dependencies]
tasty-cell-width = { path = "../tasty-cell-width" }
tasty-terminal = { path = "../tasty-terminal" }
tasty-type-appearance = { path = "../tasty-type-appearance" }
regex = "1"
termwiz = "0.22"


[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
