[package]
name = "tasty-font"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Font atlas, glyph rasterization, and font registry for Tasty"

[dependencies]
cosmic-text = "0.18"

# GPU 아틀라스에만 필요하다. 헤드리스 소비자는 gpu 기능을 켜지 않는다.
wgpu = { version = "24", optional = true }

tracing = "0.1"

# Fast non-cryptographic hash for hot-path glyph cache fallback
rustc-hash = "2"

[features]
# GPU를 사용하는 소비자가 명시적으로 켠다.
default = []
# GPU 글리프 아틀라스. 나머지 타입은 장치 없이 사용할 수 있다.
gpu = ["dep:wgpu"]

[lints]
workspace = true
