[package]
name = "tasty-plugin-git-viewer"
version = "0.1.24"
edition = "2024"
license = "MIT"
description = "External Tasty plugin: read-only git status/log/diff viewer popup"
repository = "https://github.com/zilhak/tasty"

[[bin]]
name = "tasty-plugin-git-viewer"
path = "src/main.rs"

[dependencies]
tasty-plugin-sdk = { path = "../tasty-plugin-sdk", features = ["egui-mesh"] }
tasty-plugin-protocol = { path = "../tasty-plugin-protocol" }
# Windows verbatim prefix(`\\?\`) 제거 — worktree 경로 표시/비교 정규화에 사용.
tasty-utils = { path = "../tasty-utils" }
# repo 탐색 + status/log/diff/worktrees 수집 — host core(원격 attach git 조회)와
# 공유하는 순수 로직 crate.
tasty-git-core = { path = "../tasty-git-core" }
# tasty-git-core 와 동일 버전 — main.rs 가 `git2::Repository` 를 직접 참조(refresh_collections/
# load_diff_for 시그니처)하므로 타입 정합을 위해 plugin 도 직접 의존한다.
git2 = { version = "0.20", default-features = false }
# Theme parity — set_context 의 ThemeWire 를 `Theme::with_colors_and_zoom` 으로 재구성해
# 디자인 토큰대로 그린다. 공용 위젯(Tag/Button)은 tasty-ui-widgets 로 직접 호출한다.
tasty-type-appearance = { path = "../tasty-type-appearance" }
tasty-ui-widgets = { path = "../tasty-ui-widgets" }
serde_json = "1"
# 원격(mirror) git 조회 응답 wire DTO 역직렬화 전용 — tasty-git-core 도 동일 이유로
# 의존한다. 근거: `docs/adr/0056-git-viewer-remote-attach-git-query-channel.md`.
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

# host·SDK·protocol 와 동일 egui 인스턴스로 unify (epaint serde OFF + bytemuck ON).
# plugin 이 closure 에서 git-viewer 위젯을 그리려면 SDK 와 같은 egui 타입이 필요하다 —
# Cargo 가 workspace 전역 0.31 로 통일하므로 mesh 와이어(POD Vertex)가 정합한다.
egui = { version = "0.31", default-features = false, features = [
    "bytemuck",
    "default_fonts",
] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
