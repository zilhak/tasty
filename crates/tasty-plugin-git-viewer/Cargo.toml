[package]
name = "tasty-plugin-git-viewer"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "External Tasty plugin: read-only git status/log/diff viewer popup"
repository = "https://github.com/zilhak/tasty"

[[bin]]
name = "tasty-plugin-git-viewer"
path = "src/main.rs"

[dependencies]
tasty-plugin-sdk = { path = "../tasty-plugin-sdk" }
# Read-only libgit2 binding — HTTPS/SSH 불필요라 default-features off.
git2 = { version = "0.19", default-features = false }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

[lints]
workspace = true
