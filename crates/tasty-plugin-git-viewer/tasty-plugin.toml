manifest_version = 1
id = "com.tasty.git-viewer"
name = "Git Viewer"
version = "0.1.31"
description = "Read-only git status / log / diff popup"
api_version = "1"
permissions = ["ui.popup", "ui.tool_item", "fs.read"]
lang_dir = "lang"

[entry]
type = "process"
command = "tasty-plugin-git-viewer"

[[contributes.popup]]
id = "viewer"
trigger = { kind = "ipc" }
# egui-mesh: plugin 이 popup 콘텐츠를 자기 프로세스에서 egui mesh 로 그리고, host 는
# 셸(scrim/border/outside-click/Esc)만 그린 뒤 합성한다 (ADR-0028 / A2).
rendering = "egui-mesh"
size_hint = { width = 960, height = 640 }
anchor = "screen-center"
dismiss_on_outside_click = true

[[contributes.tool]]
id = "open-viewer"
label_i18n_key = "git_viewer.tools_menu_item"
action = { kind = "open_popup", popup_id = "com.tasty.git-viewer/viewer" }
order_hint = 130

# 단축키로 뷰어를 열기 위한 커맨드. Tools 메뉴 항목과 동일한 popup 을 연다
# (default_keybinding 미지정 — 사용자가 설정 > 단축키 > 플러그인에서 직접 지정).
[[contributes.commands]]
id = "open_viewer"
title_i18n_key = "git_viewer.command.open_viewer"
binding_mode = "independent"
scope = "global"
action = { kind = "open_popup", popup_id = "com.tasty.git-viewer/viewer" }
