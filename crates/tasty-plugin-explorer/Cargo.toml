[package]
name = "tasty-plugin-explorer"
version = "0.2.1"
edition = "2024"
license = "MIT"
description = "External Tasty plugin: file explorer surface"
repository = "https://github.com/zilhak/tasty"

[[bin]]
name = "tasty-plugin-explorer"
path = "src/main.rs"

[dependencies]
tasty-plugin-sdk = { path = "../tasty-plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

[lints]
workspace = true
