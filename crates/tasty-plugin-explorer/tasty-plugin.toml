manifest_version = 1
id = "com.tasty.explorer"
name = "File Explorer"
version = "0.2.1"
description = "Built-in file explorer plugin for Tasty"
api_version = "1"
permissions = ["surface.read", "surface.write", "fs.read", "ui.settings_page"]
lang_dir = "lang"

[entry]
type = "process"
command = "tasty-plugin-explorer"

[[surface_kinds]]
kind = "explorer"
display_name_i18n_key = "surface.kind.explorer"
icon = "📁"

[[contributes.commands]]
id = "explorer.refresh"
title_i18n_key = "explorer.cmd.refresh"
default_keybinding = "F5"
binding_mode = "independent"

[[contributes.commands]]
id = "explorer.go_up"
title_i18n_key = "explorer.cmd.go_up"
default_keybinding = "alt+up"
binding_mode = "independent"

[[contributes.settings_pages]]
id = "explorer"
title_key = "settings.subtab.explorer"
category = "appearance"

[[contributes.settings_pages.items]]
kind = "font_override"
id = "font"
label_key = "settings.appearance.font_override"
storage_key = "explorer"
