[package]
name = "tasty-plugin-claude-design"
version = "0.1.22"
edition = "2024"
license = "MIT"
description = "External Tasty plugin: Claude Design (claude.ai/design) canvas integration"
repository = "https://github.com/zilhak/tasty"

[lib]
path = "src/lib.rs"

[[bin]]
name = "tasty-plugin-claude-design"
path = "src/main.rs"

[dependencies]
tasty-plugin-sdk = { path = "../tasty-plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
# import-session: 로컬 Firefox 프로필의 cookies.sqlite 읽기 전용 접근.
rusqlite = { version = "0.32", features = ["bundled"] }

[lints]
workspace = true
