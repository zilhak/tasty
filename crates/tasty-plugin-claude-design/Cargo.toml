[package]
name = "tasty-plugin-claude-design"
version = "0.1.25"
edition = "2024"
license = "MIT"
description = "External Tasty plugin: Claude Design (claude.ai/design) canvas integration"
repository = "https://github.com/zilhak/tasty"

[lib]
path = "src/lib.rs"

[[bin]]
name = "tasty-plugin-claude-design"
path = "src/main.rs"

[dependencies]
tasty-plugin-sdk = { path = "../tasty-plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
# import-session: 로컬 브라우저 프로필의 cookie DB(sqlite) 읽기 전용 접근 (Firefox·Chrome 공용).
rusqlite = { version = "0.32", features = ["bundled"] }
# Chrome 세션 import: Chromium 계열 쿠키 복호(AES-128-CBC + PBKDF2-HMAC-SHA1). 복호 로직은
# OS 무관 공통이라 전 타깃 빌드(키 획득만 chrome_import 안에서 OS별 분기). Firefox 는 평문.
aes = "0.8"
cbc = "0.1"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha1 = "0.10"

[lints]
workspace = true
