manifest_version = 1
id = "com.tasty.claude-design"
name = "Claude Design"
version = "0.1.10"
description = "Claude Design (claude.ai/design) canvas integration for Tasty"
api_version = "1"
permissions = [
    # 시스템에 설치된 Playwright(node) 런타임을 자식 프로세스로 spawn.
    "process.spawn",
    # 로그인 필요 / 세션 만료 / 런타임 부재 안내.
    "notification",
    "telemetry",
    # 주의: auth(쿠키)는 memory.secret(디스크 평문) 부적합 → OS keyring 직접 호출.
    #       keyring 은 플러그인 자기 프로세스 내부라 호스트 권한 토큰 불필요.
]
lang_dir = "lang"

[entry]
type = "process"
command = "tasty-plugin-claude-design"

[[contributes.ipc_namespace]]
prefix = "design"

[[contributes.cli]]
name = "design"
description = "Claude Design canvas integration (login, chat, status)"
description_i18n_key = "design.cli.desc"
subcommands = [
    { name = "login",    ipc_method = "design.login",    args = "no_args",   description = "Open a visible browser to log in; capture and store the session (plaintext file, ADR-0018). Returns immediately; check `design status`." },
    { name = "logout",   ipc_method = "design.logout",   args = "no_args",   description = "Delete the stored Claude Design session" },
    { name = "status",   ipc_method = "design.status",   args = "no_args",   description = "Show runtime / stored-session / runner / Cloudflare-pass state" },
    { name = "projects", ipc_method = "design.projects", args = "no_args",   description = "List Claude Design projects" },
    { name = "detect",   ipc_method = "design.detect",   args = "no_args",   description = "Auto-detect system Playwright / node / chromium and report paths" },
    { name = "probe",    ipc_method = "design.probe",    args = "no_args",   description = "Launch an off-screen headful browser and check claude.ai/design reachability + Cloudflare pass (no credentials needed)" },
    { name = "chat",     ipc_method = "design.chat",     args = "chat_args", auto_wait = { method = "design.chat_status", polling = { state_field = "state", terminal_states = ["done", "error"], interval_ms = 1500, timeout_field = "timeout" } }, description = "Send a message to a design project canvas; auto-waits for the reply (runs in background, polled via design.chat_status)." },
    { name = "chat-status", ipc_method = "design.chat_status", args = "no_args", description = "Show the latest chat status / reply" },
]

[contributes.cli.arg_groups.chat_args]
positional = [
    { name = "message", type = "string", required = true, help = "Prompt text to send to the design canvas" },
]
flags = [
    { name = "project", type = "string", flag = "--project", required = false, help = "Target project UUID or name (defaults to the attached project)" },
    { name = "timeout", type = "u32",    flag = "--timeout", required = false, help = "Stream timeout in seconds (omit = wait until the turn ends)" },
]

[contributes.cli.arg_groups.no_args]
