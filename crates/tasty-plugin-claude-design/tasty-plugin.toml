manifest_version = 1
id = "com.tasty.claude-design"
name = "Claude Design"
version = "0.1.26"
description = "Claude Design (claude.ai/design) canvas integration for Tasty"
api_version = "1"
permissions = [
    # 시스템에 설치된 Playwright(node) 런타임을 자식 프로세스로 spawn.
    "process.spawn",
    # 로그인 필요 / 세션 만료 / 런타임 부재 안내.
    "notification",
    "telemetry",
    # 주의: auth(쿠키)는 memory.secret(디스크 평문) 부적합 → OS keyring 직접 호출.
    #       keyring 은 플러그인 자기 프로세스 내부라 호스트 권한 토큰 불필요.
]
lang_dir = "lang"

[entry]
type = "process"
command = "tasty-plugin-claude-design"

[[contributes.ipc_namespace]]
prefix = "design"

[[contributes.cli]]
name = "design"
description = "Claude Design canvas integration (login, chat, status)"
description_i18n_key = "design.cli.desc"
subcommands = [
    { name = "login",    ipc_method = "design.login",    args = "no_args",   description = "Open a visible browser to log in; capture and store the session (plaintext file, ADR-0018). Returns immediately; check `design status`." },
    { name = "logout",   ipc_method = "design.logout",   args = "no_args",   description = "Delete the stored Claude Design session" },
    { name = "import-session", ipc_method = "design.import_session", args = "no_args", description = "Import an existing claude.ai session from a local browser profile's cookies — tries Chrome first, then Firefox (no browser automation involved). Use when `login` is blocked by Google's automated-browser OAuth detection — log into claude.ai with Chrome or Firefox normally once, then run this." },
    { name = "status",   ipc_method = "design.status",   args = "no_args",   description = "Show runtime / stored-session / runner / Cloudflare-pass state" },
    { name = "projects", ipc_method = "design.projects", args = "no_args",   description = "List Claude Design projects" },
    { name = "detect",   ipc_method = "design.detect",   args = "no_args",   description = "Auto-detect system Playwright / node / chromium and report paths" },
    { name = "probe",    ipc_method = "design.probe",    args = "no_args",   description = "Launch an off-screen headful browser and check claude.ai/design reachability + Cloudflare pass (no credentials needed)" },
    { name = "chat",     ipc_method = "design.chat",     args = "chat_args", auto_wait = { method = "design.chat_status", polling = { state_field = "state", terminal_states = ["done", "error", "busy"], interval_ms = 1500, timeout_field = "timeout" } }, description = "Send a message to a design project canvas; auto-waits for the reply (runs in background, polled via design.chat_status)." },
    { name = "chat-status", ipc_method = "design.chat_status", args = "no_args", description = "Show the latest chat status / reply" },
    { name = "turn-status", ipc_method = "design.turn_status", args = "turn_status_args", description = "Check whether a design project's chat is actively generating (turn in progress). Observe-only (no send) — used to re-verify a stale concurrency lock at TTL expiry." },
    { name = "protocol", ipc_method = "design.protocol", args = "protocol_args", description = "Print the concurrency-lock protocol AI agents must follow before driving a design project (file-based advisory lock under design-tasks/). Use --bootstrap for the step-by-step to install it into a target project." },
]

[contributes.cli.arg_groups.chat_args]
positional = [
    { name = "message", type = "string", required = true, help = "Prompt text to send to the design canvas" },
]
flags = [
    { name = "project", type = "string", flag = "--project", required = false, help = "Target project UUID or name (defaults to the attached project)" },
    { name = "timeout", type = "u32",    flag = "--timeout", required = false, help = "Stream timeout in seconds (omit = default 1800 = 30 min; the chat also completes via the design-tasks/.DONE lock file)" },
]

[contributes.cli.arg_groups.protocol_args]
flags = [
    { name = "bootstrap", type = "bool", flag = "--bootstrap", required = false, help = "Print the bootstrap procedure (how to install the protocol into a target design project) instead of the protocol text." },
]

[contributes.cli.arg_groups.turn_status_args]
flags = [
    { name = "project", type = "string", flag = "--project", required = false, help = "Target project UUID or name (defaults to the attached project)" },
]

[contributes.cli.arg_groups.no_args]
