[package]
name = "tasty-plugin-agent-stream"
version = "0.1.17"
edition = "2024"
license = "MIT"
description = "External Tasty plugin: AI agent transcript tail / relay pipeline"
repository = "https://github.com/zilhak/tasty"

[[bin]]
name = "tasty-plugin-agent-stream"
path = "src/main.rs"

[dependencies]
tasty-plugin-sdk = { path = "../tasty-plugin-sdk" }
serde_json = "1"
tasty-utils = { path = "../tasty-utils" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
directories = "6"
# SSE 엔드포인트(`src/sse/server.rs`)용 blocking HTTP 서버. 본체 웹훅과 같은 선택이며
# 근거는 ADR-0048 — SDK 가 async 를 지원하지 않아 plugin 도 blocking + 전용 스레드가
# 자연스럽다. `default-features = false` 로 TLS 는 빼고 프록시에 위임한다.
tiny_http = { version = "0.12", default-features = false }

# 같은 경로가 같은 파일인지 판별하는 지문(`src/tail.rs`)용. std 의
# `MetadataExt::file_index()` 는 unstable feature `windows_by_handle` 이라 stable
# 툴체인에서 못 쓴다 — Win32 `GetFileInformationByHandle` 을 직접 호출한다.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
