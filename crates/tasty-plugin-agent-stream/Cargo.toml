[package]
name = "tasty-plugin-agent-stream"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "External Tasty plugin: AI agent transcript tail / relay pipeline"
repository = "https://github.com/zilhak/tasty"

[[bin]]
name = "tasty-plugin-agent-stream"
path = "src/main.rs"

[dependencies]
tasty-plugin-sdk = { path = "../tasty-plugin-sdk" }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
directories = "6"

# 같은 경로가 같은 파일인지 판별하는 지문(`src/tail.rs`)용. std 의
# `MetadataExt::file_index()` 는 unstable feature `windows_by_handle` 이라 stable
# 툴체인에서 못 쓴다 — Win32 `GetFileInformationByHandle` 을 직접 호출한다.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
