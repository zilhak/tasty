[agent_stream.cli]
desc = "AI 에이전트 세션 transcript 를 tail 해 구조화된 스트림 이벤트로 읽습니다"

[agent_stream.error]
missing_surface = "대상 surface 가 없습니다: --surface <id> 를 넘기거나 (TASTY_SURFACE_ID 가 설정되도록) tasty 터미널 안에서 실행하세요"
no_session_meta = "surface {surface} 에 '{key}' meta 가 없습니다 — 에이전트 세션 id 를 알 수 없어 transcript 경로를 결정할 수 없습니다. 그 surface 에서 에이전트를 (재)시작해 session-start 훅이 id 를 기록하게 하세요."
transcript_root_missing = "에이전트 transcript 루트 디렉토리를 찾을 수 없습니다 (~/.claude/projects, 또는 $CLAUDE_CONFIG_DIR 이 설정됐으면 $CLAUDE_CONFIG_DIR/projects)"
transcript_not_found = "transcript 루트 아래에서 세션 {session} 의 transcript 파일을 찾지 못했습니다 — 아직 디스크에 기록되지 않았을 수 있습니다"
not_watched = "surface {surface} 는 watch 대상이 아닙니다"
missing_request_id = "request_id 가 없습니다: --request-id <id> 를 넘기세요. correlation id 는 요청자만 아는 값이어야 합니다 — 웹훅 응답은 고정 ACK 라, plugin 이 스스로 만들면 FE 가 그 값을 알 수 없어 응답을 매칭할 수 없습니다."
request_id_too_long = "request_id 가 너무 깁니다({max} 바이트 상한): correlation 토큰은 짧은 식별자(UUID·nanoid 등)여야 합니다. 웹훅으로 들어온 거대한 값은 그 턴의 모든 이벤트에 복제되므로 거부합니다."
turn_not_watched = "surface {surface} 는 watch 대상이 아니라 correlation 턴이 태깅할 이벤트가 없습니다 — 먼저 `agent-stream watch --surface {surface}` 로 등록하세요."
turn_already_open = "surface {surface} 에 이미 열린 correlation 턴이 있습니다(request_id {request}) — 에이전트는 한 번에 한 턴만 처리합니다. 그 턴의 turn_end 를 받은 뒤 다음을 시작하세요."
registry_poisoned = "agent-stream 레지스트리 락이 poisoned 상태입니다 (tail 스레드가 패닉했습니다): {detail}"
serve_port_required = "포트가 지정되지 않았습니다: --port <n> 를 넘기세요. SSE 엔드포인트는 포트를 스스로 고르지 않습니다 — 포트가 알아서 바뀌면 구독자가 붙을 고정 주소가 없어집니다."
serve_port_out_of_range = "포트 {port} 는 포트 번호 범위(1-65535)를 벗어납니다 — 범위 안의 값을 --port 로 넘기세요"
serve_invalid_bind = "bind 주소 {bind} 를 IP 로 해석할 수 없습니다 — 127.0.0.1(기본), ::1, 또는 인터페이스의 명시적 주소를 넘기세요"
serve_remote_bind_needs_token = "{bind} 에 토큰 없이 여는 것을 거부합니다: 이 엔드포인트는 대화 전문을 흘리므로 loopback 보다 넓은 주소에는 --token 이 필요합니다"
serve_bind_failed = "SSE 엔드포인트를 {addr} 에 bind 할 수 없습니다: {detail} — 포트를 비우거나 다른 포트를 지정하세요(자동 폴백 없음)"
serve_not_running = "SSE 엔드포인트가 떠 있지 않습니다"
