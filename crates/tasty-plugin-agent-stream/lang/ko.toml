[agent_stream.cli]
desc = "AI 에이전트 세션 transcript 를 tail 해 구조화된 스트림 이벤트로 읽는다"

[agent_stream.error]
missing_surface = "대상 surface 가 없다: --surface <id> 를 넘기거나 (TASTY_SURFACE_ID 가 설정되도록) tasty 터미널 안에서 실행한다"
no_session_meta = "surface {surface} 에 '{key}' meta 가 없다 — 에이전트 세션 id 를 알 수 없어 transcript 경로를 결정할 수 없다. 그 surface 에서 에이전트를 (재)시작해 session-start 훅이 id 를 기록하게 한다."
transcript_root_missing = "에이전트 transcript 루트 디렉토리를 찾을 수 없다 (~/.claude/projects, 또는 $CLAUDE_CONFIG_DIR 이 설정됐으면 $CLAUDE_CONFIG_DIR/projects)"
transcript_not_found = "transcript 루트 아래에서 세션 {session} 의 transcript 파일을 찾지 못했다 — 아직 디스크에 기록되지 않았을 수 있다"
not_watched = "surface {surface} 는 watch 대상이 아니다"
registry_poisoned = "agent-stream 레지스트리 락이 poisoned 상태다 (tail 스레드가 패닉했다): {detail}"
