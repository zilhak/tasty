[agent_stream.cli]
desc = "AI 에이전트 세션 기록을 추적하고 정규화된 스트림 이벤트 읽기"

[agent_stream.error]
missing_surface = "대상 surface 가 없습니다: --surface <id> 를 넘기거나 (TASTY_SURFACE_ID 가 설정되도록) tasty 터미널 안에서 실행하세요"
invalid_surface = "surface ID {value}가 올바르지 않습니다. u32 범위의 정수를 입력하세요. 값 생략과는 다른 오류입니다."
no_session_meta = "surface {surface} 에 '{key}' meta 가 없습니다 — 에이전트 세션 id 를 알 수 없어 transcript 경로를 결정할 수 없습니다. 그 surface 에서 에이전트를 (재)시작해 session-start 훅이 id 를 기록하게 하세요."
transcript_root_missing = "에이전트 transcript 루트 디렉토리를 찾을 수 없습니다 (~/.claude/projects, 또는 $CLAUDE_CONFIG_DIR 이 설정됐으면 $CLAUDE_CONFIG_DIR/projects)"
transcript_not_found = "transcript 루트 아래에서 세션 {session} 의 transcript 파일을 찾지 못했습니다 — 아직 디스크에 기록되지 않았을 수 있습니다"
not_watched = "surface {surface} 는 watch 대상이 아닙니다"
missing_request_id = "request_id가 없습니다. 이벤트를 요청과 연결할 수 있도록 --request-id <id>를 지정하세요. 웹훅 응답은 고정 ACK이므로 ID는 호출자가 정해야 합니다."
request_id_too_long = "request_id가 {max}바이트 상한을 넘었습니다. 턴의 모든 이벤트에 복사되므로 UUID처럼 짧은 ID를 사용하세요."
turn_not_watched = "surface {surface}를 추적하고 있지 않습니다. 턴을 열기 전에 `agent-stream watch --surface {surface}`를 실행하세요."
turn_already_open = "surface {surface}에 request_id {request}의 턴이 열려 있습니다. 한 번에 하나만 열 수 있으므로 turn_end를 받은 뒤 다음 턴을 시작하세요."
registry_poisoned = "agent-stream 레지스트리 잠금을 보유한 스레드에서 패닉이 발생했습니다: {detail}"
serve_port_required = "포트를 지정하지 않았습니다. --port <n>을 입력하세요. 구독 주소를 알 수 있도록 포트는 자동으로 고르지 않습니다."
serve_port_out_of_range = "포트 {port} 는 포트 번호 범위(1-65535)를 벗어납니다 — 범위 안의 값을 --port 로 넘기세요"
serve_invalid_bind = "바인딩 주소 {bind}가 올바른 IP 주소가 아닙니다. 127.0.0.1, ::1 또는 인터페이스의 주소를 지정하세요."
serve_remote_bind_needs_token = "토큰 없이 {bind}에서 연결을 받을 수 없습니다. 대화 전문을 전송하므로 루프백 이외의 주소에는 --token이 필요합니다."
serve_bind_failed = "SSE 엔드포인트를 {addr} 에 bind 할 수 없습니다: {detail} — 포트를 비우거나 다른 포트를 지정하세요(자동 폴백 없음)"
serve_not_running = "SSE 엔드포인트가 실행 중이 아닙니다."

[agent_stream.cli.sub.watch]
description = "서피스의 에이전트 세션 기록을 추적합니다. 서피스 메타데이터에 세션 ID가 있어야 합니다."

[agent_stream.cli.sub.turn-start]
description = "추적 중인 서피스에 턴을 열고 이벤트에 호출자의 request_id를 붙입니다. 웹훅 IpcSequence에서는 claude.tell보다 먼저 호출하세요. 추적하지 않는 서피스나 중복 턴은 거부합니다."

[agent_stream.cli.sub.unwatch]
description = "서피스 추적 중지. 마지막 turn_end{reason=stream:unwatched} 이벤트 발행"

[agent_stream.cli.sub.list]
description = "추적 중인 모든 서피스의 세션 ID·기록 경로·바이트 위치·상태 나열"

[agent_stream.cli.sub.poll]
description = "시퀀스 커서로 수집된 이벤트 읽기(비파괴). 이벤트 종류: text / thinking / tool_use / turn_end"

[agent_stream.cli.sub.serve]
description = "외부 소비자가 구독할 SSE 엔드포인트(GET /events) 열기. 포트는 필수이며 자동 폴백 없음. 다시 호출하면 새 설정으로 재바인딩"

[agent_stream.cli.sub.serve-stop]
description = "SSE 엔드포인트를 닫고 열린 모든 구독 종료"

[agent_stream.cli.sub.serve-info]
description = "엔드포인트 상태와 구독자별 집계값을 보여줍니다. 토큰은 포함하지 않습니다."

[agent_stream.cli.arg.watch_args.surface]
help = "에이전트를 실행 중인 서피스 ID(기본값: 호출자의 TASTY_SURFACE_ID)"

[agent_stream.cli.arg.watch_args.from_start]
help = "현재 파일 끝 대신 바이트 0부터 기록 재생"

[agent_stream.cli.arg.unwatch_args.surface]
help = "추적을 중지할 서피스 ID(기본값: 호출자의 TASTY_SURFACE_ID)"

[agent_stream.cli.arg.turn_start_args.surface]
help = "턴을 열 에이전트의 서피스(기본값: 호출자의 TASTY_SURFACE_ID). 이미 관찰 중이어야 함"

[agent_stream.cli.arg.turn_start_args.request_id]
help = "호출자가 정한 ID입니다. 턴의 각 이벤트에 request_id로 붙으며 수신 측이 요청과 연결하는 데 사용합니다."

[agent_stream.cli.arg.turn_start_args.timeout_secs]
help = "턴 유휴 제한 시간(초, 기본값 600, 범위 10-86400). 이 시간 동안 이벤트와 turn_end가 없으면 turn_end{reason=stream:turn_timeout}으로 턴 종료"

[agent_stream.cli.arg.poll_args.filter_surface]
help = "이 서피스에서 수집한 이벤트만 반환(기본값 없음. 생략하면 관찰 중인 모든 서피스)"

[agent_stream.cli.arg.poll_args.after_seq]
help = "커서보다 seq가 큰 이벤트 반환(기본값 0 = 버퍼의 가장 오래된 이벤트부터)"

[agent_stream.cli.arg.poll_args.limit]
help = "반환할 최대 이벤트 수(기본값 100, 최대 1000)"

[agent_stream.cli.arg.serve_args.port]
help = "수신할 TCP 포트. 자동 선택하지 않아 재시작 후에도 주소가 같도록 필수 지정"

[agent_stream.cli.arg.serve_args.bind]
help = "바인딩 주소(기본값 127.0.0.1). --token 없이 루프백 이외 주소는 거부"

[agent_stream.cli.arg.serve_args.token]
help = "공유 구독 토큰. 구독자는 'Authorization: Bearer <token>' 또는 '?token=<token>'으로 전달. 생략하면 인증 없음(루프백만 허용)"
