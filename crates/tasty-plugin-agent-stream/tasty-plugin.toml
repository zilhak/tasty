manifest_version = 1
id = "com.tasty.agent-stream"
name = "Agent Stream"
version = "0.1.16"
description = "Tails AI agent session transcripts and normalizes them into structured stream events"
api_version = "1"
# 배포 패키징(DMG / AppImage / MSIX / deb)에서는 아직 제외한다. 이유:
#  - 배포 대상이 되는 것은 ADR-0100 의 재검토 트리거다 — "tasty 를 설치하면 딸려오는
#    것이 대화 전문을 네트워크로 내보낼 수 있다" 는 의미가 되므로, 기본 비활성만으로
#    충분한지 다시 판단한 뒤에 켠다.
# 인바운드 웹훅 배선은 이제 성립한다(`agent_stream.turn_start` correlation + 본체 웹훅
# 리스너에 owner 가 IpcSequence 를 등록). 배선 자체는 코드가 아니라 owner 운영 작업이라
# plugin 이 딸려 보내는 것은 여전히 수집 + SSE + turn correlation 까지다.
# 워크스페이스 빌드의 dev 번들 sync(`ensure_dev_bundle`)는 이 플래그와 무관하게 그대로
# 동작하므로 개발/검증에는 영향이 없다(mesh-demo 와 같은 취급).
bundle = false
permissions = [
    # surface.meta.get(claude-session-id 조회) · surface.locate(대상 생존 확인).
    "surface.read",
    # transcript JSONL 읽기. 플러그인 프로세스의 직접 std::fs 는 호스트 권한 게이트가
    # 강제하지 않지만(plugin-development §10), 실제로 하는 일을 매니페스트에 정직하게
    # 선언해 사용자가 grant 시점에 알 수 있게 한다.
    "fs.read",
    # data_dir 의 watch 스냅샷(`watches.json`) 쓰기. 강제 재시작 후 등록을 되살리기 위한
    # 것으로, 쓰는 대상은 이 plugin 의 data_dir 하나뿐이다. fs.read 와 같은 이유로
    # 매니페스트에 정직하게 선언한다.
    "fs.write",
    # SSE 엔드포인트가 TCP 포트를 연다(`agent_stream.serve`). 기본 bind 는 loopback 이고,
    # 그보다 넓은 주소는 토큰 없이는 거부한다 — ADR-0100.
    "network",
]
lang_dir = "lang"

[entry]
type = "process"
command = "tasty-plugin-agent-stream"

[[contributes.ipc_namespace]]
prefix = "agent_stream"

[[contributes.cli]]
name = "agent-stream"
description = "Tail an AI agent session transcript and read normalized stream events"
description_i18n_key = "agent_stream.cli.desc"
subcommands = [
    { name = "watch",   ipc_method = "agent_stream.watch",   args = "watch_args",   description = "Start tailing the transcript of the agent session running in a surface. Resolves the session id from surface meta; fails loudly when it is absent." },
    { name = "turn-start", ipc_method = "agent_stream.turn_start", args = "turn_start_args", description = "Open a correlation turn on a watched surface so the events it produces carry the caller-provided request_id. Use it as the first step of a webhook IpcSequence, before claude.tell. Rejected if the surface is not watched or a turn is already open." },
    { name = "unwatch", ipc_method = "agent_stream.unwatch", args = "unwatch_args", description = "Stop tailing a surface. Emits a final turn_end{reason=unwatched} event." },
    { name = "list",    ipc_method = "agent_stream.list",    args = "no_args",      description = "List every surface currently being tailed with its session id, transcript path, byte offset and status" },
    { name = "poll",    ipc_method = "agent_stream.poll",    args = "poll_args",    description = "Read collected stream events by sequence cursor (non-destructive). Events are text / thinking / tool_use / turn_end." },
    { name = "serve",      ipc_method = "agent_stream.serve",      args = "serve_args", description = "Open the SSE endpoint (GET /events) so an external consumer can subscribe. The port is required — there is no automatic fallback. Calling it again rebinds with the new settings." },
    { name = "serve-stop", ipc_method = "agent_stream.serve_stop", args = "no_args",    description = "Close the SSE endpoint and end every open subscription" },
    { name = "serve-info", ipc_method = "agent_stream.serve_info", args = "no_args",    description = "Report the SSE endpoint state and per-subscriber counters. Never reports the token." },
]

[contributes.cli.arg_groups.watch_args]
flags = [
    { name = "surface",    type = "u32",  flag = "--surface",    required = false, help = "Surface ID running the agent (defaults to caller's TASTY_SURFACE_ID)" },
    { name = "from_start", type = "bool", flag = "--from-start", required = false, help = "Replay the transcript from byte 0 instead of starting at the current end of file" },
]

[contributes.cli.arg_groups.unwatch_args]
flags = [
    { name = "surface", type = "u32", flag = "--surface", required = false, help = "Surface ID to stop tailing (defaults to caller's TASTY_SURFACE_ID)" },
]

[contributes.cli.arg_groups.turn_start_args]
flags = [
    { name = "surface",      type = "u32",    flag = "--surface",      required = false, help = "Surface running the agent whose turn to open (defaults to caller's TASTY_SURFACE_ID). Must already be watched." },
    { name = "request_id",   type = "string", flag = "--request-id",   required = true,  help = "Caller-provided correlation id. Every event this turn produces carries it as request_id; the FE matches responses to requests by it." },
    { name = "timeout_secs", type = "u32",    flag = "--timeout-secs", required = false, help = "Idle timeout for this turn in seconds (default 600, range 10-86400). If no event and no turn_end arrive for this long, the turn is closed with turn_end{reason=stream:turn_timeout}." },
]

[contributes.cli.arg_groups.poll_args]
flags = [
    # 이름이 `surface` 면 CLI 계층이 TASTY_SURFACE_ID 로 자동 채운다
    # (crates/tasty-cli/src/dynamic/request.rs) — poll 의 surface 는 "대상 지정"이 아니라
    # "선택적 필터"라, 자동 채움이 붙으면 사용자가 지정하지 않았는데도 호출자 자신의
    # surface 로 조용히 좁혀진다. 그래서 파라미터 이름을 `filter_surface` 로 둔다.
    { name = "filter_surface", type = "u32", flag = "--surface", required = false, help = "Only return events collected for this surface (no default — omitting it returns every watched surface)" },
    { name = "after_seq", type = "i64", flag = "--after-seq", required = false, help = "Return events with seq strictly greater than this cursor (default: 0 = from the oldest buffered event)" },
    { name = "limit",     type = "u32", flag = "--limit",     required = false, help = "Maximum number of events to return (default 100, max 1000)" },
]

[contributes.cli.arg_groups.serve_args]
flags = [
    { name = "port",  type = "u32",    flag = "--port",  required = true,  help = "TCP port to listen on. Required — the endpoint never picks a port by itself, so the address stays the same across restarts." },
    { name = "bind",  type = "string", flag = "--bind",  required = false, help = "Bind address (default 127.0.0.1). A non-loopback address is rejected unless --token is given." },
    { name = "token", type = "string", flag = "--token", required = false, help = "Shared subscription token. Subscribers present it as 'Authorization: Bearer <token>' or '?token=<token>'. Omit for no authentication (loopback only)." },
]

[contributes.cli.arg_groups.no_args]
