# 호스트 기본 핸들러는 System으로 OS의 파일 열기 기능을 사용한다.
# priority가 작을수록 먼저 선택한다. 아래 기본값은 50이다.
# 형식을 식별하지 못하면 별도 handler 대신 picker가 처리한다.

[[handler]]
id = "html-system"
detector = "html"
priority = 50

[handler.action]
kind = "system"

[[handler]]
id = "directory-system"
detector = "$directory"
priority = 50

[handler.action]
kind = "system"
