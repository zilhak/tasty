[package]
name = "tasty-file-handler"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "File handler policy and registry for Tasty — detector-to-handler mapping, user overrides, plugin contributions, and recent picks. Domain-only: no host, GUI, or IPC coupling."

[dependencies]
tasty-utils = { path = "../tasty-utils" }
tasty-file-format = { path = "../tasty-file-format" }
# plugin 이 handler 레지스트리를 조회하는 port trait 이 wire 정의 크레이트에 산다.
# 고아 규칙상 그 impl 은 타입을 소유한 이 크레이트에만 둘 수 있다 — `tasty-file-format`
# 과 같은 이유이고 같은 결정이다.
tasty-plugin-protocol = { path = "../tasty-plugin-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "0.8"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
