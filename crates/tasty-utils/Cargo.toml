[package]
name = "tasty-utils"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Cross-cutting utility helpers for Tasty — path resolution, etc. Small leaf crate, must not depend on any tasty-* crate."

[dependencies]
directories = "6"
tracing = "0.1"

[features]
# 소비 크레이트의 dev-dependency에서만 켜는 스레드 로컬 홈 경로 override.
# release 여부와 무관하게 feature를 켜면 컴파일된다.
test-support = []

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
