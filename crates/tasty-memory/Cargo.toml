[package]
name = "tasty-memory"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Agent-facing persistent key-value store backed by SQLite (~/.tasty/memory.db)"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
thiserror = "2"
tasty-utils = { path = "../tasty-utils" }

[features]
# writer 없이 호출 스레드에서 실행하는 핸들과 시험이 직접 잠그는 공유 저장소. 다른 크레이트의 시험이
# dev-dependency로 켠다. 제품 빌드에는 없다.
test-support = []

[[example]]
name = "commit_baseline"
required-features = ["test-support"]

[dev-dependencies]
tempfile = "3"
# 실패 경고를 실제 로그로 확인하는 시험에 사용한다.
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[lints]
workspace = true
