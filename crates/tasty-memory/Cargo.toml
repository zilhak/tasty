[package]
name = "tasty-memory"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Agent-facing persistent key-value store backed by SQLite (~/.tasty/memory.db)"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
thiserror = "2"
tasty-utils = { path = "../tasty-utils" }

[dev-dependencies]
tempfile = "3"
# 경고가 실제로 나가는지 재기 위한 로그 캡처. 같은 쓰임의 선례가
# `crates/tasty-timer` 에 있고 같은 버전·feature 를 쓴다.
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[lints]
workspace = true
