[package]
name = "tasty-memory"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Agent-facing persistent key-value store backed by SQLite (~/.tasty/memory.db)"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
thiserror = "2"
tasty-utils = { path = "../tasty-utils" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
