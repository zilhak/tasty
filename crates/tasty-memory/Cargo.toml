[package]
name = "tasty-memory"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Agent-facing persistent key-value store backed by SQLite (~/.tasty/memory.db)"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
thiserror = "2"
directories = "6"
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc", "getrandom"] }
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "linux-native"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
