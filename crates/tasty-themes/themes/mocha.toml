# Catppuccin Mocha — 내장 다크 테마.
# Tasty 홈의 파일을 읽거나 파싱할 수 없으면 이 내용으로 복원한다.
# 일부 색만 정의한 사용자 테마에서는 누락된 필드의 이전 값을 유지한다.

label = "Catppuccin Mocha"
is_light = false

[palette]
crust    = "#11111b"
mantle   = "#181825"
base     = "#1e1e2e"
surface0 = "#313244"
surface1 = "#45475a"
surface2 = "#585b70"
overlay0 = "#6c7086"
overlay1 = "#7f849c"
overlay2 = "#9399b2"
text     = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
placeholder = "#6c7086"

[accent]
blue      = "#89b4fa"
green     = "#a6e3a1"
red       = "#f38ba8"
yellow    = "#f9e2af"
peach     = "#fab387"
mauve     = "#cba6f7"
teal      = "#94e2d5"
sky       = "#89dceb"
lavender  = "#b4befe"
flamingo  = "#f2cdcd"
pink      = "#f5c2e7"
maroon    = "#eba0ac"
rosewater = "#f5e0dc"

[terminal]
selection_bg = "#585b70"
vi_cursor_bg = "#b4befe"               # lavender — vi copy mode cursor cell
search_match_bg = "#f9e2af4d"          # yellow @ ~30% alpha
search_match_active_bg = "#f9e2afb3"   # yellow @ ~70% alpha

# 서피스 종류별 포커스·비포커스 색상. 사용자 테마에서는 surfaces.<kind>를 추가할 수 있다.
[surfaces.terminal]
focused_bg   = "#000000"
focused_fg   = "#cdd6f4"   # = text
unfocused_bg = "#1e1e2e"   # = base
unfocused_fg = "#a6adc8"   # = subtext0

[surfaces.markdown]
focused_bg   = "#11111b"   # = crust (webview 렌더 경로의 유일한 배경 — focus 신호 없음)
focused_fg   = "#cdd6f4"   # = text
unfocused_bg = "#181825"   # = mantle (webview 경로에서 미사용, egui 경로 잔존값)
unfocused_fg = "#a6adc8"   # = subtext0

[ansi]
black   = "#45475a"   # surface1
red     = "#f38ba8"
green   = "#a6e3a1"
yellow  = "#f9e2af"
blue    = "#89b4fa"
magenta = "#cba6f7"
cyan    = "#94e2d5"
white   = "#bac2de"   # subtext1
bright_black   = "#6c7086"   # overlay0
bright_red     = "#f38ba8"
bright_green   = "#a6e3a1"
bright_yellow  = "#f9e2af"
bright_blue    = "#89b4fa"
bright_magenta = "#cba6f7"
bright_cyan    = "#89dceb"   # sky
bright_white   = "#cdd6f4"   # text
