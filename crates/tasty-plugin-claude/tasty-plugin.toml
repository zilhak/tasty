[contributes.cli.arg_groups.no_args]

# 완료 조회는 자기 namespace의 메서드만 사용할 수 있어 claude.state를 사용한다.
# idle·needs_input은 작업이 멈춘 상태로, exited는 실패로 처리한다.
[[contributes.completion_strategy]]
id = "spawn-wait"
priority = 100
default_for_methods = ["claude.spawn"]

[contributes.completion_strategy.spec]
kind = "poll"
poll_method = "claude.state"
# spawn 결과의 자식 surface id를 상태 조회의 대상 인자로 넘긴다.
map_from_response = { child_surface_id = "surface_id" }
state_field = "state"
terminal_states = ["idle", "needs_input"]
# 자식 프로세스·surface 종료는 실패로 판정해 on_failure를 적용한다.
# 승인 대기인 needs_input은 기존 완료 알림과 같은 기준으로 terminal_states에 둔다.
failure_states = ["exited"]

# tell 응답은 메시지 전달까지만 뜻하므로 claude.state로 이후 상태를 확인한다.
# 호스트 terminal.tell이 새 입력 후 기존 idle 상태를 지우는 동작에 의존한다.
[[contributes.completion_strategy]]
id = "tell-wait"
priority = 100
default_for_methods = ["claude.tell"]

[contributes.completion_strategy.spec]
kind = "poll"
poll_method = "claude.state"
# tell 응답은 대상 surface_id를 포함하므로 응답에서 조회 인자를 가져온다.
map_from_response = { surface_id = "surface_id" }
state_field = "state"
terminal_states = ["idle", "needs_input"]
# spawn과 같은 완료·실패 기준을 사용한다.
failure_states = ["exited"]

[[contributes.settings_pages]]
id = "claude"
title_key = "settings.subtab.claude"
category = "plugin"

[[contributes.settings_pages.items]]
kind = "number"
id = "spawn_child_warn_threshold"
label_key = "claude.settings.spawn_child_warn_threshold"
storage_key = "spawn_child_warn_threshold"
default = 6.0
min = 1.0

# 완료 표식이 없어도 계속 연장되지 않도록 회차를 제한한다. 자체 상한이 없는 모든 게이트에 적용한다.
[[contributes.settings_pages.items]]
kind = "number"
id = "continue_checklist_round_limit"
label_key = "claude.settings.continue_checklist_round_limit"
storage_key = "continue_checklist_round_limit"
default = 3.0
min = 1.0

# inherit는 플래그를 붙이지 않아 Claude Code의 설정을 따른다.
# 호출별 --permission-mode를 지정하면 이 기본값보다 우선한다.
[[contributes.settings_pages.items]]
kind = "select"
id = "default_permission_mode"
label_key = "claude.settings.default_permission_mode"
storage_key = "default_permission_mode"
default = "inherit"
options = [
    { value = "inherit",           label_key = "claude.settings.permission_mode.inherit" },
    { value = "manual",            label_key = "claude.settings.permission_mode.manual" },
    { value = "plan",              label_key = "claude.settings.permission_mode.plan" },
    { value = "acceptEdits",       label_key = "claude.settings.permission_mode.accept_edits" },
    { value = "auto",              label_key = "claude.settings.permission_mode.auto" },
    { value = "dontAsk",           label_key = "claude.settings.permission_mode.dont_ask" },
    { value = "bypassPermissions", label_key = "claude.settings.permission_mode.bypass" },
]

# 사용자 세션에 문구를 보내므로 자동 재개는 기본적으로 꺼져 있다.
# 지연은 예약 때, 활성 여부와 횟수 상한은 전송을 판단할 때 읽는다.
# docs/plugins/claude/index.md#api-에러-뒤-자동-재개-auto_resumers 참고.
[[contributes.settings_pages.items]]
kind = "toggle"
id = "auto_resume_enabled"
label_key = "claude.settings.auto_resume_enabled"
storage_key = "auto_resume_enabled"
default = false

[[contributes.settings_pages.items]]
kind = "number"
id = "auto_resume_delay_secs"
label_key = "claude.settings.auto_resume_delay_secs"
storage_key = "auto_resume_delay_secs"
default = 10.0
min = 1.0
max = 86400.0

[[contributes.settings_pages.items]]
kind = "number"
id = "auto_resume_max_attempts"
label_key = "claude.settings.auto_resume_max_attempts"
storage_key = "auto_resume_max_attempts"
default = 5.0
min = 1.0
