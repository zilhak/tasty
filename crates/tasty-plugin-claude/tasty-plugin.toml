manifest_version = 1
id = "com.tasty.claude"
name = "Claude Code"
version = "0.1.167"
description = "Claude Code CLI integration for Tasty"
api_version = "1"
permissions = [
    "surface.read",
    "surface.write",
    "terminal.spawn",
    "terminal.write",
    "terminal.read",
    "fs.read",
    "fs.write",
    "notification",
    "telemetry",
    # 자식의 호스트 IPC 인증에 사용할 세션 토큰을 발급한다.
    "agent",
    "ui.settings_page",
    # `claude.spawn`/`claude.tell` 기본 완료 전략 선언에 필요.
    "completion_strategy.define",
    # Stop 훅 게이트의 본문에 넣을 세션 목표를 조회한다.
    "memory.read",
    # 자식 토큰으로 Codex namespace를 호출할 수 있도록 전달할 권한이다.
    # 자기 namespace인 claude의 호출 권한은 소유자이므로 별도 선언 없이 전달한다.
    "ipc.invoke:codex",
]
lang_dir = "lang"

[entry]
type = "process"
command = "tasty-plugin-claude"

[[contributes.ipc_namespace]]
prefix = "claude"

# 등록·실행할 훅 이벤트는 이 목록에 선언해야 한다.
[[contributes.hook_events]]
key = "claude-idle"
description = "Claude instance became idle (Stop hook)"

[[contributes.hook_events]]
key = "needs-input"
description = "Claude instance is waiting for user input (Notification hook)"

[[contributes.hook_events]]
key = "claude-stop-failure"
description = "Claude's turn ended on an API error (StopFailure hook — overloaded, rate limit, auth failure, ...). The error kind is in surface meta claude-last-stop-failure. Usually fires together with claude-idle; when background work started in the turn is still running, the state stays active, claude-idle does not fire and this event fires alone"

[[contributes.hook_events]]
key = "claude-error"
description = "Claude output matched an error pattern"

[[contributes.hook_events]]
key = "claude-error-stalled"
description = "Claude produced no output for a sustained period while the host still sees an unfinished turn (active or stale) — likely stuck. Fires with or without a preceding error; the notification text says which"

[[contributes.cli]]
name = "claude"
description = "Claude Code CLI integration (launch, spawn, kill, etc.)"
description_i18n_key = "claude.cli.desc"
subcommands = [
    { name = "launch",    ipc_method = "claude.launch",    args = "launch_args",    description = "Launch Claude Code in a new workspace", description_i18n_key = "claude.cli.sub.launch.description" },
    { name = "spawn",     ipc_method = "claude.spawn",     args = "spawn_args",     description = "Spawn a child Claude instance into a workspace. Returns immediately; a notification is delivered to the caller surface every time the child transitions to idle/needs_input, and once more when it exits — not just the first transition.", description_i18n_key = "claude.cli.sub.spawn.description" },
    { name = "children",  ipc_method = "claude.children",  args = "children_args",  description = "List children of the specified Claude parent", description_i18n_key = "claude.cli.sub.children.description" },
    { name = "parent",    ipc_method = "claude.parent",    args = "parent_args",    description = "Show the parent of the specified Claude child", description_i18n_key = "claude.cli.sub.parent.description" },
    { name = "state",     ipc_method = "claude.state",     args = "state_args",     description = "Query a single child's status: idle, needs_input, active, or exited (live-surface cross-checked)", description_i18n_key = "claude.cli.sub.state.description" },
    { name = "tell",      ipc_method = "claude.tell",      args = "tell_args",      description = "Send a message to a Claude instance (multi-line, submits at end). Returns immediately; a notification is delivered to the caller surface every time the target transitions to idle/needs_input, and once more when it exits — not just the first transition.", description_i18n_key = "claude.cli.sub.tell.description" },
    { name = "broadcast", ipc_method = "claude.broadcast", args = "broadcast_args", description = "Broadcast text to all children of a parent Claude instance", description_i18n_key = "claude.cli.sub.broadcast.description" },
    { name = "kill",      ipc_method = "claude.kill",      args = "kill_args",      description = "Kill a child Claude instance by child index", description_i18n_key = "claude.cli.sub.kill.description" },
    { name = "respawn",   ipc_method = "claude.respawn",   args = "respawn_args",   description = "Respawn a child Claude instance", description_i18n_key = "claude.cli.sub.respawn.description" },
    { name = "reboot",    ipc_method = "claude.reboot",    args = "reboot_args",    description = "Restart the Claude instance in a surface and resume the same session (delayed kill + claude -r). Call this as the LAST action of a turn — anything after the delay is cut off.", description_i18n_key = "claude.cli.sub.reboot.description" },
    # 자식에게 프로필을 적용한다. --child가 필요하며 해당 자식의 reboot 경로를 사용한다.
    { name = "child-profile", ipc_method = "claude.child_profile", args = "child_profile_args", description = "Attach a persistent Claude session profile to a CHILD instance (resolves --child to its surface, then runs the same sequence as 'claude reboot --profile' on it). Unlike reboot, this does NOT cut off the caller's turn — only the child restarts. A notification is delivered to the caller surface when the child transitions to idle/needs_input, and once more when it exits.", description_i18n_key = "claude.cli.sub.child-profile.description" },
    { name = "install",   ipc_method = "claude.install",   args = "no_args",        description = "Install tasty hooks into ~/.claude/settings.json, or update existing Tasty entries whose matcher or command is out of date. The reply lists added events under installed and updated ones under updated.", description_i18n_key = "claude.cli.sub.install.description" },
    { name = "uninstall", ipc_method = "claude.uninstall", args = "no_args",        description = "Uninstall tasty hooks from ~/.claude/settings.json", description_i18n_key = "claude.cli.sub.uninstall.description" },
    { name = "hook",      ipc_method = "claude.hook",      args = "hook_args",      stdin_json = true, description = "Claude Code hook integration. Reads JSON payload from stdin (session_id, cwd, prompt_id, message, notification_type, error, agent_id, background_tasks, tool_name, tool_response, prompt, source, reason) when invoked by Claude Code's hook system. Also reads waiting_on_background_work defensively, although neither the official hooks documentation nor observed payloads include it.", description_i18n_key = "claude.cli.sub.hook.description" },
    # 전역 훅에 넣지 않고 게이트를 적용한 세션에서만 등록한다.
    # Stop payload와 --gate를 별도 인자로 받아 판정한다.
    { name = "checklist-hook", ipc_method = "claude.checklist_hook", args = "checklist_hook_args", stdin_json = true, description = "Stop-hook gate decision. Reads JSON payload from stdin (session_id, prompt_id, stop_hook_active, last_assistant_message); --gate selects which registered gate decides (default: continue-checklist).", description_i18n_key = "claude.cli.sub.checklist-hook.description" },
    # gate를 생략하면 기본 게이트를 켜거나 끈다.
    { name = "checklist-enable",  ipc_method = "claude.checklist_enable",  args = "checklist_gate_args", description = "Turn on a Stop-hook gate (creates its enabled marker). Defaults to the built-in continue-checklist gate.", description_i18n_key = "claude.cli.sub.checklist-enable.description" },
    { name = "checklist-disable", ipc_method = "claude.checklist_disable", args = "checklist_gate_args", description = "Turn off a Stop-hook gate (removes its enabled marker). Succeeds even if it was already off.", description_i18n_key = "claude.cli.sub.checklist-disable.description" },
    { name = "checklist-status",  ipc_method = "claude.checklist_status",  args = "checklist_gate_args", description = "Show whether a Stop-hook gate is currently on. Use 'claude gate-list' to see every gate's on/off at once.", description_i18n_key = "claude.cli.sub.checklist-status.description" },
    { name = "notify-error", ipc_method = "claude.notify_error", args = "notify_error_args", description = "Internal: notify the caller that a child may be stalled after a long period without output changes. Used as the hook.set command for claude-error-stalled. Does not change child state or remove or re-register completion hooks.", description_i18n_key = "claude.cli.sub.notify-error.description" },
    { name = "notify-stop-failure", ipc_method = "claude.notify_stop_failure", args = "notify_error_args", description = "Internal: when a child's turn ended on an API error while background work keeps it waiting, write one line to the caller's notification log. Writes nothing when the turn simply ended, since the completion line already names the error. Used as the hook.set command for claude-stop-failure.", description_i18n_key = "claude.cli.sub.notify-stop-failure.description" },
    { name = "notify-done", ipc_method = "claude.notify_done", args = "notify_done_args", description = "Internal: report a spawn/tell state transition to the caller and remove matching once-hooks. If the target surface can still be found, register the three completion hooks again. Used as the hook.set command for claude-idle/needs-input/process-exit.", description_i18n_key = "claude.cli.sub.notify-done.description" },
    # CLI가 한 단계의 하위 명령을 지원하므로 profile-* 이름을 사용한다.
    { name = "profile-register",   ipc_method = "claude.profile_register",   args = "profile_register_args",   description = "Register a Claude session profile under a name (copies the file into plugin-private storage; re-registering the same name updates its content)", description_i18n_key = "claude.cli.sub.profile-register.description" },
    { name = "profile-unregister", ipc_method = "claude.profile_unregister", args = "profile_name_args",       description = "Remove a registered Claude session profile", description_i18n_key = "claude.cli.sub.profile-unregister.description" },
    { name = "profile-list",       ipc_method = "claude.profile_list",       args = "no_args",                 description = "List everything attachable by name — registered Claude session profiles and Stop-hook gates — plus the always-installed built-in hooks", description_i18n_key = "claude.cli.sub.profile-list.description" },
    { name = "profile-show",       ipc_method = "claude.profile_show",       args = "profile_name_args",       description = "Show what a name attaches — the raw settings JSON of a registered Claude session profile, or the generated Stop-hook fragment of a gate", description_i18n_key = "claude.cli.sub.profile-show.description" },
    { name = "profile-current",    ipc_method = "claude.profile_current",    args = "profile_current_args",    description = "Show which Claude session profile (if any) is attached to a surface, plus the always-installed built-in hooks", description_i18n_key = "claude.cli.sub.profile-current.description" },
    # 게이트도 프로필처럼 이름으로 적용한다. 같은 이름을 두 종류에 등록할 수 없다.
    { name = "gate-register",   ipc_method = "claude.gate_register",   args = "gate_register_args", description = "Register a Stop-hook gate under a name (copies the body file into plugin-private storage; re-registering the same name replaces both the body and the definition)", description_i18n_key = "claude.cli.sub.gate-register.description" },
    { name = "gate-unregister", ipc_method = "claude.gate_unregister", args = "gate_name_args",     description = "Remove a registered Stop-hook gate (deletes both its definition and its body copy)", description_i18n_key = "claude.cli.sub.gate-unregister.description" },
    { name = "gate-list",       ipc_method = "claude.gate_list",       args = "no_args",            description = "List registered Stop-hook gates plus the built-in ones, with each gate's effective sentinel, round limit and on/off state", description_i18n_key = "claude.cli.sub.gate-list.description" },
    { name = "gate-show",       ipc_method = "claude.gate_show",       args = "gate_name_args",     description = "Show a Stop-hook gate's definition and body text", description_i18n_key = "claude.cli.sub.gate-show.description" },
]

[contributes.cli.arg_groups.launch_args]
flags = [
    { name = "workspace", type = "string", flag = "--workspace", required = false, help = "Workspace name to create (defaults to \"claude\")", help_i18n_key = "claude.cli.arg.launch_args.workspace.help" },
    { name = "directory", type = "string", flag = "--directory", required = false, path_kind = "directory", help = "Working directory to cd into before launching claude", help_i18n_key = "claude.cli.arg.launch_args.directory.help" },
    { name = "task",      type = "string", flag = "--task",      required = false, help = "Initial task passed to claude as --task <text>", help_i18n_key = "claude.cli.arg.launch_args.task.help" },
    { name = "profile_file", type = "string", flag = "--profile-file", required = false, path_kind = "file", reject_repeat = true, help = "Claude session profile (settings JSON) injected via --settings when launching claude. Mutually exclusive with --profile", help_i18n_key = "claude.cli.arg.launch_args.profile_file.help" },
    { name = "profile", type = "string", flag = "--profile", required = false, help = "Registered Claude session profile or Stop-hook gate name(s) to attach, comma-separated for multiple (merged into one file — see 'claude profile-register' and 'claude gate-register'). Mutually exclusive with --profile-file", help_i18n_key = "claude.cli.arg.launch_args.profile.help" },
    { name = "permission_mode", type = "string", flag = "--permission-mode", required = false, help = "Child permission mode: acceptEdits|auto|bypassPermissions|manual|dontAsk|plan. Passed as --permission-mode and overrides default_permission_mode for this call. If omitted, use that plugin setting; inherit or no setting adds no flag, leaving Claude Code settings in control. An explicit mode cannot be combined with --profile/--profile-file that sets permissions.defaultMode.", help_i18n_key = "claude.cli.arg.launch_args.permission_mode.help" },
]

[contributes.cli.arg_groups.spawn_args]
flags = [
    { name = "surface",   type = "u32",    flag = "--surface",   required = false, help = "Parent surface ID (defaults to caller's TASTY_SURFACE_ID)", help_i18n_key = "claude.cli.arg.spawn_args.surface.help" },
    { name = "workspace", type = "string", flag = "--workspace", required = true,  help = "Target workspace (ID or name)", help_i18n_key = "claude.cli.arg.spawn_args.workspace.help" },
    { name = "pane",      type = "u32",    flag = "--pane",      required = false, help = "Target pane ID (defaults to the first pane in the workspace)", help_i18n_key = "claude.cli.arg.spawn_args.pane.help" },
    { name = "cwd",       type = "string", flag = "--cwd",       required = false, path_kind = "directory", help = "Working directory for the child Claude process", help_i18n_key = "claude.cli.arg.spawn_args.cwd.help" },
    { name = "role",      type = "string", flag = "--role",      required = false, help = "Role label attached to the child (used by broadcast --role)", help_i18n_key = "claude.cli.arg.spawn_args.role.help" },
    { name = "nickname",  type = "string", flag = "--nickname",  required = false, help = "Display nickname shown on the tab", help_i18n_key = "claude.cli.arg.spawn_args.nickname.help" },
    { name = "prompt",    type = "string", flag = "--prompt",    required = false, help = "Initial prompt sent to the child after spawn", help_i18n_key = "claude.cli.arg.spawn_args.prompt.help" },
    { name = "profile_file", type = "string", flag = "--profile-file", required = false, path_kind = "file", reject_repeat = true, help = "Claude session profile (settings JSON) injected via --settings when launching the child. Mutually exclusive with --profile", help_i18n_key = "claude.cli.arg.spawn_args.profile_file.help" },
    { name = "profile", type = "string", flag = "--profile", required = false, help = "Registered Claude session profile or Stop-hook gate name(s) to attach, comma-separated for multiple (merged into one file — see 'claude profile-register' and 'claude gate-register'). Mutually exclusive with --profile-file", help_i18n_key = "claude.cli.arg.spawn_args.profile.help" },
    { name = "permission_mode", type = "string", flag = "--permission-mode", required = false, help = "Child permission mode: acceptEdits|auto|bypassPermissions|manual|dontAsk|plan. Passed as --permission-mode and overrides default_permission_mode for this call. If omitted, use that plugin setting; inherit or no setting adds no flag, leaving Claude Code settings in control. An explicit mode cannot be combined with --profile/--profile-file that sets permissions.defaultMode.", help_i18n_key = "claude.cli.arg.spawn_args.permission_mode.help" },
]

[contributes.cli.arg_groups.children_args]
flags = [
    { name = "surface", type = "u32", flag = "--surface", required = false, help = "Parent surface ID (defaults to caller's TASTY_SURFACE_ID)", help_i18n_key = "claude.cli.arg.children_args.surface.help" },
]

[contributes.cli.arg_groups.parent_args]
flags = [
    { name = "surface", type = "u32", flag = "--surface", required = false, help = "Child Claude surface ID to look up the parent of (defaults to caller's TASTY_SURFACE_ID)", help_i18n_key = "claude.cli.arg.parent_args.surface.help" },
]

[contributes.cli.arg_groups.state_args]
flags = [
    { name = "surface", type = "u32", flag = "--surface", required = false, help = "Child Claude surface ID to query (defaults to caller's TASTY_SURFACE_ID)", help_i18n_key = "claude.cli.arg.state_args.surface.help" },
]

[contributes.cli.arg_groups.tell_args]
positional = [
    { name = "message", type = "string", required = true, help = "Message text to send. Newlines are preserved; the message is submitted automatically.", help_i18n_key = "claude.cli.arg.tell_args.message.help" },
]
flags = [
    { name = "surface",        type = "u32",  flag = "--surface",        required = false, help = "Target Claude surface ID to send the message to (defaults to caller's TASTY_SURFACE_ID)", help_i18n_key = "claude.cli.arg.tell_args.surface.help" },
    { name = "caller_surface", type = "u32",  flag = "--caller-surface", required = false, help = "Surface that should receive the completion notification (defaults to caller's TASTY_SURFACE_ID)", help_i18n_key = "claude.cli.arg.tell_args.caller_surface.help" },
]

[contributes.cli.arg_groups.notify_done_args]
flags = [
    { name = "caller_surface", type = "u32",    flag = "--caller-surface", required = true, help = "Surface that issued the spawn/tell command and should receive the notification", help_i18n_key = "claude.cli.arg.notify_done_args.caller_surface.help" },
    { name = "target_surface", type = "u32",    flag = "--target-surface", required = true, help = "Surface whose spawn/tell just completed", help_i18n_key = "claude.cli.arg.notify_done_args.target_surface.help" },
    { name = "command",        type = "string", flag = "--command",        required = true, help = "Which command completed: spawn or tell", help_i18n_key = "claude.cli.arg.notify_done_args.command.help" },
]

[contributes.cli.arg_groups.notify_error_args]
flags = [
    { name = "caller_surface", type = "u32", flag = "--caller-surface", required = true, help = "Surface that issued the spawn/tell command and should receive the notification", help_i18n_key = "claude.cli.arg.notify_error_args.caller_surface.help" },
    { name = "target_surface", type = "u32", flag = "--target-surface", required = true, help = "Child surface that stalled after an error", help_i18n_key = "claude.cli.arg.notify_error_args.target_surface.help" },
]

[contributes.cli.arg_groups.broadcast_args]
positional = [
    { name = "text", type = "string", required = true, help = "Text to broadcast. Use \\r to submit (e.g. \"hello\\r\")", help_i18n_key = "claude.cli.arg.broadcast_args.text.help" },
]
flags = [
    { name = "surface", type = "u32",    flag = "--surface", required = false, help = "Parent surface ID (defaults to caller's TASTY_SURFACE_ID)", help_i18n_key = "claude.cli.arg.broadcast_args.surface.help" },
    { name = "role",    type = "string", flag = "--role",    required = false, help = "Only send to children with this role label", help_i18n_key = "claude.cli.arg.broadcast_args.role.help" },
]

[contributes.cli.arg_groups.kill_args]
flags = [
    { name = "surface", type = "u32", flag = "--surface", required = false, help = "Parent surface ID (defaults to caller's TASTY_SURFACE_ID)", help_i18n_key = "claude.cli.arg.kill_args.surface.help" },
    { name = "child_index", type = "u32", flag = "--child",   required = true,  help = "Child index to kill", help_i18n_key = "claude.cli.arg.kill_args.child_index.help" },
]

[contributes.cli.arg_groups.respawn_args]
flags = [
    { name = "surface",  type = "u32",    flag = "--surface",  required = false, help = "Parent surface ID (defaults to caller's TASTY_SURFACE_ID)", help_i18n_key = "claude.cli.arg.respawn_args.surface.help" },
    { name = "child_index", type = "u32",    flag = "--child",    required = true,  help = "Child index to respawn", help_i18n_key = "claude.cli.arg.respawn_args.child_index.help" },
    { name = "cwd",      type = "string", flag = "--cwd",      required = false, path_kind = "directory", help = "Override working directory for the respawned process", help_i18n_key = "claude.cli.arg.respawn_args.cwd.help" },
    { name = "role",     type = "string", flag = "--role",     required = false, help = "Replace the role label of the child", help_i18n_key = "claude.cli.arg.respawn_args.role.help" },
    { name = "nickname", type = "string", flag = "--nickname", required = false, help = "Replace the display nickname of the child", help_i18n_key = "claude.cli.arg.respawn_args.nickname.help" },
    { name = "prompt",   type = "string", flag = "--prompt",   required = false, help = "Initial prompt sent to the respawned child", help_i18n_key = "claude.cli.arg.respawn_args.prompt.help" },
    { name = "profile_file", type = "string", flag = "--profile-file", required = false, path_kind = "file", reject_repeat = true, help = "Claude session profile (settings JSON) injected via --settings when relaunching the child. Mutually exclusive with --profile", help_i18n_key = "claude.cli.arg.respawn_args.profile_file.help" },
    { name = "profile", type = "string", flag = "--profile", required = false, help = "Registered Claude session profile or Stop-hook gate name(s) to attach, comma-separated for multiple (merged into one file — see 'claude profile-register' and 'claude gate-register'). Mutually exclusive with --profile-file", help_i18n_key = "claude.cli.arg.respawn_args.profile.help" },
    { name = "permission_mode", type = "string", flag = "--permission-mode", required = false, help = "Child permission mode: acceptEdits|auto|bypassPermissions|manual|dontAsk|plan. Passed as --permission-mode and overrides default_permission_mode for this call. If omitted, use that plugin setting; inherit or no setting adds no flag, leaving Claude Code settings in control. An explicit mode cannot be combined with --profile/--profile-file that sets permissions.defaultMode.", help_i18n_key = "claude.cli.arg.respawn_args.permission_mode.help" },
]

[contributes.cli.arg_groups.reboot_args]
flags = [
    { name = "surface", type = "u32",    flag = "--surface", required = false, help = "Target Claude surface ID (defaults to caller's TASTY_SURFACE_ID)", help_i18n_key = "claude.cli.arg.reboot_args.surface.help" },
    { name = "delay",   type = "u32",    flag = "--delay",   required = false, help = "Seconds to wait before killing Claude (default: 5)", help_i18n_key = "claude.cli.arg.reboot_args.delay.help" },
    { name = "prompt",  type = "string", flag = "--prompt",  required = false, help = "Extra text appended to the reboot notice prompt sent to the restarted Claude", help_i18n_key = "claude.cli.arg.reboot_args.prompt.help" },
    { name = "profile_file", type = "string", flag = "--profile-file", required = false, path_kind = "file", reject_repeat = true, help = "Claude session profile (settings JSON) to attach via --settings on resume. Persists on the surface and is inherited by future reboots until cleared with --clear-profile. Mutually exclusive with --profile", help_i18n_key = "claude.cli.arg.reboot_args.profile_file.help" },
    { name = "profile", type = "string", flag = "--profile", required = false, help = "Registered Claude session profile or Stop-hook gate name(s) to attach, comma-separated for multiple (merged into one file — see 'claude profile-register' and 'claude gate-register'). Persists on the surface (re-resolved from the registry on each future reboot, so edits to the profile or gate are picked up) and is inherited until cleared with --clear-profile. Mutually exclusive with --profile-file", help_i18n_key = "claude.cli.arg.reboot_args.profile.help" },
    { name = "clear_profile", type = "bool", flag = "--clear-profile", required = false, help = "Detach a previously attached session profile (path- or name-based) before resuming", help_i18n_key = "claude.cli.arg.reboot_args.clear_profile.help" },
    { name = "permission_mode", type = "string", flag = "--permission-mode", required = false, help = "Child permission mode: acceptEdits|auto|bypassPermissions|manual|dontAsk|plan. Passed as --permission-mode and overrides default_permission_mode for this call. If omitted, use that plugin setting; inherit or no setting adds no flag, leaving Claude Code settings in control. An explicit mode cannot be combined with --profile/--profile-file that sets permissions.defaultMode.", help_i18n_key = "claude.cli.arg.reboot_args.permission_mode.help" },
]

