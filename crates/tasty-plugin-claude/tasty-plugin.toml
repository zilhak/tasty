manifest_version = 1
id = "com.tasty.claude"
name = "Claude Code"
version = "0.1.29"
description = "Claude Code CLI integration for Tasty"
api_version = "1"
permissions = [
    "surface.read",
    "surface.write",
    "terminal.spawn",
    "terminal.write",
    "terminal.read",
    "fs.read",
    "fs.write",
    "notification",
    "telemetry",
    # Phase 6.2: 자식 Claude 인스턴스에 session token 을 발급한다.
    # 자식이 호스트에 IPC 호출 시 envelope.session_token 으로 신원을 증명.
    "agent",
    "ui.settings_page",
    # `claude.spawn` 기본 완료 전략 선언에 필요.
    "completion_strategy.define",
]
lang_dir = "lang"

[entry]
type = "process"
command = "tasty-plugin-claude"

[[contributes.ipc_namespace]]
prefix = "claude"

# 이 plugin 이 `surface.fire_hook` 로 발사하는 surface hook 이벤트 카탈로그.
# host 가 `hook.set` / `surface.fire_hook` 등록을 (내장 ∪ 활성 plugin 선언) 으로
# 검증하므로, 여기 선언되지 않은 키는 plugin 활성 상태여도 거부된다.
[[contributes.hook_events]]
key = "claude-idle"
description = "Claude instance became idle (Stop hook)"

[[contributes.hook_events]]
key = "needs-input"
description = "Claude instance is waiting for user input (Notification hook)"

[[contributes.hook_events]]
key = "claude-error"
description = "Claude output matched an error pattern"

[[contributes.cli]]
name = "claude"
description = "Claude Code CLI integration (launch, spawn, kill, etc.)"
description_i18n_key = "claude.cli.desc"
subcommands = [
    { name = "launch",    ipc_method = "claude.launch",    args = "launch_args",    description = "Launch Claude Code in a new workspace" },
    { name = "spawn",     ipc_method = "claude.spawn",     args = "spawn_args",     description = "Spawn a child Claude instance into a workspace. Returns immediately; a notification is delivered to the caller surface every time the child transitions to idle/needs_input, and once more when it exits — not just the first transition." },
    { name = "children",  ipc_method = "claude.children",  args = "children_args",  description = "List children of the specified Claude parent" },
    { name = "parent",    ipc_method = "claude.parent",    args = "parent_args",    description = "Show the parent of the specified Claude child" },
    { name = "state",     ipc_method = "claude.state",     args = "state_args",     description = "Query a single child's status: idle, needs_input, active, or exited (live-surface cross-checked)" },
    { name = "tell",      ipc_method = "claude.tell",      args = "tell_args",      description = "Send a message to a Claude instance (multi-line, submits at end). Returns immediately; a notification is delivered to the caller surface every time the target transitions to idle/needs_input, and once more when it exits — not just the first transition." },
    { name = "broadcast", ipc_method = "claude.broadcast", args = "broadcast_args", description = "Broadcast text to all children of a parent Claude instance" },
    { name = "kill",      ipc_method = "claude.kill",      args = "kill_args",      description = "Kill a child Claude instance by child index" },
    { name = "respawn",   ipc_method = "claude.respawn",   args = "respawn_args",   description = "Respawn a child Claude instance" },
    { name = "reboot",    ipc_method = "claude.reboot",    args = "reboot_args",    description = "Restart the Claude instance in a surface and resume the same session (delayed kill + claude -r). Call this as the LAST action of a turn — anything after the delay is cut off." },
    { name = "install",   ipc_method = "claude.install",   args = "no_args",        description = "Install tasty hooks into ~/.claude/settings.json" },
    { name = "uninstall", ipc_method = "claude.uninstall", args = "no_args",        description = "Uninstall tasty hooks from ~/.claude/settings.json" },
    { name = "hook",      ipc_method = "claude.hook",      args = "hook_args",      stdin_json = true, description = "Claude Code hook integration. Reads JSON payload from stdin (session_id, message, notification_type) when invoked by Claude Code's hook system." },
    # `continue-checklist` 세션 프로필 전용 Stop 훅 — `install::MANAGED_HOOKS` 에는
    # 넣지 않는다(전역 미설치, 프로필로 부착된 세션에서만 등록됨). `hook`
    # subcommand 와 별개 IPC/파라미터 스키마를 쓴다 — Claude Code Stop 훅 payload
    # 필드(session_id/prompt_id/stop_hook_active/last_assistant_message)를 그대로
    # 받는다.
    { name = "checklist-hook", ipc_method = "claude.checklist_hook", args = "checklist_hook_args", stdin_json = true, description = "Stop hook for the continue-checklist session profile. Reads JSON payload from stdin (session_id, prompt_id, stop_hook_active, last_assistant_message)." },
    { name = "notify-done", ipc_method = "claude.notify_done", args = "notify_done_args", description = "Internal: deliver a spawn/tell state-transition notification to the caller surface, clean up sibling once-hooks, and — if the target surface still exists (i.e. this fire wasn't process-exit) — re-arm all three sibling hooks so future transitions keep notifying until the child actually exits (invoked as the hook.set command for claude-idle/needs-input/process-exit)." },
    # Claude 세션 프로필 레지스트리 (등록 → 이름으로 launch/spawn/respawn/reboot 의
    # --profile 에 부착). CLI 스키마가 subcommand 1단계만 지원해 `tasty claude profile
    # <sub>` 형태 대신 `profile-*` 평면 이름을 쓴다(기존 `notify-done` 과 동일 관례).
    { name = "profile-register",   ipc_method = "claude.profile_register",   args = "profile_register_args",   description = "Register a Claude session profile under a name (copies the file into plugin-private storage; re-registering the same name updates its content)" },
    { name = "profile-unregister", ipc_method = "claude.profile_unregister", args = "profile_name_args",       description = "Remove a registered Claude session profile" },
    { name = "profile-list",       ipc_method = "claude.profile_list",       args = "no_args",                 description = "List registered Claude session profiles plus the always-installed built-in hooks" },
    { name = "profile-show",       ipc_method = "claude.profile_show",       args = "profile_name_args",       description = "Show the raw settings JSON of a registered Claude session profile" },
    { name = "profile-current",    ipc_method = "claude.profile_current",    args = "profile_current_args",    description = "Show which Claude session profile (if any) is attached to a surface, plus the always-installed built-in hooks" },
]

[contributes.cli.arg_groups.launch_args]
flags = [
    { name = "workspace", type = "string", flag = "--workspace", required = false, help = "Workspace name to create (defaults to \"claude\")" },
    { name = "directory", type = "string", flag = "--directory", required = false, path_kind = "directory", help = "Working directory to cd into before launching claude" },
    { name = "task",      type = "string", flag = "--task",      required = false, help = "Initial task passed to claude as --task <text>" },
    { name = "profile_file", type = "string", flag = "--profile-file", required = false, path_kind = "file", reject_repeat = true, help = "Claude session profile (settings JSON) injected via --settings when launching claude. Mutually exclusive with --profile" },
    { name = "profile", type = "string", flag = "--profile", required = false, help = "Registered Claude session profile name(s) to attach, comma-separated for multiple (merged into one file — see 'claude profile-register'). Mutually exclusive with --profile-file" },
]

[contributes.cli.arg_groups.spawn_args]
flags = [
    { name = "surface",   type = "u32",    flag = "--surface",   required = false, help = "Parent surface ID (defaults to caller's TASTY_SURFACE_ID)" },
    { name = "workspace", type = "string", flag = "--workspace", required = true,  help = "Target workspace (ID or name)" },
    { name = "pane",      type = "u32",    flag = "--pane",      required = false, help = "Target pane ID (defaults to the first pane in the workspace)" },
    { name = "cwd",       type = "string", flag = "--cwd",       required = false, path_kind = "directory", help = "Working directory for the child Claude process" },
    { name = "role",      type = "string", flag = "--role",      required = false, help = "Role label attached to the child (used by broadcast --role)" },
    { name = "nickname",  type = "string", flag = "--nickname",  required = false, help = "Display nickname shown on the tab" },
    { name = "prompt",    type = "string", flag = "--prompt",    required = false, help = "Initial prompt sent to the child after spawn" },
    { name = "profile_file", type = "string", flag = "--profile-file", required = false, path_kind = "file", reject_repeat = true, help = "Claude session profile (settings JSON) injected via --settings when launching the child. Mutually exclusive with --profile" },
    { name = "profile", type = "string", flag = "--profile", required = false, help = "Registered Claude session profile name(s) to attach, comma-separated for multiple (merged into one file — see 'claude profile-register'). Mutually exclusive with --profile-file" },
]

[contributes.cli.arg_groups.children_args]
flags = [
    { name = "surface", type = "u32", flag = "--surface", required = false, help = "Parent surface ID (defaults to caller's TASTY_SURFACE_ID)" },
]

[contributes.cli.arg_groups.parent_args]
flags = [
    { name = "surface", type = "u32", flag = "--surface", required = false, help = "Child Claude surface ID to look up the parent of (defaults to caller's TASTY_SURFACE_ID)" },
]

[contributes.cli.arg_groups.state_args]
flags = [
    { name = "surface", type = "u32", flag = "--surface", required = false, help = "Child Claude surface ID to query (defaults to caller's TASTY_SURFACE_ID)" },
]

[contributes.cli.arg_groups.tell_args]
positional = [
    { name = "message", type = "string", required = true, help = "Message text to send. Newlines are preserved; the message is submitted automatically." },
]
flags = [
    { name = "surface",        type = "u32",  flag = "--surface",        required = false, help = "Target Claude surface ID to send the message to (defaults to caller's TASTY_SURFACE_ID)" },
    { name = "caller_surface", type = "u32",  flag = "--caller-surface", required = false, help = "Surface that should receive the completion notification (defaults to caller's TASTY_SURFACE_ID)" },
]

[contributes.cli.arg_groups.notify_done_args]
flags = [
    { name = "caller_surface", type = "u32",    flag = "--caller-surface", required = true, help = "Surface that issued the spawn/tell command and should receive the notification" },
    { name = "target_surface", type = "u32",    flag = "--target-surface", required = true, help = "Surface whose spawn/tell just completed" },
    { name = "command",        type = "string", flag = "--command",        required = true, help = "Which command completed: spawn or tell" },
]

[contributes.cli.arg_groups.broadcast_args]
positional = [
    { name = "text", type = "string", required = true, help = "Text to broadcast. Use \\r to submit (e.g. \"hello\\r\")" },
]
flags = [
    { name = "surface", type = "u32",    flag = "--surface", required = false, help = "Parent surface ID (defaults to caller's TASTY_SURFACE_ID)" },
    { name = "role",    type = "string", flag = "--role",    required = false, help = "Only send to children with this role label" },
]

[contributes.cli.arg_groups.kill_args]
flags = [
    { name = "surface", type = "u32", flag = "--surface", required = false, help = "Parent surface ID (defaults to caller's TASTY_SURFACE_ID)" },
    { name = "child_index", type = "u32", flag = "--child",   required = true,  help = "Child index to kill" },
]

[contributes.cli.arg_groups.respawn_args]
flags = [
    { name = "surface",  type = "u32",    flag = "--surface",  required = false, help = "Parent surface ID (defaults to caller's TASTY_SURFACE_ID)" },
    { name = "child_index", type = "u32",    flag = "--child",    required = true,  help = "Child index to respawn" },
    { name = "cwd",      type = "string", flag = "--cwd",      required = false, path_kind = "directory", help = "Override working directory for the respawned process" },
    { name = "role",     type = "string", flag = "--role",     required = false, help = "Replace the role label of the child" },
    { name = "nickname", type = "string", flag = "--nickname", required = false, help = "Replace the display nickname of the child" },
    { name = "prompt",   type = "string", flag = "--prompt",   required = false, help = "Initial prompt sent to the respawned child" },
    { name = "profile_file", type = "string", flag = "--profile-file", required = false, path_kind = "file", reject_repeat = true, help = "Claude session profile (settings JSON) injected via --settings when relaunching the child. Mutually exclusive with --profile" },
    { name = "profile", type = "string", flag = "--profile", required = false, help = "Registered Claude session profile name(s) to attach, comma-separated for multiple (merged into one file — see 'claude profile-register'). Mutually exclusive with --profile-file" },
]

[contributes.cli.arg_groups.reboot_args]
flags = [
    { name = "surface", type = "u32",    flag = "--surface", required = false, help = "Target Claude surface ID (defaults to caller's TASTY_SURFACE_ID)" },
    { name = "delay",   type = "u32",    flag = "--delay",   required = false, help = "Seconds to wait before killing Claude (default: 5)" },
    { name = "prompt",  type = "string", flag = "--prompt",  required = false, help = "Extra text appended to the reboot notice prompt sent to the restarted Claude" },
    { name = "profile_file", type = "string", flag = "--profile-file", required = false, path_kind = "file", reject_repeat = true, help = "Claude session profile (settings JSON) to attach via --settings on resume. Persists on the surface and is inherited by future reboots until cleared with --clear-profile. Mutually exclusive with --profile" },
    { name = "profile", type = "string", flag = "--profile", required = false, help = "Registered Claude session profile name(s) to attach, comma-separated for multiple (merged into one file — see 'claude profile-register'). Persists on the surface (re-resolved from the registry on each future reboot) and is inherited until cleared with --clear-profile. Mutually exclusive with --profile-file" },
    { name = "clear_profile", type = "bool", flag = "--clear-profile", required = false, help = "Detach a previously attached session profile (path- or name-based) before resuming" },
]

[contributes.cli.arg_groups.hook_args]
positional = [
    { name = "event", type = "string", required = true, help = "Hook event name (e.g. stop, notification, session-end, prompt-submit, session-start, subagent-stop, pre-tool-use, post-tool-use)" },
]
flags = [
    { name = "surface", type = "u32",    flag = "--surface", required = false, help = "Surface ID the hook is firing for (defaults to caller's TASTY_SURFACE_ID)" },
    { name = "session", type = "string", flag = "--session", required = false, stdin_field = "session_id", help = "Claude Code session ID. Auto-populated from stdin JSON 'session_id' when Claude Code invokes the hook." },
    { name = "message", type = "string", flag = "--message", required = false, stdin_field = "message",    help = "Hook message text (used for notification token extraction). Auto-populated from stdin JSON 'message'." },
    { name = "notification_type", type = "string", flag = "--notification-type", required = false, stdin_field = "notification_type", help = "Claude Code notification subtype (e.g. permission_prompt, idle_prompt). Auto-populated from stdin JSON 'notification_type'. Used to exclude idle_prompt from the needs_input signal." },
]

[contributes.cli.arg_groups.checklist_hook_args]
flags = [
    { name = "session_id", type = "string", flag = "--session-id", required = false, help = "Claude Code session ID. Auto-populated from stdin JSON 'session_id'." },
    { name = "prompt_id", type = "string", flag = "--prompt-id", required = false, help = "Claude Code prompt/turn ID — changes on each new user turn, stays fixed within a blocked extension chain. Auto-populated from stdin JSON 'prompt_id'." },
    # `bool` 이 아닌 `string` 인 이유: `CliArgType::Bool` 은 `extract_value` 가
    # 항상 `Some(Value::Bool(get_flag 결과))` 를 반환해(부재를 표현할 방법이
    # 없음) `merge_stdin_params` 의 "params 에 이미 키가 있으면 skip" 규칙과
    # 만나면 stdin JSON 값이 절대 반영되지 않는다(항상 CLI 쪽 기본값 false 로
    # 덮임). string 으로 받아 핸들러가 "true"/"false" 문자열을 직접 비교한다.
    { name = "stop_hook_active", type = "string", flag = "--stop-hook-active", required = false, help = "Whether Claude Code's own stop-hook-active flag was set (sanity-check only, not the primary decision signal). Auto-populated from stdin JSON 'stop_hook_active' (\"true\"/\"false\")." },
    { name = "last_assistant_message", type = "string", flag = "--last-assistant-message", required = false, help = "The assistant's last message text, searched for the completion sentinel. Auto-populated from stdin JSON 'last_assistant_message'." },
]

[contributes.cli.arg_groups.profile_register_args]
positional = [
    { name = "name", type = "string", required = true, help = "Short name to register the profile under (lowercase letters, digits, '-', max 32 chars)" },
]
flags = [
    { name = "file", type = "string", flag = "--file", required = true, path_kind = "file", help = "Path to the settings JSON file to register (copied into plugin-private storage)" },
]

[contributes.cli.arg_groups.profile_name_args]
positional = [
    { name = "name", type = "string", required = true, help = "Registered profile short name" },
]

[contributes.cli.arg_groups.profile_current_args]
flags = [
    { name = "surface", type = "u32", flag = "--surface", required = false, help = "Surface ID to query (defaults to caller's TASTY_SURFACE_ID)" },
]

[contributes.cli.arg_groups.no_args]

# 완료 판정 전략 — `claude.spawn` 의 기본 완료 판정(결정 6).
# poll_method 는 owner 자기 namespace 로만 제한되므로(결정 2) 호스트
# `terminal.state`(결정 3, terminal namespace 소유)를 직접 참조할 수 없다 —
# 그래서 이 plugin 자신의 `claude.state`(그 위에 얇게 위임하는 wrapper,
# handlers.rs 참고)를 poll_method 로 둔다. idle/needs_input 을 둘 다 terminal
# 로 두는 것은 기존 spawn/tell 훅 알림이 이미 이 둘을 "자식이 작업을 멈췄다"로
# 취급하는 것과 같은 기준이다(위 spawn/tell subcommand 설명 참고). exited 는
# 결정 4 로 신설된 상태.
[[contributes.completion_strategy]]
id = "spawn-wait"
priority = 100
default_for_methods = ["claude.spawn"]

[contributes.completion_strategy.spec]
kind = "poll"
poll_method = "claude.state"
# `claude.spawn` 응답의 `child_surface_id` 를 poll 호출(`claude.state`) 의
# 필수 파라미터 `surface_id` 로 옮긴다 — 이 매핑이 없으면 poll params 가
# 비어 `claude.state` 가 "Missing required 'surface_id' parameter" 로 매 tick
# 실패한다(handlers.rs 의 `require_surface_id`).
map_from_response = { child_surface_id = "surface_id" }
state_field = "state"
terminal_states = ["idle", "needs_input", "exited"]

[[contributes.settings_pages]]
id = "claude"
title_key = "settings.subtab.claude"
category = "plugin"

[[contributes.settings_pages.items]]
kind = "number"
id = "spawn_child_warn_threshold"
label_key = "claude.settings.spawn_child_warn_threshold"
storage_key = "spawn_child_warn_threshold"
default = 6.0
min = 1.0

# `continue-checklist` 라운드 상한(백스톱). Claude Code 자체엔 Stop 훅 block
# 무한루프를 막는 호스트측 안전장치가 없음이 실측으로 확인됨 — 이 값이 없으면
# 센티넬을 못 뱉는 세션이 영원히 block 될 수 있다. 기본값 3 은 "마무리 몇 스텝
# 더 허용"과 "그래도 반드시 끊는다" 사이 절충.
[[contributes.settings_pages.items]]
kind = "number"
id = "continue_checklist_round_limit"
label_key = "claude.settings.continue_checklist_round_limit"
storage_key = "continue_checklist_round_limit"
default = 3.0
min = 1.0
