[contributes.cli.arg_groups.hook_args]
positional = [
    { name = "event", type = "string", required = true, help = "Hook event name (e.g. stop, stop-failure, notification, session-end, prompt-submit, session-start, subagent-stop, pre-tool-use, post-tool-use, background-start)", help_i18n_key = "claude.cli.arg.hook_args.event.help" },
]
flags = [
    { name = "surface", type = "u32",    flag = "--surface", required = false, help = "Surface ID the hook is firing for (defaults to caller's TASTY_SURFACE_ID)", help_i18n_key = "claude.cli.arg.hook_args.surface.help" },
    { name = "session", type = "string", flag = "--session", required = false, stdin_field = "session_id", help = "Claude Code session ID. Auto-populated from stdin JSON 'session_id' when Claude Code invokes the hook.", help_i18n_key = "claude.cli.arg.hook_args.session.help" },
    { name = "message", type = "string", flag = "--message", required = false, stdin_field = "message",    help = "Hook message text (used for notification token extraction). Auto-populated from stdin JSON 'message'.", help_i18n_key = "claude.cli.arg.hook_args.message.help" },
    { name = "notification_type", type = "string", flag = "--notification-type", required = false, stdin_field = "notification_type", help = "Claude Code notification subtype (e.g. permission_prompt, auth_success). Auto-populated from stdin JSON 'notification_type'. Decides whether the notification sets needs_input, sets active, or leaves the state unchanged. A missing value sets needs_input; an unlisted value leaves the state unchanged.", help_i18n_key = "claude.cli.arg.hook_args.notification_type.help" },
    { name = "error", type = "string", flag = "--error", required = false, stdin_field = "error", help = "API error kind that ended the turn (e.g. overloaded, rate_limit, server_error, authentication_failed). Auto-populated from stdin JSON 'error' on the StopFailure hook.", help_i18n_key = "claude.cli.arg.hook_args.error.help" },
    { name = "agent_id", type = "string", flag = "--agent-id", required = false, stdin_field = "agent_id", help = "Subagent ID when the hook fires inside a subagent (absent on the main thread). Auto-populated from stdin JSON 'agent_id'. A stop-failure carrying it is a subagent's API error — the main turn continues, so it is ignored.", help_i18n_key = "claude.cli.arg.hook_args.agent_id.help" },
    { name = "prompt_id", type = "string", flag = "--prompt-id", required = false, stdin_field = "prompt_id", help = "Claude Code prompt/turn ID. Auto-populated from stdin JSON 'prompt_id' on the Stop hook. Pairs this stop with the Stop-hook gate decisions for the same turn.", help_i18n_key = "claude.cli.arg.hook_args.prompt_id.help" },
    # 배열·bool 값을 stdin JSON 그대로 받도록 문자열로 선언한다. bool 플래그는 미지정에도 false 가 채워져 stdin 값을 가린다.
    { name = "background_tasks", type = "string", flag = "--background-tasks", required = false, stdin_field = "background_tasks", help = "Background tasks still attached to the session, as a JSON array. Auto-populated from stdin JSON 'background_tasks' on the Stop hook. A stop with any item whose status does not mean finished (completed, failed, cancelled, canceled, killed, stopped, error, done; unknown or missing status counts as unfinished) only ended the main response while background work continues, so the child stays active instead of going idle.", help_i18n_key = "claude.cli.arg.hook_args.background_tasks.help" },
    { name = "waiting_on_background_work", type = "string", flag = "--waiting-on-background-work", required = false, stdin_field = "waiting_on_background_work", help = "Whether the session is waiting for background work to finish (\"true\"/\"false\"). Not in the official hooks documentation (checked 2026-09-28) or in observed Claude Code 2.1.283 payloads; read defensively from stdin JSON 'waiting_on_background_work' if it ever arrives, and when present it decides instead of --background-tasks.", help_i18n_key = "claude.cli.arg.hook_args.waiting_on_background_work.help" },
    { name = "tool_name", type = "string", flag = "--tool-name", required = false, stdin_field = "tool_name", help = "Tool that ran, for the background-start event. Auto-populated from stdin JSON 'tool_name' on PostToolUse. Bash and Agent (Task) can start background work.", help_i18n_key = "claude.cli.arg.hook_args.tool_name.help" },
    { name = "tool_response", type = "string", flag = "--tool-response", required = false, stdin_field = "tool_response", help = "Tool result, for the background-start event. Auto-populated from stdin JSON 'tool_response' on PostToolUse. A background Bash command carries backgroundTaskId and a background Agent carries agentId; the plugin records them so that a StopFailure while that work still runs keeps the child active.", help_i18n_key = "claude.cli.arg.hook_args.tool_response.help" },
    { name = "prompt", type = "string", flag = "--prompt", required = false, stdin_field = "prompt", help = "Prompt text. Auto-populated from stdin JSON 'prompt' on UserPromptSubmit. A prompt that starts with <task-notification> reports finished background work by its <task-id>.", help_i18n_key = "claude.cli.arg.hook_args.prompt.help" },
    { name = "source", type = "string", flag = "--source", required = false, stdin_field = "source", help = "How the session started (startup, resume, clear, compact, fork). Auto-populated from stdin JSON 'source' on SessionStart. A session reopened with resume records the --settings it was restored with, so the Stop-hook gates in it are counted.", help_i18n_key = "claude.cli.arg.hook_args.source.help" },
    { name = "cwd", type = "string", flag = "--cwd", required = false, stdin_field = "cwd", help = "Working directory of the Claude session. Auto-populated from stdin JSON 'cwd'. While a child waits on background work, the plugin uses it with the session ID to find the output files of the awaited tasks under Claude Code's temporary folder and watches whether they still grow.", help_i18n_key = "claude.cli.arg.hook_args.cwd.help" },
    { name = "reason", type = "string", flag = "--reason", required = false, stdin_field = "reason", help = "Why the session ended (clear, resume, logout, prompt_input_exit, other). Auto-populated from stdin JSON 'reason' on SessionEnd. Any value but clear and resume means the Claude process ended, so the settings recorded for it are forgotten.", help_i18n_key = "claude.cli.arg.hook_args.reason.help" },
]

[contributes.cli.arg_groups.checklist_hook_args]
