manifest_version = 1
id = "com.tasty.claude"
name = "Claude Code"
version = "0.1.14"
description = "Claude Code CLI integration for Tasty"
api_version = "1"
permissions = [
    "surface.read",
    "surface.write",
    "terminal.spawn",
    "terminal.write",
    "terminal.read",
    "fs.read",
    "fs.write",
    "notification",
    "telemetry",
    # Phase 6.2: 자식 Claude 인스턴스에 session token 을 발급한다.
    # 자식이 호스트에 IPC 호출 시 envelope.session_token 으로 신원을 증명.
    "agent",
    "ui.settings_page",
]
lang_dir = "lang"

[entry]
type = "process"
command = "tasty-plugin-claude"

[[contributes.ipc_namespace]]
prefix = "claude"

# 이 plugin 이 `surface.fire_hook` 로 발사하는 surface hook 이벤트 카탈로그.
# host 가 `hook.set` / `surface.fire_hook` 등록을 (내장 ∪ 활성 plugin 선언) 으로
# 검증하므로, 여기 선언되지 않은 키는 plugin 활성 상태여도 거부된다.
[[contributes.hook_events]]
key = "claude-idle"
description = "Claude instance became idle (Stop hook)"

[[contributes.hook_events]]
key = "needs-input"
description = "Claude instance is waiting for user input (Notification hook)"

[[contributes.hook_events]]
key = "claude-error"
description = "Claude output matched an error pattern"

[[contributes.cli]]
name = "claude"
description = "Claude Code CLI integration (launch, spawn, kill, etc.)"
description_i18n_key = "claude.cli.desc"
subcommands = [
    { name = "launch",    ipc_method = "claude.launch",    args = "launch_args",    description = "Launch Claude Code in a new workspace" },
    { name = "spawn",     ipc_method = "claude.spawn",     args = "spawn_args",     description = "Spawn a child Claude instance into a workspace. Returns immediately; a one-shot notification is delivered to the caller surface when the child becomes idle / needs_input / exited." },
    { name = "children",  ipc_method = "claude.children",  args = "children_args",  description = "List children of the specified Claude parent" },
    { name = "parent",    ipc_method = "claude.parent",    args = "parent_args",    description = "Show the parent of the specified Claude child" },
    { name = "tell",      ipc_method = "claude.tell",      args = "tell_args",      description = "Send a message to a Claude instance (multi-line, submits at end). Returns immediately; a one-shot notification is delivered to the caller surface when the target becomes idle / needs_input / exited." },
    { name = "broadcast", ipc_method = "claude.broadcast", args = "broadcast_args", description = "Broadcast text to all children of a parent Claude instance" },
    { name = "kill",      ipc_method = "claude.kill",      args = "kill_args",      description = "Kill a child Claude instance by child index" },
    { name = "respawn",   ipc_method = "claude.respawn",   args = "respawn_args",   description = "Respawn a child Claude instance" },
    { name = "reboot",    ipc_method = "claude.reboot",    args = "reboot_args",    description = "Restart the Claude instance in a surface and resume the same session (delayed kill + claude -r). Call this as the LAST action of a turn — anything after the delay is cut off." },
    { name = "install",   ipc_method = "claude.install",   args = "no_args",        description = "Install tasty hooks into ~/.claude/settings.json" },
    { name = "uninstall", ipc_method = "claude.uninstall", args = "no_args",        description = "Uninstall tasty hooks from ~/.claude/settings.json" },
    { name = "hook",      ipc_method = "claude.hook",      args = "hook_args",      stdin_json = true, description = "Claude Code hook integration. Reads JSON payload from stdin (session_id, message) when invoked by Claude Code's hook system." },
    { name = "notify-done", ipc_method = "claude.notify_done", args = "notify_done_args", description = "Internal: deliver a one-shot spawn/tell completion notification to the caller surface and clean up sibling once-hooks (invoked as the hook.set command for claude-idle/needs-input/process-exit)." },
]

[contributes.cli.arg_groups.launch_args]
flags = [
    { name = "workspace", type = "string", flag = "--workspace", required = false, help = "Workspace name to create (defaults to \"claude\")" },
    { name = "directory", type = "string", flag = "--directory", required = false, path_kind = "directory", help = "Working directory to cd into before launching claude" },
    { name = "task",      type = "string", flag = "--task",      required = false, help = "Initial task passed to claude as --task <text>" },
]

[contributes.cli.arg_groups.spawn_args]
flags = [
    { name = "surface",   type = "u32",    flag = "--surface",   required = false, help = "Parent surface ID (defaults to caller's TASTY_SURFACE_ID)" },
    { name = "workspace", type = "string", flag = "--workspace", required = true,  help = "Target workspace (ID or name)" },
    { name = "pane",      type = "u32",    flag = "--pane",      required = false, help = "Target pane ID (defaults to the first pane in the workspace)" },
    { name = "cwd",       type = "string", flag = "--cwd",       required = false, path_kind = "directory", help = "Working directory for the child Claude process" },
    { name = "role",      type = "string", flag = "--role",      required = false, help = "Role label attached to the child (used by broadcast --role)" },
    { name = "nickname",  type = "string", flag = "--nickname",  required = false, help = "Display nickname shown on the tab" },
    { name = "prompt",    type = "string", flag = "--prompt",    required = false, help = "Initial prompt sent to the child after spawn" },
]

[contributes.cli.arg_groups.children_args]
flags = [
    { name = "surface", type = "u32", flag = "--surface", required = false, help = "Parent surface ID (defaults to caller's TASTY_SURFACE_ID)" },
]

[contributes.cli.arg_groups.parent_args]
flags = [
    { name = "surface", type = "u32", flag = "--surface", required = false, help = "Child Claude surface ID to look up the parent of (defaults to caller's TASTY_SURFACE_ID)" },
]

[contributes.cli.arg_groups.tell_args]
positional = [
    { name = "message", type = "string", required = true, help = "Message text to send. Newlines are preserved; the message is submitted automatically." },
]
flags = [
    { name = "surface",        type = "u32",  flag = "--surface",        required = false, help = "Target Claude surface ID to send the message to (defaults to caller's TASTY_SURFACE_ID)" },
    { name = "caller_surface", type = "u32",  flag = "--caller-surface", required = false, help = "Surface that should receive the completion notification (defaults to caller's TASTY_SURFACE_ID)" },
]

[contributes.cli.arg_groups.notify_done_args]
flags = [
    { name = "caller_surface", type = "u32",    flag = "--caller-surface", required = true, help = "Surface that issued the spawn/tell command and should receive the notification" },
    { name = "target_surface", type = "u32",    flag = "--target-surface", required = true, help = "Surface whose spawn/tell just completed" },
    { name = "command",        type = "string", flag = "--command",        required = true, help = "Which command completed: spawn or tell" },
]

[contributes.cli.arg_groups.broadcast_args]
positional = [
    { name = "text", type = "string", required = true, help = "Text to broadcast. Use \\r to submit (e.g. \"hello\\r\")" },
]
flags = [
    { name = "surface", type = "u32",    flag = "--surface", required = false, help = "Parent surface ID (defaults to caller's TASTY_SURFACE_ID)" },
    { name = "role",    type = "string", flag = "--role",    required = false, help = "Only send to children with this role label" },
]

[contributes.cli.arg_groups.kill_args]
flags = [
    { name = "surface", type = "u32", flag = "--surface", required = false, help = "Parent surface ID (defaults to caller's TASTY_SURFACE_ID)" },
    { name = "child_index", type = "u32", flag = "--child",   required = true,  help = "Child index to kill" },
]

[contributes.cli.arg_groups.respawn_args]
flags = [
    { name = "surface",  type = "u32",    flag = "--surface",  required = false, help = "Parent surface ID (defaults to caller's TASTY_SURFACE_ID)" },
    { name = "child_index", type = "u32",    flag = "--child",    required = true,  help = "Child index to respawn" },
    { name = "cwd",      type = "string", flag = "--cwd",      required = false, path_kind = "directory", help = "Override working directory for the respawned process" },
    { name = "role",     type = "string", flag = "--role",     required = false, help = "Replace the role label of the child" },
    { name = "nickname", type = "string", flag = "--nickname", required = false, help = "Replace the display nickname of the child" },
    { name = "prompt",   type = "string", flag = "--prompt",   required = false, help = "Initial prompt sent to the respawned child" },
]

[contributes.cli.arg_groups.reboot_args]
flags = [
    { name = "surface", type = "u32",    flag = "--surface", required = false, help = "Target Claude surface ID (defaults to caller's TASTY_SURFACE_ID)" },
    { name = "delay",   type = "u32",    flag = "--delay",   required = false, help = "Seconds to wait before killing Claude (default: 5)" },
    { name = "prompt",  type = "string", flag = "--prompt",  required = false, help = "Extra text appended to the reboot notice prompt sent to the restarted Claude" },
]

[contributes.cli.arg_groups.hook_args]
positional = [
    { name = "event", type = "string", required = true, help = "Hook event name (e.g. stop, notification, session-end, prompt-submit, session-start, subagent-stop)" },
]
flags = [
    { name = "surface", type = "u32",    flag = "--surface", required = false, help = "Surface ID the hook is firing for (defaults to caller's TASTY_SURFACE_ID)" },
    { name = "session", type = "string", flag = "--session", required = false, stdin_field = "session_id", help = "Claude Code session ID. Auto-populated from stdin JSON 'session_id' when Claude Code invokes the hook." },
    { name = "message", type = "string", flag = "--message", required = false, stdin_field = "message",    help = "Hook message text (used for notification token extraction). Auto-populated from stdin JSON 'message'." },
]

[contributes.cli.arg_groups.no_args]

[[contributes.settings_pages]]
id = "claude"
title_key = "settings.subtab.claude"
category = "plugin"

[[contributes.settings_pages.items]]
kind = "number"
id = "spawn_child_warn_threshold"
label_key = "claude.settings.spawn_child_warn_threshold"
storage_key = "spawn_child_warn_threshold"
default = 6.0
min = 1.0
