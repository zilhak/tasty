    { name = "prompt_id", type = "string", flag = "--prompt-id", required = false, help = "Claude Code prompt/turn ID — changes on each new user turn, stays fixed within a blocked extension chain. Auto-populated from stdin JSON 'prompt_id'.", help_i18n_key = "claude.cli.arg.checklist_hook_args.prompt_id.help" },
    # bool은 미지정에도 false가 채워져 stdin 값을 가리므로 문자열로 받는다.
    { name = "stop_hook_active", type = "string", flag = "--stop-hook-active", required = false, help = "Whether Claude Code's own stop-hook-active flag was set (sanity-check only, not the primary decision signal). Auto-populated from stdin JSON 'stop_hook_active' (\"true\"/\"false\").", help_i18n_key = "claude.cli.arg.checklist_hook_args.stop_hook_active.help" },
    { name = "last_assistant_message", type = "string", flag = "--last-assistant-message", required = false, help = "The assistant's last message text, searched for the completion sentinel. Auto-populated from stdin JSON 'last_assistant_message'.", help_i18n_key = "claude.cli.arg.checklist_hook_args.last_assistant_message.help" },
