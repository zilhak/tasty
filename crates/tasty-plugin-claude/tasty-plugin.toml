    { name = "block_cap", type = "string", flag = "--block-cap", required = false, help = "Claude Code's cap on consecutive Stop-hook blocks (CLAUDE_CODE_STOP_HOOK_BLOCK_CAP). The gate command passes the environment value; empty means the default 8. A block that reaches the cap does not continue the turn, so the child is reported idle.", help_i18n_key = "claude.cli.arg.checklist_hook_args.block_cap.help" },
    # Stop payload에는 게이트 이름이 없어 등록한 명령의 인자로 전달한다. 생략하면 기본 게이트다.
    { name = "gate", type = "string", flag = "--gate", required = false, default = "continue-checklist", help = "Name of the Stop-hook gate whose body, sentinel and round limit this hook decides with (see 'claude gate-register'). Defaults to the built-in continue-checklist gate.", help_i18n_key = "claude.cli.arg.checklist_hook_args.gate.help" },
