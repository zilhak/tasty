[claude.cli.arg.respawn_args.profile_file]
help = "子の再起動時に --settings で渡すClaudeセッションプロファイル（settings JSON）。--profileと併用不可"

[claude.cli.arg.respawn_args.profile]
help = "適用する登録済みセッションプロファイルまたはStopフックゲート名。複数はカンマ区切りで一つのファイルに統合（'claude profile-register'、'claude gate-register' 参照）。--profile-fileと併用不可"

[claude.cli.arg.respawn_args.permission_mode]
help = "子の権限モード：acceptEdits|auto|bypassPermissions|manual|dontAsk|plan。--permission-mode で渡し、今回だけ default_permission_mode より優先します。省略時はその設定を使用し、inherit または未設定ならフラグを付けず Claude Code の設定に従います。明示したモードは permissions.defaultMode を設定する --profile/--profile-file と併用できません。"

[claude.cli.arg.reboot_args.surface]
help = "対象ClaudeサーフェスID（既定値：呼び出し元のTASTY_SURFACE_ID）"

[claude.cli.arg.reboot_args.delay]
help = "Claude終了前の待機時間（秒、既定値：5）"

[claude.cli.arg.reboot_args.prompt]
help = "再起動したClaudeの再起動案内プロンプトに追加するテキスト"

[claude.cli.arg.reboot_args.profile_file]
help = "再開時に --settings で適用するClaudeセッションプロファイル（settings JSON）。サーフェスに保存され、--clear-profileで解除するまで次回の再起動に継承されます。--profileと併用不可"

[claude.cli.arg.reboot_args.profile]
help = "適用する登録済みセッションプロファイル/Stopフックゲート名（複数はカンマ区切りで一ファイルに統合。'claude profile-register'、'claude gate-register' 参照）。サーフェスに保存し、再起動ごとに登録情報を読み直して編集を反映します。--clear-profileまで継承。--profile-fileと併用不可"

[claude.cli.arg.reboot_args.clear_profile]
help = "再開前に既存のセッションプロファイルを解除（パスまたは名前指定）"

[claude.cli.arg.reboot_args.permission_mode]
help = "子の権限モード：acceptEdits|auto|bypassPermissions|manual|dontAsk|plan。--permission-mode で渡し、今回だけ default_permission_mode より優先します。省略時はその設定を使用し、inherit または未設定ならフラグを付けず Claude Code の設定に従います。明示したモードは permissions.defaultMode を設定する --profile/--profile-file と併用できません。"

[claude.cli.arg.child_profile_args.surface]
help = "親サーフェスID（既定値：呼び出し元のTASTY_SURFACE_ID）"

[claude.cli.arg.child_profile_args.child_index]
help = "プロファイルを適用する子インデックス（'claude children' で確認）"

[claude.cli.arg.child_profile_args.delay]
help = "子Claude終了前の待機時間（秒、既定値：5）"

[claude.cli.arg.child_profile_args.prompt]
help = "再起動した子の再起動案内プロンプトに追加するテキスト"

[claude.cli.arg.child_profile_args.profile_file]
help = "再開時に子へ --settings で適用するClaudeセッションプロファイル（settings JSON）。子サーフェスに保存し、--clear-profileまで次回の再起動に継承。--profileと併用不可"

[claude.cli.arg.child_profile_args.profile]
help = "子に適用する登録済みセッションプロファイル/Stopフックゲート名（複数はカンマ区切りで一ファイルに統合。'claude profile-register'、'claude gate-register' 参照）。子サーフェスに保存し再起動ごとに登録情報を読み直し、--clear-profileまで継承。--profile-fileと併用不可"

[claude.cli.arg.child_profile_args.clear_profile]
help = "再開前に子の既存セッションプロファイルを解除（パスまたは名前指定）"

[claude.cli.arg.child_profile_args.permission_mode]
help = "子の権限モード：acceptEdits|auto|bypassPermissions|manual|dontAsk|plan。--permission-mode で渡し、今回だけ default_permission_mode より優先します。省略時はその設定を使用し、inherit または未設定ならフラグを付けず Claude Code の設定に従います。明示したモードは permissions.defaultMode を設定する --profile/--profile-file と併用できません。"

[claude.cli.arg.hook_args.event]
help = "フックイベント名（例：stop、stop-failure、notification、session-end、prompt-submit、session-start、subagent-stop、pre-tool-use、post-tool-use）"

[claude.cli.arg.hook_args.surface]
help = "フック対象サーフェスID（既定値：呼び出し元のTASTY_SURFACE_ID）"

[claude.cli.arg.hook_args.session]
help = "Claude CodeセッションID。フック呼び出し時にstdin JSONの 'session_id' から自動設定"

[claude.cli.arg.hook_args.message]
help = "フックメッセージ（通知トークン抽出に使用）。stdin JSONの 'message' から自動設定"

[claude.cli.arg.hook_args.notification_type]
help = "Claude Code通知のサブタイプ（例：permission_prompt、idle_prompt）。stdin JSONの 'notification_type' から自動設定。needs_input信号からidle_promptを除外する際に使用"

[claude.cli.arg.hook_args.error]
help = "ターンを終了させた API エラーの種類（例：overloaded、rate_limit、server_error、authentication_failed）。StopFailure フックで stdin JSON の 'error' から自動設定"

[claude.cli.arg.hook_args.agent_id]
help = "フックがサブエージェント内で発火したときのサブエージェント ID（メインスレッドでは無し）。stdin JSON の 'agent_id' から自動設定。これを持つ stop-failure はサブエージェントの API エラーでメインターンは続くため無視"

[claude.cli.arg.checklist_hook_args.surface]
help = "ゲート対象サーフェスID。セッションの目標照会に使用。既定値は呼び出し元のTASTY_SURFACE_ID"

[claude.cli.arg.checklist_hook_args.session_id]
help = "Claude CodeセッションID。stdin JSONの 'session_id' から自動設定"

[claude.cli.arg.checklist_hook_args.prompt_id]
help = "Claude Codeのプロンプト/ターンID。新しいユーザーターンで変わり、ブロック後の延長中は維持されます。stdin JSONの 'prompt_id' から自動設定"

[claude.cli.arg.checklist_hook_args.stop_hook_active]
help = "Claude Code自身のstop-hook-activeフラグの有無（主判定ではなく整合確認用）。stdin JSONの 'stop_hook_active'（\"true\"/\"false\"）から自動設定"

[claude.cli.arg.checklist_hook_args.last_assistant_message]
help = "完了マーカーを探すassistantの最終メッセージ。stdin JSONの 'last_assistant_message' から自動設定"

[claude.cli.arg.checklist_hook_args.gate]
help = "本文・完了マーカー・回数制限で判定するStopフックゲート名（'claude gate-register' 参照）。既定値は組み込みcontinue-checklist"

[claude.cli.arg.checklist_gate_args.gate]
help = "有効化/無効化/照会するStopフックゲート名（'claude gate-register' 参照）。既定値は組み込みcontinue-checklist"

[claude.cli.arg.profile_register_args.name]
help = "プロファイルの登録名（英小文字・数字・'-'、最大32文字）"

[claude.cli.arg.profile_register_args.file]
help = "登録するsettings JSONファイルのパス（plugin専用領域に複製）"

[claude.cli.arg.profile_name_args.name]
help = "登録済みプロファイル名"

[claude.cli.arg.profile_current_args.surface]
help = "照会するサーフェスID（既定値：呼び出し元のTASTY_SURFACE_ID）"

[claude.cli.arg.gate_register_args.name]
help = "ゲートの登録名（英小文字・数字・'-'、最大32文字）。セッションプロファイルと名前空間を共有するため、反対側に同名があれば隠さず登録を拒否"

[claude.cli.arg.gate_register_args.body_file]
help = "登録するチェックリスト本文のMarkdownパス（plugin専用領域に複製）。モデルに完了宣言方法を伝えるため、このゲートの有効な完了マーカーが必須です。"

[claude.cli.arg.gate_register_args.sentinel]
help = "ターンを終えるためモデルが出力する完了マーカー。既定値は組み込みマーカー。空値は全メッセージに一致するため禁止"

[claude.cli.arg.gate_register_args.rounds]
help = "ゲートの回数上限（1以上）。省略時はpluginの 'continue-checklist round limit' 設定を使用"

[claude.cli.arg.gate_name_args.name]
help = "登録済みゲート名"
