[claude.checklist]
body = """
ターンを終える前に確認せよ:
1. 結果は本当に依頼内容を満たしているか — 楽な方法で済ませていないか?
2. コードや設定を変更したなら、実際に検証(ビルド/テスト/実行)したか — 動くはずだと仮定しただけになっていないか?
3. 残っている作業はあるか? あるなら何か明示せよ。ないなら、ないと明示的に述べよ。

{{goal}}
3 つすべてを本当に満たしているなら、返信のどこかに次の文字列をそのまま含めよ: [[TASTY-CHECKLIST-DONE]] そうでなければ作業を続けよ。
"""
goal_clause = """このセッションに設定された goal: {}
上で述べた残作業を、この goal に照らして判定せよ。残作業のうちユーザーの判断を必要とせず自分で進められるものがあるなら、ここで終えずにそれを進めよ。残作業がすべてユーザーの判断を要するか goal の範囲外であれば、そのまま終えてよい。
"""
no_data_dir = "plugin data directory が利用できません(ホストが TASTY_PLUGIN_DATA_DIR を注入していません) — checklist を有効/無効化できません"
io_error = "checklist marker ファイルの入出力に失敗しました: {}"

