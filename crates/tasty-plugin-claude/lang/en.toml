[claude.cli]
desc = "Claude Code CLI integration (launch, spawn, kill, etc.)"

[claude]
"settings.spawn_child_warn_threshold" = "Child count warning threshold"
"settings.continue_checklist_round_limit" = "Default gate round limit (used when a gate sets none)"
"settings.default_permission_mode" = "Default permission mode for child sessions"
"settings.auto_resume_enabled" = "Resume automatically after a temporary API error (server overload)"
"settings.auto_resume_delay_secs" = "Seconds to wait before resuming"
"settings.auto_resume_max_attempts" = "Consecutive automatic resumes before giving up"
"settings.permission_mode.inherit" = "Inherit (use Claude Code's own settings)"
"settings.permission_mode.manual" = "Ask every time (manual)"
"settings.permission_mode.plan" = "Plan only (plan)"
"settings.permission_mode.accept_edits" = "Accept file edits (acceptEdits)"
"settings.permission_mode.auto" = "Automatic (auto)"
"settings.permission_mode.dont_ask" = "Do not ask (dontAsk)"
"settings.permission_mode.bypass" = "Bypass all permission checks (bypassPermissions)"

[claude.checklist]
body = """
Before ending this turn, check:
1. Does the result actually satisfy what was asked, not just what was easiest to do?
2. If you changed code or config, did you verify it (build/test/run), not just assume it works?
3. Is there follow-up work left? If so, say what it is. If not, say so explicitly.

{{goal}}
If all three are genuinely satisfied, include the exact string [[TASTY-CHECKLIST-DONE]] somewhere in your reply. Otherwise, keep working.
"""
goal_clause = """The goal set for this session: {}
Judge the follow-up work you just described against that goal. If any of it needs no decision from the user and you can carry it out yourself, do not stop here — go do it. If everything left either needs the user's judgement or falls outside the goal, it is fine to stop.
"""
no_data_dir = "plugin data directory not available (host did not inject TASTY_PLUGIN_DATA_DIR) — cannot enable or disable the checklist"
io_error = "checklist marker I/O failed: {}"

