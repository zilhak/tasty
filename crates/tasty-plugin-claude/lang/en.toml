[settings.subtab]
claude = "Claude Code"

[claude.cli.sub.launch]
description = "Launch Claude Code in a new workspace"

[claude.cli.sub.spawn]
description = "Spawn a child Claude instance into a workspace. Returns immediately; a notification is delivered to the caller surface every time the child transitions to idle/needs_input, and once more when it exits — not just the first transition."

[claude.cli.sub.children]
description = "List children of the specified Claude parent"

[claude.cli.sub.parent]
description = "Show the parent of the specified Claude child"

[claude.cli.sub.state]
description = "Query a single child's status: idle, needs_input, active, or exited (live-surface cross-checked)"

[claude.cli.sub.tell]
description = "Send a message to a Claude instance (multi-line, submits at end). Returns immediately; a notification is delivered to the caller surface every time the target transitions to idle/needs_input, and once more when it exits — not just the first transition."

[claude.cli.sub.broadcast]
description = "Broadcast text to all children of a parent Claude instance"

[claude.cli.sub.kill]
description = "Kill a child Claude instance by child index"

[claude.cli.sub.respawn]
description = "Respawn a child Claude instance"

[claude.cli.sub.reboot]
description = "Restart the Claude instance in a surface and resume the same session (delayed kill + claude -r). Call this as the LAST action of a turn — anything after the delay is cut off."

[claude.cli.sub.child-profile]
description = "Attach a persistent Claude session profile to a CHILD instance (resolves --child to its surface, then runs the same sequence as 'claude reboot --profile' on it). Unlike reboot, this does NOT cut off the caller's turn — only the child restarts. A notification is delivered to the caller surface when the child transitions to idle/needs_input, and once more when it exits."

[claude.cli.sub.install]
description = "Install tasty hooks into ~/.claude/settings.json"

[claude.cli.sub.uninstall]
description = "Uninstall tasty hooks from ~/.claude/settings.json"

[claude.cli.sub.hook]
description = "Claude Code hook integration. Reads JSON payload from stdin (session_id, message, notification_type, error, agent_id) when invoked by Claude Code's hook system."

[claude.cli.sub.checklist-hook]
description = "Stop-hook gate decision. Reads JSON payload from stdin (session_id, prompt_id, stop_hook_active, last_assistant_message); --gate selects which registered gate decides (default: continue-checklist)."

[claude.cli.sub.checklist-enable]
description = "Turn on a Stop-hook gate (creates its enabled marker). Defaults to the built-in continue-checklist gate."

[claude.cli.sub.checklist-disable]
description = "Turn off a Stop-hook gate (removes its enabled marker). Succeeds even if it was already off."

[claude.cli.sub.checklist-status]
description = "Show whether a Stop-hook gate is currently on. Use 'claude gate-list' to see every gate's on/off at once."

[claude.cli.sub.notify-error]
description = "Internal: notify the caller that a child may be stalled after a long period without output changes. Used as the hook.set command for claude-error-stalled. Does not change child state or remove or re-register completion hooks."

[claude.cli.sub.notify-done]
description = "Internal: report a spawn/tell state transition to the caller and remove matching once-hooks. If the target surface can still be found, register the three completion hooks again. Used as the hook.set command for claude-idle/needs-input/process-exit."

[claude.cli.sub.profile-register]
description = "Register a Claude session profile under a name (copies the file into plugin-private storage; re-registering the same name updates its content)"

[claude.cli.sub.profile-unregister]
description = "Remove a registered Claude session profile"

[claude.cli.sub.profile-list]
description = "List everything attachable by name — registered Claude session profiles and Stop-hook gates — plus the always-installed built-in hooks"

[claude.cli.sub.profile-show]
description = "Show what a name attaches — the raw settings JSON of a registered Claude session profile, or the generated Stop-hook fragment of a gate"

[claude.cli.sub.profile-current]
description = "Show which Claude session profile (if any) is attached to a surface, plus the always-installed built-in hooks"

[claude.cli.sub.gate-register]
description = "Register a Stop-hook gate under a name (copies the body file into plugin-private storage; re-registering the same name replaces both the body and the definition)"

[claude.cli.sub.gate-unregister]
description = "Remove a registered Stop-hook gate (deletes both its definition and its body copy)"

[claude.cli.sub.gate-list]
description = "List registered Stop-hook gates plus the built-in ones, with each gate's effective sentinel, round limit and on/off state"

[claude.cli.sub.gate-show]
description = "Show a Stop-hook gate's definition and body text"

