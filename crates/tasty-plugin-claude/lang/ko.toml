[claude.cli]
desc = "Claude Code 자식 세션을 관리합니다"

[claude]
"settings.spawn_child_warn_threshold" = "Spawn child 경고 임계치"
"settings.continue_checklist_round_limit" = "게이트 기본 라운드 상한 (게이트가 자체 값을 지정하지 않았을 때)"

[claude.checklist]
body = """
턴을 끝내기 전에 아래를 점검해라:
1. 결과가 실제로 요청한 것을 충족하는가 — 하기 쉬운 것만 하고 넘어가지 않았는가?
2. 코드나 설정을 바꿨다면 실제로 검증(빌드/테스트/실행)했는가 — 될 거라고 가정만 하지 않았는가?
3. 후속 작업이 남아 있는가? 남아 있다면 무엇인지 밝혀라. 없다면 없다고 명시적으로 밝혀라.

{{goal}}
세 가지 모두 진짜로 충족됐다면 답변 어딘가에 정확히 다음 문자열을 포함해라: [[TASTY-CHECKLIST-DONE]] 그렇지 않다면 계속 작업해라.
"""
goal_clause = """이 세션에 설정된 goal: {}
위에서 밝힌 남은 작업을 이 goal 에 비추어 판정해라. 남은 작업 중 사용자 판단이 필요하지 않고 스스로 진행할 수 있는 것이 있다면, 여기서 끝내지 말고 그것을 진행해라. 남은 작업이 전부 사용자 판단을 필요로 하거나 goal 범위 밖이라면 그대로 끝내도 된다.
"""
no_data_dir = "plugin data directory 를 사용할 수 없다(호스트가 TASTY_PLUGIN_DATA_DIR 를 주입하지 않음) — checklist 를 켜거나 끌 수 없다"
io_error = "checklist marker 파일 입출력 실패: {}"

[claude.params]
missing_surface_id = "필수 파라미터 'surface'(또는 'surface_id') 누락"
missing_surface_no_env = "필수 파라미터 'surface_id' 누락(환경변수 TASTY_SURFACE_ID 도 설정돼 있지 않음)"
surface_id_not_a_number = "'surface_id' 에 {} 가 왔다 — 32 비트에 들어가는 정수여야 한다. 자르지 않고 거부한다: 잘린 id 는 실재할 수 있는 다른 surface 를 가리킨다"
target_surface_not_a_number = "대상 surface 에 {} 가 왔다 — 'surface'/'surface_id' 는 32 비트에 들어가는 정수여야 한다. 자르지 않고 거부한다: 잘린 id 는 실재할 수 있는 다른 surface 를 가리킨다"
surface_conflict = "'surface' 와 'surface_id' 가 서로 다른 대상을 가리킨다 ({}) — 하나만 보내거나 같은 값을 보내라"
surface_not_a_number = "'surface' 에 숫자가 아닌 {} 이(가) 왔습니다 — 무시하지 않고 거부합니다: 무시하면 TASTY_SURFACE_ID, 즉 호출자 자신의 surface 로 폴백합니다"
missing_child_index = "필수 파라미터 'child'(또는 'child_index') 누락"
child_index_not_a_number = "'child' 에 {} 가 왔다 — 32 비트에 들어가는 정수여야 한다. 자르지 않고 거부한다: 잘린 index 는 다른 자식을 가리킨다"
missing_text = "필수 파라미터 'text' 누락"
missing_message = "필수 파라미터 'message' 누락"
missing_caller_surface = "필수 파라미터 'caller_surface' 누락"
missing_target_surface = "필수 파라미터 'target_surface' 누락"
missing_command = "필수 파라미터 'command' 누락"
missing_name = "필수 파라미터 'name' 누락"
missing_file = "필수 파라미터 'file' 누락"
missing_body_file = "필수 파라미터 'body_file' 이 없다"

[claude.hook]
missing_event = "필수 파라미터 'event' 누락"
unknown_event = "알 수 없는 claude hook 이벤트: '{}'"

[claude.notify]
done_message = "surface {}: 작업 완료 (호출: {})"
stalled_message = "surface {}: 에러 이후 출력이 멈췄다 — 자식이 정지한 것으로 보인다 (여전히 active, 완료 신호 없음)"
stalled_hint = " 마지막 에러: {}"

[claude.launch]
workspace_create_missing_id = "호스트 workspace.create 응답에 'id' 가 없다"

[claude.child]
unknown_index = "index {} 인 자식이 없다 — 부모 surface {} 기준 (사용 가능한 index: {})"

[claude.respawn]
missing_child_surface_id = "호스트 terminal.respawn 응답에 'child_surface_id' 가 없다: {}"

[claude.spawn]
missing_child_surface_id = "호스트 terminal.spawn 응답에 'child_surface_id' 가 없다: {}"
warning_threshold = "이 parent 의 자식이 이제 {}개로, 경고 임계치({})를 넘었다."
warning_idle_children = " index {} 의 idle 자식은 새로 spawn 하는 대신 respawn 으로 재사용할 수 있다."
warning_stale_children = " index {} 의 자식은 에이전트 프로세스가 더 이상 돌지 않는데 완료 보고가 오지 않았다(hook 유실) — 이들도 respawn 대상이다."

[claude.install]
no_home_dir = "홈 디렉터리를 확인할 수 없다"
settings_root_not_object = "~/.claude/settings.json 최상위 값이 JSON object 가 아니다"
hooks_not_object = "~/.claude/settings.json 의 'hooks' 키가 JSON object 가 아니다"
hooks_event_not_array = "~/.claude/settings.json 의 'hooks.{}' 가 JSON array 가 아니다"
install_failed = "install 실패: {}"
uninstall_failed = "uninstall 실패: {}"

[claude.profile]
no_data_dir = "plugin data directory 를 사용할 수 없다(호스트가 TASTY_PLUGIN_DATA_DIR 를 주입하지 않음) — 프로필을 등록하거나 부착할 수 없다"
invalid_short_name = "'{}' 는 유효한 프로필 이름이 아니다(소문자, 숫자, '-' 만, 최대 32자)"
empty_names = "프로필 이름이 주어지지 않았다"
unknown_profile = "'{}' 라는 이름으로 등록된 프로필이 없다"
not_attachable = "'{}' 는 조회 전용 내장 항목이라 이름으로 부착할 수 없다"
gate_name_conflict = "'{}' 는 이미 Stop-훅 게이트로 등록돼 있다 — 게이트도 이름으로 부착되므로 다른 이름을 쓰거나 'claude gate-unregister {}' 로 먼저 해제해라"
source_not_readable = "프로필 원본 '{}' 을 읽을 수 없다: {}"
source_not_json_object = "프로필 원본 '{}' 이 JSON object 가 아니다"
io_error = "'{}': {}"
error_prefix = "profile: {}"
mutually_exclusive_file_and_profile = "--profile-file 와 --profile 은 동시에 줄 수 없다 — 하나만 지정해라"
builtin_always_installed = "내장 — 항상 설치됨 (Claude Code 이벤트: {})"
builtin_always_installed_with_matcher = "내장 — 항상 설치됨 (Claude Code 이벤트: {}, matcher: {})"
gate_attachable = "Stop-훅 게이트 — 등록된 프로필처럼 이름으로 부착 가능 ('claude gate-show <이름>' 으로 정의 확인)"

[claude.gate]
no_data_dir = "plugin data directory 를 사용할 수 없다(호스트가 TASTY_PLUGIN_DATA_DIR 를 주입하지 않음) — 게이트를 등록하거나 해제할 수 없다"
invalid_short_name = "'{}' 는 유효한 게이트 이름이 아니다(소문자, 숫자, '-' 만, 최대 32자)"
unknown_gate = "'{}' 라는 이름으로 등록된 게이트가 없다"
body_not_readable = "게이트 본문 '{}' 을 읽을 수 없다: {}"
body_missing_sentinel = "게이트 본문에 센티넬 '{}' 이 없다 — 센티넬이 없으면 모델이 종료를 선언할 방법을 안내받지 못해, 게이트가 라운드 상한만큼 무조건 연장하는 장치로 변질된다"
empty_sentinel = "센티넬은 비워둘 수 없다 — 빈 센티넬은 모든 메시지에 매칭되어 게이트가 첫 라운드에 통과한다"
rounds_below_one = "--rounds 는 1 이상이어야 한다"
profile_name_conflict = "'{}' 는 이미 세션 프로필로 등록돼 있다 — 게이트도 이름으로 부착되므로 다른 이름을 쓰거나 'claude profile-unregister {}' 로 먼저 해제해라"
io_error = "'{}': {}"
error_prefix = "gate: {}"

[claude.profile_merge]
not_an_object = "프로필 '{}' 의 최상위 값이 JSON object 가 아니다"
scalar_conflict = "'{}' 에서 프로필 머지 충돌: {} vs {} — 권한이 조용히 약해지는 것을 막기 위해 거부한다"

[claude.reboot]
notice = "tasty claude reboot : 이 세션은 tasty 의 reboot 기능으로 재시작되었습니다 (claude -r 로 동일 세션 resume). 직전 턴이 잘렸을 수 있으니 마지막 작업 상태를 확인하고 이어서 진행하세요."
malformed_session_id = "surface {} 의 claude-session-id meta 형식이 잘못됐다: {}"
no_foreground_process = "surface {} 의 foreground 프로세스를 확인할 수 없다"
lock_poisoned = "reboot in-flight lock 이 poison 됐다: {}"
already_in_progress = "surface {} 는 이미 reboot 진행 중이다"
spawn_thread_failed = "reboot 스레드 생성 실패: {}"
profile_file_not_readable = "프로필 파일 '{}' 을 읽을 수 없다: {}"
profile_file_not_json = "프로필 파일 '{}' 이 유효한 JSON 이 아니다: {}"
no_active_session = "surface {} 에 활성 claude 세션이 없다 (claude-session-id meta 미설정 — tasty 훅이 설치돼 있는가? `tasty claude install` 실행 필요)"

[settings.subtab]
claude = "Claude Code"
