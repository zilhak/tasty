[settings.subtab]
claude = "Claude Code"

[claude.cli.sub.launch]
description = "새 워크스페이스에서 Claude Code 시작"

[claude.cli.sub.spawn]
description = "워크스페이스에 자식 Claude 생성. 즉시 반환하며 자식이 idle/needs_input으로 전환할 때마다, 그리고 종료할 때 호출자 서피스에 알림을 전달합니다. 첫 전환에만 한정되지 않습니다."

[claude.cli.sub.children]
description = "지정한 Claude 부모의 자식 나열"

[claude.cli.sub.parent]
description = "지정한 Claude 자식의 부모 표시"

[claude.cli.sub.state]
description = "자식 하나의 상태 조회: idle, needs_input, active, exited(실제 서피스와 대조)"

[claude.cli.sub.tell]
description = "Claude 인스턴스에 여러 줄 메시지 전송(끝에서 제출). 즉시 반환하며 대상이 idle/needs_input으로 전환할 때마다, 그리고 종료할 때 호출자 서피스에 알림을 전달합니다. 첫 전환에만 한정되지 않습니다."

[claude.cli.sub.broadcast]
description = "부모 Claude 인스턴스의 모든 자식에게 텍스트 일괄 전송"

[claude.cli.sub.kill]
description = "자식 인덱스로 Claude 인스턴스 종료"

[claude.cli.sub.respawn]
description = "자식 Claude 인스턴스 재생성"

[claude.cli.sub.reboot]
description = "서피스의 Claude를 재시작하고 같은 세션 재개(지연 종료 + claude -r). 턴의 마지막 동작으로 호출하세요. 지연 이후 작업은 중단됩니다."

[claude.cli.sub.child-profile]
description = "자식 인스턴스에 지속되는 Claude 세션 프로필 부착(--child의 서피스를 찾아 'claude reboot --profile'과 같은 순서 실행). 자식만 재시작하므로 reboot와 달리 호출자의 턴은 중단하지 않습니다. 자식이 idle/needs_input으로 전환하거나 종료하면 호출자 서피스에 알립니다."

[claude.cli.sub.install]
description = "~/.claude/settings.json에 tasty 훅 설치"

[claude.cli.sub.uninstall]
description = "~/.claude/settings.json에서 tasty 훅 제거"

[claude.cli.sub.hook]
description = "Claude Code 훅 연동. Claude Code 훅 시스템이 호출하면 stdin에서 JSON payload(session_id, message, notification_type, error, agent_id)를 읽습니다."

[claude.cli.sub.checklist-hook]
description = "Stop 훅 게이트 판정. stdin에서 JSON(session_id, prompt_id, stop_hook_active, last_assistant_message)을 읽습니다. --gate로 판정할 등록 게이트 선택(기본값: continue-checklist)."

[claude.cli.sub.checklist-enable]
description = "Stop 훅 게이트 활성화(활성 마커 생성). 기본값은 내장 continue-checklist 게이트"

[claude.cli.sub.checklist-disable]
description = "Stop 훅 게이트 비활성화(활성 마커 제거). 이미 꺼져 있어도 성공"

[claude.cli.sub.checklist-status]
description = "Stop 훅 게이트 활성 상태 표시. 모든 게이트를 한 번에 보려면 'claude gate-list' 사용"

[claude.cli.sub.notify-error]
description = "내부용: 오류 후 자식 정체 알림을 호출자 서피스에 전달(claude-error-stalled의 hook.set 명령). 자식 상태나 완료 훅을 변경·정리·재등록하지 않습니다."

[claude.cli.sub.notify-done]
description = "내부용: spawn/tell 상태 전환을 호출자에게 알리고 형제 일회성 훅을 정리합니다. 대상 서피스가 남아 있으면(process-exit이 아니면) 세 형제 훅을 다시 등록해 실제 종료까지 계속 알립니다(claude-idle/needs-input/process-exit의 hook.set 명령)."

[claude.cli.sub.profile-register]
description = "이름으로 Claude 세션 프로필 등록(plugin 전용 저장소에 파일 복사, 같은 이름 재등록은 내용 갱신)"

[claude.cli.sub.profile-unregister]
description = "등록된 Claude 세션 프로필 제거"

[claude.cli.sub.profile-list]
description = "이름으로 부착 가능한 세션 프로필·Stop 훅 게이트와 항상 설치된 내장 훅 나열"

[claude.cli.sub.profile-show]
description = "이름으로 부착할 내용 표시: 등록된 세션 프로필의 원시 settings JSON 또는 게이트에서 생성한 Stop 훅 조각"

[claude.cli.sub.profile-current]
description = "서피스에 부착된 Claude 세션 프로필(있는 경우)과 항상 설치된 내장 훅 표시"

[claude.cli.sub.gate-register]
description = "이름으로 Stop 훅 게이트 등록(plugin 전용 저장소에 본문 복사, 같은 이름 재등록은 본문과 정의 모두 교체)"

[claude.cli.sub.gate-unregister]
description = "등록된 Stop 훅 게이트 제거(정의 및 본문 사본 삭제)"

[claude.cli.sub.gate-list]
description = "등록 및 내장 Stop 훅 게이트의 유효 완료 표식·회차 제한·활성 상태 나열"

[claude.cli.sub.gate-show]
description = "Stop 훅 게이트 정의 및 본문 표시"

