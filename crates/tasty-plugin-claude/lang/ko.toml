[claude.cli.sub.tell]
description = "Claude 인스턴스에 여러 줄 메시지 전송(끝에서 제출). 즉시 반환하며 대상이 idle/needs_input으로 전환할 때마다, 그리고 종료할 때 호출자 서피스에 알림을 전달합니다. 첫 전환에만 한정되지 않습니다."

[claude.cli.sub.broadcast]
