help = "자식 세션 권한 모드(acceptEdits|auto|bypassPermissions|manual|dontAsk|plan). --permission-mode로 전달하며 이번 호출에만 default_permission_mode를 재정의합니다. 미지정이면 플래그를 보내지 않아 사용자 Claude Code 설정을 따릅니다. permissions.defaultMode를 설정한 --profile/--profile-file과 함께 쓰면 거부됩니다."

