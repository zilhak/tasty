[package]
name = "tasty-plugin-claude"
version = "0.2.76"
edition = "2024"
license = "MIT"
description = "External Tasty plugin: Claude Code CLI integration"
repository = "https://github.com/zilhak/tasty"

[[bin]]
name = "tasty-plugin-claude"
path = "src/main.rs"

[dependencies]
tasty-plugin-sdk = { path = "../tasty-plugin-sdk" }
tasty-plugin-agent-common = { path = "../tasty-plugin-agent-common" }
tasty-utils = { path = "../tasty-utils" }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
regex = "1"
directories = "6"
shell-escape = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# 언어별 시험의 대상 목록을 내장 언어 정본에서 얻는다.
tasty-i18n = { path = "../tasty-i18n" }
tempfile = "3"
tasty-test-support = { path = "../tasty-test-support" }

[lints]
workspace = true
