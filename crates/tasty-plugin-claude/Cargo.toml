[package]
name = "tasty-plugin-claude"
version = "0.1.70"
edition = "2024"
license = "MIT"
description = "External Tasty plugin: Claude Code CLI integration"
repository = "https://github.com/zilhak/tasty"

[lib]
path = "src/lib.rs"

[[bin]]
name = "tasty-plugin-claude"
path = "src/main.rs"

[dependencies]
tasty-plugin-sdk = { path = "../tasty-plugin-sdk" }
tasty-plugin-agent-common = { path = "../tasty-plugin-agent-common" }
tasty-utils = { path = "../tasty-utils" }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
regex = "1"
directories = "6"
shell-escape = "0.1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
