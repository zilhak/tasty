manifest_version = 1
id = "com.tasty.mesh-demo"
name = "egui-mesh Demo"
version = "0.1.41"
description = "egui-mesh channel proof-of-concept surface (A1)"
api_version = "1"
# 배포 패키지에서는 제외하고 개발용 build-plugins / link-plugins에서는 준비한다.
bundle = false
permissions = [
    "surface.read",
    "surface.write",
    "file_handler.define",
    "file_handler.handle:meshdemo",
    "ui.popup",
    "ui.banner",
]
lang_dir = "lang"

[entry]
type = "process"
command = "tasty-plugin-mesh-demo"

# 플러그인이 만든 egui mesh를 호스트가 합성한다. 등록 시 번들 목록과 API 버전을 검사한다.
[[surface_kinds]]
kind = "mesh_demo"
display_name_i18n_key = "surface.kind.mesh_demo"
rendering = "egui-mesh"

# `.meshdemo` 파일을 열면 mesh_demo surface 로 띄운다 (markdown/image 와 동일 패턴).
# convert popup 외에 파일 연결로도 surface 를 만들 수 있게 해 헤드리스 검증을 돕는다.
[[contributes.detector]]
id = "meshdemo"
display_name_i18n_key = "file_handler.format.mesh_demo"
[[contributes.detector.rule]]
kind = "extension"
values = ["meshdemo"]

[[contributes.handler]]
id = "viewer"
detector = "meshdemo"
priority = 50
display_name_i18n_key = "file_handler.host.mesh_demo"
[contributes.handler.action]
kind = "open_surface"
surface_kind = "mesh_demo"
param_key = "file"

# 플러그인은 팝업 콘텐츠를, 호스트는 외곽과 닫기 동작을 처리한다.
[[contributes.popup]]
id = "demo"
trigger = { kind = "ipc" }
rendering = "egui-mesh"
size_hint = { width = 480, height = 320 }
anchor = "screen-center"
dismiss_on_outside_click = true

# 배너 콘텐츠는 플러그인이 그린다. 호스트가 위치·외곽·닫기와 8초 TTL을 관리한다.
[[contributes.banner]]
id = "status"
trigger = { kind = "ipc" }
rendering = "egui-mesh"
scope = "surface"
ttl_seconds = 8
size_hint = { height = 72 }
