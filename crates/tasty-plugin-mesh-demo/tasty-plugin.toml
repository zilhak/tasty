manifest_version = 1
id = "com.tasty.mesh-demo"
name = "egui-mesh Demo"
version = "0.1.10"
description = "egui-mesh channel proof-of-concept surface (A1)"
api_version = "1"
# 데모/PoC plugin — 배포 패키징(DMG/AppImage/MSIX)에서 제외한다. dev 빌드
# (just build-plugins / link-plugins)는 영향 없이 그대로 스테이징한다.
bundle = false
permissions = [
    "surface.read",
    "surface.write",
    "file_handler.define",
    "file_handler.handle:meshdemo",
    "ui.popup",
    "ui.banner",
]
lang_dir = "lang"

[entry]
type = "process"
command = "tasty-plugin-mesh-demo"

# egui-mesh: plugin 이 자기 프로세스에서 egui 를 tessellate 한 mesh 를 host 가 전용
# egui_wgpu::Renderer 로 합성한다 (ADR-0028). bundled 전용 화이트리스트 + api_version
# 게이트를 통과해야 등록된다 (src/core/surface_registry/egui_mesh.rs).
[[surface_kinds]]
kind = "mesh_demo"
display_name_i18n_key = "surface.kind.mesh_demo"
rendering = "egui-mesh"

# `.meshdemo` 파일을 열면 mesh_demo surface 로 띄운다 (markdown/image 와 동일 패턴).
# convert popup 외에 파일 연결로도 surface 를 만들 수 있게 해 헤드리스 검증을 돕는다.
[[contributes.detector]]
id = "meshdemo"
display_name_i18n_key = "file_handler.format.mesh_demo"
[[contributes.detector.rule]]
kind = "extension"
values = ["meshdemo"]

[[contributes.handler]]
id = "viewer"
detector = "meshdemo"
priority = 50
display_name_i18n_key = "file_handler.host.mesh_demo"
[contributes.handler.action]
kind = "open_surface"
surface_kind = "mesh_demo"
param_key = "file"

# egui-mesh popup PoC (A2): plugin 이 popup 콘텐츠를 자기 프로세스에서 egui mesh 로
# 그리고, host 는 셸(scrim/border/outside-click/Esc)만 그린 뒤 합성한다. ipc 로 연다
# (debug.popup.open { plugin_id, popup_id }). rendering = "egui-mesh" 가 mesh 경로 선택.
[[contributes.popup]]
id = "demo"
trigger = { kind = "ipc" }
rendering = "egui-mesh"
size_hint = { width = 480, height = 320 }
anchor = "screen-center"
dismiss_on_outside_click = true

# egui-mesh banner PoC (A3): plugin 이 banner content 를 자기 프로세스에서 egui mesh 로
# 그리고, host 는 셸(컨테이너/border/close X/카운트다운)과 스택/위치/dismiss 타이밍을 소유한
# 뒤 content_rect 에 합성한다. ipc 로 연다 (debug.plugin_banner.open { plugin_id?, banner_id,
# surface_id }). ttl_seconds = 8 로 자동 소멸(스택/카운트다운 시각 검증). scope 는 surface
# (그 plugin 이 소유한 mesh_demo surface).
[[contributes.banner]]
id = "status"
trigger = { kind = "ipc" }
rendering = "egui-mesh"
scope = "surface"
ttl_seconds = 8
size_hint = { height = 72 }
