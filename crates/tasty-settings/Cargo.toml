[package]
name = "tasty-settings"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "Settings types and persistence for Tasty (appearance, keybindings, general)"

[dependencies]
# Workspace crates
tasty-themes = { path = "../tasty-themes" }
tasty-type-appearance = { path = "../tasty-type-appearance", default-features = false }
tasty-type-geometry = { path = "../tasty-type-geometry" }
tasty-utils = { path = "../tasty-utils" }

# Serialization
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Hashing (script registry SHA256 / TOFU)
sha2 = "0.10"

# Logging
tracing = "0.1"

# Error handling
anyhow = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
