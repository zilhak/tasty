[package]
name = "tasty-update"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "GitHub Releases polling + version comparison for tasty auto-update"

[dependencies]
ureq = { version = "2", features = ["json", "tls"] }
serde = { version = "1", features = ["derive"] }
semver = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
