[package]
name = "tasty-update"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "GitHub Releases polling + version comparison for tasty auto-update"

[dependencies]
ureq = { version = "2", features = ["json", "tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
thiserror = "2"
tracing = "0.1"

[lints]
workspace = true
