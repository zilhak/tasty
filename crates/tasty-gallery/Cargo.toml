[package]
name = "tasty-gallery"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "Tasty UI component gallery — standalone visual catalog (Storybook-like)"

[dependencies]
winit = "0.30"
wgpu = "24"
egui = "0.31"
egui-wgpu = "0.31"
egui-winit = "0.31"
# "image" 는 공용 워드마크의 로고 PNG(bytes 로더)를 디코드한다.
egui_extras = { version = "0.31", features = ["svg", "image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "0.4"
png = "0.18"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

tasty-dag-layout = { path = "../tasty-dag-layout" }
tasty-design-tokens = { path = "../tasty-design-tokens" }
tasty-egui-theme = { path = "../tasty-egui-theme" }
# 본체와 같은 고정폭 글꼴로 텍스트 폭을 측정한다.
tasty-font = { path = "../tasty-font" }
# 본체 번역 파일의 문구를 사본 없이 그대로 보여준다.
tasty-i18n = { path = "../tasty-i18n" }
# Plugins 서브탭 예제가 본체와 같은 규칙으로 해석하지 못한 키를 고른다.
tasty-key-match = { path = "../tasty-key-match" }
tasty-icons = { path = "../tasty-icons", features = ["egui"] }
# 설정 파일을 읽지 않고 기본 키바인딩으로 전환 예제의 라벨을 만든다.
tasty-settings = { path = "../tasty-settings" }
# 권한 안내 본문을 본체와 같은 조립 함수로 만든다(gui feature 없이 순수 부분만 쓴다).
tasty-platform = { path = "../tasty-platform" }
tasty-ui-widgets = { path = "../tasty-ui-widgets" }
tasty-themes = { path = "../tasty-themes" }
tasty-type-appearance = { path = "../tasty-type-appearance", features = ["egui-compat"] }
tasty-type-geometry = { path = "../tasty-type-geometry" }

[dev-dependencies]
serde_json = "1"
# lang_copies 시험이 본체 lang/en.toml 을 키로 펼친다.
toml = "0.8"
# lang_copies 시험의 소스 순회. 하한을 인자로 받는 공용 순회다. dev 전용이라 산출물에 들어가지 않는다.
tasty-doc-guards = { path = "../tasty-doc-guards" }

[lints]
workspace = true
