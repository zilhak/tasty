[package]
name = "tasty-plugin-image"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "External Tasty plugin: image surface namespace + CLI"
repository = "https://github.com/zilhak/tasty"

[[bin]]
name = "tasty-plugin-image"
path = "src/main.rs"

[dependencies]
tasty-plugin-sdk = { path = "../tasty-plugin-sdk" }
serde_json = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

[lints]
workspace = true
