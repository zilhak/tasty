[package]
name = "tasty-plugin-image"
version = "0.1.52"
edition = "2024"
license = "MIT"
description = "Image surface viewer / paint canvas plugin (egui-mesh + bitmap texture)"
repository = "https://github.com/zilhak/tasty"

[[bin]]
name = "tasty-plugin-image"
path = "src/main.rs"

[dependencies]
tasty-plugin-sdk = { path = "../tasty-plugin-sdk", features = ["egui-mesh"] }
# 호스트와 같은 언어팩 폰트 검사·설치 함수를 사용한다.
tasty-egui-theme = { path = "../tasty-egui-theme" }
tasty-plugin-protocol = { path = "../tasty-plugin-protocol" }
tasty-type-appearance = { path = "../tasty-type-appearance", features = ["egui-compat"] }
# 파일 읽기 지원 여부는 이 feature와 ImageFormat::reading_enabled에서 확인한다.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "ico", "tiff"] }
# 붙여넣을 클립보드 이미지를 읽는다.
arboard = "3"
# 새 이미지의 저장 경로를 고른다.
rfd = "0.15"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

# SDK와 같은 egui 타입을 사용한다.
egui = { version = "0.31", default-features = false, features = [
    "bytemuck",
    "default_fonts",
] }

# 빌드 때 tasty-icons의 SVG를 폴리라인 상수로 변환한다.
[build-dependencies]
usvg = "0.37"
tasty-icons = { path = "../tasty-icons", default-features = false }

[lints]
workspace = true
