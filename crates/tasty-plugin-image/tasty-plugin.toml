manifest_version = 1
id = "com.tasty.image"
name = "Image"
version = "0.1.18"
description = "Image surface viewer / paint canvas"
api_version = "1"
permissions = [
    "surface.read",
    "surface.write",
    "clipboard.read",
    "fs.read",
    "fs.write",
    "file_handler.define",
    "file_handler.handle:image",
]
lang_dir = "lang"

[entry]
type = "process"
command = "tasty-plugin-image"

# egui-mesh 하이브리드(ADR-0028 / B2): 비트맵은 plugin egui Context 의 텍스처로
# 올려(mesh textures_delta 채널, 폰트 atlas 와 동일 경로) mesh 로 합성하고, chrome
# (control bar / paint bar / handles / zoom)도 같은 mesh 로 선명하게 그린다. host 의
# egui-mesh 화이트리스트 + api_version 게이트(src/core/surface_registry/egui_mesh.rs)를
# 통과해야 등록된다. 별도 Canvas 레이어(재사용 substrate)는 실재하지 않아 채택하지
# 않는다 — mesh 텍스처델타가 대형 비트맵을 1회 업로드+캐시로 처리한다(ADR-0028 재결정).
[[surface_kinds]]
kind = "image"
display_name_i18n_key = "surface.kind.image"
icon = "image"
rendering = "egui-mesh"
# capability: paste 는 plugin(image.paste)이 소비 — host 가 terminal 로 흘리지 않음.
egui_paste = true
# 자동 탭 명명: `file` 값의 basename 을 표시명으로. 본체의 kind 하드코딩을 대체.
name_from_param = "file"

# 프리셋 편집기 필드 — 파일 경로(+Browse). 적용 시 파일 폴더를 cwd 로 파생.
[[surface_kinds.preset_fields]]
id = "file"
label_key = "preset.field.file"
param_key = "file"
input_type = "file_path"
required = true
placeholder_key = "preset.field.file_hint"
derive_cwd = true

[surface_kinds.default_colors]
focused_bg = "#1e1e2e"
focused_fg = "#cdd6f4"
unfocused_bg = "#181825"
unfocused_fg = "#a6adc8"

[[contributes.ipc_namespace]]
prefix = "image"
description_i18n_key = "image.namespace.desc"

# 이미지 확장자 매핑. install 단계가 전역 id 를 "com.tasty.image/image" 로 자동 prefix.
[[contributes.detector]]
id = "image"
display_name_i18n_key = "file_handler.format.image"
[[contributes.detector.rule]]
kind = "extension"
values = ["png", "jpg", "jpeg", "gif", "webp", "bmp", "ico", "tiff", "tif"]

# id 는 short name (lowercase + 숫자 + `-`, 1~32자). 전역 id 는 install 단계가
# "com.tasty.image/viewer" 로 자동 prefix.
[[contributes.handler]]
id = "viewer"
detector = "image"
priority = 50
display_name_i18n_key = "file_handler.host.image-viewer"
[contributes.handler.action]
kind = "open_surface"
surface_kind = "image"
param_key = "file"

[[contributes.cli]]
name = "image"
description = "Image surface viewer and paint canvas"
description_i18n_key = "image.cli.desc"
subcommands = [
    { name = "open",   ipc_method = "image.open",       args = "open_args",   description = "Convert a surface to image kind and load the given file" },
    { name = "save",   ipc_method = "image.save",       args = "save_args",   description = "Save the current image surface to disk (PNG)" },
    { name = "export", ipc_method = "image.export_png", args = "export_args", description = "Export the current image surface to the given PNG path" },
    { name = "next",   ipc_method = "image.next",       args = "nav_args",    description = "Step to the next image in the same directory" },
    { name = "prev",   ipc_method = "image.prev",       args = "nav_args",    description = "Step to the previous image in the same directory" },
    { name = "paste",  ipc_method = "image.paste",      args = "nav_args",    description = "Paste a clipboard image as a floating selection" },
    { name = "list",   ipc_method = "image.list",       args = "no_args",     description = "List all open image surfaces" },
]

[contributes.cli.arg_groups.open_args]
positional = [
    { name = "path", type = "string", required = true, help = "Path to the image file to open" },
]
flags = [
    { name = "surface", type = "u32", flag = "--surface", required = true, help = "Target surface ID" },
]

[contributes.cli.arg_groups.save_args]
flags = [
    { name = "surface", type = "u32",    flag = "--surface", required = true,  help = "Target surface ID" },
    { name = "path",    type = "string", flag = "--path",    required = false, help = "Override save path (defaults to the surface's open file with .png extension)" },
]

[contributes.cli.arg_groups.export_args]
positional = [
    { name = "path", type = "string", required = true, help = "PNG file path to export to" },
]
flags = [
    { name = "surface", type = "u32", flag = "--surface", required = true, help = "Target surface ID" },
]

[contributes.cli.arg_groups.nav_args]
flags = [
    { name = "surface", type = "u32", flag = "--surface", required = true, help = "Target surface ID" },
]

[contributes.cli.arg_groups.no_args]
