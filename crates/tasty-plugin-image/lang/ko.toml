[image.cli.arg.save_args.path]
help = "저장 경로 재정의(기본값: 서피스에서 연 파일의 확장자를 .png로 변경)"

[image.cli.arg.export_args.path]
help = "내보낼 PNG 파일 경로"

[image.cli.arg.export_args.surface]
help = "대상 서피스 ID"

[image.cli.arg.nav_args.surface]
help = "대상 서피스 ID"
