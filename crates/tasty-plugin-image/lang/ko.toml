# 프리셋 편집기 필드 라벨 (호스트가 t() 로 해석).
[preset.field]
file = "파일"
file_hint = "이미지 파일 경로"

[image.cli.sub.open]
description = "서피스를 이미지 종류로 변환하고 지정 파일 로드"

[image.cli.sub.save]
description = "현재 이미지 서피스를 디스크에 PNG로 저장"

[image.cli.sub.export]
description = "현재 이미지 서피스를 지정 PNG 경로로 내보내기"

[image.cli.sub.next]
description = "같은 디렉터리의 다음 이미지로 이동"

[image.cli.sub.prev]
description = "같은 디렉터리의 이전 이미지로 이동"

[image.cli.sub.paste]
description = "클립보드 이미지를 떠 있는 선택 영역으로 붙여넣기"

[image.cli.sub.reload]
description = "디스크에서 파일 다시 읽기(편집 세션 중이면 연기)"

[image.cli.sub.list]
description = "열린 이미지 서피스 모두 나열"

