# 등록만으로 실행하지 않으며 실제 훅·웹훅 바인딩이 필요하다.
# command-completed의 알림 action과 task 완료 통지는 별도 처리다.

[[handler]]
id = "webhook-notify"
source = "webhook"
priority = 100

[handler.action]
kind = "ipc_sequence"
calls = [{ method = "notification.create", params = { title = "Webhook", body = "${body.message}" } }]

[[handler]]
id = "command-completed"
source = "hook"
priority = 100

[handler.action]
kind = "ipc_sequence"
calls = [{ method = "notification.create", params = { title = "Command completed", body = "exit code ${body.exit_code}" } }]
