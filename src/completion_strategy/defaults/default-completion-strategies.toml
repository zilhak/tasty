# 완료 판정 전략. poll은 상태를 조회하고 push는 훅 핸들러의 보고를 기다린다.
# push의 timeout_ms는 필수다. priority가 작을수록 우선하며 default_for_methods는 기본 전략을 지정한다.
# 레지스트리 규칙: docs/dev-guide/agent-runner.md.
#
# command-completed는 OSC 133 셸 통합이 필요하다. 없으면 hook.set이 경고하지만 거절하지는 않는다.
# Custom 작업의 params에는 surface_id가 있어야 해당 surface에 일회성 완료 훅을 건다.
# host/command-completed 핸들러는 ../../hook_handler/defaults/default-hook-handlers.toml에 있다.
# exit code가 0이거나 없으면 성공, 그 외에는 실패로 처리한다.
[[strategy]]
id = "command-completed"
priority = 100
default_for_methods = []

[strategy.spec]
kind = "push"
notify_via = "host/command-completed"
timeout_ms = 300000
