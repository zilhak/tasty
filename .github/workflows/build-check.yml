name: Build Check

# 패키지 빌드를 검사하고 산출물은 삭제한다.
# self-hosted 러너의 부하를 제한하기 위해 수동으로만 실행한다.

on:
  workflow_dispatch:

# 같은 ref의 이전 실행을 취소해 러너가 중복 작업을 하지 않게 한다.
concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4

      - name: Build DMG
        run: bash scripts/build-macos-dmg.sh

      - name: Clean up dist
        if: always()
        run: rm -rf dist

  build-windows:
    runs-on: [self-hosted, Windows]
    steps:
      - uses: actions/checkout@v4

      - name: PowerShell syntax check
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.PSParser]::Tokenize(
            (Get-Content -Raw scripts/build-windows.ps1),
            [ref]$errors
          ) | Out-Null
          if ($errors -and $errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "PowerShell syntax OK"

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Install-Module -Name PSScriptAnalyzer -Force -SkipPublisherCheck -Scope CurrentUser
          }
          $issues = Invoke-ScriptAnalyzer -Path scripts/build-windows.ps1 -Severity Error
          if ($issues) {
            $issues | Format-Table
            exit 1
          }
          Write-Host "PSScriptAnalyzer OK"

      - name: Build ZIP and MSI
        shell: pwsh
        run: ./scripts/build-windows.ps1

      - name: Clean up dist
        if: always()
        shell: pwsh
        run: Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue

  build-linux-x64:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PATH
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build tar.gz + deb + rpm + AppImage
        run: bash scripts/build-linux.sh

      - name: Clean up dist
        if: always()
        run: rm -rf dist

  build-linux-arm64:
    runs-on: [self-hosted, Linux, ARM64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PATH
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build tar.gz + deb + rpm + AppImage
        run: bash scripts/build-linux.sh

      - name: Clean up dist
        if: always()
        run: rm -rf dist
