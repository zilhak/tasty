name: Script Gates

# Intent를 우회한 상태 변경, 사유 없는 allow 속성, 공용 순회를 거치지 않는
# read_dir 호출, Core::apply 밖의 구조 writer와 셸 스크립트를 검사한다.

on:
  # 현재 검사 대상 밖인 문서·사이트 변경만 있는 push는 생략한다.
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'site/**'
      - '**/*.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: script-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  script-gates:
    runs-on: [self-hosted, Linux, X64]
    # 실측 최대 1.0분 × 3. 기준: docs/dev-guide/ci-gates.md#잡-시간-상한
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup PATH
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # 문자열을 검사 대상에서 제외하도록 공용 마스킹 도구를 먼저 빌드한다.
      # 구조 writer 래칫은 test 전용 코드를 지우는 도구도 함께 쓴다.
      - name: Build the masking judge
        run: cargo build -p tasty-doc-guards --bin mask-source --bin strip-cfg-test

      - name: Intent discipline
        run: bash scripts/check-intent-discipline.sh

      # 예외 수가 늘거나 줄면 실패한다. 줄었을 때는 허용 상한도 함께 낮춘다.
      - name: Allow reason (ratchet)
        if: always()
        run: bash scripts/check-allow-reason.sh

      # 앞 검사가 실패해도 공용 순회를 우회한 호출 수를 확인한다.
      - name: Shared walk (ratchet)
        if: always()
        run: bash scripts/check-shared-walk-ratchet.sh

      # Core::apply 밖의 구조 상태 writer 수가 기준 파일보다 늘면 실패한다.
      - name: Core writer (ratchet)
        if: always()
        run: bash scripts/check-core-writer-ratchet.sh

      # 검사 도구가 없으면 스크립트가 종료 코드 2로 실패하므로 먼저 설치한다.
      - name: Provision the shell checker
        if: always()
        run: bash scripts/install-shellcheck.sh

      # warning 이상이면 실패한다. 기준: docs/dev-guide/ci-gates.md#셸-검사와-커밋-범위
      - name: Shell assets (shellcheck)
        if: always()
        run: bash scripts/check-shell-assets.sh
