name: Supply Chain Check

# 의존성·설정 변경은 push와 PR에서, 새 보안 공지는 주간 실행에서 확인한다.
# push만 Cargo.lock/deny.toml 경로로 제한하며 PR에는 경로 필터를 두지 않는다.
# deny.toml의 advisories, licenses, bans, sources 규칙을 적용한다.

on:
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - deny.toml
  pull_request:
    branches: [main]
  schedule:
    # 매주 월요일 09:00 UTC에 보안 공지를 확인한다.
    - cron: "0 9 * * 1"
  workflow_dispatch:

concurrency:
  group: supply-chain-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PATH
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Ensure cargo-deny
        run: |
          if ! command -v cargo-deny >/dev/null 2>&1; then
            cargo install cargo-deny --locked
          fi
          cargo-deny --version

      - name: cargo deny check
        run: cargo deny check
