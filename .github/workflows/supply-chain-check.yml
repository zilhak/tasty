name: Supply Chain Check

# 루트 deny.toml 로 cargo-deny 의 advisories / licenses / bans / sources 4단계를 검증.
# cargo-deny 는 무컴파일·초단위라 자동화 부하가 극소이므로 매 PR 게이트로 상시화한다.
# 추가로 advisory DB 는 코드 무변경에도 시간 드리프트(신규 CVE)가 생기므로 주간 스케줄로
# 정기 스캔한다(daily 는 러너 부하 대비 이득이 적어 weekly). build-check/test 처럼 무거운
# 잡과 달리 deny 는 부하가 없어 수동 only 정책의 예외로 둔다.

on:
  pull_request:
    branches: [main]
  schedule:
    # 매주 월요일 09:00 UTC(주간 정기 advisory 스캔).
    - cron: "0 9 * * 1"
  workflow_dispatch:

# 같은 ref 의 중복 실행은 자동 취소 (self-hosted runner 점유 회피).
concurrency:
  group: supply-chain-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PATH
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Ensure cargo-deny
        run: |
          if ! command -v cargo-deny >/dev/null 2>&1; then
            cargo install cargo-deny --locked
          fi
          cargo-deny --version

      - name: cargo deny check
        run: cargo deny check
