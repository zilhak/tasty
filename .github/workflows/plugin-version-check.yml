name: Plugin Version Check

# plugin 의 빌드 산출물이 달라졌는데 매니페스트 `version` 이 그대로인 것을 잡는다.
# 목적은 라이브 반영이다 — `upgrade-builtins` 재sync 는 version 이 올랐을 때만 동작한다
# (same-version skip). 판정은 scripts/check-plugin-version-bump.sh 하나가 하고, 로컬
# 훅 둘(pre-commit P.1 · pre-push B.9)도 같은 스크립트를 부른다 — 세 자리가 갈리지 않게.
# 세 자리는 모수가 다르다: P.1 은 staged 를 main 과의 merge-base 와, B.9 는 원격 tip 을
# 로컬 tip 과, 이 잡은 밀려 들어온 범위의 두 끝점을 본다.
#
# 판별식이 파일 수 문턱이 아니라 **rustfmt 정규화 후 내용**인 근거·측정·대안:
# docs/adr/0137-plugin-version-bump-is-judged-by-content-not-file-count.md
#
# self-hosted Linux X64 근거: 컴파일이 없는 git+rustfmt 게이트라 초 단위로 끝난다.
# complexity-check.yml / supply-chain-check.yml 과 같은 관행.

on:
  # 이 저장소는 PR 을 열지 않고 main 에 직접 push 한다 — main push 가 실질적 유일
  # 채널이다(complexity-check.yml 이 같은 이유를 ADR-0131 근거로 적어 두었다).
  # PR 트리거도 함께 둬서 PR 을 쓰기 시작하면 그때부터 자동으로 걸리게 한다.
  # 필터를 경로 목록으로 두지 않는 이유: 판정 대상이 plugin 디렉토리가 아니라 **워크스페이스
  # 내부 의존 폐포**다(ADR-0166). `tasty-utils`·`tasty-shm` 처럼 이름이 `tasty-plugin-` 으로
  # 시작하지 않는 크레이트가 바뀌어도 plugin 산출물이 달라지므로, 좁은 필터로는 그 push 에서
  # 잡 자체가 안 돈다 — 스크립트를 고쳐도 자동 채널이 안 따라온다.
  # 그리고 좌변은 `crates/` 에서도 끝나지 않는다 — `[patch]` 로 끼운 상류 사본
  # (`vendor/tiny_http`)처럼 워크스페이스 밖 path 의존도 plugin 산출물을 바꾼다(ADR-0537).
  # 그 경로를 여기 목록으로 적으면 새 사본이 생길 때 이 자리만 옛 목록에 남아 조용히 안
  # 돈다. 그래서 거꾸로 **문서만 담은 push 만** 뺀다.
  # 단 `paths-ignore` 로는 못 뺀다 — `**/*.md` 가 스크립트의 판정 대상인 `.md` 까지 뺀다.
  # 스크립트(`build_affecting`)는 `*/src/*` · `*/lang/*` · `*/assets/*` 아래를 확장자와 무관하게
  # 산출물로 보므로 `crates/tasty-plugin-markdown/assets/NOTICE.md` 가 판정 대상이고, 그 파일만
  # 담은 push 에서 잡이 안 돌면 필터가 판정 대상의 상위집합이 아니게 된다. 오늘 `.md` 가 산출물에
  # 안 실린다는 것은 참이지만 그 0 은 바뀌어도 아무도 모른다. 그래서 `paths` 에 부정 패턴을 쓰고
  # 그 세 디렉토리 모양을 되살린다(ADR-0537).
  # ★ **순서가 의미를 정한다.** GitHub Actions 는 `paths` 의 패턴을 위에서 아래로 평가하고,
  # 한 파일에 여러 패턴이 맞으면 **뒤에 오는 패턴이 이긴다**(`!` 로 시작하면 제외, 아니면 포함).
  # - 맨 앞 `'**'` 가 없으면 세 디렉토리 밖 산출물 경로(`Cargo.toml` · `tasty-plugin.toml` ·
  #   `build.rs`)가 빠진다 — 아무것도 안 도는 것이 아니라 **덜 도는** 쪽이라 더 안 보인다.
  # - `src`·`lang`·`assets` 세 줄은 `'!**/*.md'` 보다 **뒤에** 있어야 그 아래 `.md` 가 다시 들어온다.
  # - `'!docs/**'`·`'!site/**'` 는 세 줄보다 **뒤에** 있어야 `site/src/**` 같은 자리가 되살아나지
  #   않는다(그 둘은 스크립트의 스캔 뿌리 — `crates/` 와 워크스페이스 밖 path 의존 — 밖이다. 오늘
  #   path 의존은 `vendor/tiny_http` 하나다).
  # 줄을 옮기면 조용히 깨진다.
  push:
    branches: [main]
    paths:
      - '**'
      - '!**/*.md'
      - '**/src/**'
      - '**/lang/**'
      - '**/assets/**'
      - '!docs/**'
      - '!site/**'
  pull_request:
    branches: [main]
    paths:
      - '**'
      - '!**/*.md'
      - '**/src/**'
      - '**/lang/**'
      - '**/assets/**'
      - '!docs/**'
      - '!site/**'
  workflow_dispatch:

concurrency:
  group: plugin-version-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-bump:
    runs-on: [self-hosted, Linux, X64]
    steps:
      # **이 잡만 전체 이력이 필요하다.** 판정이 "밀어넣은 범위의 두 끝점" 을 비교하는데,
      # 이 저장소의 다른 잡이 쓰는 기본 checkout 은 depth 1 이라 부모 커밋이 없다.
      # 얕은 상태로 두면 스크립트가 rev 를 못 찾아 exit 2(판정 불가) 로 죽는다 —
      # 조용히 통과하지는 않지만, 매번 빨개지므로 여기서 깊이를 준다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PATH
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # 판정에 rustfmt 가 필요하다. 없으면 스크립트가 exit 2 로 죽으므로 여기서 보장한다.
      - name: Ensure rustfmt
        run: |
          if ! command -v rustfmt >/dev/null 2>&1; then
            rustup component add rustfmt
          fi
          rustfmt --version

      # 출하 범위 판정기. 없으면 스크립트가 **더 넓게** 보므로 죽지는 않지만, CI 와 로컬
      # pre-commit 이 서로 다른 술어로 판정하게 된다 — 같은 커밋이 한쪽에서만 빨개진다.
      # 의존 0 크레이트(ADR-0138)의 bin 하나라 빌드가 싸다. complexity-check.yml 이 같은
      # 이유로 같은 스텝을 둔다.
      - name: Build the shipping-scope judge
        run: cargo build --locked -p tasty-doc-guards --bin strip-cfg-test

      - name: Plugin version bump gate
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            BEFORE='${{ github.event.pull_request.base.sha }}'
            AFTER='${{ github.event.pull_request.head.sha }}'
          else
            BEFORE='${{ github.event.before }}'
            AFTER='${{ github.sha }}'
          fi
          # 브랜치 최초 생성 push 는 before 가 전부 0 이다 — 비교할 기준이 **없다**.
          # 올릴 이전 값 자체가 없는 경우라 통과시키되, 그 사실을 출력한다.
          # (판정 불가를 조용히 통과로 세지 않기 위해 반드시 찍는다.)
          case "$BEFORE" in
            0000000000000000000000000000000000000000|'')
              echo "[plugin-version] skip: 기준 커밋이 없다(브랜치 최초 생성). 판정 대상 0."
              exit 0 ;;
          esac
          echo "범위: $BEFORE..$AFTER"
          bash scripts/check-plugin-version-bump.sh --range "$BEFORE" "$AFTER"
