name: Plugin Version Check

# 플러그인과 내부 의존 코드가 바뀌면 버전도 올렸는지 검사한다.
# 로컬 훅과 같은 스크립트를 사용하지만 비교 범위는 이벤트의 두 커밋이다.
# 비교 조건: docs/dev-guide/release.md#플러그인-버전-비교

on:
  # vendor 등 워크스페이스 밖 path 의존성도 검사 대상이므로 경로를 좁게 열거하지 않는다.
  # 패턴은 순서대로 적용된다. 전체 포함 → 일반 Markdown 제외 → 빌드 입력 디렉터리
  # 재포함 → docs/site 제외 순서를 유지한다. src/lang/assets 아래 Markdown도 검사한다.
  push:
    branches: [main]
    paths:
      - '**'
      - '!**/*.md'
      - '**/src/**'
      - '**/lang/**'
      - '**/assets/**'
      - '!docs/**'
      - '!site/**'
  pull_request:
    branches: [main]
    paths:
      - '**'
      - '!**/*.md'
      - '**/src/**'
      - '**/lang/**'
      - '**/assets/**'
      - '!docs/**'
      - '!site/**'
  workflow_dispatch:

concurrency:
  group: plugin-version-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-bump:
    runs-on: [self-hosted, Linux, X64]
    steps:
      # 비교할 두 커밋을 모두 읽을 수 있도록 전체 이력을 가져온다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PATH
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Ensure rustfmt
        run: |
          if ! command -v rustfmt >/dev/null 2>&1; then
            rustup component add rustfmt
          fi
          rustfmt --version

      # 로컬 훅과 동일하게 테스트 전용 코드를 제외하도록 도구를 미리 빌드한다.
      - name: Build the shipping-scope judge
        run: cargo build --locked -p tasty-doc-guards --bin strip-cfg-test

      - name: Plugin version bump gate
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            BEFORE='${{ github.event.pull_request.base.sha }}'
            AFTER='${{ github.event.pull_request.head.sha }}'
          else
            BEFORE='${{ github.event.before }}'
            AFTER='${{ github.sha }}'
          fi
          # 최초 push는 비교할 커밋이 없으므로 생략 사실을 출력한다.
          case "$BEFORE" in
            0000000000000000000000000000000000000000|'')
              echo "[plugin-version] skip: 기준 커밋이 없다(브랜치 최초 생성). 판정 대상 0."
              exit 0 ;;
          esac
          echo "범위: $BEFORE..$AFTER"
          bash scripts/check-plugin-version-bump.sh --range "$BEFORE" "$AFTER"
