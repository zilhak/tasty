name: Doc Guards

# 문서만 바뀐 push도 검사하도록 경로 필터를 두지 않는다.
# 네이티브 의존성이 없는 tasty-doc-guards를 공용 러너에서 실행해
# self-hosted 러너의 빌드 작업과 경합하지 않게 한다.
# 범위: docs/dev-guide/guard-relocation.md#문서-검사를-옮길-위치

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  doc-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 한 테스트 바이너리가 실패해도 나머지 결과를 수집한다.
      - name: cargo test -p tasty-doc-guards
        run: cargo test -p tasty-doc-guards --locked --no-fail-fast
