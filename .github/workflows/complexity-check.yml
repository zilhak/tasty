name: Complexity Check

# 테스트·생성 코드를 제외하고 1000 code SLOC를 넘는 Rust 파일을 검사한다.
# 기준: docs/dev-guide/complexity-gate.md#무엇을도구임계값
# 함수 복잡도는 crossplatform-check.yml의 Windows Clippy에서 별도로 검사한다.

on:
  # PR 없이 반영한 변경도 검사한다. 문서만 바뀐 push는 생략한다.
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'site/**'
      - '**/*.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

# 같은 ref의 이전 실행을 취소해 러너가 중복 작업을 하지 않게 한다.
concurrency:
  group: complexity-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-file-size:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PATH
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Ensure tokei
        run: |
          if ! command -v tokei >/dev/null 2>&1; then
            cargo install tokei --locked
          fi
          tokei --version

      # 테스트 코드를 제외하는 도구를 미리 빌드해 검사 중 중첩 Cargo 실행을 피한다.
      - name: Build the shipping-scope judge
        run: cargo build --locked -p tasty-doc-guards --bin strip-cfg-test

      - name: File SLOC gate
        run: bash scripts/check-file-size.sh

      # 예외 목록에 등록된 대형 파일도 합계가 계속 늘지 않는지 검사한다.
      - name: Frozen sum ratchet
        run: bash scripts/check-frozen-sum-ratchet.sh
