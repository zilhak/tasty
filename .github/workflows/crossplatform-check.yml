name: Cross-platform Check

# OS별 컴파일과 테스트를 실행한다.
on:
  push:
    branches: [main]
    # 문서만 바뀐 push는 생략한다. 문서 검사는 doc-guards.yml에서 실행한다.
    paths-ignore:
      - 'docs/**'
      - 'site/**'
      - '**/*.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: crossplatform-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-macos:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4

      - name: cargo check
        run: cargo check --workspace --locked

      # 테스트가 PTY와 자식 셸을 사용하므로 fd soft 상한을 먼저 확인한다.
      # 4096은 측정된 사용량에 여유를 둔 하한이다. 실패하면 실제 최고 사용량을
      # 다시 측정하고 원인을 확인한다. 하한만 낮추지 않는다.
      # 측정 절차: docs/dev-guide/ci-gates.md
      # soft/hard와 커널 상한을 출력하되 이 스텝에서 상한을 변경하지 않는다.
      - name: fd budget
        run: |
          soft="$(ulimit -n)"
          echo "soft: $soft"
          echo "hard: $(ulimit -Hn)"
          sysctl -n kern.maxfilesperproc kern.maxfiles
          if [ "$soft" = "unlimited" ]; then
            echo "soft 상한이 unlimited이므로 fd 하한 검사를 생략합니다."
            exit 0
          fi
          if [ "$soft" -lt 4096 ]; then
            echo "::error::fd soft 상한이 $soft 입니다(필요한 하한: 4096)."
            echo "::error::테스트에서 EMFILE 오류가 발생할 수 있습니다."
            echo "::error::하한을 낮추기 전에 실제 최고 fd 사용량을 측정해 주세요."
            echo "::error::측정 절차: docs/dev-guide/ci-gates.md"
            exit 1
          fi

      # macOS 전용 분기를 포함한 단위 테스트를 실행한다.
      - name: cargo test (macos, gui, unit)
        run: cargo test --workspace --lib --bins --locked --no-fail-fast

  check-windows:
    runs-on: [self-hosted, Windows]
    steps:
      - uses: actions/checkout@v4

      # 재사용하는 러너에는 이전 CRLF 파일이 남을 수 있다. 문자열 기반 소스 검사가
      # 줄바꿈 차이로 실패하지 않도록 필요한 경우에만 다시 체크아웃한다.
      # 항상 다시 쓰면 mtime이 바뀌어 Cargo 증분 빌드를 재사용하기 어렵다.
      - name: normalize the working tree to committed line endings
        shell: pwsh
        run: |
          $before = @(git ls-files --eol | Select-String 'w/crlf')
          Write-Host "CRLF in working tree (before): $($before.Count)"
          if ($before.Count -gt 0) {
            $before | Select-Object -First 5 | ForEach-Object { Write-Host "  $_" }
            # Git이 기존 파일을 수정되지 않은 것으로 판단할 수 있어 먼저 삭제한다.
            $before | ForEach-Object {
              Remove-Item -LiteralPath (($_.Line -split "`t")[-1]) -Force -ErrorAction SilentlyContinue
            }
            git checkout --force -- .
            $after = @(git ls-files --eol | Select-String 'w/crlf')
            Write-Host "CRLF in working tree (after): $($after.Count)"
            if ($after.Count -gt 0) { throw "renormalize did not take" }
          }

      # 앞 스텝이 실패해도 Clippy를 실행할 수 있도록 설치 스텝에도 같은 조건을 둔다.
      - name: ensure clippy component
        if: ${{ !cancelled() }}
        shell: pwsh
        run: rustup component add clippy

      # CRLF 정규화 실패는 Rust 컴파일을 막지 않으므로 Clippy는 계속 실행한다.
      # 기존 warning을 모두 오류로 바꾸지 않고 deny 수준의 오류만 차단한다.
      - name: cargo clippy
        if: ${{ !cancelled() }}
        shell: pwsh
        run: cargo clippy --workspace --all-targets --locked

      # Windows 전용 분기와 플랫폼 의존 동작을 검사한다.
      # --no-fail-fast로 한 테스트 바이너리가 실패해도 나머지 결과를 수집한다.
      # GUI 통합 테스트는 데스크톱 세션을 요구하므로 아래에서 대상 패키지를 따로 지정한다.
      - name: cargo test (unit)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: cargo test --workspace --lib --bins --locked --no-fail-fast

      # 화면 없이 실행할 수 있는 공유 메모리·문서 검사 패키지의 통합 테스트만 실행한다.
      # Windows의 핸들 전달과 경로 구분자는 Linux 실행 결과로 검증할 수 없다.
      # GUI를 사용하는 루트 통합 테스트는 여기에 포함하지 않는다.
      - name: cargo test (windows integration — shm · doc-guards)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: cargo test -p tasty-shm -p tasty-doc-guards --locked --no-fail-fast

      # 데스크톱 세션을 조사하는 참고 정보이며 실패해도 잡을 중단하지 않는다.
      # Windows Forms의 창 생성 성공만으로 winit/wgpu 실행을 보장하지 않는다.
      # 앞 스텝이 실패한 경우에도 진단을 남기기 위해 !cancelled()를 사용한다.
      - name: desktop session (diagnostic — 재고 나면 지운다)
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: pwsh
        run: |
          "UserInteractive : $([System.Environment]::UserInteractive)"
          "SessionId       : $((Get-Process -Id $PID).SessionId)  (0 이면 서비스 세션 = 화면 없음)"
          "---- qwinsta ----"
          try { qwinsta } catch { "qwinsta 를 못 불렀다: $_" }
          "---- 실제 창 생성 ----"
          try {
            Add-Type -AssemblyName System.Windows.Forms
            $f = New-Object System.Windows.Forms.Form
            $f.Show(); Start-Sleep -Milliseconds 200; $f.Close(); $f.Dispose()
            "window: ok — 데스크톱 세션이 있다"
          } catch {
            "window: FAILED — $($_.Exception.Message)"
          }

  # GUI 기능을 끈 빌드와 테스트를 검사한다. 같은 러너에서 GUI 단위 테스트도 실행한다.
  check-headless:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PATH
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: cargo check (headless)
        run: cargo check --workspace --no-default-features --locked

      # headless 전용 구현과 IPC·attach·PTY 통합 경로를 검사한다.
      # GUI 전용 gui_tests 타깃은 Cargo의 required-features로 제외된다.
      # e2e 하네스는 같은 feature로 빌드한 headless 바이너리를 실행한다.
      #
      # multi_window_owner_routing은 window.create를 요구해 건너뛴다.
      # headless에는 winit 이벤트 루프와 창 생성 핸들러가 없다.
      # 제외 범위는 이 테스트 하나이며 다른 시나리오는 실행한다.
      # skip을 추가할 때는 각 테스트의 실행 불가 사유를 확인한다.
      - name: cargo test (headless)
        run: |
          cargo test --workspace --no-default-features --locked --no-fail-fast -- \
            --skip multi_window_owner_routing

      # 기본 feature의 Clippy에서는 제외되는 headless 전용 코드도 검사한다.
      - name: cargo clippy (headless)
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --no-default-features --locked

      # Linux의 GUI 개발 빌드를 컴파일하고 단위 테스트를 실행한다.
      # release 검사와는 debug_assertions 조건이 다르며 통합 테스트는 포함하지 않는다.
      # 앞 스텝이 실패해도 이 조합의 결과를 얻기 위해 !cancelled()를 사용한다.
      # 잡 이름은 외부의 required status check에서 참조할 수 있어 유지한다.
      - name: cargo test (linux, gui, unit)
        if: ${{ !cancelled() }}
        run: cargo test --workspace --lib --bins --locked --no-fail-fast

      # headless에서 제외한 창 소유권 테스트를 전용 Xvfb에서 실행한다.
      # 아직 관측용이므로 실패해도 잡을 중단하지 않는다. 이 스텝의 결과를 따로 확인한다.
      # 차단 검사로 바꾸려면 CI에서 연속 통과할 횟수를 정하고 실제 결과를 확인한다.
      # 기준과 확인 절차는 docs/dev-guide/ci-gates.md에 기록한다.
      - name: cargo test (linux, gui, e2e — 관측용)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          command -v xvfb-run || { echo "이 러너에 xvfb-run이 없어 GUI 테스트를 실행할 수 없습니다."; exit 1; }
          # xvfb-run 안에서 정해진 DISPLAY를 하네스에 전달해야 하므로 sh -c를 사용한다.
          # 격리 조건: docs/dev-guide/e2e-tests.md#3-환경-격리
          xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            sh -c 'TASTY_E2E_DISPLAY="$DISPLAY" cargo test --workspace --locked --no-fail-fast \
              --test e2e_tests -- multi_window_owner_routing --exact'

      # 실패 원인을 조사할 때도 필요하므로 앞 스텝의 실패와 관계없이 진단한다.
      # 디스크·도구 상태 출력에 실패해도 컴파일·테스트 결과를 바꾸지 않는다.
      - name: disk (diagnostic)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          df -h .
          du -sh target 2>/dev/null || echo "target 없음"
          du -sh ~/.cargo 2>/dev/null || true
          command -v xvfb-run || echo "xvfb-run 없음"

  # Linux GUI release 설정을 컴파일한다. debug_assertions가 꺼진 코드를 확인한다.
  # cargo check이므로 테스트 실행, 코드 생성·LTO, 배포 패키지 검사는 포함하지 않는다.
  check-release:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PATH
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: cargo check (gui, release)
        run: cargo check --workspace --release --locked
