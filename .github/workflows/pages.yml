name: Pages

# site/ (Astro 앱 + 사용자 가이드 site/content/) 로 GitHub Pages 정적 사이트를 만들어
# 배포한다. docs/ 는 발행하지 않는다. 절차·구조: docs/dev-guide/site.md

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "assets/icons/tasty-melon.svg"
      - "Cargo.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 새 배포가 시작되면 이전 실행을 취소한다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      # 다운로드 링크에 필요한 최신 릴리스의 버전과 자산 파일명을 읽는다.
      - name: Resolve latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view --repo "$GITHUB_REPOSITORY" --json tagName,assets > release.json

      - run: npm run build

      # 생성한 HTML의 내부 링크와 앵커를 검사한다.
      # site/content의 앵커는 Rust 문서 검사 대신 이 단계에서 확인한다.
      - run: npm run check-links

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
