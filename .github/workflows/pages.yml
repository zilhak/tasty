name: Pages

# site/ (생성기 + 사용자 가이드 site/content/) 로 GitHub Pages 정적 사이트를 만들어 배포한다.
# 생성기는 site/ 의 별도 crate (workspace exclude) — 본체 빌드와 무관하다. docs/ 는 발행하지 않는다.
# 절차·구조: docs/dev-guide/site.md

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "assets/icons/tasty-melon.svg"
      - "Cargo.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 항상 최신 커밋 하나만 살린다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache site generator build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            site/target
          key: pages-cargo-${{ runner.os }}-${{ hashFiles('site/Cargo.lock') }}
          restore-keys: pages-cargo-${{ runner.os }}-

      # 랜딩의 다운로드 링크는 최신 릴리스 자산을 직접 가리킨다 — 자산 파일명에
      # 버전이 들어 있어 빌드 시점에 해석한다 (docs/dev-guide/site.md "다운로드").
      - name: Resolve latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view --repo "$GITHUB_REPOSITORY" --json tagName,assets > site/release.json

      # --strict 는 가이드 안의 깨진 상대 링크와 ORDER 에 없는 페이지를 배포 실패로 승격한다.
      - name: Generate site
        run: cargo run --release --manifest-path site/Cargo.toml -- --strict

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
