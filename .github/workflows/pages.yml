name: Pages

# site/ (Astro 앱 + 사용자 가이드 site/content/) 로 GitHub Pages 정적 사이트를 만들어
# 배포한다. docs/ 는 발행하지 않는다. 절차·구조: docs/dev-guide/site.md

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "assets/icons/tasty-melon.svg"
      - "Cargo.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 항상 최신 커밋 하나만 살린다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      # 랜딩의 다운로드 링크는 최신 릴리스 자산을 직접 가리킨다 — 자산 파일명에
      # 버전이 들어 있어 빌드 시점에 해석한다 (docs/dev-guide/site.md "다운로드").
      - name: Resolve latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view --repo "$GITHUB_REPOSITORY" --json tagName,assets > release.json

      # prebuild 가 site/vendor/ 를 ES module 로 변환한 뒤 astro build 가 돈다.
      - run: npm run build

      # 배포 전 판정 — 산출된 HTML 의 내부 링크와 `#앵커` 를 전수로 푼다. 옛 러스트
      # 생성기의 `--strict` 를 잇는 자리이고, `site/content/` 안의 앵커를 보는 유일한
      # 판사다: crates/tasty-doc-guards 의 앵커 가드는 그 트리를 여기에 넘긴다
      # (docs/adr/0247-site-anchors-are-judged-by-the-artifact-not-a-copy-of-the-rule.md).
      # 이 스텝을 지우면 그 트리의 앵커에는 판사가 하나도 안 남는다.
      - run: npm run check-links

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
