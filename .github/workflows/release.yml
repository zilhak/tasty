name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    if: github.event_name == 'push'
    runs-on: [self-hosted, Linux]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract and verify version
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) != Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract changelog from tag commit
        run: git log -1 --format=%b > "$RUNNER_TEMP/release-notes.md"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --draft \
            --title "v${{ steps.version.outputs.version }}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

  build-macos:
    needs: create-release
    if: ${{ always() && (needs.create-release.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4

      - name: Decode release signing key
        env:
          KEY_B64: ${{ secrets.TASTY_RELEASE_SIGN_KEY }}
        run: |
          if [ -z "$KEY_B64" ]; then
            echo "::error::TASTY_RELEASE_SIGN_KEY secret is not set"
            exit 1
          fi
          KEY_DIR="$RUNNER_TEMP/tasty-keys"
          mkdir -p "$KEY_DIR"
          chmod 700 "$KEY_DIR"
          KEY_PATH="$KEY_DIR/release.pem"
          printf '%s' "$KEY_B64" | base64 -d > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "TASTY_SIGN_KEY=$KEY_PATH" >> "$GITHUB_ENV"
          echo "::add-mask::$KEY_PATH"

      - name: Sign plugin manifests
        run: bash scripts/sign-bundle.sh --key "$TASTY_SIGN_KEY" --all-builtins

      - name: Build DMG
        run: bash scripts/build-macos-dmg.sh

      - name: Wipe release signing key
        if: always()
        run: |
          if [ -n "${TASTY_SIGN_KEY:-}" ] && [ -f "$TASTY_SIGN_KEY" ]; then
            rm -f "$TASTY_SIGN_KEY"
          fi
          rm -rf "$RUNNER_TEMP/tasty-keys"

      - name: Upload to release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          gh release upload --clobber "v${VERSION}" "dist/Tasty-${VERSION}-macos.dmg"
          gh release upload --clobber "v${VERSION}" "dist/SHA256SUMS-macos.txt"

      - name: Clean up dist
        if: always()
        run: rm -rf dist

  build-windows:
    needs: create-release
    if: ${{ always() && (needs.create-release.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: [self-hosted, Windows]
    steps:
      - uses: actions/checkout@v4

      - name: Decode release signing key
        shell: pwsh
        env:
          KEY_B64: ${{ secrets.TASTY_RELEASE_SIGN_KEY }}
        run: |
          if (-not $env:KEY_B64) {
            Write-Error "TASTY_RELEASE_SIGN_KEY secret is not set"
            exit 1
          }
          $KeyDir = Join-Path $env:RUNNER_TEMP "tasty-keys"
          New-Item -ItemType Directory -Force -Path $KeyDir | Out-Null
          $KeyPath = Join-Path $KeyDir "release.pem"
          [IO.File]::WriteAllBytes($KeyPath, [Convert]::FromBase64String($env:KEY_B64))
          "TASTY_SIGN_KEY=$KeyPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "::add-mask::$KeyPath"

      - name: Sign plugin manifests
        shell: bash
        run: bash scripts/sign-bundle.sh --key "$TASTY_SIGN_KEY" --all-builtins

      - name: Build ZIP and MSI
        shell: pwsh
        run: ./scripts/build-windows.ps1

      - name: Wipe release signing key
        if: always()
        shell: pwsh
        run: |
          $KeyDir = Join-Path $env:RUNNER_TEMP "tasty-keys"
          Remove-Item -Recurse -Force $KeyDir -ErrorAction SilentlyContinue

      - name: Upload to release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $VERSION = "${{ needs.create-release.outputs.version }}"
          gh release upload --clobber "v${VERSION}" "dist/tasty-${VERSION}-windows-x64.zip"
          gh release upload --clobber "v${VERSION}" "dist/tasty-${VERSION}-windows-x64.msi"
          gh release upload --clobber "v${VERSION}" "dist/SHA256SUMS-windows.txt"

      - name: Clean up dist
        if: always()
        shell: pwsh
        run: Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue

  build-linux-x64:
    needs: create-release
    if: ${{ always() && (needs.create-release.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PATH
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Decode release signing key
        env:
          KEY_B64: ${{ secrets.TASTY_RELEASE_SIGN_KEY }}
        run: |
          if [ -z "$KEY_B64" ]; then
            echo "::error::TASTY_RELEASE_SIGN_KEY secret is not set"
            exit 1
          fi
          KEY_DIR="$RUNNER_TEMP/tasty-keys"
          mkdir -p "$KEY_DIR"
          chmod 700 "$KEY_DIR"
          KEY_PATH="$KEY_DIR/release.pem"
          printf '%s' "$KEY_B64" | base64 -d > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "TASTY_SIGN_KEY=$KEY_PATH" >> "$GITHUB_ENV"
          echo "::add-mask::$KEY_PATH"

      - name: Sign plugin manifests
        run: bash scripts/sign-bundle.sh --key "$TASTY_SIGN_KEY" --all-builtins

      - name: Build tar.gz + deb + rpm + AppImage
        run: bash scripts/build-linux.sh

      - name: Wipe release signing key
        if: always()
        run: |
          if [ -n "${TASTY_SIGN_KEY:-}" ] && [ -f "$TASTY_SIGN_KEY" ]; then
            rm -f "$TASTY_SIGN_KEY"
          fi
          rm -rf "$RUNNER_TEMP/tasty-keys"

      - name: Upload to release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          gh release upload --clobber "v${VERSION}" "dist/tasty-${VERSION}-linux-x64.tar.gz"
          gh release upload --clobber "v${VERSION}" "dist/tasty_${VERSION}-1_amd64.deb"
          gh release upload --clobber "v${VERSION}" "dist/tasty-${VERSION}-1.x86_64.rpm"
          gh release upload --clobber "v${VERSION}" "dist/Tasty-${VERSION}-x86_64.AppImage"
          gh release upload --clobber "v${VERSION}" "dist/SHA256SUMS-linux-x64.txt"

      - name: Clean up dist
        if: always()
        run: rm -rf dist

  build-linux-arm64:
    needs: create-release
    if: ${{ always() && (needs.create-release.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: [self-hosted, Linux, ARM64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PATH
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Decode release signing key
        env:
          KEY_B64: ${{ secrets.TASTY_RELEASE_SIGN_KEY }}
        run: |
          if [ -z "$KEY_B64" ]; then
            echo "::error::TASTY_RELEASE_SIGN_KEY secret is not set"
            exit 1
          fi
          KEY_DIR="$RUNNER_TEMP/tasty-keys"
          mkdir -p "$KEY_DIR"
          chmod 700 "$KEY_DIR"
          KEY_PATH="$KEY_DIR/release.pem"
          printf '%s' "$KEY_B64" | base64 -d > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "TASTY_SIGN_KEY=$KEY_PATH" >> "$GITHUB_ENV"
          echo "::add-mask::$KEY_PATH"

      - name: Sign plugin manifests
        run: bash scripts/sign-bundle.sh --key "$TASTY_SIGN_KEY" --all-builtins

      - name: Build tar.gz + deb + rpm + AppImage
        run: bash scripts/build-linux.sh

      - name: Wipe release signing key
        if: always()
        run: |
          if [ -n "${TASTY_SIGN_KEY:-}" ] && [ -f "$TASTY_SIGN_KEY" ]; then
            rm -f "$TASTY_SIGN_KEY"
          fi
          rm -rf "$RUNNER_TEMP/tasty-keys"

      - name: Upload to release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          gh release upload --clobber "v${VERSION}" "dist/tasty-${VERSION}-linux-arm64.tar.gz"
          gh release upload --clobber "v${VERSION}" "dist/tasty_${VERSION}-1_arm64.deb"
          gh release upload --clobber "v${VERSION}" "dist/tasty-${VERSION}-1.aarch64.rpm"
          gh release upload --clobber "v${VERSION}" "dist/Tasty-${VERSION}-aarch64.AppImage"
          gh release upload --clobber "v${VERSION}" "dist/SHA256SUMS-linux-arm64.txt"

      - name: Clean up dist
        if: always()
        run: rm -rf dist

  publish-release:
    needs: [create-release, build-macos, build-windows, build-linux-x64, build-linux-arm64]
    if: github.event_name == 'push'
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v4

      - name: Upload agent-guide docs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          for f in docs/agent-guide/*; do
            [ -f "$f" ] && gh release upload --clobber "v${VERSION}" "$f" || true
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          gh release edit "v${VERSION}" --draft=false
