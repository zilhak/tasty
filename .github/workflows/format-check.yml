name: Format Check

# 로컬 훅을 설치하지 않은 체크아웃의 변경도 검사한다.
# 컴파일하지 않으므로 네이티브 GUI 의존성 없이 공용 러너에서 실행할 수 있다.
# 워크스페이스에서 제외한 SDK는 매니페스트를 지정해 따로 검사한다.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: format-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 도구 버전은 rust-toolchain.toml을 따른다.
      - name: ensure rustfmt component
        run: rustup component add rustfmt

      - name: cargo fmt --check (workspace)
        run: cargo fmt --check

      - name: cargo fmt --check (plugin sdk wasm — workspace exclude)
        run: cargo fmt --check --manifest-path crates/tasty-plugin-sdk-wasm/Cargo.toml
