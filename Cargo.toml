[workspace]
members = ["crates/*"]
# Phase J.C — WASM plugin POC 격리. wasmtime/wit-bindgen 의존성이 default
# 빌드에 새지 않도록 main workspace 에서 완전 제외. 자체 Cargo.lock 사용.
# `cargo build` / `cargo build --workspace` 모두 이 crate 를 미인식.
# 본 격리가 없으면 wasmtime 의존성 해석으로 cold build time 이 분 단위 증가.
# 상세 = docs/architecture/wasm-poc-result.md.
exclude = ["crates/tasty-plugin-sdk-wasm"]
resolver = "2"

# 워크스페이스 공통 lint.
# `undocumented_unsafe_blocks`: 모든 unsafe 블록 위에 `// SAFETY:` 주석 필수.
# `multiple_unsafe_ops_per_block`: 한 블록에 두 개 이상의 unsafe op 적발 (현재는 warn).
#   FFI 묶음(Win32 등)이 자연스럽게 한 블록인 경우가 많아 deny로 올리기 전 비용 측정 단계.
# 각 member crate 및 본 패키지의 `[lints]` 절에서 `workspace = true`로 상속.
[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
# 복잡도 게이트(파트 A): 함수 cognitive complexity 상한 강제. nursery lint 라
# 명시 활성화가 필요하다. 임계값은 clippy.toml 의 cognitive-complexity-threshold(=20).
# 기존 초과 함수는 위치 단위 #[allow(clippy::cognitive_complexity)] // complexity-exempt: …
# 로 동결(grandfather). 신규 초과 함수는 CI(Windows clippy 잡)에서 자동 차단된다.
# `-D warnings` 없이도 deny 라 그 자체로 에러가 되므로 별도 플래그 불요.
# 상세: docs/dev-guide/complexity-gate.md, docs/adr/0037-complexity-gate.md
cognitive_complexity = "deny"
multiple_unsafe_ops_per_block = "warn"
# 도메인 Error enum 이 IPC fault path / preset mutation 등과 1:1 매핑이라
# Box 화는 hot path 영향 + 호출 사이트의 ? 흐름이 어색해진다. 22개 위치를
# 일괄 allow. 신규 Error enum 추가 시 sizeof 확인 + Box 화 검토 필요.
result_large_err = "allow"
# `let_underscore_must_use`: `let _ = <Result/#[must_use]>` 형태의 무음 무시 적발.
#   error-handling.md 정책("Result 를 let _ 로 삼키지 않는다 — 로그 또는 사유 주석")의
#   구조적 강제. 의도적 무시는 같은 줄 사유 주석을 단다(주석은 clippy 를 끄지 않으므로
#   warn 가 그대로 남지만, 리뷰에서 "주석 유무"로 판정한다). reference/단순 값 drop 은
#   must_use 가 아니라 걸리지 않는다 — 정확히 Result/must_use 누락만 표면화한다.
#   CI 에 `-D warnings` 가 없어 빌드를 막지 않는다. 신규 Result 삼킴이 clippy 에 뜨면 처리.
let_underscore_must_use = "warn"

# `unsafe fn` 내부의 unsafe op도 명시적 unsafe block을 강제. 호출 사이트에서
# unsafe 의도가 항상 드러난다. Rust 2024 edition에선 기본 deny지만, 워크스페이스
# 일관성을 위해 명시.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[package]
name = "tasty"
version = "0.9.2"
edition = "2024"
authors = ["zilhak <zilhak1@gmail.com>"]
license = "MIT"
description = "Cross-platform GPU-accelerated terminal emulator for AI coding agents"
repository = "https://github.com/zilhak/tasty"

[package.metadata.deb]
maintainer = "zilhak <zilhak1@gmail.com>"
copyright = "2026, zilhak <zilhak1@gmail.com>"
extended-description = """
Tasty is a cross-platform GPU-accelerated terminal emulator with first-class
support for AI coding agents. Built on wgpu (Vulkan/DX12/Metal) and winit,
it exposes both an IPC API and a CLI surface so agents can drive the
terminal programmatically alongside human use."""
depends = "$auto, libfreetype6, libfontconfig1"
section = "utils"
priority = "optional"
assets = [
    ["target/release/tasty", "usr/bin/", "755"],
    ["assets/linux/tasty.desktop", "usr/share/applications/", "644"],
    ["assets/icons/icon_16.png",  "usr/share/icons/hicolor/16x16/apps/tasty.png",   "644"],
    ["assets/icons/icon_32.png",  "usr/share/icons/hicolor/32x32/apps/tasty.png",   "644"],
    ["assets/icons/icon_64.png",  "usr/share/icons/hicolor/64x64/apps/tasty.png",   "644"],
    ["assets/icons/icon_128.png", "usr/share/icons/hicolor/128x128/apps/tasty.png", "644"],
    ["assets/icons/icon_256.png", "usr/share/icons/hicolor/256x256/apps/tasty.png", "644"],
    ["assets/icons/icon_512.png", "usr/share/icons/hicolor/512x512/apps/tasty.png", "644"],
    # Builtin plugins — installed under FHS path; `bundle_root()` picks this up
    # as the linux fallback (crates/tasty-host-plugin/src/builtin.rs).
    # Per-plugin layout: <id>/{tasty-plugin-<crate>, tasty-plugin.toml, lang/}.
    # Keep in sync with crates/tasty-host-plugin/src/builtin.rs BUILTINS and
