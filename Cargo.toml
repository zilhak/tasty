[workspace]
members = ["crates/*"]
resolver = "2"

[package]
name = "tasty"
version = "0.1.4"
edition = "2024"
license = "MIT"
description = "Cross-platform GPU-accelerated terminal emulator for AI coding agents"
repository = "https://github.com/zilhak/tasty"

[dependencies]
# Workspace crates
tasty-hooks = { path = "crates/tasty-hooks" }
tasty-terminal = { path = "crates/tasty-terminal" }
# Window & Input
winit = "0.30"

# GPU Rendering
wgpu = "24"

# UI Widgets
egui = "0.31"
egui-wgpu = "0.31"
egui-winit = "0.31"

# Terminal Emulation
termwiz = "0.22"
portable-pty = "0.8"

# Async
pollster = "0.4"
tokio = { version = "1", features = ["full"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error Handling
anyhow = "1"
thiserror = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# CLI
clap = { version = "4", features = ["derive"] }

# Font & Text
cosmic-text = "0.18"
bytemuck = { version = "1", features = ["derive"] }

# Notifications
notify-rust = "4"

# Regex
regex = "1"

# Shell escaping
shell-escape = "0.1"

# Clipboard
arboard = "3"

# PNG encoding (screenshots)
png = "0.18"

# Image loading/saving (image viewer)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp", "ico", "tiff"] }

# Platform
libc = "0.2"

# File Dialogs
rfd = "0.15"

# Utilities
directories = "6"

# SQLite (state.db for bookmarks, recent files, clipboard history 등)
rusqlite = { version = "0.32", features = ["bundled"] }

# WebView (macOS)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSURLRequest", "NSObject", "NSArray"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKWebViewConfiguration", "WKPreferences", "WKWebsiteDataStore", "WKNavigation"] }
objc2-app-kit = { version = "0.3", features = ["NSView", "NSWindow", "NSResponder", "NSMenu", "NSMenuItem", "NSEvent", "NSGraphics", "NSPasteboard", "NSPasteboardItem", "NSApplication", "NSRunningApplication", "libc"] }

# WebView (Windows)
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
tray-icon = "0.22"

# WebView (Linux)
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
gtk = "0.18"
gdkx11 = "0.18"
x11-dl = "2.21"

[dev-dependencies]
serde_json = "1"
enigo = "0.6"


# TODO: winit PR #4478 (https://github.com/rust-windowing/winit/pull/4478) 머지 후 공식 버전으로 교체
[patch.crates-io]
winit = { git = "https://github.com/zilhak/winit-ime-fix.git", branch = "fix-korean-ime" }

[profile.release]
lto = true
strip = true
opt-level = 3
