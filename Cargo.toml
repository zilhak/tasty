[package.metadata.generate-rpm.requires]
freetype = "*"
fontconfig = "*"

# Debian의 libvulkan1과 같은 동적 로딩용 권장 의존성이다.
[package.metadata.generate-rpm.recommends]
vulkan-loader = "*"

# 모듈과 공개 API는 lib에, 실행 진입점은 bin에 둔다.
# 외부 공개 범위는 cargo doc -p tasty --no-deps로 확인할 수 있다.
[lib]
name = "tasty"
path = "src/lib.rs"

[[bin]]
name = "tasty"
path = "src/main.rs"

[dependencies]
tasty-font = { path = "crates/tasty-font" }
tasty-hooks = { path = "crates/tasty-hooks" }
tasty-lua = { path = "crates/tasty-lua" }
tasty-memory = { path = "crates/tasty-memory" }
tasty-output = { path = "crates/tasty-output" }
tasty-approval = { path = "crates/tasty-approval" }
tasty-telemetry = { path = "crates/tasty-telemetry" }
tasty-agent = { path = "crates/tasty-agent" }
tasty-dag-layout = { path = "crates/tasty-dag-layout" }
tasty-design-tokens = { path = "crates/tasty-design-tokens" }
tasty-plugin-protocol = { path = "crates/tasty-plugin-protocol" }
tasty-plugin-manifest = { path = "crates/tasty-plugin-manifest" }
tasty-host-plugin = { path = "crates/tasty-host-plugin" }
tasty-plugin-claude = { path = "crates/tasty-plugin-claude" }
tasty-ipc = { path = "crates/tasty-ipc" }
tasty-cli = { path = "crates/tasty-cli" }
tasty-model = { path = "crates/tasty-model" }
tasty-file-format = { path = "crates/tasty-file-format" }
tasty-file-handler = { path = "crates/tasty-file-handler" }
tasty-selection = { path = "crates/tasty-selection" }
tasty-terminal-link = { path = "crates/tasty-terminal-link" }
tasty-remote = { path = "crates/tasty-remote" }
tasty-remote-profiles = { path = "crates/tasty-remote-profiles" }
tasty-ssh = { path = "crates/tasty-ssh" }
tasty-presets = { path = "crates/tasty-presets" }
tasty-settings = { path = "crates/tasty-settings" }
# 윈도잉·GTK·AppKit 의존성은 아래 gui feature에서 활성화한다.
tasty-platform = { path = "crates/tasty-platform" }
# headless에 winit을 포함하지 않도록 GUI 키 매칭은 선택 의존성으로 둔다.
tasty-key-match = { path = "crates/tasty-key-match", optional = true }
tasty-themes = { path = "crates/tasty-themes" }
# headless에서는 egui 테마 변환을 사용하지 않는다.
tasty-egui-theme = { path = "crates/tasty-egui-theme", optional = true }
# egui 렌더링 기능은 아래 gui feature에서만 활성화한다.
tasty-icons = { path = "crates/tasty-icons" }
tasty-ui-widgets = { path = "crates/tasty-ui-widgets", optional = true }
tasty-type-appearance = { path = "crates/tasty-type-appearance" }
tasty-type-geometry = { path = "crates/tasty-type-geometry" }
tasty-cell-width = { path = "crates/tasty-cell-width" }
tasty-utils = { path = "crates/tasty-utils" }
tasty-i18n = { path = "crates/tasty-i18n" }
tasty-shm = { path = "crates/tasty-shm" }
tasty-terminal = { path = "crates/tasty-terminal" }
tasty-reaper = { path = "crates/tasty-reaper" }
tasty-portscan = { path = "crates/tasty-portscan" }
tasty-timer = { path = "crates/tasty-timer" }
# 원격 attach의 Git 조회도 Git 플러그인과 같은 구현을 사용한다.
tasty-git-core = { path = "crates/tasty-git-core" }
winit = { version = "0.30", optional = true }

wgpu = { version = "24", optional = true }

egui = { version = "0.31", optional = true }
egui-wgpu = { version = "0.31", optional = true }
egui-winit = { version = "0.31", optional = true }
# SVG 아이콘을 읽고 현재 글자색으로 그리는 데 사용한다.
egui_extras = { version = "0.31", features = ["svg", "image"], optional = true }

termwiz = "0.22"

pollster = "0.4"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

dhat = { version = "0.3", optional = true }

anyhow = "1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

base64 = "0.22"

semver = "1"

infer = { version = "0.16", default-features = false }

# 파일 판별 규칙의 glob 패턴을 묶어 컴파일한 뒤 재사용한다.
globset = "0.4"

# 호스트·사용자의 Lua 파일 판별 규칙을 실행한다.
mlua = { version = "0.10", features = ["lua54", "vendored", "send"] }

jsonschema = { version = "0.30", default-features = false }

clap = { version = "4", features = ["derive"] }

cosmic-text = { version = "0.18", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }

regex = "1"

webbrowser = { version = "1", optional = true }

shell-escape = "0.1"

# 웹훅 HTTP 리스너. TLS는 리버스 프록시 등 외부에서 처리한다.
tiny_http = { version = "0.12", default-features = false }

arboard = { version = "3", optional = true }

trash = { version = "5", optional = true }

png = { version = "0.18", optional = true }

image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp", "ico", "tiff"], optional = true }

libc = "0.2"

rfd = { version = "0.15", optional = true }

directories = "6"

tempfile = "3"

rusqlite = { version = "0.32", features = ["bundled"] }

rand = "0.9"

# UTC 시각만 사용하므로 기본 시간대 데이터 의존성은 제외한다.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
pulldown-cmark = { version = "0.12", default-features = false, optional = true }
tray-icon = { version = "0.22", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSURLRequest", "NSObject", "NSArray"], optional = true }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKWebViewConfiguration", "WKPreferences", "WKWebsiteDataStore", "WKNavigation", "WKNavigationAction", "WKNavigationDelegate", "WKContentRuleList", "WKContentRuleListStore", "WKUserContentController", "block2"], optional = true }
objc2-app-kit = { version = "0.3", features = ["NSView", "NSWindow", "NSResponder", "NSMenu", "NSMenuItem", "NSEvent", "NSGraphics", "NSPasteboard", "NSPasteboardItem", "NSApplication", "NSRunningApplication", "NSImage", "libc"], optional = true }
# WKContentRuleList의 completion handler에 필요한 블록 타입이다.
block2 = { version = "0.6", optional = true }
drag = { version = "2.1", optional = true }

[target.'cfg(windows)'.dependencies]
webview2-com = { version = "0.38", optional = true }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"], optional = true }
gtk = { version = "0.18", optional = true }
gdkx11 = { version = "0.18", optional = true }
x11-dl = { version = "2.21", optional = true }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
default = ["gui"]
# headless에서 윈도잉·egui·GPU 의존성을 제외하도록 GUI 기능을 여기서 함께 켠다.
gui = [
    "dep:winit",
    "tasty-platform/gui",
    "dep:wgpu",
    "dep:egui",
    "dep:egui-wgpu",
    "dep:egui-winit",
    "dep:egui_extras",
    "tasty-plugin-protocol/egui-mesh",
    # 이 feature가 선택 의존성인 tasty-key-match도 활성화한다.
    "tasty-key-match/egui-input",
    "dep:tasty-egui-theme",
    "dep:tasty-ui-widgets",
    "tasty-icons/egui",
    "tasty-type-appearance/egui-compat",
    "tasty-font/gpu",
    "dep:cosmic-text",
    "dep:bytemuck",
    "dep:webbrowser",
    "dep:arboard",
    "dep:trash",
    "dep:png",
    "dep:image",
    "dep:rfd",
    "dep:pulldown-cmark",
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-web-kit",
    "dep:objc2-app-kit",
    "dep:block2",
    "dep:drag",
    "dep:webview2-com",
    "dep:tray-icon",
    "dep:webkit2gtk",
    "dep:gtk",
    "dep:gdkx11",
    "dep:x11-dl",
]
# 선택적으로 할당을 측정하고 종료 때 dhat-heap.json을 쓴다.
# 사용법: docs/dev-guide/memory-leak-soak.md
dhat-heap = ["dep:dhat"]

[dev-dependencies]
serde_json = "1"
# 의존 크레이트에는 호출자의 cfg(test)가 적용되지 않아 test-support를 명시한다.
# IsolatedHome의 push_home_override를 테스트에서 사용하기 위한 설정이다.
tasty-utils = { path = "crates/tasty-utils", features = ["test-support"] }
tasty-test-support = { path = "crates/tasty-test-support" }
# 플러그인 프로세스 없이 팝업 인스턴스를 만드는 테스트용 함수를 활성화한다.
tasty-host-plugin = { path = "crates/tasty-host-plugin", features = ["test-support"] }
tasty-doc-guards = { path = "crates/tasty-doc-guards" }
# 지연 시험의 대조 측정용이다. docs/dev-guide/self-verification.md#시간-측정과-실패-진단
tasty-latency-control = { path = "crates/tasty-latency-control" }
enigo = "0.6"
tempfile = "3"
# soak 하네스에서 프로세스 트리와 RSS를 조회한다.
# 호스트의 런타임 샘플링은 tasty-host-plugin이 별도 의존성으로 사용한다.
sysinfo = "0.35"

# gui_common이 GUI 선택 의존성을 사용하므로 headless 테스트에서 제외한다.
[[test]]
name = "gui_tests"
required-features = ["gui"]

# IME 수정을 위한 winit 포크는 재현 가능한 커밋으로 고정한다.
# 상류 반영 후 교체 조건: docs/dev-guide/dep-issues.md
[patch.crates-io]
winit = { git = "https://github.com/zilhak/winit-ime-fix.git", rev = "dfe2ec8d5bf55bfbca274a7cf56e5fae0d20c1f5" }
# 413 응답 뒤 남은 본문을 읽지 않고 닫도록 패치한 사본이다.
# 패치 범위와 상류 버전으로 돌아갈 조건: vendor/tiny_http/PATCHES.md
tiny_http = { path = "vendor/tiny_http" }

[lints]
workspace = true

# 본체는 빌드 속도를 위해 opt-level 0, 의존성과 아래 크레이트는 반복 실행 비용을 위해 3을 쓴다.
[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 3

# 별표 패턴은 워크스페이스 멤버에 적용되지 않으므로 필요한 크레이트를 명시한다.
