[package.metadata.generate-rpm.requires]
freetype = "*"
fontconfig = "*"

[dependencies]
# Workspace crates
tasty-font = { path = "crates/tasty-font" }
tasty-hooks = { path = "crates/tasty-hooks" }
tasty-lua = { path = "crates/tasty-lua" }
tasty-memory = { path = "crates/tasty-memory" }
tasty-output = { path = "crates/tasty-output" }
tasty-approval = { path = "crates/tasty-approval" }
tasty-telemetry = { path = "crates/tasty-telemetry" }
tasty-agent = { path = "crates/tasty-agent" }
tasty-plugin-protocol = { path = "crates/tasty-plugin-protocol" }
tasty-plugin-manifest = { path = "crates/tasty-plugin-manifest" }
tasty-host-plugin = { path = "crates/tasty-host-plugin" }
tasty-plugin-claude = { path = "crates/tasty-plugin-claude" }
tasty-ipc = { path = "crates/tasty-ipc" }
tasty-cli = { path = "crates/tasty-cli" }
tasty-model = { path = "crates/tasty-model" }
tasty-remote-profiles = { path = "crates/tasty-remote-profiles" }
tasty-presets = { path = "crates/tasty-presets" }
tasty-settings = { path = "crates/tasty-settings" }
tasty-themes = { path = "crates/tasty-themes" }
tasty-egui-theme = { path = "crates/tasty-egui-theme" }
tasty-icons = { path = "crates/tasty-icons", features = ["egui"] }
tasty-ui-widgets = { path = "crates/tasty-ui-widgets" }
tasty-type-appearance = { path = "crates/tasty-type-appearance" }
tasty-type-geometry = { path = "crates/tasty-type-geometry" }
tasty-utils = { path = "crates/tasty-utils" }
tasty-i18n = { path = "crates/tasty-i18n" }
tasty-shm = { path = "crates/tasty-shm" }
tasty-terminal = { path = "crates/tasty-terminal" }
tasty-reaper = { path = "crates/tasty-reaper" }
tasty-portscan = { path = "crates/tasty-portscan" }
# Window & Input
winit = { version = "0.30", optional = true }

# GPU Rendering
wgpu = { version = "24", optional = true }

# UI Widgets
egui = { version = "0.31", optional = true }
egui-wgpu = { version = "0.31", optional = true }
egui-winit = { version = "0.31", optional = true }
# SVG icons (chevron) via egui::Image — load + tint as currentColor.
egui_extras = { version = "0.31", features = ["svg", "image"], optional = true }

# Terminal Emulation
termwiz = "0.22"

# Async
pollster = "0.4"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# heap attribution (opt-in feature `dhat-heap`) — memory-leak-soak.md 참조
dhat = { version = "0.3", optional = true }

# Error Handling
anyhow = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# base64 for OSC 52 clipboard read responses (`OSC 52 ; c ; <base64> ST`)
base64 = "0.22"

# Version range matching (plugin extension version_req)
semver = "1"

# File type detection (file_format Deep evaluator — magic bytes + MIME)
infer = { version = "0.16", default-features = false }

# Lua sandbox for file_format Lua detector rules (host/user only)
mlua = { version = "0.10", features = ["lua54", "vendored", "send"] }

# JSON Schema validation for file_format StructureCheck rule
jsonschema = { version = "0.30", default-features = false }

# CLI
clap = { version = "4", features = ["derive"] }

# Font & Text
cosmic-text = { version = "0.18", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }

# Regex
regex = "1"

# URL/파일 오픈 (터미널 내 링크 클릭 시 기본 브라우저/연결 프로그램)
webbrowser = { version = "1", optional = true }

# Shell escaping
shell-escape = "0.1"

# 인바운드 웹훅 리스너 — 경량 blocking HTTP/1.1 서버 (thread-per-request).
# ssl feature 없이 사용(TLS 종단은 리버스 프록시/공유기에 위임). tokio 불필요 —
# 코드베이스 std::thread blocking I/O 일관성 유지. 신규 트랜지티브 3개
# (ascii/chunked_transfer/httpdate) 전부 퍼미시브 라이선스. 근거: docs/adr.
tiny_http = { version = "0.12", default-features = false }

# Clipboard
arboard = { version = "3", optional = true }

# Trash/recycle bin (explorer "Move to Trash")
trash = { version = "5", optional = true }

# PNG encoding (screenshots)
png = { version = "0.18", optional = true }

# Image loading/saving (image viewer)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp", "ico", "tiff"], optional = true }

# Platform
libc = "0.2"

# File Dialogs
rfd = { version = "0.15", optional = true }

# Utilities
directories = "6"

# Atomic file writes (user config persistence — file_format / file_handler)
tempfile = "3"

# SQLite (state.db for bookmarks, recent files, clipboard history 등)
rusqlite = { version = "0.32", features = ["bundled"] }

# RNG (Phase 6.2: agent session token)
rand = "0.9"

# Date/time — known-plugins.toml trusted_at RFC3339 timestamp.
# default-features=false 로 tzdata 의존 제거; UTC + std clock 만 사용.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Markdown surface 렌더 — CommonMark/GFM 파싱만 pulldown-cmark 로 하고, 그리기는
# tasty 가 직접(per-level heading 토큰 계층·prose 줄간격 적용) 한다. egui_commonmark 는
# heading 을 단일 스타일로만 스케일해 디자인의 6단계 계층을 표현할 수 없어 제거했다.
pulldown-cmark = { version = "0.12", default-features = false, optional = true }
# System tray (cross-platform: Windows=Shell_NotifyIcon, macOS=NSStatusItem, Linux=SNI/AppIndicator via GTK)
tray-icon = { version = "0.22", optional = true }

# WebView (macOS)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSURLRequest", "NSObject", "NSArray"], optional = true }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKWebViewConfiguration", "WKPreferences", "WKWebsiteDataStore", "WKNavigation", "WKNavigationDelegate", "WKContentRuleList", "WKContentRuleListStore", "WKUserContentController", "block2"], optional = true }
objc2-app-kit = { version = "0.3", features = ["NSView", "NSWindow", "NSResponder", "NSMenu", "NSMenuItem", "NSEvent", "NSGraphics", "NSPasteboard", "NSPasteboardItem", "NSApplication", "NSRunningApplication", "NSImage", "libc"], optional = true }
# objc2-web-kit 0.3 의 WKContentRuleList completion handler block 타입(>=0.6.1).
block2 = { version = "0.6", optional = true }
drag = { version = "2.1", optional = true }

# WebView (Windows)
[target.'cfg(windows)'.dependencies]
webview2-com = { version = "0.38", optional = true }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

# WebView (Linux)
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"], optional = true }
gtk = { version = "0.18", optional = true }
gdkx11 = { version = "0.18", optional = true }
x11-dl = { version = "2.21", optional = true }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
default = ["gui"]
gui = [
    "dep:winit",
    "dep:wgpu",
    "dep:egui",
    "dep:egui-wgpu",
    "dep:egui-winit",
    "dep:egui_extras",
    # egui-mesh host 합성(A1-S5)이 mesh_wire POD 코덱을 쓴다. gui 빌드만 활성화 —
    # 비-gui(CLI/headless) 빌드는 egui 의존 없이 유지(protocol lib.rs 불변식).
    "tasty-plugin-protocol/egui-mesh",
    "dep:cosmic-text",
    "dep:bytemuck",
    "dep:webbrowser",
    "dep:arboard",
    "dep:trash",
    "dep:png",
    "dep:image",
    "dep:rfd",
    "dep:pulldown-cmark",
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-web-kit",
    "dep:objc2-app-kit",
    "dep:block2",
    "dep:drag",
    "dep:webview2-com",
    "dep:tray-icon",
    "dep:webkit2gtk",
    "dep:gtk",
    "dep:gdkx11",
    "dep:x11-dl",
]
# heap attribution (opt-in): 전 할당 계측 → 종료 시 dhat-heap.json.
# UMDH 없는 환경(권한/미설치)에서의 크로스플랫폼 대안. 기본 빌드와 무관.
# 사용법: docs/dev-guide/memory-leak-soak.md
dhat-heap = ["dep:dhat"]

[dev-dependencies]
serde_json = "1"
enigo = "0.6"
tempfile = "3"
# 메모리 누수 soak 하네스(tests/soak_memory.rs)의 외부 측정용 — 프로세스 트리
# RSS·자식 프로세스 열거. 본체 의존성 아님(관찰자 효과 0), dev 전용.
sysinfo = "0.35"

# gui_common 이 objc2-app-kit 등 gui 전용 optional 의존을 쓰므로 headless
# (`--no-default-features`) 테스트 빌드에서 제외한다.
[[test]]
name = "gui_tests"
required-features = ["gui"]


# 한글 IME 수정을 위한 개인 포크 핀. 재현성을 위해 movable branch 가 아니라 고정 commit(rev)에 핀한다.
# 탈출 조건·근거·대비책: docs/dev-guide/dep-issues.md 참조.
# TODO: winit PR #4478 (https://github.com/rust-windowing/winit/pull/4478) 머지 후 공식 버전으로 교체
[patch.crates-io]
winit = { git = "https://github.com/zilhak/winit-ime-fix.git", rev = "dfe2ec8d5bf55bfbca274a7cf56e5fae0d20c1f5" }

[lints]
workspace = true

# 일상 dev 빌드의 hot-path 비용을 줄이기 위한 절충 최적화.
# 본 crate (tasty 본체) 는 빠른 컴파일을 위해 opt-level=0 유지하고,
# 의존성 + 워크스페이스 crate (cell 루프 / atlas / wgpu wrapper 등 hot path 의 본진)
# 는 release 수준으로 미리 최적화하여 cache 한다.
# 첫 빌드는 길어지지만 incremental dev cycle 은 거의 그대로.
[profile.dev]
opt-level = 0

# 의존성 전체를 opt=3 (release 수준)
[profile.dev.package."*"]
opt-level = 3

# 워크스페이스 crate 들은 `"*"` glob 으로 적용되지 않으므로 각각 명시.
[profile.dev.package.tasty-agent]
opt-level = 3
[profile.dev.package.tasty-approval]
opt-level = 3
[profile.dev.package.tasty-cli]
opt-level = 3
[profile.dev.package.tasty-font]
opt-level = 3
[profile.dev.package.tasty-hooks]
opt-level = 3
[profile.dev.package.tasty-host-plugin]
opt-level = 3
[profile.dev.package.tasty-ipc]
opt-level = 3
[profile.dev.package.tasty-lua]
opt-level = 3
[profile.dev.package.tasty-memory]
opt-level = 3
[profile.dev.package.tasty-model]
opt-level = 3
[profile.dev.package.tasty-output]
opt-level = 3
[profile.dev.package.tasty-plugin-claude]
opt-level = 3
[profile.dev.package.tasty-plugin-claude-design]
opt-level = 3
[profile.dev.package.tasty-plugin-clipboard-viewer]
opt-level = 3
[profile.dev.package.tasty-plugin-codex]
opt-level = 3
[profile.dev.package.tasty-plugin-git-viewer]
opt-level = 3
[profile.dev.package.tasty-plugin-html]
opt-level = 3
[profile.dev.package.tasty-plugin-image]
opt-level = 3
[profile.dev.package.tasty-plugin-manifest]
opt-level = 3
[profile.dev.package.tasty-plugin-markdown]
opt-level = 3
[profile.dev.package.tasty-plugin-mesh-demo]
opt-level = 3
[profile.dev.package.tasty-plugin-protocol]
opt-level = 3
[profile.dev.package.tasty-plugin-sdk]
opt-level = 3
[profile.dev.package.tasty-portscan]
opt-level = 3
