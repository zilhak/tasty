[workspace]
members = ["crates/*"]
resolver = "2"

# 워크스페이스 공통 lint.
# `undocumented_unsafe_blocks`: 모든 unsafe 블록 위에 `// SAFETY:` 주석 필수.
# `multiple_unsafe_ops_per_block`: 한 블록에 두 개 이상의 unsafe op 적발 (현재는 warn).
#   FFI 묶음(Win32 등)이 자연스럽게 한 블록인 경우가 많아 deny로 올리기 전 비용 측정 단계.
# 각 member crate 및 본 패키지의 `[lints]` 절에서 `workspace = true`로 상속.
[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "warn"

# `unsafe fn` 내부의 unsafe op도 명시적 unsafe block을 강제. 호출 사이트에서
# unsafe 의도가 항상 드러난다. Rust 2024 edition에선 기본 deny지만, 워크스페이스
# 일관성을 위해 명시.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[package]
name = "tasty"
version = "0.4.0"
edition = "2024"
authors = ["zilhak <zilhak1@gmail.com>"]
license = "MIT"
description = "Cross-platform GPU-accelerated terminal emulator for AI coding agents"
repository = "https://github.com/zilhak/tasty"

[package.metadata.deb]
maintainer = "zilhak <zilhak1@gmail.com>"
copyright = "2026, zilhak <zilhak1@gmail.com>"
extended-description = """
Tasty is a cross-platform GPU-accelerated terminal emulator with first-class
support for AI coding agents. Built on wgpu (Vulkan/DX12/Metal) and winit,
it exposes both an IPC API and a CLI surface so agents can drive the
terminal programmatically alongside human use."""
depends = "$auto, libfreetype6, libfontconfig1"
section = "utils"
priority = "optional"
assets = [
    ["target/release/tasty", "usr/bin/", "755"],
    ["assets/linux/tasty.desktop", "usr/share/applications/", "644"],
    ["assets/icons/icon_16.png",  "usr/share/icons/hicolor/16x16/apps/tasty.png",   "644"],
    ["assets/icons/icon_32.png",  "usr/share/icons/hicolor/32x32/apps/tasty.png",   "644"],
    ["assets/icons/icon_64.png",  "usr/share/icons/hicolor/64x64/apps/tasty.png",   "644"],
    ["assets/icons/icon_128.png", "usr/share/icons/hicolor/128x128/apps/tasty.png", "644"],
    ["assets/icons/icon_256.png", "usr/share/icons/hicolor/256x256/apps/tasty.png", "644"],
    ["assets/icons/icon_512.png", "usr/share/icons/hicolor/512x512/apps/tasty.png", "644"],
]

[package.metadata.generate-rpm]
license = "MIT"
summary = "Cross-platform GPU-accelerated terminal emulator for AI coding agents"
# builtin: rpm-build 도구가 없는 빌더(Ubuntu 등)에서도 ELF 분석으로 의존성을 잡는다.
auto-req = "builtin"
assets = [
    { source = "target/release/tasty", dest = "/usr/bin/tasty", mode = "755" },
    { source = "assets/linux/tasty.desktop", dest = "/usr/share/applications/tasty.desktop", mode = "644" },
    { source = "assets/icons/icon_16.png",  dest = "/usr/share/icons/hicolor/16x16/apps/tasty.png",   mode = "644" },
    { source = "assets/icons/icon_32.png",  dest = "/usr/share/icons/hicolor/32x32/apps/tasty.png",   mode = "644" },
    { source = "assets/icons/icon_64.png",  dest = "/usr/share/icons/hicolor/64x64/apps/tasty.png",   mode = "644" },
    { source = "assets/icons/icon_128.png", dest = "/usr/share/icons/hicolor/128x128/apps/tasty.png", mode = "644" },
    { source = "assets/icons/icon_256.png", dest = "/usr/share/icons/hicolor/256x256/apps/tasty.png", mode = "644" },
    { source = "assets/icons/icon_512.png", dest = "/usr/share/icons/hicolor/512x512/apps/tasty.png", mode = "644" },
]

[package.metadata.generate-rpm.requires]
freetype = "*"
fontconfig = "*"

[dependencies]
# Workspace crates
tasty-core = { path = "crates/tasty-core" }
tasty-font = { path = "crates/tasty-font" }
tasty-hooks = { path = "crates/tasty-hooks" }
tasty-memory = { path = "crates/tasty-memory" }
tasty-output = { path = "crates/tasty-output" }
tasty-plugin-protocol = { path = "crates/tasty-plugin-protocol" }
tasty-settings = { path = "crates/tasty-settings" }
tasty-shm = { path = "crates/tasty-shm" }
tasty-terminal = { path = "crates/tasty-terminal" }
# Window & Input
winit = "0.30"

# GPU Rendering
wgpu = "24"

# UI Widgets
egui = "0.31"
egui-wgpu = "0.31"
egui-winit = "0.31"

# Terminal Emulation
termwiz = "0.22"

# Async
pollster = "0.4"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error Handling
anyhow = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Version range matching (plugin extension version_req)
semver = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Font & Text
cosmic-text = "0.18"
bytemuck = { version = "1", features = ["derive"] }

# Notifications
notify-rust = "4"

# Regex
regex = "1"

# URL/파일 오픈 (터미널 내 링크 클릭 시 기본 브라우저/연결 프로그램)
webbrowser = "1"

# Shell escaping
shell-escape = "0.1"

# Clipboard
arboard = "3"

# Trash (OS recycle bin)
trash = "5"

# PNG encoding (screenshots)
png = "0.18"

# Image loading/saving (image viewer)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp", "ico", "tiff"] }

# Platform
libc = "0.2"

# File Dialogs
rfd = "0.15"

# Utilities
directories = "6"

# SQLite (state.db for bookmarks, recent files, clipboard history 등)
rusqlite = { version = "0.32", features = ["bundled"] }
egui_commonmark = "0.20.0"

# WebView (macOS)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSURLRequest", "NSObject", "NSArray"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKWebViewConfiguration", "WKPreferences", "WKWebsiteDataStore", "WKNavigation"] }
objc2-app-kit = { version = "0.3", features = ["NSView", "NSWindow", "NSResponder", "NSMenu", "NSMenuItem", "NSEvent", "NSGraphics", "NSPasteboard", "NSPasteboardItem", "NSApplication", "NSRunningApplication", "NSImage", "libc"] }
drag = "2.1"

# WebView (Windows)
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
tray-icon = "0.22"

# WebView (Linux)
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
gtk = "0.18"
gdkx11 = "0.18"
x11-dl = "2.21"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
serde_json = "1"
enigo = "0.6"
tempfile = "3"


# TODO: winit PR #4478 (https://github.com/rust-windowing/winit/pull/4478) 머지 후 공식 버전으로 교체
[patch.crates-io]
winit = { git = "https://github.com/zilhak/winit-ime-fix.git", branch = "fix-korean-ime" }

[lints]
workspace = true

[profile.release]
lto = "thin"
strip = true
opt-level = 3

# 배포용 프로필. release를 상속받되 full LTO를 사용해 끝까지 짜낸다.
# 일상 cargo build --release보다 약 3.5배 느리므로 DMG/MSIX 등 배포 산출물에만 사용.
[profile.dist]
inherits = "release"
lto = true
