[workspace]
members = ["crates/*"]
# WASM 실험 SDK는 자체 Cargo.lock으로 관리해 기본 빌드의 의존성 해석에서 제외한다.
# 보류 이유: docs/adr/0025-plugin-trust-and-distribution.md
# vendor 사본은 workspace lint·fmt 대상에 포함하지 않는다.
exclude = ["crates/tasty-plugin-sdk-wasm", "vendor/tiny_http"]
resolver = "2"

# 각 패키지가 [lints] workspace = true로 공통 규칙을 사용한다.
[workspace.lints.clippy]
# unsafe 블록에는 SAFETY 주석으로 전제를 설명한다.
undocumented_unsafe_blocks = "deny"
# 함수 복잡도 기준은 clippy.toml의 cognitive-complexity-threshold = 20이다.
# 기존 예외는 위치별 allow와 complexity-exempt 사유를 남긴다.
# 검사 범위: docs/dev-guide/complexity-gate.md#무엇을도구임계값
cognitive_complexity = "deny"
# FFI처럼 여러 unsafe 연산을 묶어야 하는 예외는 해당 파일·함수에서 설명한다.
# 플랫폼 전용 코드는 그 타깃으로 Clippy를 실행해야 검사할 수 있다.
multiple_unsafe_ops_per_block = "deny"
# 도메인 오류를 일괄 Box로 감싸는 비용을 피한다. 새 오류 타입은 크기와 Box 사용을 검토한다.
# 적용 위치를 확인하려면 이 lint를 임시로 warn으로 바꿔 Clippy를 실행한다.
result_large_err = "allow"
# Result 등 must_use 값을 무시한 위치를 경고한다. 사유 주석은 Clippy가 검사하지 않는다.
# 주석 정책은 let_underscore_documented 테스트로 별도 확인한다.
# 범위: docs/dev-guide/error-handling.md
let_underscore_must_use = "warn"
# 직접 색을 만드는 호출은 금지하고 필요한 예외는 위치별 allow와 이유를 적는다.
# 기준: docs/design/systems/theme.md
disallowed_methods = "deny"
# 공개 unsafe 함수는 호출자가 지켜야 할 조건을 # Safety 절에 적는다.
missing_safety_doc = "deny"

# unsafe 함수 내부에서도 unsafe 연산에는 명시적 unsafe 블록이 필요하다.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# 함수 주소는 포인터를 거쳐 정수로 변환한다(f as *const () as usize).
function_casts_as_integer = "deny"
unused_assignments = "deny"
unused_must_use = "deny"
dead_code = "deny"

[package]
name = "tasty"
version = "0.10.4"
edition = "2024"
authors = ["zilhak <zilhak1@gmail.com>"]
license = "MIT"
description = "Cross-platform GPU-accelerated terminal emulator for AI coding agents"
repository = "https://github.com/zilhak/tasty"

[package.metadata.deb]
maintainer = "zilhak <zilhak1@gmail.com>"
copyright = "2026, zilhak <zilhak1@gmail.com>"
extended-description = """
Tasty is a cross-platform GPU-accelerated terminal emulator with first-class
support for AI coding agents. Built on wgpu (Vulkan/DX12/Metal) and winit,
it exposes both an IPC API and a CLI surface so agents can drive the
terminal programmatically alongside human use."""
depends = "$auto, libfreetype6, libfontconfig1"
# Vulkan은 동적 로딩하므로 $auto의 ELF 의존성 검사로 찾지 못한다.
# 다른 GPU 백엔드를 사용할 수 있어 필수 의존성 대신 권장 패키지로 둔다.
recommends = "libvulkan1"
section = "utils"
priority = "optional"
assets = [
    ["target/release/tasty", "usr/bin/", "755"],
    ["assets/linux/tasty.desktop", "usr/share/applications/", "644"],
    ["assets/icons/icon_16.png",  "usr/share/icons/hicolor/16x16/apps/tasty.png",   "644"],
    ["assets/icons/icon_32.png",  "usr/share/icons/hicolor/32x32/apps/tasty.png",   "644"],
    ["assets/icons/icon_64.png",  "usr/share/icons/hicolor/64x64/apps/tasty.png",   "644"],
    ["assets/icons/icon_128.png", "usr/share/icons/hicolor/128x128/apps/tasty.png", "644"],
    ["assets/icons/icon_256.png", "usr/share/icons/hicolor/256x256/apps/tasty.png", "644"],
    ["assets/icons/icon_512.png", "usr/share/icons/hicolor/512x512/apps/tasty.png", "644"],
    # LICENSES 하위 경로를 유지해 THIRD_PARTY_LICENSES.md의 링크가 설치 후에도 열리게 한다.
    # 라이선스 파일 목록은 중복해서 열거하지 않고 디렉터리 전체를 포함한다.
    ["LICENSE", "usr/share/doc/tasty/", "644"],
    ["THIRD_PARTY_LICENSES.md", "usr/share/doc/tasty/", "644"],
    ["LICENSES/*", "usr/share/doc/tasty/LICENSES/", "644"],
    # Linux 번들 검색 경로에 설치한다. BUILTINS 및 빌드 스크립트의 준비 목록과 맞춘다.
    # 기준: crates/tasty-host-plugin/src/builtin.rs
    ["target/release/tasty-plugin-claude",            "usr/lib/tasty/plugins/com.tasty.claude/",            "755"],
    ["crates/tasty-plugin-claude/tasty-plugin.toml",  "usr/lib/tasty/plugins/com.tasty.claude/",            "644"],
    ["crates/tasty-plugin-claude/tasty-plugin.toml.sig", "usr/lib/tasty/plugins/com.tasty.claude/",         "644"],
    ["crates/tasty-plugin-claude/lang/*",             "usr/lib/tasty/plugins/com.tasty.claude/lang/",       "644"],
    ["target/release/tasty-plugin-clipboard-viewer",             "usr/lib/tasty/plugins/com.tasty.clipboard-viewer/",             "755"],
    ["crates/tasty-plugin-clipboard-viewer/tasty-plugin.toml",   "usr/lib/tasty/plugins/com.tasty.clipboard-viewer/",             "644"],
    ["crates/tasty-plugin-clipboard-viewer/tasty-plugin.toml.sig", "usr/lib/tasty/plugins/com.tasty.clipboard-viewer/",          "644"],
    ["crates/tasty-plugin-clipboard-viewer/lang/*",              "usr/lib/tasty/plugins/com.tasty.clipboard-viewer/lang/",        "644"],
    ["target/release/tasty-plugin-codex",             "usr/lib/tasty/plugins/com.tasty.codex/",             "755"],
    ["crates/tasty-plugin-codex/tasty-plugin.toml",   "usr/lib/tasty/plugins/com.tasty.codex/",             "644"],
    ["crates/tasty-plugin-codex/tasty-plugin.toml.sig", "usr/lib/tasty/plugins/com.tasty.codex/",           "644"],
    ["crates/tasty-plugin-codex/lang/*",              "usr/lib/tasty/plugins/com.tasty.codex/lang/",        "644"],
    ["target/release/tasty-plugin-git-viewer",        "usr/lib/tasty/plugins/com.tasty.git-viewer/",        "755"],
    ["crates/tasty-plugin-git-viewer/tasty-plugin.toml","usr/lib/tasty/plugins/com.tasty.git-viewer/",      "644"],
    ["crates/tasty-plugin-git-viewer/tasty-plugin.toml.sig","usr/lib/tasty/plugins/com.tasty.git-viewer/",  "644"],
    ["crates/tasty-plugin-git-viewer/lang/*",         "usr/lib/tasty/plugins/com.tasty.git-viewer/lang/",   "644"],
    ["target/release/tasty-plugin-html",              "usr/lib/tasty/plugins/com.tasty.html/",              "755"],
    ["crates/tasty-plugin-html/tasty-plugin.toml",    "usr/lib/tasty/plugins/com.tasty.html/",              "644"],
    ["crates/tasty-plugin-html/tasty-plugin.toml.sig","usr/lib/tasty/plugins/com.tasty.html/",              "644"],
    ["crates/tasty-plugin-html/lang/*",               "usr/lib/tasty/plugins/com.tasty.html/lang/",         "644"],
    ["target/release/tasty-plugin-image",             "usr/lib/tasty/plugins/com.tasty.image/",             "755"],
    ["crates/tasty-plugin-image/tasty-plugin.toml",   "usr/lib/tasty/plugins/com.tasty.image/",             "644"],
    ["crates/tasty-plugin-image/tasty-plugin.toml.sig","usr/lib/tasty/plugins/com.tasty.image/",            "644"],
    ["crates/tasty-plugin-image/lang/*",              "usr/lib/tasty/plugins/com.tasty.image/lang/",        "644"],
    ["target/release/tasty-plugin-markdown",          "usr/lib/tasty/plugins/com.tasty.markdown/",          "755"],
    ["crates/tasty-plugin-markdown/tasty-plugin.toml","usr/lib/tasty/plugins/com.tasty.markdown/",          "644"],
    ["crates/tasty-plugin-markdown/tasty-plugin.toml.sig","usr/lib/tasty/plugins/com.tasty.markdown/",      "644"],
    ["crates/tasty-plugin-markdown/lang/*",           "usr/lib/tasty/plugins/com.tasty.markdown/lang/",     "644"],
]

