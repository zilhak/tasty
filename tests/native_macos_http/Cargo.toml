[package]
name = "native-macos-http"
version = "0.0.0"
edition = "2024"
publish = false
[workspace]
[dependencies]
objc2 = "=0.6.4"
objc2-foundation = "=0.3.2"
objc2-web-kit = { version = "=0.3.2", features = ["block2"] }
objc2-app-kit = "=0.3.2"
block2 = "=0.6.2"
libc = "0.2"
sha2 = "0.10"
url = "2"
serde_json = "1"
[[bin]]
name = "native-macos-http"
path = "driver.rs"

[dev-dependencies]
rcgen = { version = "=0.14.8", default-features = false, features = ["aws_lc_rs"] }
