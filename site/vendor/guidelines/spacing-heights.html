<!-- @dsCard group="Spacing" viewport="700x170" name="Interactive Heights" subtitle="Fixed row heights for tree / control / tab" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 22px; background: var(--tasty-bg-panel); display: grid; gap: 12px; max-width: 420px; }
  .r { display: flex; align-items: center; gap: 12px; }
  .demo { display: flex; align-items: center; padding: 0 12px; background: var(--tasty-surface-raised);
          border: 1px solid var(--tasty-border-default); border-radius: var(--tasty-radius);
          color: var(--tasty-text-primary); font-size: 12px; }
  .tree { height: var(--tasty-control-height-tree); }
  .ctrl { height: var(--tasty-control-height); }
  .tab  { height: var(--tasty-control-height-tab); width: var(--tasty-tab-width); }
  .l { font-family: var(--tasty-font-mono); font-size: 10.5px; color: var(--tasty-text-muted); }
</style>
</head>
<body>
  <div class="r"><div class="demo tree">tree row</div><div class="l">--tasty-control-height-tree · 22px</div></div>
  <div class="r"><div class="demo ctrl">button / input / menu</div><div class="l">--tasty-control-height · 28px</div></div>
  <div class="r"><div class="demo tab">tab</div><div class="l">--tasty-control-height-tab · 24px · width 150px</div></div>
</body>
</html>
