<!-- @dsCard group="Colors" viewport="700x270" name="Semantic — Accent Roles" subtitle="Status + agent accent mapping" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 20px; background: var(--tasty-bg-app); }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .item { border-radius: var(--tasty-radius); border: 1px solid var(--tasty-separator); overflow: hidden; }
  .bar { height: 8px; }
  .body { padding: 10px; background: var(--tasty-bg-panel); }
  .role { font-size: 12px; font-weight: 600; color: var(--tasty-text-primary); }
  .tok { font-family: var(--tasty-font-mono); font-size: 10px; color: var(--tasty-text-muted); margin-top: 3px; }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="bar" style="background:var(--tasty-accent-primary)"></div><div class="body"><div class="role">primary</div><div class="tok">blue</div></div></div>
    <div class="item"><div class="bar" style="background:var(--tasty-accent-info)"></div><div class="body"><div class="role">info</div><div class="tok">sky</div></div></div>
    <div class="item"><div class="bar" style="background:var(--tasty-accent-success)"></div><div class="body"><div class="role">success</div><div class="tok">green</div></div></div>
    <div class="item"><div class="bar" style="background:var(--tasty-accent-warning)"></div><div class="body"><div class="role">warning</div><div class="tok">yellow</div></div></div>
    <div class="item"><div class="bar" style="background:var(--tasty-accent-danger)"></div><div class="body"><div class="role">danger</div><div class="tok">red</div></div></div>
    <div class="item"><div class="bar" style="background:var(--tasty-accent-agent)"></div><div class="body"><div class="role">agent</div><div class="tok">mauve</div></div></div>
    <div class="item"><div class="bar" style="background:var(--tasty-accent-occupied-soft)"></div><div class="body"><div class="role">occupied · soft</div><div class="tok">green</div></div></div>
    <div class="item"><div class="bar" style="background:var(--tasty-accent-occupied-hard)"></div><div class="body"><div class="role">occupied · hard</div><div class="tok">peach</div></div></div>
  </div>
</body>
</html>
