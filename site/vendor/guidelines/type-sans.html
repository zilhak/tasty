<!-- @dsCard group="Type" viewport="700x210" name="UI Sans — Chrome" subtitle="Native system sans for app chrome — capped at 14px" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 22px; background: var(--tasty-bg-panel); }
  .stack { display: grid; gap: 11px; }
  .line { display: flex; align-items: baseline; gap: 14px; }
  .tok { font-family: var(--tasty-font-mono); font-size: 10.5px; color: var(--tasty-text-muted); width: 150px; flex: none; }
  .h { font-size: var(--tasty-font-size-heading); font-weight: 600; color: var(--tasty-text-primary); }
  .b { font-size: var(--tasty-font-size-body); color: var(--tasty-text-primary); }
  .c { font-size: var(--tasty-font-size-caption); color: var(--tasty-text-muted); }
  .m { font-size: var(--tasty-font-size-max); font-weight: 600; color: var(--tasty-text-primary); }
</style>
</head>
<body>
  <div class="stack">
    <div class="line"><span class="tok">--max · 14 / 600</span><span class="m">Appearance settings</span></div>
    <div class="line"><span class="tok">--heading · 13 / 600</span><span class="h">Restore layout on startup</span></div>
    <div class="line"><span class="tok">--body · 13 / 400</span><span class="b">Switch to this workspace when the agent attaches.</span></div>
    <div class="line"><span class="tok">--caption · 11 / 400</span><span class="c">Language change takes effect after restart.</span></div>
  </div>
</body>
</html>
