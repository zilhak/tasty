<!-- @dsCard group="Brand" viewport="700x150" name="Watermelon Palette" subtitle="The three mark colors + their token names" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 22px; background: var(--tasty-bg-panel); display: flex; gap: 16px; align-items: center; }
  .sw { display: flex; align-items: center; gap: 12px; }
  .chip { width: 56px; height: 56px; border-radius: var(--tasty-radius); border: 1px solid var(--tasty-separator); }
  .name { font-size: 12.5px; font-weight: 600; color: var(--tasty-text-primary); }
  .tok { font-family: var(--tasty-font-mono); font-size: 10.5px; color: var(--tasty-text-muted); margin-top: 3px; }
  img { width: 56px; height: 56px; margin-right: 8px; }
</style>
</head>
<body>
  <img src="../assets/icons/icon_256.png" alt="Tasty logo" />
  <div class="sw"><div class="chip" style="background:var(--tasty-brand-melon-flesh)"></div><div><div class="name">flesh</div><div class="tok">#f25d6b</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--tasty-brand-melon-rind)"></div><div><div class="name">rind</div><div class="tok">#1e7d4f</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--tasty-brand-melon-seed)"></div><div><div class="name">seed</div><div class="tok">#11111b</div></div></div>
</body>
</html>
