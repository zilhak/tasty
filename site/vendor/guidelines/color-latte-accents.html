<!-- @dsCard group="Colors" viewport="700x290" name="Latte — Accents" subtitle="Light-theme accent ramp" -->
<!DOCTYPE html>
<html lang="en" data-theme="latte">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 20px; background: var(--tasty-bg-app); }
  .grid { display: grid; gap: 10px; }
  .sw { border-radius: var(--tasty-radius); overflow: hidden; border: 1px solid var(--tasty-separator); }
  .chip { height: 56px; }
  .meta { padding: 7px 9px; background: var(--tasty-bg-panel); }
  .name { font-size: 12px; color: var(--tasty-text-primary); font-weight: 600; }
  .hex { font-family: var(--tasty-font-mono); font-size: 10.5px; color: var(--tasty-text-muted); margin-top: 2px; }
  .small .chip { height: 44px; }
</style>
</head>
<body>
  <div class="grid small" style="grid-template-columns:repeat(7,1fr)">
    <div class="sw"><div class="chip" style="background:var(--tasty-color-blue)"></div><div class="meta"><div class="name">blue</div><div class="hex">#1e66f5</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-color-green)"></div><div class="meta"><div class="name">green</div><div class="hex">#40a02b</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-color-red)"></div><div class="meta"><div class="name">red</div><div class="hex">#d20f39</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-color-yellow)"></div><div class="meta"><div class="name">yellow</div><div class="hex">#df8e1d</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-color-peach)"></div><div class="meta"><div class="name">peach</div><div class="hex">#fe640b</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-color-mauve)"></div><div class="meta"><div class="name">mauve</div><div class="hex">#8839ef</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-color-teal)"></div><div class="meta"><div class="name">teal</div><div class="hex">#179299</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-color-sky)"></div><div class="meta"><div class="name">sky</div><div class="hex">#04a5e5</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-color-lavender)"></div><div class="meta"><div class="name">lavender</div><div class="hex">#7287fd</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-color-flamingo)"></div><div class="meta"><div class="name">flamingo</div><div class="hex">#dd7878</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-color-pink)"></div><div class="meta"><div class="name">pink</div><div class="hex">#ea76cb</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-color-maroon)"></div><div class="meta"><div class="name">maroon</div><div class="hex">#e64553</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-color-rosewater)"></div><div class="meta"><div class="name">rosewater</div><div class="hex">#dc8a78</div></div></div>
  </div>
</body>
</html>
