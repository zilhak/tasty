<!-- @dsCard group="Colors" viewport="700x290" name="Mocha — Accents" subtitle="13 Catppuccin accents" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 20px; background: var(--tasty-bg-app); }
  .grid { display: grid; gap: 10px; }
  .sw { border-radius: var(--tasty-radius); overflow: hidden; border: 1px solid var(--tasty-separator); }
  .chip { height: 56px; }
  .meta { padding: 7px 9px; background: var(--tasty-bg-panel); }
  .name { font-size: 12px; color: var(--tasty-text-primary); font-weight: 600; }
  .hex { font-family: var(--tasty-font-mono); font-size: 10.5px; color: var(--tasty-text-muted); margin-top: 2px; }
  .small .chip { height: 44px; }
</style>
</head>
<body>
  <div class="grid small" style="grid-template-columns:repeat(7,1fr)">
    <div class="sw"><div class="chip" style="background:var(--tasty-color-blue)"></div><div class="meta"><div class="name">blue</div><div class="hex">#89b4fa</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-color-green)"></div><div class="meta"><div class="name">green</div><div class="hex">#a6e3a1</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-color-red)"></div><div class="meta"><div class="name">red</div><div class="hex">#f38ba8</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-color-yellow)"></div><div class="meta"><div class="name">yellow</div><div class="hex">#f9e2af</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-color-peach)"></div><div class="meta"><div class="name">peach</div><div class="hex">#fab387</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-color-mauve)"></div><div class="meta"><div class="name">mauve</div><div class="hex">#cba6f7</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-color-teal)"></div><div class="meta"><div class="name">teal</div><div class="hex">#94e2d5</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-color-sky)"></div><div class="meta"><div class="name">sky</div><div class="hex">#89dceb</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-color-lavender)"></div><div class="meta"><div class="name">lavender</div><div class="hex">#b4befe</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-color-flamingo)"></div><div class="meta"><div class="name">flamingo</div><div class="hex">#f2cdcd</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-color-pink)"></div><div class="meta"><div class="name">pink</div><div class="hex">#f5c2e7</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-color-maroon)"></div><div class="meta"><div class="name">maroon</div><div class="hex">#eba0ac</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-color-rosewater)"></div><div class="meta"><div class="name">rosewater</div><div class="hex">#f5e0dc</div></div></div>
  </div>
</body>
</html>
