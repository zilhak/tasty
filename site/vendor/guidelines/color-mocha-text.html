<!-- @dsCard group="Colors" viewport="700x180" name="Mocha — Overlays & Text" subtitle="Overlay grays and the text ramp" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 20px; background: var(--tasty-bg-app); }
  .grid { display: grid; gap: 10px; }
  .sw { border-radius: var(--tasty-radius); overflow: hidden; border: 1px solid var(--tasty-separator); }
  .chip { height: 56px; }
  .meta { padding: 7px 9px; background: var(--tasty-bg-panel); }
  .name { font-size: 12px; color: var(--tasty-text-primary); font-weight: 600; }
  .hex { font-family: var(--tasty-font-mono); font-size: 10.5px; color: var(--tasty-text-muted); margin-top: 2px; }
  .small .chip { height: 44px; }
</style>
</head>
<body>
  <div class="grid" style="grid-template-columns:repeat(7,1fr)">
    <div class="sw"><div class="chip" style="background:var(--tasty-color-neutral-600)"></div><div class="meta"><div class="name">overlay0</div><div class="hex">#6c7086</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-color-neutral-700)"></div><div class="meta"><div class="name">overlay1</div><div class="hex">#7f849c</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-color-neutral-800)"></div><div class="meta"><div class="name">overlay2</div><div class="hex">#9399b2</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-color-neutral-1100)"></div><div class="meta"><div class="name">text</div><div class="hex">#cdd6f4</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-color-neutral-1000)"></div><div class="meta"><div class="name">subtext1</div><div class="hex">#bac2de</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-color-neutral-900)"></div><div class="meta"><div class="name">subtext0</div><div class="hex">#a6adc8</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-color-neutral-600)"></div><div class="meta"><div class="name">placeholder</div><div class="hex">#6c7086</div></div></div>
  </div>
</body>
</html>
