<!-- @dsCard group="Spacing" viewport="700x150" name="Radius & Border" subtitle="One radius (4px), one border (1px). No shadow system." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 22px; background: var(--tasty-bg-panel); display: flex; gap: 24px; align-items: center; }
  .box { width: 78px; height: 60px; background: var(--tasty-surface-raised); border: 1px solid var(--tasty-border-default);
         display: flex; align-items: center; justify-content: center; color: var(--tasty-text-muted);
         font-family: var(--tasty-font-mono); font-size: 10.5px; }
  .l { font-family: var(--tasty-font-mono); font-size: 10.5px; color: var(--tasty-text-muted); margin-top: 8px; }
  .col { text-align: center; }
  .strong { border-color: var(--tasty-border-strong); }
  .note { max-width: 230px; font-size: 12px; color: var(--tasty-text-secondary); line-height: 1.5; }
  .note b { color: var(--tasty-text-primary); }
</style>
</head>
<body>
  <div class="col"><div class="box" style="border-radius:var(--tasty-radius-sm)">2px</div><div class="l">--tasty-radius-sm</div></div>
  <div class="col"><div class="box" style="border-radius:var(--tasty-radius)">4px</div><div class="l">--tasty-radius</div></div>
  <div class="col"><div class="box strong" style="border-radius:var(--tasty-radius)">1px</div><div class="l">--tasty-border-strong</div></div>
  <div class="note">Elevation is communicated by <b>surface tint</b>, never drop shadow — the system ships <b>no shadow tokens</b>.</div>
</body>
</html>
