<!-- @dsCard group="Brand" viewport="700x190" name="Logo & Wordmark" subtitle="Watermelon-slice mark + monospace wordmark" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 0; background: var(--tasty-bg-app); display: flex; }
  .panel { flex: 1; display: flex; align-items: center; justify-content: center; gap: 0; padding: 28px; }
  .dark { background: #000; }
  .light { background: #ffffff; }
  .logo { width: 64px; height: 64px; image-rendering: -webkit-optimize-contrast; }
  .word { font-family: var(--tasty-font-mono); font-weight: 700; font-size: 38px; letter-spacing: -1px; margin-left: -10px; }
  .word.on-dark { color: #cdd6f4; }
  .word.on-light { color: #4c4f69; }
  .dot { color: var(--tasty-brand-melon-flesh); }
</style>
</head>
<body>
  <div class="panel dark">
    <img class="logo" src="../assets/icons/icon_256.png" alt="Tasty logo" />
    <div class="word on-dark">tasty<span class="dot">.</span></div>
  </div>
  <div class="panel light">
    <img class="logo" src="../assets/icons/icon_256.png" alt="Tasty logo" />
    <div class="word on-light">tasty<span class="dot">.</span></div>
  </div>
</body>
</html>
