<!-- @dsCard group="Colors" viewport="700x190" name="States — Overlays & Selection" subtitle="hover/active overlays + terminal selection, derived from is_light" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 20px; background: var(--tasty-bg-app); display: grid; gap: 14px; }
  .demo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .cell { background: var(--tasty-surface-raised); border: 1px solid var(--tasty-border-default); border-radius: var(--tasty-radius);
          height: 56px; display: flex; align-items: center; justify-content: center;
          font-size: 12px; color: var(--tasty-text-secondary); position: relative; }
  .cell .ov { position: absolute; inset: 0; border-radius: var(--tasty-radius); }
  .lbl { font-family: var(--tasty-font-mono); font-size: 10.5px; color: var(--tasty-text-muted); margin-top: 6px; text-align: center; }
  .term { background: #000; border-radius: var(--tasty-radius); padding: 12px 14px; font-family: var(--tasty-font-mono);
          font-size: 13px; color: var(--tasty-color-neutral-1100); border: 1px solid var(--tasty-border-default); }
  .sel { background: var(--tasty-selection-bg); }
  .vi { background: var(--tasty-vi-cursor-bg); color: #11111b; }
  .sm { background: var(--tasty-search-match-bg); }
  .sma { background: var(--tasty-search-match-active-bg); color:#11111b; }
</style>
</head>
<body>
  <div>
    <div class="demo">
      <div><div class="cell">rest</div><div class="lbl">base</div></div>
      <div><div class="cell">hover<span class="ov" style="background:var(--tasty-overlay-hover)"></span></div><div class="lbl">--tasty-overlay-hover · 8%</div></div>
      <div><div class="cell">active<span class="ov" style="background:var(--tasty-overlay-active)"></span></div><div class="lbl">--tasty-overlay-active · 12%</div></div>
    </div>
  </div>
  <div class="term">grep <span class="sel">selection_bg</span> · vi cursor <span class="vi">&nbsp;cell&nbsp;</span> · search <span class="sm">match</span> <span class="sma">active</span></div>
</body>
</html>
