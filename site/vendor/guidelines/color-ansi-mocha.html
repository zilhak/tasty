<!-- @dsCard group="Colors" viewport="700x200" name="ANSI 16 — Mocha" subtitle="Terminal palette, normal + bright" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 20px; background: var(--tasty-bg-app); }
  .grid { display: grid; gap: 10px; }
  .sw { border-radius: var(--tasty-radius); overflow: hidden; border: 1px solid var(--tasty-separator); }
  .chip { height: 56px; }
  .meta { padding: 7px 9px; background: var(--tasty-bg-panel); }
  .name { font-size: 12px; color: var(--tasty-text-primary); font-weight: 600; }
  .hex { font-family: var(--tasty-font-mono); font-size: 10.5px; color: var(--tasty-text-muted); margin-top: 2px; }
  .small .chip { height: 44px; }
</style>
</head>
<body>
  <div class="grid small" style="grid-template-columns:repeat(8,1fr)">
    <div class="sw"><div class="chip" style="background:var(--tasty-ansi-black)"></div><div class="meta"><div class="name">black</div><div class="hex">#45475a</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-ansi-red)"></div><div class="meta"><div class="name">red</div><div class="hex">#f38ba8</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-ansi-green)"></div><div class="meta"><div class="name">green</div><div class="hex">#a6e3a1</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-ansi-yellow)"></div><div class="meta"><div class="name">yellow</div><div class="hex">#f9e2af</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-ansi-blue)"></div><div class="meta"><div class="name">blue</div><div class="hex">#89b4fa</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-ansi-magenta)"></div><div class="meta"><div class="name">magenta</div><div class="hex">#cba6f7</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-ansi-cyan)"></div><div class="meta"><div class="name">cyan</div><div class="hex">#94e2d5</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-ansi-white)"></div><div class="meta"><div class="name">white</div><div class="hex">#bac2de</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-ansi-bright-black)"></div><div class="meta"><div class="name">br.black</div><div class="hex">#6c7086</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-ansi-bright-red)"></div><div class="meta"><div class="name">br.red</div><div class="hex">#f38ba8</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-ansi-bright-green)"></div><div class="meta"><div class="name">br.green</div><div class="hex">#a6e3a1</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-ansi-bright-yellow)"></div><div class="meta"><div class="name">br.yellow</div><div class="hex">#f9e2af</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-ansi-bright-blue)"></div><div class="meta"><div class="name">br.blue</div><div class="hex">#89b4fa</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-ansi-bright-magenta)"></div><div class="meta"><div class="name">br.magenta</div><div class="hex">#cba6f7</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-ansi-bright-cyan)"></div><div class="meta"><div class="name">br.cyan</div><div class="hex">#89dceb</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-ansi-bright-white)"></div><div class="meta"><div class="name">br.white</div><div class="hex">#cdd6f4</div></div></div>
  </div>
</body>
</html>
