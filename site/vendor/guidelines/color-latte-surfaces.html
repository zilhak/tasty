<!-- @dsCard group="Colors" viewport="700x180" name="Latte — Surfaces & Text" subtitle="Light theme ramp (data-theme=latte)" -->
<!DOCTYPE html>
<html lang="en" data-theme="latte">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 20px; background: var(--tasty-bg-app); }
  .grid { display: grid; gap: 10px; }
  .sw { border-radius: var(--tasty-radius); overflow: hidden; border: 1px solid var(--tasty-separator); }
  .chip { height: 56px; }
  .meta { padding: 7px 9px; background: var(--tasty-bg-panel); }
  .name { font-size: 12px; color: var(--tasty-text-primary); font-weight: 600; }
  .hex { font-family: var(--tasty-font-mono); font-size: 10.5px; color: var(--tasty-text-muted); margin-top: 2px; }
  .small .chip { height: 44px; }
</style>
</head>
<body>
  <div class="grid" style="grid-template-columns:repeat(7,1fr)">
    <div class="sw"><div class="chip" style="background:var(--tasty-color-neutral-200)"></div><div class="meta"><div class="name">base</div><div class="hex">#eff1f5</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-color-neutral-100)"></div><div class="meta"><div class="name">mantle</div><div class="hex">#e6e9ef</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-color-neutral-0)"></div><div class="meta"><div class="name">crust</div><div class="hex">#dce0e8</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-color-neutral-300)"></div><div class="meta"><div class="name">surface0</div><div class="hex">#ccd0da</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-color-neutral-400)"></div><div class="meta"><div class="name">surface1</div><div class="hex">#bcc0cc</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-color-neutral-1100)"></div><div class="meta"><div class="name">text</div><div class="hex">#4c4f69</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-color-neutral-900)"></div><div class="meta"><div class="name">subtext0</div><div class="hex">#6c6f85</div></div></div>
  </div>
</body>
</html>
