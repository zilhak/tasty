<!-- @dsCard group="Spacing" viewport="700x150" name="4px Grid" subtitle="Every gap is a multiple of 4 — xs/sm/md/lg/xl only" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 22px; background: var(--tasty-bg-panel); display: flex; gap: 22px; align-items: flex-end; }
  .u { text-align: center; }
  .bar { background: var(--tasty-accent-primary); border-radius: var(--tasty-radius-sm); }
  .l { font-family: var(--tasty-font-mono); font-size: 11px; color: var(--tasty-text-primary); margin-top: 8px; font-weight: 600; }
  .v { font-family: var(--tasty-font-mono); font-size: 10px; color: var(--tasty-text-muted); margin-top: 2px; }
</style>
</head>
<body>
  <div class="u"><div class="bar" style="width:var(--tasty-space-xs);height:var(--tasty-space-xs)"></div><div class="l">xs</div><div class="v">4px</div></div>
  <div class="u"><div class="bar" style="width:var(--tasty-space-sm);height:var(--tasty-space-sm)"></div><div class="l">sm</div><div class="v">8px</div></div>
  <div class="u"><div class="bar" style="width:var(--tasty-space-md);height:var(--tasty-space-md)"></div><div class="l">md</div><div class="v">12px</div></div>
  <div class="u"><div class="bar" style="width:var(--tasty-space-lg);height:var(--tasty-space-lg)"></div><div class="l">lg</div><div class="v">16px</div></div>
  <div class="u"><div class="bar" style="width:var(--tasty-space-xl);height:var(--tasty-space-xl)"></div><div class="l">xl</div><div class="v">24px</div></div>
</body>
</html>
