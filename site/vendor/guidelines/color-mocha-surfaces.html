<!-- @dsCard group="Colors" viewport="700x180" name="Mocha — Surfaces" subtitle="Dark elevation ramp: crust → surface2" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 20px; background: var(--tasty-bg-app); }
  .row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .sw { border-radius: var(--tasty-radius); overflow: hidden; border: 1px solid var(--tasty-separator); }
  .chip { height: 64px; }
  .meta { padding: 8px 10px; background: var(--tasty-bg-panel); }
  .name { font-size: 12px; color: var(--tasty-text-primary); font-weight: 600; }
  .hex { font-family: var(--tasty-font-mono); font-size: 11px; color: var(--tasty-text-muted); margin-top: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--tasty-color-neutral-0)"></div><div class="meta"><div class="name">crust</div><div class="hex">#11111b</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-color-neutral-100)"></div><div class="meta"><div class="name">mantle</div><div class="hex">#181825</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-color-neutral-200)"></div><div class="meta"><div class="name">base</div><div class="hex">#1e1e2e</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-color-neutral-300)"></div><div class="meta"><div class="name">surface0</div><div class="hex">#313244</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-color-neutral-400)"></div><div class="meta"><div class="name">surface1</div><div class="hex">#45475a</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tasty-color-neutral-500)"></div><div class="meta"><div class="name">surface2</div><div class="hex">#585b70</div></div></div>
  </div>
</body>
</html>
