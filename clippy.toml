# Tasty 워크스페이스 clippy 정책.
#
# cognitive-complexity-threshold: 복잡도 게이트(파트 A)의 임계값.
#   함수 cognitive complexity 가 이 값을 넘으면 `cognitive_complexity` lint 발동.
#   Cargo.toml [workspace.lints.clippy] 에서 deny 로 승격 → 신규 초과 함수는 빌드 에러.
#   기존 초과 함수는 위치 단위 `#[allow(clippy::cognitive_complexity)] // complexity-exempt: …`
#   로 동결(grandfather). 20 은 rca cognitive ≈ 50 등가로, egui 즉시모드 draw 는
#   clippy 가 자동 배제하므로 실 로직 hotspot 만 표면화한다.
#   상세: docs/dev-guide/complexity-gate.md, docs/adr/0037-complexity-gate.md
cognitive-complexity-threshold = 20

# disallowed-methods: 색을 "디자인" 하는 함수의 우연한 호출을 차단.
# 정상 경로는 단 두 가지뿐 — `~/.tasty/themes/*.toml` 또는 tasty-themes 의 const.
#
# 예외가 필요한 곳 (파일/함수 단위로 `#[allow(clippy::disallowed_methods)]` 부여):
# - tasty-type-appearance::theme  (색상 const 정의 본거지)
# - tasty-type-appearance::color  (HexColor 변환 헬퍼 내부)
# - tasty-themes::fallback        (MOCHA_FALLBACK_COLORS 정의)
# - settings 픽커 (사용자 입력 → HexColor)
# - 그림 브러시/픽셀 추출 (사용자 입력)

disallowed-methods = [
    { path = "tasty_type_appearance::color::HexColor::from_rgb", reason = "테마 색은 themes/*.toml 또는 const 에서만. 사용자 입력이면 #[allow] + 주석." },
    { path = "tasty_type_appearance::color::HexColor::from_rgba", reason = "동상." },
    { path = "egui::Color32::from_rgb", reason = "theme().X 또는 .with_alpha(N).to_egui() 사용." },
    { path = "egui::Color32::from_rgba_unmultiplied", reason = "외부 픽셀 데이터 변환은 #[allow] + 주석." },
    { path = "egui::Color32::from_rgba_premultiplied", reason = "premultiplied 의미 색은 theme().X.to_egui_premultiplied()." },
    { path = "egui::Color32::from_gray", reason = "Theme 의 회색 톤 사용." },
]
