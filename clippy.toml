# 함수 복잡도 상한은 20이며 Cargo.toml에서 deny로 적용한다.
# 기존 예외는 위치별 allow와 complexity-exempt 사유를 남긴다.
# 기준: docs/dev-guide/complexity-gate.md#무엇을도구임계값
cognitive-complexity-threshold = 20

# 테마 색은 themes/*.toml 또는 색상 상수에서 정의한다.
# 색 변환, 사용자 색상 선택, 브러시·픽셀 입력 등은 파일·함수별 allow와 이유를 적는다.
# 공용 색 정의·변환의 예외는 tasty-type-appearance와 tasty-themes에 있다.
disallowed-methods = [
    { path = "tasty_type_appearance::color::HexColor::from_rgb", reason = "테마 파일이나 색상 상수를 사용하세요. 사용자 입력 변환은 allow와 이유를 적으세요." },
    { path = "tasty_type_appearance::color::HexColor::from_rgba", reason = "테마 파일이나 색상 상수를 사용하세요. 사용자 입력 변환은 allow와 이유를 적으세요." },
    { path = "egui::Color32::from_rgb", reason = "theme().X 또는 .with_alpha(N).to_egui()를 사용하세요." },
    { path = "egui::Color32::from_rgba_unmultiplied", reason = "외부 픽셀 변환에 필요하면 allow와 이유를 적으세요." },
    { path = "egui::Color32::from_rgba_premultiplied", reason = "테마 색은 theme().X.to_egui_premultiplied()로 변환하세요." },
    { path = "egui::Color32::from_gray", reason = "테마에 정의된 회색을 사용하세요." },
]
